theme: "ai-operating-model"
questions:
  - id: "ops-platform-ownership"
    tracks: ["leadership"]
    roles: ["ai-platform-lead"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Define a strategy for an internal AI platform, including who owns its success metrics.
      ru: >-
        Определите стратегию внутренней AI-платформы и распределите ответственность за её метрики успеха.
    tests:
      en: >-
        Whether platform investment is tied to internal customer outcomes and clear ownership.
      ru: >-
        Связаны ли инвестиции в платформу с результатами внутренних клиентов и понятной ответственностью.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-stripe-questions"
        company: "stripe"
    start_here: ["leadership"]
    priority: 16
    outline:
      en:
        - "Identify recurring needs across teams and where a shared service adds value."
        - "Separate platform reliability and adoption from the business outcomes owned by consuming teams."
        - "Choose a first supported workflow, service boundaries and a review of continued investment."
      ru:
        - "Найдите повторяющиеся потребности команд и пользу общего сервиса."
        - "Разделите надёжность и использование платформы и бизнес-результаты команд-потребителей."
        - "Выберите первый поддерживаемый процесс, границы сервиса и порядок пересмотра инвестиций."
    answer:
      en: "An internal platform strategy starts from noticing that several teams are doing the same work: getting access to models, assembling evaluation, setting up logging, dealing with secrets and personal data. The platform takes what repeats and leaves teams what is unique to them, otherwise it becomes a bottleneck. I would split the metrics by level: the platform owns reliability and demand, meaning gateway availability and SLO, time from idea to working prototype, the share of teams that chose it voluntarily, and cost per request; the business outcome stays with the consuming teams, because otherwise nobody owns it. In practice, pick one workflow and support it end to end, say explicitly what the platform does not do, and set a date in advance to review continued investment. If internal teams have no right to choose an alternative, the adoption number stops proving anything."
      ru: "Стратегия внутренней платформы начинается с наблюдения, что несколько команд делают одно и то же: получают доступ к моделям, собирают оценку, настраивают журналирование, разбираются с секретами и персональными данными. Платформа берёт повторяющееся и оставляет командам уникальное, иначе превращается в узкое место. Метрики я бы развёл по уровням: платформа отвечает за надёжность и востребованность — доступность и SLO шлюза, время от идеи до работающего прототипа, доля команд, выбравших её добровольно, стоимость запроса; бизнес-результат остаётся за командами-потребителями, потому что иначе за него не отвечает никто. Практически стоит выбрать один сценарий и поддержать его целиком, явно назвать, чего платформа не делает, и заранее назначить срок пересмотра инвестиций. Если у внутренних команд нет права выбрать альтернативу, показатель использования перестаёт что-либо доказывать."
    reading: ["google-sre-book","paper-heart"]
  - id: "ops-restricted-models"
    tracks: ["engineering","leadership"]
    roles: ["ai-platform-engineer"]
    type: "system_design"
    level: "senior"
    text:
      en: >-
        How would you support multiple model providers when some deployment environments permit only a subset of models?
      ru: >-
        Как поддерживать несколько поставщиков моделей, если в отдельных средах разрешена только часть моделей?
    tests:
      en: >-
        Whether a platform preserves deployment constraints and makes capability gaps visible.
      ru: >-
        Учитывает ли платформа ограничения сред и явно ли показывает различия возможностей.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "palantir"
    start_here: ["leadership"]
    priority: 17
    outline:
      en:
        - "Make environment policy and data restrictions explicit in model selection."
        - "Define a portable interface without pretending all models have identical capabilities."
        - "Evaluate allowed fallbacks and fail closed when no compliant route exists."
      ru:
        - "Явно включите политику среды и ограничения данных в выбор модели."
        - "Определите переносимый интерфейс, сохраняя различия возможностей моделей."
        - "Проверьте допустимые резервные варианты и отказывайте, если разрешённого маршрута нет."
    answer:
      en: "The environment's allowed list must govern model selection. The route is computed from data class, jurisdiction and the policy of the specific environment: the application asks for a capability such as long context or image input, and the platform picks a permitted model and can explain why that one. A portable interface over providers hides the shape of the call, but it must not hide the differences: context length, tool support, structured output format and guardrail behaviour diverge, and believing models are interchangeable turns into regressions in production. So capabilities are declared explicitly and checked with a shared eval set on every allowed route. Fallback is permitted only inside the allowed set, and when no compliant route exists the request is rejected with a clear error instead of quietly going to another provider. The price is less flexibility and constant upkeep of the environment matrix."
      ru: "Разрешённый список среды должен быть частью выбора модели, а не примечанием в документации. Маршрут вычисляется из класса данных, юрисдикции и политики конкретной среды: приложение запрашивает возможность вроде длинного контекста или работы с изображениями, а платформа подбирает допустимую модель и умеет объяснить, почему именно её. Переносимый интерфейс поверх поставщиков прячет форму вызова, но различия прятать нельзя — длина контекста, поддержка инструментов, формат структурированного ответа, поведение guardrails расходятся, и вера во взаимозаменяемость оборачивается регрессиями в продакшене. Поэтому возможности объявляются явно и проверяются общим eval-набором на каждом разрешённом маршруте. Резервный переход допустим только внутри разрешённого множества, а при отсутствии легального маршрута запрос отклоняется с понятной ошибкой вместо тихого ухода к другому поставщику. Плата — меньше гибкости и постоянная поддержка матрицы сред."
    reading: ["azure-multitenant","nist-ai-rmf"]
  - id: "ops-private-evaluation"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer"]
    type: "system_design"
    level: "senior"
    text:
      en: >-
        How would you evaluate an enterprise AI assistant when your team cannot inspect customer data?
      ru: >-
        Как оценивать корпоративного AI-ассистента, если ваша команда не может просматривать данные клиента?
    tests:
      en: >-
        Whether you can obtain useful quality evidence within data-access restrictions.
      ru: >-
        Умеете ли вы получать полезные данные о качестве в рамках ограниченного доступа.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
    start_here: ["leadership"]
    priority: 45
    outline:
      en:
        - "Move measurement into the customer's environment and return aggregates, not their content."
        - "Have the customer's own reviewers label a sample against a rubric you supply and audit."
        - "Build a public or synthetic proxy set shaped like their tasks, and state what it cannot show."
      ru:
        - "Перенести измерение в среду клиента и возвращать агрегаты, а не их содержимое."
        - "Поручить разметку выборки ревьюерам клиента по рубрике, которую вы даёте и проверяете."
        - "Собрать публичный или синтетический прокси-набор под их задачи и назвать его ограничения."
    answer:
      en: "If I cannot see the data, I move the measurement to where the data lives and bring back numbers. The evaluation harness runs inside the customer's environment, computing scores, failure categories and counts, and exports aggregates with a minimum cell size — never examples or transcripts. Labels come from their people, not mine: I supply the rubric and the sampling plan, and I audit agreement between their reviewers, because a rubric applied inconsistently is worse than no rubric. Alongside that I build a proxy set from public or synthetic documents shaped like their corpus, which is what I iterate against daily. The trade-off is honest: proxy data misses exactly the distribution that breaks in production, and aggregates tell me a category is failing without showing me why. So I also negotiate a narrow escalation path — a redacted or customer-approved example when a defect needs diagnosis, rather than standing access."
      ru: "Если я не вижу данные, я переношу измерение туда, где они живут, и забираю оттуда только числа. Харнесс оценки работает внутри среды клиента, считает оценки, категории сбоев и количества, а наружу отдаёт агрегаты с минимальным размером ячейки — никогда примеры и расшифровки. Разметку делают их люди, а не мои: я даю рубрику и план выборки, а затем проверяю согласованность между их ревьюерами, потому что рубрика, применяемая по-разному, хуже отсутствия рубрики. Рядом я собираю прокси-набор из публичных или синтетических документов, похожих на их корпус, — именно на нём идёт ежедневная работа. Компромисс честный: прокси-данные упускают ровно то распределение, которое ломается в продакшене, а агрегаты сообщают, что категория сбоит, не показывая почему. Поэтому я отдельно договариваюсь об узком канале эскалации: обезличенный или согласованный клиентом пример, когда дефект требует диагностики, вместо постоянного доступа."
    reading: ["anthropic-evals-for-agents"]
  - id: "ops-shared-data-access"
    tracks: ["engineering","leadership"]
    type: "system_design"
    level: "senior"
    text:
      en: >-
        Design a service that lets several teams query a shared dataset without exposing the underlying raw records.
      ru: >-
        Спроектируйте сервис, в котором несколько команд запрашивают общий набор данных без доступа к исходным записям.
    tests:
      en: >-
        Whether you define permissible results and enforce access across a shared platform.
      ru: >-
        Умеете ли вы определить допустимые результаты и обеспечить разграничение доступа на общей платформе.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "palantir"
