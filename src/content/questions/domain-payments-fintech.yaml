theme: "domain-payments-fintech"
questions:
  - id: "pay-agent-authority"
    tracks: ["engineering","leadership"]
    type: "system_design"
    level: "senior"
    text:
      en: >-
        A shopping agent can initiate payments. How would you prove that each payment matches the user's actual authorisation?
      ru: >-
        Торговый агент может инициировать платежи. Как доказать, что каждый платёж соответствует реальному разрешению пользователя?
    tests:
      en: >-
        Whether you separate an agent's proposal from a verifiable payment mandate.
      ru: >-
        Разделяете ли вы предложение агента и проверяемое разрешение на платёж.
    provenance: "generated"
    added: "2026-09-26"
    basis: ["radar:domain-payments-fintech"]
    start_here: ["leadership"]
    priority: 35
    outline:
      en:
        - "Represent user intent and transaction constraints explicitly, including amount and payee."
        - "Validate authority at execution; require new confirmation for changes outside the grant."
        - "Preserve an audit trail and distinguish authorisation evidence from settlement success."
      ru:
        - "Явно представьте намерение пользователя и ограничения операции, включая сумму и получателя."
        - "Проверяйте полномочия при выполнении; запрашивайте новое подтверждение изменений за пределами разрешения."
        - "Сохраняйте аудиторский след и различайте подтверждение полномочий и успешное завершение расчётов."
    answer:
      en: "A payment has to rest on a separate verifiable authorisation, not on what the agent understood the user to mean. Intent is expressed as an explicit object with constraints, amount or limit, payee, currency, validity period and conditions, and it's signed so it can be produced later; that's what AP2 is built on, where signed mandates tie the user's consent to a specific purchase and payment and give a consistent trail. Authority is validated at execution time on the payment side: if the amount or the payee falls outside the grant, you need a new confirmation, not the agent's guess. The audit trail keeps what the user approved, what the agent proposed and what executed. Authorisation evidence and settlement are different things: an authorisation doesn't mean the money arrived. A signature authenticates a signer and unchanged mandate; genuine consent also requires a trusted approval flow. Limits and revocation still matter."
      ru: "Платёж должен опираться на отдельное проверяемое разрешение, а не на то, что агент так понял пользователя. Намерение выражается явным объектом с ограничениями — сумма или лимит, получатель, валюта, срок действия, условия — и подписывается так, что его можно предъявить позже; именно на этом построен AP2, где подписанные мандаты связывают согласие пользователя с конкретной покупкой и платежом и дают непротиворечивый след. Полномочия проверяются в момент исполнения на стороне платёжной части: если сумма или получатель вышли за границы разрешения, нужно новое подтверждение, а не догадка агента. Аудиторский след хранит, что пользователь одобрил, что агент предложил и что исполнилось. Важно различать подтверждение полномочий и завершение расчётов: авторизация не означает, что деньги дошли. Подпись подтверждает подписанта и неизменность мандата; подлинное согласие требует доверенного процесса одобрения. Лимиты и возможность отзыва всё равно нужны."
    reading: ["ap2-protocol", "stripe-acp", "ucp-protocol"]
  - id: "pay-ambiguous-timeout"
    tracks: ["engineering","leadership"]
    type: "system_design"
    level: "senior"
    text:
      en: >-
        An AI support agent initiates a refund, then the payment API times out. How should the system recover without issuing the refund twice?
      ru: >-
        AI-агент поддержки инициировал возврат, после чего платёжный API не ответил вовремя. Как восстановить работу без двойного возврата?
    tests:
      en: >-
        Whether you treat an unknown outcome as a reconciliation problem rather than blindly repeating a side effect.
      ru: >-
        Рассматриваете ли вы неизвестный исход как задачу сверки, а не повод бездумно повторить операцию.
    provenance: "generated"
    added: "2026-09-26"
    basis: ["radar:domain-payments-fintech"]
    start_here: ["leadership"]
    priority: 36
    outline:
      en:
        - "Assign one stable operation identity and persist intent before retries."
        - "Use the provider's idempotency contract and reconcile status after ambiguous failures."
        - "Handle retention limits, concurrent attempts and manual escalation; do not promise global exactly-once execution."
      ru:
        - "Задайте стабильный идентификатор операции и сохраните намерение до повторов."
        - "Используйте контракт идемпотентности поставщика и сверяйте статус после неоднозначного сбоя."
        - "Учтите срок хранения ключей, конкурентные попытки и ручную эскалацию; не обещайте сквозное выполнение строго один раз."
    answer:
      en: "A timeout does not mean the refund failed, so I'd treat the unknown outcome as a reconciliation problem rather than a reason to repeat the call. Every operation gets a stable identifier created before the first request, and the intent is persisted in our own database before the request goes out, otherwise a retry has nothing to attach to. The retry goes with the same idempotency key under the provider's contract, with exponential backoff and jitter; if the response is ambiguous again, the status is resolved with a status query or by reconciling reports, not with a second refund. You have to account for the finite lifetime of keys, concurrent attempts under one key, and a changed amount, which makes it a different operation. I'd test parallel retries and the manual escalation path. There is no end to end exactly once: this is retry with deduplication and later reconciliation."
      ru: "Таймаут не означает, что возврат не прошёл, поэтому неизвестный исход я бы рассматривал как задачу сверки, а не как повод повторить вызов. Каждой операции присваивается стабильный идентификатор, созданный до первого обращения, а намерение сохраняется в своей базе раньше, чем уходит запрос, иначе повтор не с чем связать. Повтор идёт с тем же ключом идемпотентности по контракту поставщика, с экспоненциальной задержкой и случайным разбросом; если ответ снова неоднозначен, статус выясняется запросом состояния или сверкой выгрузок, а не вторым возвратом. Учитывать нужно конечный срок жизни ключей, одновременные попытки с одним ключом и изменение суммы, которое делает запрос уже другой операцией. Проверил бы поведение при параллельных повторах и путь ручной эскалации. Сквозного выполнения ровно один раз не бывает: это повтор с дедупликацией и последующей сверкой."
    reading: ["stripe-idempotency"]
  - id: "pay-bank-copilot-release"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A bank wants to roll out an AI assistant that proposes case decisions to employees. What evidence and controls would you require before expansion?
      ru: >-
        Банк хочет внедрить AI-ассистента, предлагающего сотрудникам решения по обращениям. Какие данные и меры контроля нужны перед расширением запуска?
    tests:
      en: >-
        Whether you keep accountability and validation proportional to the decision's consequences.
      ru: >-
        Соразмерны ли ответственность и проверка последствиям решения.
    provenance: "generated"
    added: "2026-09-26"
    basis: ["radar:domain-payments-fintech"]
    start_here: ["leadership"]
    priority: 37
    outline:
      en:
        - "Define the decisions, affected customers and limits of the assistant's authority."
        - "Evaluate representative cases and harmful errors, including how employees use or override suggestions."
        - "Document owners, monitoring, escalation and a controlled expansion; verify applicable jurisdiction-specific obligations separately."
      ru:
        - "Определите решения, затронутых клиентов и границы полномочий ассистента."
        - "Оцените типичные случаи и опасные ошибки, включая принятие и отмену рекомендаций сотрудниками."
        - "Зафиксируйте владельцев, мониторинг, эскалацию и контролируемое расширение; отдельно проверьте применимые требования юрисдикции."
    answer:
      en: "Before expanding you have to fix which decisions the assistant touches, which customers they affect, and where its authority ends: it proposes, the employee decides, and that has to be true in the interface, not just in a document. I would collect two kinds of evidence: a set of real cases with known correct outcomes, including rare and expensive errors, and the behaviour of employees, the share of suggestions accepted and rejected, and reversals and corrections after acceptance. The mechanism is uncomfortable: a suggestion shifts attention, and agreement quickly becomes a formality, so suggestion quality is measured together with the quality of human decisions. Then you name owners, monitoring, the escalation path and a staged expansion by segment with a stop ready, and the applicable jurisdiction requirements are verified separately with lawyers. Quality on historical cases does not predict behaviour with new products and unfamiliar fraud schemes."
      ru: "До расширения нужно зафиксировать, какие решения ассистент затрагивает, кого из клиентов они касаются и где проходит граница его полномочий: он предлагает, сотрудник решает, и это должно быть правдой в интерфейсе, а не декларацией. Данные я бы собрал двух видов — набор реальных обращений с известным правильным исходом, включая редкие и дорогие ошибки, и поведение сотрудников: доля принятых и отклонённых рекомендаций, отмены и исправления после принятия. Механизм здесь неприятный: подсказка смещает внимание, и согласие быстро становится формальным, поэтому качество подсказки измеряется вместе с качеством решений людей. Дальше назначаются владельцы, мониторинг, порядок эскалации и поэтапное расширение по сегментам с готовой остановкой, а применимые требования юрисдикции проверяются отдельно с юристами. Качество на исторических обращениях не предсказывает поведение при новых продуктах и незнакомых схемах мошенничества."
    reading: ["nist-ai-rmf", "sr-11-7"]
  - id: "pay-clinical-data-boundary"
    tracks: ["engineering","leadership"]
    type: "system_design"
    level: "senior"
    text:
      en: >-
        A clinical AI service handles recordings, transcripts and notes containing protected health information. How does that constrain architecture and use of third-party model APIs?
      ru: >-
        Клинический AI-сервис обрабатывает аудио, расшифровки и записи с защищённой медицинской информацией. Как это влияет на архитектуру и использование сторонних API моделей?
    tests:
      en: >-
        Whether you map sensitive data flows and establish permitted processing before integration.
      ru: >-
        Умеете ли вы описать потоки чувствительных данных и определить допустимую обработку до интеграции.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
  - id: "pay-clinical-writeback"
    tracks: ["engineering","leadership"]
    type: "system_design"
    level: "senior"
    text:
      en: >-
        How would you write an AI-generated clinical note back into an electronic health-record system, and what can go wrong?
      ru: >-
        Как записать подготовленный AI медицинский документ обратно в систему электронных медицинских карт и какие сбои возможны?
    tests:
      en: >-
        Whether you consider patient identity, review status, duplicate writes and recovery.
      ru: >-
        Учитываете ли вы идентификацию пациента, статус проверки, повторные записи и восстановление.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
