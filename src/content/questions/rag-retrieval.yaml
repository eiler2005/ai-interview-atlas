theme: "rag-retrieval"
questions:
  - id: "rag-chunking"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "Choose a chunking approach for technical documentation, including how you preserve meaning across section boundaries."
      ru: "Выберите подход к разбиению технической документации на чанки, сохраняя смысл на границах разделов."
    tests:
      en: "Whether chunk size follows document structure and retrieval evaluation."
      ru: "Умение выбирать размер чанков по структуре документов и результатам поиска."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 12
    outline:
      en:
        - "Preserve headings, source locations and the context needed to interpret each chunk."
        - "Vary chunk size and overlap on representative questions."
        - "Measure retrieval misses and downstream answer quality, including table and boundary cases."
      ru:
        - "Сохранить заголовки, позиции в источнике и контекст для понимания чанка."
        - "Сравнить размеры и перекрытия на характерных вопросах."
        - "Измерить пропуски поиска и качество ответов, включая таблицы и границы чанков."
    answer:
      en: "I'd split along the document's structure, because an embedding is one vector per chunk: a chunk that straddles two topics averages them and matches neither, and one cut mid-procedure loses what this flag or the step above refers to. The unit is a section; sections longer than a few hundred tokens split recursively at paragraphs with a small overlap, while code blocks and tables stay whole, a table keeping its header row. Each chunk carries its heading chain, document id and position, so it's intelligible away from its page and links back precisely. The trade-off is size: small chunks match precisely but lose context, large ones keep it but blur the vector and fill the prompt. My baseline is a fixed-size window with overlap, compared on representative questions with known source passages: recall at k for retrieval, then answer quality, with tables and answers spanning two sections checked separately. The boundary: this needs real structure, and on scanned PDFs or inconsistent headings I'd fall back to recursive size-based splitting."
      ru: "Резал бы по структуре документа, потому что эмбеддинг — это один вектор на чанк: чанк, захвативший две темы, усредняет их и не совпадает ни с одной, а разрезанный посреди инструкции теряет, к чему относятся «этот флаг» или «шаг выше». Единица — раздел; разделы длиннее нескольких сотен токенов рекурсивно делятся по абзацам с небольшим перекрытием, а блоки кода и таблицы остаются целыми, причём таблица сохраняет строку заголовков. Каждый чанк несёт цепочку заголовков, идентификатор документа и позицию в нём, поэтому понятен в отрыве от страницы и даёт точную ссылку. Компромисс в размере: мелкие чанки точнее попадают в запрос, но теряют контекст, крупные сохраняют его, но размывают вектор и забивают промпт. Базой беру окно фиксированного размера с перекрытием и сравниваю на характерных вопросах с известными исходными фрагментами: полноту поиска в первых k результатах, затем качество ответов, отдельно проверяя таблицы и ответы на стыке двух разделов. Граница: подходу нужна настоящая структура, и на сканированных PDF или непоследовательных заголовках я бы откатился к рекурсивному разбиению по размеру."
    reading: ["anthropic-contextual-retrieval"]
  - id: "rag-hybrid"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "When would you combine lexical and dense retrieval, and how would you merge their rankings?"
      ru: "Когда стоит объединить лексический и векторный поиск и как свести их ранжирование?"
    tests:
      en: "Whether exact terms and semantic similarity receive appropriate treatment."
      ru: "Умение учитывать точные термины и смысловое сходство."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "microsoft"
      - source: "outcome-school-company-wise"
        company: "perplexity"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 13
    outline:
      en:
        - "Explain lexical strength on identifiers and dense strength on paraphrases."
        - "Fuse rankings without assuming raw scores are comparable."
        - "Ablate each retriever and reranking on a fixed relevance set."
      ru:
        - "Объяснить пользу лексического поиска для идентификаторов и векторного для перефразировок."
        - "Свести ранжирование, не предполагая сопоставимости исходных оценок."
        - "Проверить вклад каждого поиска и переранжирования на фиксированном наборе релевантности."
    answer:
      en: "It's worth combining when queries contain both exact strings and free wording. Lexical search is irreplaceable for identifiers, error codes, function names, versions and rare terms that an embedding doesn't distinguish; dense search pulls in paraphrases and synonyms where there's no word overlap at all. You can't add their scores together directly: a lexical score isn't normalised and isn't comparable with cosine similarity. It's more practical to fuse by rank, for instance reciprocal rank fusion, or to normalise within a single query, or to take the union of candidates and rerank with a cross-encoder, at which point the original scales stop mattering entirely. I'd test on a fixed query set with labelled relevance, switching off each branch and the reranking in turn to see what each part contributes. The price is a second index, an extra latency stage and cost. If queries are homogeneous, hybrid adds complexity without a gain."
      ru: "Объединять стоит, когда в запросах встречаются и точные строки, и свободные формулировки. Лексический поиск незаменим для идентификаторов, кодов ошибок, имён функций, версий и редких терминов, которые эмбеддинг просто не различает; векторный вытягивает перефразировки и синонимы, где совпадения слов нет вовсе. Складывать их оценки напрямую нельзя: лексический счёт не нормирован и несопоставим с косинусной близостью. Практичнее сливать по рангам, например взаимным ранговым слиянием, либо нормировать в пределах одного запроса, либо собрать объединение кандидатов и переранжировать кросс-энкодером — тогда исходные шкалы вообще перестают иметь значение. Проверял бы на фиксированном наборе запросов с размеченной релевантностью, отключая по очереди каждую ветку и переранжирование, чтобы увидеть вклад каждой части. Плата — второй индекс, лишний этап задержки и стоимость. Если запросы однородны, гибрид добавит сложности без выигрыша."
    reading: ["anthropic-contextual-retrieval"]
  - id: "rag-reranking"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Where should a cross-encoder reranker sit in a retrieval pipeline, and when does its quality gain justify latency?"
      ru: "Где разместить cross-encoder reranker в поисковом пайплайне и когда выигрыш качества оправдывает задержку?"
    tests:
      en: "Whether candidate count, recall and reranking cost are balanced."
      ru: "Умение сбалансировать число кандидатов, полноту поиска и стоимость переранжирования."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "microsoft"
      - source: "outcome-school-company-wise"
        company: "perplexity"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 46
    outline:
      en:
        - "Retrieve a broad candidate set first, then score query-document pairs with the reranker."
        - "Measure initial recall separately: a reranker cannot recover a document missing from its input."
        - "Sweep candidate and final-context counts against held-out answer quality and end-to-end latency."
      ru:
        - "Сначала получить широкий набор кандидатов, затем оценить пары запроса и документа reranker-ом."
        - "Отдельно измерить полноту первого поиска: reranker не вернёт документ, которого нет на входе."
        - "Сравнить число кандидатов и размер итогового контекста по качеству на отложенных вопросах и полной задержке."
    answer:
      en: "A cross-encoder belongs after a cheap retriever and before generation, scoring query-document pairs for a shortlist rather than the corpus: it reads the query and passage together, which is what makes it more accurate than comparing two independent embeddings, and also what makes it too slow to run over everything. The pipeline's ceiling is therefore the first stage's recall — a reranker cannot promote a document that was never fetched, so I measure recall at the candidate depth separately from final answer quality, otherwise a first-stage miss looks like a reranker failure. Tuning is a sweep: candidate count and final context size against held-out answer quality and end-to-end latency, watching the point where extra candidates stop changing the top results. The gain justifies the latency when relevance is genuinely the bottleneck; if answers fail because the corpus lacks the fact, reranking buys nothing."
      ru: "Cross-encoder стоит после дешёвого поиска и до генерации: он оценивает пары «запрос — документ» для короткого списка, а не для всего корпуса. Он читает запрос и фрагмент вместе — именно это делает его точнее сравнения двух независимых эмбеддингов и одновременно слишком медленным, чтобы прогонять по всему. Потолок пайплайна поэтому задаёт полнота первой ступени: reranker не поднимет документ, которого не было в выдаче, поэтому полноту на глубине кандидатов я измеряю отдельно от итогового качества ответа, иначе промах первой ступени выглядит как ошибка reranker-а. Настройка — это перебор: число кандидатов и размер итогового контекста против качества на отложенных вопросах и полной задержки, с поиском точки, где новые кандидаты перестают менять верх списка. Выигрыш оправдывает задержку, когда узкое место действительно в релевантности; если ответы плохи потому, что факта нет в корпусе, переранжирование не даёт ничего."
    reading: ["anthropic-contextual-retrieval"]
  - id: "rag-stage-evaluation"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "How would you separately evaluate document retrieval and answer generation in a RAG application?"
      ru: "Как отдельно оценить поиск документов и генерацию ответа в RAG-приложении?"
    tests:
      en: "Whether failures can be attributed to the correct stage."
      ru: "Умение локализовать ошибки на правильном этапе."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 14
    outline:
      en:
        - "Build questions with relevant passages and acceptable answer criteria."
        - "Measure retrieval recall separately from answer support and correctness."
        - "Use oracle passages to distinguish retrieval failures from generation failures."
      ru:
        - "Подготовить вопросы с релевантными фрагментами и критериями ответа."
        - "Отдельно измерять полноту поиска, подтверждённость и правильность ответа."
        - "Подставить эталонные фрагменты, чтобы отличить ошибки поиска от генерации."
    answer:
      en: "For representative questions I label answer-bearing passages and define acceptable answers separately. Retrieval is then measured by its own metrics, whether the needed passage appeared in the results and at what rank, and generation by groundedness, whether every statement rests on the context it was given, and by factual correctness. The key move is running generation with the gold passages as input: if the answer is right with them, retrieval or context assembly needs investigation; if not, the problem is the model, the prompt or the context format. Without that split, an end to end metric mixes two different defects and the team fixes the wrong stage. I'd keep the set small but alive, topping it up with real production failures. Limits: relevance labelling is subjective, gold passages don't reproduce the noise of real retrieval, and a judge model itself needs checking against human agreement."
      ru: "Разделяю так: для набора вопросов заранее размечаю, какие фрагменты действительно содержат ответ, и отдельно формулирую критерии правильного ответа. Тогда поиск меряется своими метриками — попал ли нужный фрагмент в выдачу и на каком месте, — а генерация меряется подтверждённостью, то есть опирается ли каждое утверждение на переданный контекст, и фактической правильностью. Ключевой приём — прогнать генерацию с эталонными фрагментами на входе: если с ними ответ верный, проверяю поиск и сборку контекста, если нет, дело в модели, промпте или формате контекста. Без такого разделения сквозная метрика смешивает два разных дефекта, и команда чинит не тот этап. Набор держал бы небольшим, но живым, пополняя его реальными провалами из продакшена. Ограничения есть: разметка релевантности субъективна, эталонные фрагменты не воспроизводят шум настоящей выдачи, а судья-модель сама требует проверки согласия с людьми."
    reading: ["paper-rag","anthropic-evals-for-agents"]
  - id: "rag-hyde"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Explain hypothetical-document retrieval and how you would establish whether it improves your query distribution."
      ru: "Объясните поиск через гипотетический документ и способ проверить пользу на вашем распределении запросов."
    tests:
      en: "Whether generated query expansion is treated as a testable hypothesis."
      ru: "Умение проверять полезность генерируемого расширения запроса."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 66
    outline:
      en:
        - "Generate a hypothetical document, embed it and retrieve real corpus documents near that embedding."
        - "Treat the generated document as a search aid, never as a factual source for the answer."
        - "Compare with direct-query retrieval on representative queries, measuring relevance, answer quality and added latency."
      ru:
        - "Сгенерировать гипотетический документ, получить его embedding и найти близкие реальные документы корпуса."
        - "Считать сгенерированный документ средством поиска, но не фактическим источником ответа."
        - "Сравнить с поиском по исходному запросу на характерной выборке: релевантность, качество ответа и добавленная задержка."
    answer:
      en: "HyDE bets that an answer-shaped text lands closer to real answers in embedding space than a short question does. A language model writes a plausible document answering the query, an encoder embeds it, and retrieval returns the real documents nearest that vector; the original paper used an unsupervised contrastive encoder without relevance labels, relying on the embedding to discard invented specifics. The hypothetical text is only a search key: it never enters the answer's context or citations, because its details may be fabricated. The cost is a generation call before every retrieval. Whether it helps is an empirical question for my traffic, so I'd label representative queries and compare recall and ranking against direct-query retrieval and a hybrid baseline, by query type, then check answer quality and p95 latency. It tends to help short, underspecified queries worded unlike the documents, and to hurt when the model doesn't know the domain and invents the wrong vocabulary, or when queries hinge on exact identifiers that lexical search already matches."
      ru: "HyDE делает ставку на то, что текст в форме ответа ложится в пространстве эмбеддингов ближе к настоящим ответам, чем короткий вопрос. Языковая модель пишет правдоподобный документ с ответом на запрос, энкодер превращает его в эмбеддинг, и поиск возвращает ближайшие к этому вектору реальные документы; в исходной статье использовался энкодер, обученный контрастивно без разметки релевантности, в расчёте на то, что эмбеддинг отбросит выдуманные детали. Гипотетический текст — только ключ поиска: он никогда не попадает ни в контекст ответа, ни в ссылки, потому что его подробности могут быть выдуманы. Платим вызовом генерации перед каждым поиском. Помогает ли это, решается измерением на моём трафике: я бы разметил характерные запросы и сравнил полноту и ранжирование с поиском по исходному запросу и с гибридным baseline в разбивке по типам запросов, а затем проверил качество ответов и p95 задержки. Обычно метод помогает коротким, недоопределённым запросам, сформулированным не так, как документы, и вредит, когда модель не знает предметную область и выдумывает не ту лексику или когда запрос держится на точных идентификаторах, которые лексический поиск и так находит."
    reading: ["paper-hyde"]
  - id: "rag-agentic"
    tracks: ["engineering","leadership"]
    type: "knowledge"
    text:
      en: "When should a retrieval application plan multiple searches instead of making one fixed retrieval call?"
      ru: "Когда поисковому приложению стоит планировать несколько поисков вместо одного фиксированного вызова?"
    tests:
      en: "Whether iterative retrieval earns its extra cost and failure modes."
      ru: "Умение обосновать добавочную стоимость и риски итеративного поиска."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Iterate when later queries depend on earlier findings: multi-hop questions, cross-entity comparisons or underspecified requests."
        - "Weigh added latency, tokens and compounding errors such as query drift and loops against the measured recall gain."
        - "Compare single-shot and iterative retrieval per question type on accuracy, evidence recall, calls per answer and cost."
      ru:
        - "Итерировать, когда следующие запросы зависят от найденного ранее: многошаговые вопросы, сравнение сущностей, недоопределённые формулировки."
        - "Сопоставить добавочную задержку, токены и накопление ошибок — уход запроса в сторону, зацикливание — с измеренным ростом полноты."
        - "Сравнить однократный и итеративный поиск по типам вопросов: точность, полнота найденных доказательств, число вызовов на ответ и стоимость."
    reading: ["paper-react","anthropic-multi-agent-research"]
  - id: "rag-embedding-drift"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "Search quality declines as the corpus changes. How would you detect embedding drift and separate it from indexing defects?"
      ru: "Качество поиска падает по мере изменения корпуса. Как выявить дрейф эмбеддингов и отличить его от ошибок индексации?"
    tests:
      en: "Whether diagnosis uses stable relevance sets and production slices."
      ru: "Умение диагностировать по стабильным наборам релевантности и срезам трафика."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Hold a frozen relevance set and corpus snapshot; stable scores there clear the model and point to new content or indexing."
        - "Check indexing directly: document counts against the source, embedding model version per vector, parse failures, ANN recall against exact search."
        - "Slice production queries by document age and topic; new-term misses that lexical search catches signal genuine drift."
      ru:
        - "Держать замороженный набор релевантности и снимок корпуса: стабильный результат на них оправдывает модель и указывает на новый контент или индексацию."
        - "Проверить индексацию напрямую: число документов против источника, версию модели эмбеддингов у каждого вектора, сбои парсинга, полноту ANN против точного поиска."
        - "Разрезать продовый трафик по возрасту и теме документов: промахи по новым терминам, которые находит лексический поиск, указывают на настоящий дрейф."
    reading: ["google-rules-of-ml", "faiss-indexes"]
  - id: "rag-permissions"
    tracks: ["engineering","leadership"]
    type: "system_design"
    text:
      en: "Design retrieval that enforces the source system's access rights, including permission changes and shared caches."
      ru: "Спроектируйте поиск с соблюдением прав исходной системы, включая изменения разрешений и общие кеши."
    tests:
      en: "Whether access checks cover the full path to generated output."
      ru: "Умение обеспечить проверку доступа на всём пути до ответа."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "microsoft"
      - source: "outcome-school-company-wise"
        company: "databricks"
      - source: "outcome-school-company-wise"
        company: "palantir"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 15
    outline:
      en:
        - "Propagate identity and enforce authorisation before content reaches the model."
        - "Keep permission updates, deletions and cache keys consistent with the policy."
        - "Test denied access and revocation paths; citations and logs need the same boundary."
      ru:
        - "Передавать идентичность и проверять доступ до попадания текста в модель."
        - "Согласовать изменения прав, удаления и ключи кеша с политикой доступа."
        - "Проверить запрет и отзыв доступа; ссылки и логи должны соблюдать ту же границу."
    answer:
      en: "The source system defines document permissions; retrieval must enforce them before content reaches the model. I pass the user's identity into search and filter candidates by access, then check authoritative permissions if indexed ACL freshness cannot be established. Post-filtering can damage recall, and applying controls only after generation is too late. Permission changes and deletions need measurable propagation, revoked grants must invalidate caches, and cached answers must respect the current caller's access. A shared embedding cache need not be per user if it cannot expose restricted content and retrieval remains authorised. I test revoked access, deleted documents and users without rights, including citations, suggestions and logs. Stale content can be labelled; uncertain authorisation must fail closed rather than merely display a warning."
      ru: "Права задаёт исходная система, а поиск применяет их до передачи текста модели. Передаю в поиск идентичность пользователя и фильтрую кандидатов по доступу; если свежесть ACL индекса неизвестна, проверяю права в авторитетной системе. Постфильтрация может снизить полноту, а проверять доступ лишь после генерации поздно. Изменения прав и удаления должны распространяться с измеримой задержкой; отзыв разрешений инвалидирует кеши, а кеш ответов учитывает актуальный доступ вызывающего. Общий кеш эмбеддингов необязательно разделять по пользователям, если он не раскрывает закрытый текст и поиск сохраняет проверку прав. Проверяю отзыв доступа, удаление документов и пользователей без прав, включая цитаты, подсказки и логи. Устаревание содержания можно обозначить, но при неизвестном статусе полномочий доступ надо закрыть, а не просто показать предупреждение."
    reading: ["azure-search-document-access"]
  - id: "rag-ann-index"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Compare exact search, HNSW and IVF-PQ for an embedding index under memory, recall and latency constraints."
      ru: "Сравните точный поиск, HNSW и IVF-PQ для индекса эмбеддингов при ограничениях памяти, полноты и задержки."
    tests:
      en: "Whether approximation is evaluated against a measurable exact baseline."
      ru: "Умение проверять приближённый поиск относительно точного эталона."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 16
    outline:
      en:
        - "Use exact search on a sample as the recall baseline."
        - "Compare graph traversal with coarse partitions and product quantisation."
        - "Measure memory, update cost and filtered-search behaviour at target latency."
      ru:
        - "Использовать точный поиск на выборке как эталон полноты."
        - "Сравнить обход графа с грубыми кластерами и product quantisation."
        - "Измерить память, стоимость обновлений и поиск с фильтрами при целевой задержке."
    answer:
      en: "I'd start with exact search over a sample of queries: it gives the baseline against which the word recall means anything at all. HNSW builds a multi layer graph of neighbours and descends it greedily: search is fast and accurate and inserts need no retraining, but deletes are usually only marked, and the graph lives entirely in memory and costs dearly there. IVF-PQ first divides the space into coarse clusters and looks at only the nearest few, storing vectors compressed by product quantisers: it cuts memory by an order of magnitude or more, but quantisation itself loses accuracy and the clustering has to be trained on representative data. I'd choose by measuring recall against the exact baseline at the target latency, and separately measure memory footprint, the cost of updates and deletions, and behaviour under metadata filters. A small collection needs no approximate index at all, and no index will fix bad embeddings."
      ru: "Начинал бы я с точного поиска на выборке запросов: он даёт эталон, относительно которого слово recall вообще имеет смысл. HNSW строит многослойный граф соседей и жадно спускается по нему: поиск быстрый и точный, вставка не требует переобучения, но удаления обычно лишь помечаются, а граф целиком живёт в памяти и дорого по ней обходится. IVF-PQ сначала делит пространство на грубые кластеры и смотрит лишь несколько ближайших, а векторы хранит сжатыми с помощью product quantisation: памяти нужно меньше на порядок, а то и больше, зато квантование само по себе теряет точность, а кластеризацию приходится обучать на репрезентативных данных. Выбор делал бы по замеру recall относительно точного эталона при целевой задержке, отдельно измерив объём памяти, стоимость обновлений и удалений и поведение при фильтрах по метаданным. Маленькой коллекции приближённый индекс не нужен вовсе, а плохие эмбеддинги никакой индекс не исправит."
    reading: ["paper-hnsw", "faiss-indexes"]
  - id: "rag-document-layout"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "How would you index tables, diagrams and multi-column pages without losing their relationships to surrounding text?"
      ru: "Как индексировать таблицы, схемы и многоколоночные страницы, сохраняя их связи с окружающим текстом?"
    tests:
      en: "Whether parsing errors and layout structure are considered before embedding."
      ru: "Учёт ошибок парсинга и структуры документа до построения эмбеддингов."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Recover layout before embedding: reading order across columns, table structure with headers, figure captions with page coordinates."
        - "Index tables and figures as linked units with header context and generated descriptions, tied to the paragraphs that cite them."
        - "Audit parsing on sampled pages against the rendered originals, then evaluate retrieval on questions answerable only from tables or figures."
      ru:
        - "Восстановить макет до эмбеддингов: порядок чтения по колонкам, структуру таблиц с заголовками, подписи рисунков с координатами на странице."
        - "Индексировать таблицы и рисунки как связанные единицы с контекстом заголовков и сгенерированными описаниями, привязав их к ссылающимся абзацам."
        - "Проверить парсинг на выборке страниц против отрисованных оригиналов, затем оценить поиск на вопросах, ответ на которые есть только в таблицах или рисунках."
    reading: ["anthropic-contextual-retrieval"]
  - id: "rag-freshness"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "Design continuous index updates, including changed documents, deletions and queries during a rebuild."
      ru: "Спроектируйте непрерывное обновление индекса с изменениями, удалениями и запросами во время перестроения."
    tests:
      en: "Whether freshness has consistency guarantees and an observable lag."
      ru: "Умение задать гарантии согласованности и измеримый лаг свежести."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "perplexity"
    added: "2026-09-26"
    outline:
      en:
        - "Apply ordered changes idempotently by document ID and version; define when a complete new chunk set becomes visible."
        - "Enforce deletions and revoked access at query time; rebuild from a consistent snapshot, catch up changes and validate before switching the read alias."
        - "Measure source-to-search lag and reconcile counts, representative queries and permissions; rollback must not resurrect deleted or forbidden content."
      ru:
        - "Идемпотентно применять упорядоченные изменения по ID и версии документа; задать момент видимости полного нового набора чанков."
        - "Проверять удаления и отзыв доступа при запросе; пересобирать из согласованного снимка, догонять изменения и проверять до смены read alias."
        - "Измерять задержку от источника до поиска, сверять количества, характерные запросы и права; откат не должен возвращать удалённое или запрещённое содержимое."
    reading: ["elastic-index-aliases", "azure-search-document-access"]
    start_here: ["engineering"]
    priority: 82
    answer:
      en: "I would treat indexing as a versioned projection of the source system, with stable document IDs, change ordering and explicit deletion records. Incremental workers need idempotent updates and a checkpoint so a retry neither skips a change nor resurrects deleted content. For a rebuild, I would create a separate index, load a consistent snapshot, catch up subsequent changes and validate counts, representative queries and permissions before switching the read alias. An atomic alias change helps the cutover, but it does not by itself solve stale writes or access revocation. Those need their own propagation and enforcement policy, including caches. I would monitor source-to-search lag and test updates, deletes and a query during cutover. A retained old index can support rollback only if deleted or newly restricted documents cannot become visible again; freshness includes authority as well as content."
      ru: "Я рассматривал бы индекс как версионированную проекцию источника со стабильными ID документов, порядком изменений и явными записями удаления. Инкрементальным workers нужны идемпотентные обновления и checkpoint, чтобы повтор не пропустил изменение и не воскресил удалённое содержимое. При пересборке я создал бы отдельный индекс, загрузил согласованный снимок, догнал последующие изменения и проверил количества, характерные запросы и права до переключения read alias. Атомарная смена alias помогает переключению, но сама не решает запоздавшие записи и отзыв доступа. Для них нужна отдельная политика распространения и проверки, включая кеши. Я наблюдал бы задержку от источника до поиска и проверял обновление, удаление и запрос во время перехода. Старый индекс пригоден для отката только тогда, когда удалённые или вновь ограниченные документы не становятся видимыми снова; свежесть относится и к полномочиям, и к содержимому."
  - id: "rag-citations"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "How would you connect each factual claim in an answer to the retrieved passage that supports it?"
      ru: "Как связать каждое фактическое утверждение ответа с подтверждающим найденным фрагментом?"
    tests:
      en: "Whether a citation is checked for support rather than merely attached."
      ru: "Умение проверять, подтверждает ли ссылка утверждение."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "perplexity"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 47
    outline:
      en:
        - "Bind each claim to a passage identifier during generation instead of appending links at the end."
        - "Verify that the cited passage entails the claim before the answer is shown."
        - "Define behaviour when nothing supports a claim: drop it, mark it unsupported or abstain."
      ru:
        - "Привязывать каждое утверждение к идентификатору фрагмента при генерации, а не добавлять ссылки в конце."
        - "Проверять, что процитированный фрагмент влечёт утверждение, до показа ответа."
        - "Определить поведение, когда подтверждения нет: убрать утверждение, помечать как неподтверждённое или отказаться отвечать."
    answer:
      en: "The point is that attaching a source is not evidence of support, so I design for claim-level attribution and then verify it. Generation emits each factual sentence with the identifier of the passage it used, ideally with character offsets, which keeps the binding checkable instead of a bibliography appended at the end. A separate verification step then asks whether the cited passage actually entails the claim — an entailment model or a second-pass judge, calibrated against a human-labelled sample, because a judge that rubber-stamps is worse than no check. Claims that fail get dropped, marked unsupported, or trigger abstention, and I measure the share of sentences with a verified citation, precision of citations on a labelled set, and how often the system abstains. The limit is that entailment only proves the passage says it; if retrieval surfaced a stale document, a perfectly supported claim can still be false."
      ru: "Смысл в том, что приложенная ссылка ещё не доказывает подтверждение, поэтому я проектирую привязку на уровне утверждений и затем её проверяю. Генерация помечает каждое фактическое предложение идентификатором использованного фрагмента, желательно со смещениями в символах, — тогда связь можно проверить, а не получить список литературы в конце. Отдельный шаг проверки спрашивает, действительно ли процитированный фрагмент влечёт утверждение: NLI-модель или судья вторым проходом, откалиброванный на размеченной людьми выборке, потому что судья, штампующий «подтверждено», хуже отсутствия проверки. Непрошедшие утверждения убираются, помечаются как неподтверждённые или приводят к отказу отвечать, а я измеряю долю предложений с проверенной ссылкой, точность ссылок на размеченном наборе и частоту отказов. Граница в том, что следование доказывает лишь то, что так написано во фрагменте: если поиск вернул устаревший документ, безупречно подтверждённое утверждение всё равно может быть ложным."
    reading: ["eugeneyan-llm-patterns"]
  - id: "rag-structured-queries"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "A user asks for the count of open orders blocked by supplier issues. Why might document retrieval fail, and what should answer the query?"
      ru: "Пользователь спрашивает число открытых заказов, заблокированных проблемами поставщика. Почему поиск документов может ошибиться и какой механизм должен отвечать?"
    tests:
      en: "Whether structured aggregation is separated from semantic retrieval."
      ru: "Умение отличать структурированную агрегацию от семантического поиска."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "palantir"
    added: "2026-09-26"
    outline:
      en:
        - "Explain why top-k retrieval fails: it returns similar passages, not a complete filtered set, so any count is a sample."
        - "Route to the system of record: a governed query over order status and block reason, with the model only translating intent."
        - "Pin down what counts as blocked by a supplier, show the query and data timestamp, and test against known counts."
      ru:
        - "Объяснить провал top-k поиска: он возвращает похожие фрагменты, а не полный отфильтрованный набор, поэтому любой подсчёт — лишь выборка."
        - "Направить запрос в систему учёта: управляемый запрос по статусу заказа и причине блокировки, а модель лишь переводит намерение."
        - "Уточнить, что считается блокировкой из-за поставщика, показать запрос и момент среза данных и проверить на заранее известных значениях."
    reading: ["paper-spider-2", "postgresql-table-expressions"]
  - id: "rag-clinical-context"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "How can a patient's existing medication list help transcribe drug names without causing the recogniser to insert drugs that were never spoken?"
      ru: "Как использовать список лекарств пациента для распознавания названий, не заставляя систему добавлять не произнесённые препараты?"
    tests:
      en: "Whether contextual retrieval is balanced against confirmation bias."
      ru: "Умение учитывать риск подтверждающего смещения при использовании контекста."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Use the list as a bounded decoding bias toward acoustically plausible matches, never as text to insert."
        - "Guard against confirmation bias: compare biased and unbiased hypotheses, and flag listed drugs with weak acoustic evidence for review."
        - "Test listed, new unlisted and unmentioned drugs; tune bias strength on recall against false insertions and substitutions."
      ru:
        - "Использовать список как ограниченное смещение декодирования в пользу акустически правдоподобных совпадений, а не как текст для вставки."
        - "Защититься от подтверждающего смещения: сравнивать гипотезы со смещением и без и отправлять на проверку препараты из списка со слабой акустической опорой."
        - "Проверить случаи с препаратом из списка, новым препаратом вне списка и без упоминания; подобрать силу смещения по полноте против вставок и подмен."
    reading: ["azure-speech-phrase-list", "who-large-multimodal-health"]
