  - id: "rag-embedding-drift"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "Search quality declines as the corpus changes. How would you detect embedding drift and separate it from indexing defects?"
      ru: "Качество поиска падает по мере изменения корпуса. Как выявить дрейф эмбеддингов и отличить его от ошибок индексации?"
    tests:
      en: "Whether diagnosis uses stable relevance sets and production slices."
      ru: "Умение диагностировать по стабильным наборам релевантности и срезам трафика."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
  - id: "rag-permissions"
    tracks: ["engineering","leadership"]
    type: "system_design"
    text:
      en: "Design retrieval that enforces the source system's access rights, including permission changes and shared caches."
      ru: "Спроектируйте поиск с соблюдением прав исходной системы, включая изменения разрешений и общие кеши."
    tests:
      en: "Whether access checks cover the full path to generated output."
      ru: "Умение обеспечить проверку доступа на всём пути до ответа."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "microsoft"
      - source: "outcome-school-company-wise"
        company: "databricks"
      - source: "outcome-school-company-wise"
        company: "palantir"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 15
    outline:
      en:
        - "Propagate identity and enforce authorisation before content reaches the model."
        - "Keep permission updates, deletions and cache keys consistent with the policy."
        - "Test denied access and revocation paths; citations and logs need the same boundary."
      ru:
        - "Передавать идентичность и проверять доступ до попадания текста в модель."
        - "Согласовать изменения прав, удаления и ключи кеша с политикой доступа."
        - "Проверить запрет и отзыв доступа; ссылки и логи должны соблюдать ту же границу."
    answer:
      en: "The source system defines document permissions; retrieval must enforce them before content reaches the model. I pass the user's identity into search and filter candidates by access, then check authoritative permissions if indexed ACL freshness cannot be established. Post-filtering can damage recall, and applying controls only after generation is too late. Permission changes and deletions need measurable propagation, revoked grants must invalidate caches, and cached answers must respect the current caller's access. A shared embedding cache need not be per user if it cannot expose restricted content and retrieval remains authorised. I test revoked access, deleted documents and users without rights, including citations, suggestions and logs. Stale content can be labelled; uncertain authorisation must fail closed rather than merely display a warning."
      ru: "Права задаёт исходная система, а поиск применяет их до передачи текста модели. Передаю в поиск идентичность пользователя и фильтрую кандидатов по доступу; если свежесть ACL индекса неизвестна, проверяю права в авторитетной системе. Постфильтрация может снизить полноту, а проверять доступ лишь после генерации поздно. Изменения прав и удаления должны распространяться с измеримой задержкой; отзыв разрешений инвалидирует кеши, а кеш ответов учитывает актуальный доступ вызывающего. Общий кеш эмбеддингов необязательно разделять по пользователям, если он не раскрывает закрытый текст и поиск сохраняет проверку прав. Проверяю отзыв доступа, удаление документов и пользователей без прав, включая цитаты, подсказки и логи. Устаревание содержания можно обозначить, но при неизвестном статусе полномочий доступ надо закрыть, а не просто показать предупреждение."
    reading: ["azure-search-document-access"]
  - id: "rag-ann-index"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Compare exact search, HNSW and IVF-PQ for an embedding index under memory, recall and latency constraints."
      ru: "Сравните точный поиск, HNSW и IVF-PQ для индекса эмбеддингов при ограничениях памяти, полноты и задержки."
    tests:
      en: "Whether approximation is evaluated against a measurable exact baseline."
      ru: "Умение проверять приближённый поиск относительно точного эталона."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 16
    outline:
      en:
        - "Use exact search on a sample as the recall baseline."
        - "Compare graph traversal with coarse partitions and product quantisation."
        - "Measure memory, update cost and filtered-search behaviour at target latency."
      ru:
        - "Использовать точный поиск на выборке как эталон полноты."
        - "Сравнить обход графа с грубыми кластерами и product quantisation."
        - "Измерить память, стоимость обновлений и поиск с фильтрами при целевой задержке."
    answer:
      en: "I'd start with exact search over a sample of queries: it gives the baseline against which the word recall means anything at all. HNSW builds a multi layer graph of neighbours and descends it greedily: search is fast and accurate, insertion is cheap, but the graph lives entirely in memory and costs dearly there. IVF-PQ first divides the space into coarse clusters and looks at only the nearest few, storing vectors compressed by product quantisers: it needs several times less memory, but quantisation itself loses accuracy and the clustering has to be trained on representative data. I'd choose by measuring recall against the exact baseline at the target latency, and separately measure memory footprint, the cost of updates and deletions, and behaviour under metadata filters. A small collection needs no approximate index at all, and no index will fix bad embeddings."
      ru: "Начинал бы я с точного поиска на выборке запросов: он даёт эталон, относительно которого слово recall вообще имеет смысл. HNSW строит многослойный граф соседей и жадно спускается по нему: поиск быстрый и точный, вставка дешёвая, но граф целиком живёт в памяти и дорого по ней обходится. IVF-PQ сначала делит пространство на грубые кластеры и смотрит лишь несколько ближайших, а векторы хранит сжатыми произведением квантователей: памяти нужно в разы меньше, зато квантование само по себе теряет точность, а кластеризацию приходится обучать на репрезентативных данных. Выбор делал бы по замеру recall относительно точного эталона при целевой задержке, отдельно измерив объём памяти, стоимость обновлений и удалений и поведение при фильтрах по метаданным. Маленькой коллекции приближённый индекс не нужен вовсе, а плохие эмбеддинги никакой индекс не исправит."
    reading: ["paper-hnsw", "faiss-indexes"]
