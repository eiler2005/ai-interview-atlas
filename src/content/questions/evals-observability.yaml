        company: "anthropic"
      - source: "outcome-school-company-wise"
        company: "openai"
    added: "2026-09-26"
  - id: "eval-release-gate"
    tracks: ["engineering","leadership"]
    type: "system_design"
    text:
      en: "Design a release gate for prompt and model updates, including what happens when aggregate gains hide a critical regression."
      ru: "Спроектируйте критерии допуска изменений промпта и модели, включая ситуацию, когда общий рост скрывает критическую регрессию."
    tests:
      en: "Whether release decisions account for failure severity and uncertainty."
      ru: "Учёт тяжести ошибок и неопределённости при выпуске."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 28
    outline:
      en:
        - "Version the candidate, baseline, dataset and graders."
        - "Set acceptance rules for critical slices and repeated stochastic trials."
        - "Combine offline results with a monitored rollout and explicit rollback criteria."
      ru:
        - "Версионировать кандидат, baseline, датасет и оценщиков."
        - "Задать правила допуска для критических срезов и повторных стохастических запусков."
        - "Сочетать офлайн-оценку с контролируемым rollout и явными критериями отката."
    answer:
      en: "Admitting a change means comparing the candidate against a pinned baseline, so first version everything: the prompt, the model and its parameters, the dataset, and the grader code. Without that you can't tell what to attribute the gain to. I set the acceptance rule as a set of conditions rather than one average: the aggregate is no worse than baseline and no critical slice has dropped, meaning safety, money, and rare but expensive scenarios. Otherwise an overall rise quietly hides a regression on a small but important group. I handle stochasticity with repeated runs and look at the spread, not one pass. Offline scores are not enough: next comes a controlled rollout on a share of traffic with rollback conditions written down in advance, so nobody argues about them mid-incident. A gate catches only what the dataset covers, so new failure modes appear after they have already happened in production."
      ru: "Допуск изменения — это сравнение кандидата с зафиксированным baseline, поэтому сначала версионируется всё: промпт, модель и её параметры, датасет и код оценщиков. Без этого непонятно, чему приписывать рост. Правило допуска задаю не одним средним числом, а набором условий: агрегат не хуже baseline и при этом ни один критический срез не просел — безопасность, деньги, редкие, но дорогие сценарии. Иначе общий рост спокойно прячет регрессию на маленькой, но важной группе. Стохастичность учитываю повторными запусками и смотрю на разброс, а не на единственный прогон. Офлайн-оценки мало: дальше идёт контролируемый rollout на доле трафика с заранее записанными условиями отката, чтобы не спорить о них посреди инцидента. Граница: гейт ловит только то, что покрыто датасетом, поэтому новые режимы отказа он увидит уже после того, как они случились в проде."
    reading: ["anthropic-evals-for-agents"]
  - id: "eval-benchmark-mismatch"
    tracks: ["engineering","leadership"]
    type: "applied_scenario"
    text:
      en: "Benchmark results improve but users report a worse product. What hypotheses would you test first?"
      ru: "Результаты бенчмарков растут, а пользователи жалуются на ухудшение продукта. Какие гипотезы проверить сначала?"
    tests:
      en: "Whether evaluation coverage is connected to actual user tasks."
      ru: "Умение связать покрытие оценки с реальными задачами пользователей."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 29
    outline:
      en:
        - "Compare benchmark tasks and traffic with actual user workflows."
        - "Check leakage, slice regressions, latency and changes in user expectations."
        - "Reproduce complaints and add representative failures without overfitting the test set."
      ru:
        - "Сопоставить задачи бенчмарка и трафик с реальными сценариями."
        - "Проверить утечки, регрессии срезов, задержку и изменения ожиданий."
        - "Воспроизвести жалобы и добавить типичные ошибки, не подгоняя модель под тест."
    answer:
      en: "The first hypothesis is a gap between what the benchmark measures and what people actually do in the product. I would take a sample of live traffic and line it up against the test set by task type, language and length; often the category that improved barely occurs in the product. The second hypothesis is test leakage into training, or fitting to the set. The third is a regression on a specific slice hidden by the average. The fourth is non-benchmark causes: latency went up, the answer format changed, expectations shifted after the update. There is one practical step: reproduce specific complaints as test cases and add typical failures to the set, and the conversation moves from impressions to measurement. The limit: grow the set carefully, because optimising straight at it will detach the metric from usefulness again, and some complaints are not about the model at all."
      ru: "Первая гипотеза — расхождение между тем, что меряет бенчмарк, и тем, что люди реально делают в продукте. Я бы взял выборку живого трафика и сопоставил её с составом тестового набора по типам задач, языку и длине: часто оказывается, что выросла категория, которая в продукте почти не встречается. Вторая гипотеза — утечка тестов в обучение или подгонка под набор. Третья — регрессия на конкретном срезе, спрятанная средним. Четвёртая — небенчмарочные причины: выросла задержка, изменился формат ответа, сместились ожидания после обновления. Практический шаг один: воспроизвести конкретные жалобы как тест-кейсы и добавить типичные ошибки в набор, тогда разговор переходит от впечатлений к измерению. Граница: пополнять набор надо аккуратно, потому что оптимизация прямо под него снова оторвёт метрику от пользы, а часть жалоб вообще не про модель."
    reading: ["google-rules-of-ml"]
  - id: "eval-contamination"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "How does benchmark contamination distort evaluation, and how would you reduce leakage into training or model selection?"
      ru: "Как загрязнение бенчмарка искажает оценку и как уменьшить утечку в обучение или подбор модели?"
    tests:
      en: "Whether repeated tuning on test data is recognised as leakage."
      ru: "Понимание того, что повторная настройка по тестовому набору создаёт утечку."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
  - id: "eval-traces"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "Design observability for a production LLM workflow: which spans, versions, costs and feedback should be linked?"
      ru: "Спроектируйте наблюдаемость LLM-процесса в production: какие spans, версии, затраты и обратную связь нужно связать?"
    tests:
      en: "Whether a failed user task can be reconstructed without indiscriminate sensitive logging."
      ru: "Умение восстановить сбой задачи без бесконтрольного логирования чувствительных данных."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 30
    outline:
      en:
        - "Link model, retrieval and tool spans to one task identifier and version set."
        - "Record latency, token use, outcomes and sampled feedback with retention controls."
        - "Use traces to diagnose stage failures and convert recurring failures into eval cases."
      ru:
        - "Связать spans модели, retrieval и инструментов с идентификатором задачи и версиями."
        - "Записывать задержки, токены, исходы и выборочную обратную связь с ограничением хранения."
        - "Локализовать по трассировкам ошибки этапов и превращать повторы в eval-кейсы."
    answer:
      en: "The core of observability is one end-to-end task identifier that every span attaches to: model calls, retrieval steps, tool calls, with the prompt, model, index and code versions alongside. Without versions a trace shows what broke but will not answer which change broke it. On each span I record latency, tokens and cost, the outcome and the error code, and I collect user feedback on a sample and bind it to the same identifier. Request and response contents are sensitive data, so I keep them selectively, with a short retention and masked fields, while metrics and structure can live longer. From there the traces show at which stage the task is lost, and recurring failures move into the eval set as cases. The limit: a trace explains one failure but says nothing about how frequent it is until there are aggregates beside it."
      ru: "Ядро наблюдаемости — сквозной идентификатор задачи, к которому привязаны все spans: вызовы модели, шаги retrieval, вызовы инструментов, а рядом версии промпта, модели, индекса и кода. Без версий трассировка покажет, что сломалось, но не ответит, после какого изменения. На каждом span пишу задержку, токены и стоимость, исход и код ошибки, а пользовательскую обратную связь собираю выборочно и привязываю к тому же идентификатору. Содержимое запросов и ответов — чувствительные данные, поэтому храню их выборочно, с коротким сроком и маскированием полей, тогда как метрики и структуру можно держать дольше. Дальше по трассировкам видно, на каком этапе теряется задача, а повторяющиеся сбои переношу в eval-набор как кейсы. Граница: трассировка объясняет отдельный сбой, но не говорит, насколько он част, пока рядом нет агрегатов."
    reading: ["google-sre-book","anthropic-evals-for-agents"]
