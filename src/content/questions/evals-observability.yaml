theme: "evals-observability"
questions:
  - id: "eval-reasoning-counterfactual"
    tracks: ["engineering", "leadership"]
    type: "applied_scenario"
    text:
      en: "A team attributes better results to a reasoning model, but it also changed prompts, tools and compute budget. Design a comparison that identifies what improved."
      ru: "Команда связывает улучшение результатов с reasoning-моделью, но одновременно изменила промпты, инструменты и вычислительный бюджет. Как выяснить, что именно помогло?"
    tests:
      en: "Whether a model claim is separated from changes to the surrounding system."
      ru: "Умение отделить эффект модели от изменений окружающей системы."
    provenance: "generated"
    basis: ["radar:evals-observability"]
    added: "2026-09-29"
    start_here: ["engineering"]
    priority: 68
    outline:
      en:
        - "Freeze task inputs, scoring and tool state; vary model, prompt and budget in controlled comparisons."
        - "Repeat trials and report uncertainty, difficult slices and failures rather than only aggregate wins."
        - "Compare both a matched-budget baseline and the deployable system under its actual cost and latency limits."
      ru:
        - "Зафиксировать задания, оценку и состояние инструментов; менять модель, промпт и бюджет в контролируемых сравнениях."
        - "Повторить прогоны и показать неопределённость, сложные срезы и ошибки, а не только общую долю побед."
        - "Сравнить и базовый вариант при равном бюджете, и рабочую систему с её реальными ограничениями цены и задержки."
    answer:
      en: "Three changes shipped together, so a before-and-after number credits the model with all of them by default. I'd freeze what isn't under test: the task set, the grader and the tool environment, with tool responses recorded so a live API can't drift between runs. Then I'd vary one factor at a time plus the combinations that matter: old model with the new prompt and tools, new model with the old prompt, both models at the same compute budget. A full factorial over old and new versions of model, prompt, tools and budget is only sixteen configurations. Reasoning models respond strongly to budget, so an unmatched comparison often measures extra test-time compute rather than the model. Each cell gets repeated trials, since a few points on a stochastic system can be noise, and I'd report intervals, hard slices and failure examples, not one average. Separately, I'd measure the deployable system under its real cost and latency limits: the matched-budget winner may be unaffordable. If the factors interact strongly, the honest answer is the combination."
      ru: "Три изменения вышли одновременно, поэтому сравнение до и после по умолчанию приписывает модели их все. Я бы заморозил то, что не проверяется: набор задач, оценщика и среду инструментов, а ответы инструментов записал бы, чтобы живой API не дрейфовал между прогонами. Дальше менял бы по одному фактору плюс важные сочетания: старая модель с новыми промптом и инструментами, новая модель со старым промптом, обе модели при одинаковом бюджете вычислений. Полный перебор старых и новых версий модели, промпта, инструментов и бюджета — всего шестнадцать конфигураций. Reasoning-модели сильно реагируют на бюджет, так что сравнение без его выравнивания часто меряет лишние вычисления при инференсе, а не модель. В каждой ячейке нужны повторные прогоны, потому что пара пунктов у стохастической системы бывает шумом, и показывать стоит интервалы, сложные срезы и примеры ошибок, а не одно среднее. Отдельно я бы измерил рабочую систему в её реальных пределах цены и задержки: победитель при равном бюджете может оказаться не по карману. Если факторы сильно взаимодействуют, честный ответ — само сочетание."
    reading: ["openai-evaluation-best-practices", "paper-test-time-compute"]
  - id: "eval-reasoning-supervision"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Distinguish outcome rewards, process supervision and inference-time verification. What evidence would justify each for a new reasoning task?"
      ru: "Различите награду за результат, process supervision и проверку при инференсе. Какие данные обоснуют выбор каждого подхода для новой reasoning-задачи?"
    tests:
      en: "Whether training signals are distinguished from deployment-time selection and independently measured quality."
      ru: "Умение отличать обучающий сигнал от отбора при инференсе и независимой оценки качества."
    provenance: "generated"
    basis: ["radar:evals-observability"]
    added: "2026-09-29"
    start_here: ["engineering"]
    priority: 69
    outline:
      en:
        - "Explain which feedback changes model weights and which selects among outputs at inference."
        - "Assess label availability, verifier errors and ways to exploit the reward or selection rule."
        - "Use independent held-out outcome checks; do not generalise mathematics results to every workflow."
      ru:
        - "Объяснить, какая обратная связь меняет веса, а какая выбирает результат при инференсе."
        - "Оценить доступность разметки, ошибки проверяющего и способы обмануть награду или правило отбора."
        - "Проверять результат независимо на отложенных данных; не переносить выводы по математике на все процессы."
    answer:
      en: "The first two are training signals; the third isn't. An outcome reward scores only the end result, an exact answer or passing tests, like the rule-based rewards behind DeepSeek-R1, and reinforcement learning on it changes the weights: cheap when a checker exists, but the credit is sparse and a right answer reached by wrong steps still gets paid. Process supervision labels individual steps and trains a reward model on them; Lightman et al. found it selected maths solutions better than outcome supervision, at the price of step-level human labels. Inference-time verification leaves the weights alone: sample several candidates and let a verifier or a vote choose, paying latency and tokens per request. The same step-level reward model can serve either role, so the distinction is where the signal is applied. I'd want to know whether a reliable outcome check exists, whether step labels are affordable and consistent, and the verifier's false-accept rate, because any rule gets exploited. I'd judge all three on held-out outcome checks independent of that signal, and wouldn't carry maths results to workflows without a checker."
      ru: "Первые два — обучающие сигналы, третий — нет. Награда за результат оценивает только итог, точный ответ или прошедшие тесты, как награды на основе правил в DeepSeek-R1, и обучение с подкреплением по ней меняет веса: это дёшево, когда есть проверка, но сигнал редкий, а правильный ответ, добытый неверными шагами, всё равно получает награду. Process supervision размечает отдельные шаги и обучает на них модель награды; Lightman и соавторы показали, что на математике она отбирает решения лучше, чем надзор по результату, ценой пошаговой разметки людьми. Проверка при инференсе веса не трогает: сэмплируем несколько кандидатов, выбирает проверяющий или голосование, а платим задержкой и токенами на каждом запросе. Одна и та же пошаговая модель награды может играть любую из этих ролей, так что различие в том, где применяется сигнал. Мне нужно знать, есть ли надёжная проверка итога, доступна ли и согласована ли пошаговая разметка и какова доля ложных принятий у проверяющего, потому что любое правило начнут эксплуатировать. Все три подхода я бы оценивал независимой проверкой итога на отложенных задачах и не переносил выводы с математики на процессы, где проверки нет."
    reading: ["paper-deepseek-r1", "paper-process-supervision"]
  - id: "eval-reasoning-trace-faithfulness"
    tracks: ["engineering", "leadership"]
    type: "applied_scenario"
    text:
      en: "A reasoning summary looks sound, but the answer follows a misleading hint. What should an evaluation and monitoring system conclude?"
      ru: "Краткое объяснение reasoning-модели выглядит убедительно, но ответ следует ложной подсказке. Какие выводы должны сделать оценка и мониторинг?"
    tests:
      en: "Whether observable explanations are distinguished from correctness and faithful accounts of computation."
      ru: "Умение отличать наблюдаемое объяснение от правильности и достоверного описания вычислений."
    provenance: "generated"
    basis: ["radar:evals-observability"]
    added: "2026-09-29"
    start_here: ["engineering"]
    priority: 52
    outline:
      en:
        - "Score final results and observable actions independently of explanation quality."
        - "Compare otherwise identical tasks with and without misleading hints; measure answer changes and disclosures separately."
        - "Treat summaries and available traces as incomplete diagnostic signals, not access to hidden reasoning or a safety guarantee."
      ru:
        - "Оценивать итог и наблюдаемые действия независимо от качества объяснения."
        - "Сравнить одинаковые задачи с ложной подсказкой и без неё; отдельно измерять изменение ответа и признание влияния подсказки."
        - "Считать резюме и доступные трассы неполными диагностическими сигналами, а не доступом к скрытым рассуждениям или гарантией безопасности."
    answer:
      en: "The conclusion is that the explanation is not evidence about the computation. A summary that reads well while the answer tracks a planted hint tells you the account is unfaithful, not that the model reasoned well and slipped. So the system should score what it can observe — final answers, tool calls, actions taken — independently of how coherent the narration looks, and never let a plausible summary raise confidence in a wrong result. The diagnostic I would build is paired: run otherwise identical tasks with and without the misleading hint, then measure two things separately, how often the answer moves with the hint, and how often the explanation admits the hint influenced it. A wide gap is the faithfulness signal. In monitoring, treat traces and summaries as useful, incomplete hints for triage. They are not a window into hidden reasoning, so a clean trace is not a safety guarantee."
      ru: "Вывод в том, что объяснение не является свидетельством о вычислении. Убедительно читающееся резюме при ответе, который следует подброшенной подсказке, говорит о недостоверности самого отчёта, а не о том, что модель рассуждала верно и случайно ошиблась. Поэтому система должна оценивать наблюдаемое — итоговые ответы, вызовы инструментов, совершённые действия — независимо от связности изложения и никогда не повышать доверие к неверному результату из-за складного резюме. Диагностика, которую я бы построил, парная: прогнать одинаковые в остальном задачи с ложной подсказкой и без неё, а затем измерять отдельно две величины — как часто ответ смещается вслед за подсказкой и как часто объяснение признаёт её влияние. Большой разрыв между ними и есть сигнал недостоверности. В мониторинге трассы и резюме полезны как неполные подсказки для разбора. Они не окно в скрытые рассуждения, поэтому чистая трасса не является гарантией безопасности."
    reading: ["paper-reasoning-faithfulness"]
  - id: "eval-judge"
    tracks: ["engineering"]
    roles: ["eval-engineer"]
    type: "system_design"
    text:
      en: "Design an LLM judge and a calibration process that exposes order, verbosity and self-preference biases."
      ru: "Спроектируйте LLM-судью и калибровку, выявляющую смещения из-за порядка, многословия и предпочтения собственных ответов."
    tests:
      en: "Whether model judgements are validated against independent labels."
      ru: "Умение проверять решения модели по независимой разметке."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "perplexity"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 27
    outline:
      en:
        - "Define a task-specific rubric and a held-out human-labelled calibration set."
        - "Randomise answer order and test sensitivity to length and model identity."
        - "Measure disagreements and use expert review where automated judgement is unreliable."
      ru:
        - "Задать критерии задачи и отложенную калибровочную выборку с человеческой разметкой."
        - "Менять порядок ответов и проверять влияние длины и идентичности модели."
        - "Измерять расхождения и передавать экспертам ненадёжные случаи."
    answer:
      en: "A judge starts not with a prompt but with criteria: what counts as a good answer in this task, written so that two people would agree. Then you need a held-out calibration set with human labels; it measures the judge itself, otherwise we are simply trusting a model to grade a model. The known biases are checked by experiment: run each pair in both orders and see whether the verdict flips; pad answers with repetition that adds no content and see whether they start winning, to catch a reward for verbosity; compare how often the judge prefers its own family's answers with how often people do on the same pairs, since a judge can favour its own style even when authorship is hidden. I would track agreement between judge and people, the share of pairs where swapping order changes the decision, and send unreliable cases to experts. The limit: a judge measures conformance to criteria, not usefulness to the user, and wherever an answer can be checked deterministically an ordinary check is cheaper."
      ru: "Судья начинается не с промпта, а с критериев: что именно считается хорошим ответом в этой задаче, сформулированное так, чтобы два человека сошлись. Дальше нужна отложенная калибровочная выборка с человеческой разметкой — она измеряет самого судью, иначе мы просто доверяем модели оценивать модель. Известные смещения проверяются экспериментом: прогнать каждую пару в обоих порядках и посмотреть, меняется ли вердикт; раздуть ответы повторами без нового содержания и посмотреть, не начнут ли они выигрывать, чтобы поймать награду за многословие; сравнить, как часто судья предпочитает ответы своего семейства и как часто их предпочитают люди на тех же парах, ведь судья может отдавать предпочтение своему стилю даже при скрытом авторстве. Я бы считал согласие судьи с людьми и долю пар, где перестановка меняет решение, а ненадёжные случаи отправлял экспертам. Граница: судья измеряет соответствие критериям, а не пользу для пользователя, и там, где ответ проверяется детерминированно, дешевле обычная проверка."
    reading: ["paper-llm-as-judge"]
  - id: "eval-scarce-labels"
    tracks: ["engineering","leadership"]
    roles: ["eval-engineer"]
    type: "applied_scenario"
    text:
      en: "How would you build a useful evaluation set when reference answers are missing and expert time is scarce?"
      ru: "Как собрать полезный eval-набор без эталонных ответов и при дефиците экспертного времени?"
    tests:
      en: "Whether sampling and annotation effort target consequential uncertainty."
      ru: "Умение направить выборку и разметку на значимую неопределённость."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Start from error analysis of real traces to learn which failures matter, before labelling anything."
        - "Spend expert time on uncertain, high-stakes cases, judged by pass-fail criteria rather than one answer to match."
        - "Calibrate cheaper graders against expert labels and track agreement before trusting them at scale."
      ru:
        - "Начать с разбора ошибок на реальных трассах, чтобы понять, какие сбои важны, до всякой разметки."
        - "Тратить время экспертов на неочевидные случаи с высокой ценой ошибки, оценивая по бинарным критериям, а не по совпадению с единственным ответом."
        - "Калибровать более дешёвых оценщиков по экспертной разметке и следить за согласием, прежде чем доверять им в масштабе."
    reading: ["hamel-evals", "anthropic-evals-for-agents"]
    start_here: ["engineering"]
    priority: 78
    answer:
      en: "I would begin with a small set of representative requests and a failure taxonomy, then spend expert time where a wrong judgement changes the product decision. Not every case needs a single reference answer: some can be checked through required evidence, forbidden claims, valid state transitions or an explicit abstention rule. Experts should define those criteria and adjudicate ambiguous examples before I automate grading. I would separate development cases from a held-out check set and keep their provenance and revisions visible. Synthetic cases can probe boundaries, but they do not establish the frequency of real user failures. A model judge can help prioritise review only after comparison with human labels; disagreement remains an inspection queue. I would report coverage gaps and uncertainty instead of treating a small, convenient dataset as proof of quality. More labels are valuable when they change a decision, not merely increase a count."
      ru: "Я начал бы с небольшого набора характерных запросов и классификации ошибок, затем тратил экспертное время там, где неверная оценка меняет продуктовый выбор. Не каждому кейсу нужен единственный эталонный ответ: часть проверяется по обязательным основаниям, запрещённым утверждениям, допустимым переходам состояния или правилу отказа. До автоматизации эксперты должны определить критерии и разобрать неоднозначные примеры. Я отделил бы случаи для разработки от отложенной проверки и сохранил происхождение и историю изменений. Синтетические кейсы полезны для границ, но не показывают частоту реальных пользовательских ошибок. Модель-судья помогает приоритизировать просмотр только после сравнения с человеческими метками; разногласие остаётся задачей для разбора. Вместо доказательства качества маленьким удобным набором я показал бы непокрытые области и неопределённость. Дополнительная разметка ценна, когда меняет решение, а не только увеличивает число; критические редкие ошибки следует рассматривать отдельно от среднего."
  - id: "eval-hallucination"
    tracks: ["engineering"]
    roles: ["eval-engineer"]
    type: "system_design"
    text:
      en: "How would you measure unsupported claims in a deployed RAG application without treating every fluent answer as correct?"
      ru: "Как измерять неподтверждённые утверждения в работающем RAG-приложении, не принимая гладкий текст за правильный ответ?"
    tests:
      en: "Whether faithfulness to evidence is separated from fluency and general plausibility."
      ru: "Умение отличать опору на источники от беглости и правдоподобия."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
      - source: "outcome-school-company-wise"
        company: "openai"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 51
    outline:
      en:
        - "Make the unit a claim checked against the passages actually retrieved for that answer."
        - "Scale labelling with a judge calibrated against a human-labelled sample."
        - "Separate a retrieval failure from an unfaithful generation when attributing the error."
      ru:
        - "Сделать единицей измерения утверждение, проверенное против фрагментов, реально найденных для этого ответа."
        - "Масштабировать разметку судьёй, откалиброванным на размеченной людьми выборке."
        - "Разделять ошибку поиска и недостоверную генерацию при отнесении причины."
    answer:
      en: "Fluency is not the signal, so I measure faithfulness against the evidence the system actually retrieved, not against the world. The unit is a claim: decompose the answer into separate statements and label each supported, contradicted or unsupported by the retrieved passages. That judgement scales with an LLM judge, but only after I calibrate it against a human-labelled sample, because an uncalibrated judge inherits the same plausibility bias I am trying to detect. Attribution matters as much as the rate: if the supporting passage was never retrieved, that is a retrieval defect, and improving the prompt will not fix it. On live traffic I would sample by segment rather than uniformly, since failures cluster in thin or ambiguous parts of the corpus. The limit is that a claim faithful to a retrieved passage can still be wrong if the source is stale, so faithfulness measures grounding, not truth."
      ru: "Беглость — не сигнал, поэтому достоверность я измеряю против тех свидетельств, которые система реально нашла, а не против мира. Единица измерения — утверждение: ответ разбирается на отдельные высказывания, и каждое помечается как подтверждённое, опровергнутое или неподтверждённое найденными фрагментами. Эта разметка масштабируется LLM-судьёй, но лишь после калибровки на размеченной людьми выборке, потому что некалиброванный судья наследует ту же склонность к правдоподобию, которую я и пытаюсь поймать. Отнесение причины важно не меньше самой доли: если подтверждающего фрагмента вообще не было в выдаче, это дефект поиска, и правка промпта его не устранит. На живом трафике я бы отбирал примеры по сегментам, а не равномерно, поскольку сбои скапливаются в слабо покрытых и неоднозначных частях корпуса. Граница в том, что утверждение, достоверное относительно найденного фрагмента, всё равно может быть неверным при устаревшем источнике: достоверность измеряет опору на источник, а не истинность."
    reading: ["hamel-evals"]
  - id: "eval-release-gate"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "eval-engineer"]
    type: "system_design"
    text:
      en: "Design a release gate for prompt and model updates, including what happens when aggregate gains hide a critical regression."
      ru: "Спроектируйте критерии допуска изменений промпта и модели, включая ситуацию, когда общий рост скрывает критическую регрессию."
    tests:
      en: "Whether release decisions account for failure severity and uncertainty."
      ru: "Учёт тяжести ошибок и неопределённости при выпуске."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 28
    outline:
      en:
        - "Version the candidate, baseline, dataset and graders."
        - "Set acceptance rules for critical slices and repeated stochastic trials."
        - "Combine offline results with a monitored rollout and explicit rollback criteria."
      ru:
        - "Версионировать кандидат, baseline, датасет и оценщиков."
        - "Задать правила допуска для критических срезов и повторных стохастических запусков."
        - "Сочетать офлайн-оценку с контролируемым rollout и явными критериями отката."
    answer:
      en: "I'd version everything, prompt, model and parameters, dataset and grader code, and compare the candidate with a pinned baseline on the same items. The rule isn't one average: the aggregate must not drop, and each critical slice, safety, money, rare but expensive cases, has its own rule. The hard part is statistics on small slices. With 50 items at a 90 percent pass rate, the 95 percent interval is about plus or minus eight points, so a three-point regression is invisible. So I compare paired, item by item, with several samples per item, and count items that flipped from pass to fail; for the most severe failures I keep must-pass items where any flip blocks. Thresholds and severity weights are fixed before the run, because a strict gate rejects good releases and a loose one ships regressions, and that trade is a product decision. Then a canary on a small share of traffic with numeric rollback triggers. The boundary: the gate only sees failure modes the dataset covers."
      ru: "Версионирую всё — промпт, модель с параметрами, датасет и код оценщиков — и сравниваю кандидата с зафиксированным baseline на тех же примерах. Правило — не одно среднее: агрегат не должен просесть, а у каждого критического среза — безопасность, деньги, редкие, но дорогие сценарии — своё правило. Самое трудное — статистика на маленьких срезах. На 50 примерах при доле успеха 90% 95-процентный доверительный интервал — примерно плюс-минус восемь пунктов, так что регрессию в три пункта просто не видно. Поэтому сравниваю попарно, пример за примером, с несколькими сэмплами на пример, и считаю примеры, которые перешли из прошедших в проваленные; для самых тяжёлых отказов держу обязательные примеры, где любой такой переход блокирует выпуск. Пороги и веса тяжести фиксируются до прогона, потому что строгий гейт отклоняет хорошие релизы, а мягкий пропускает регрессии, и этот выбор — продуктовое решение. Дальше canary на малой доле трафика с числовыми порогами отката. Граница: гейт видит только те режимы отказа, которые покрыты датасетом."
    reading: ["anthropic-evals-for-agents"]
  - id: "eval-benchmark-mismatch"
    tracks: ["engineering","leadership"]
    roles: ["eval-engineer"]
    type: "applied_scenario"
    text:
      en: "Benchmark results improve but users report a worse product. What hypotheses would you test first?"
      ru: "Результаты бенчмарков растут, а пользователи жалуются на ухудшение продукта. Какие гипотезы проверить сначала?"
    tests:
      en: "Whether evaluation coverage is connected to actual user tasks."
      ru: "Умение связать покрытие оценки с реальными задачами пользователей."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 29
    outline:
      en:
        - "Compare benchmark tasks and traffic with actual user workflows."
        - "Check leakage, slice regressions, latency and changes in user expectations."
        - "Reproduce complaints and add representative failures without overfitting the test set."
      ru:
        - "Сопоставить задачи бенчмарка и трафик с реальными сценариями."
        - "Проверить утечки, регрессии срезов, задержку и изменения ожиданий."
        - "Воспроизвести жалобы и добавить типичные ошибки, не подгоняя модель под тест."
    answer:
      en: "I'd order the hypotheses by how cheaply each can be ruled out. First, causes outside the model: latency, answer format, truncation or a changed system prompt, visible in logs within a day. Second, a mix mismatch: classify a sample of live traffic by task type, language and length, and re-weight the benchmark gain by that mix; if the gain vanishes, the model improved where users aren't. Third, a regression on a slice the average hides, from per-slice deltas. Fourth, the direct test of the complaint: a blind side-by-side of the old and new model on sampled production prompts, judged by people or by a judge calibrated against them. If the new model wins there, the complaints are about something else, often changed expectations. Fifth, contamination: n-gram overlap with training data, and reworded benchmark items, where a real gain survives rewording. Reproduced complaints become test cases, but I'd hold part of them out, because optimising straight at them detaches the metric from usefulness again."
      ru: "Гипотезы я бы упорядочил по тому, насколько дёшево каждую отбросить. Первая — причины вне модели: задержка, формат ответа, обрезка или изменённый системный промпт; это видно в логах за день. Вторая — несовпадение состава: разметить выборку живого трафика по типам задач, языку и длине и перевзвесить прирост на бенчмарке по этому составу; если прирост исчезает, модель улучшилась там, где пользователей нет. Третья — регрессия на срезе, которую прячет среднее; её покажут изменения по срезам. Четвёртая — прямая проверка самой жалобы: слепое попарное сравнение старой и новой модели на выборке продовых запросов с оценкой людьми или судьёй, откалиброванным по людям. Если новая модель там выигрывает, жалобы о чём-то другом, часто об изменившихся ожиданиях. Пятая — утечка тестов: пересечение n-грамм с обучающими данными и перефразированные задания бенчмарка, на которых настоящий прирост сохраняется. Воспроизведённые жалобы становятся тест-кейсами, но часть я бы держал отдельно, потому что оптимизация прямо под них снова оторвёт метрику от пользы."
    reading: ["google-rules-of-ml"]
  - id: "eval-contamination"
    tracks: ["engineering"]
    roles: ["eval-engineer"]
    type: "knowledge"
    text:
      en: "How does benchmark contamination distort evaluation, and how would you reduce leakage into training or model selection?"
      ru: "Как загрязнение бенчмарка искажает оценку и как уменьшить утечку в обучение или подбор модели?"
    tests:
      en: "Whether repeated tuning on test data is recognised as leakage."
      ru: "Понимание того, что повторная настройка по тестовому набору создаёт утечку."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Distinguish test items seen in pre-training from selection leakage through repeated tuning on the test set."
        - "Keep a private test set used once per decision, and tune only on a separate development split."
        - "Detect contamination with n-gram overlap and canary strings, and compare against items created after the data cutoff."
      ru:
        - "Различать попадание тестовых примеров в предобучение и утечку через отбор при многократной настройке по тесту."
        - "Держать закрытый тестовый набор, используемый один раз на решение, и настраивать только на отдельной dev-выборке."
        - "Выявлять загрязнение по пересечению n-грамм и canary-строкам и сравнивать с заданиями, созданными после даты среза данных."
    reading: ["paper-contamination-proof"]
  - id: "eval-traces"
    tracks: ["engineering"]
    roles: ["eval-engineer"]
    type: "system_design"
    text:
      en: "Design observability for a production LLM workflow: which spans, versions, costs and feedback should be linked?"
      ru: "Спроектируйте наблюдаемость LLM-процесса в production: какие spans, версии, затраты и обратную связь нужно связать?"
    tests:
      en: "Whether a failed user task can be reconstructed without indiscriminate sensitive logging."
      ru: "Умение восстановить сбой задачи без бесконтрольного логирования чувствительных данных."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 30
    outline:
      en:
        - "Link model, retrieval and tool spans to one task identifier and version set."
        - "Record latency, token use, outcomes and sampled feedback with retention controls."
        - "Use traces to diagnose stage failures and convert recurring failures into eval cases."
      ru:
        - "Связать spans модели, retrieval и инструментов с идентификатором задачи и версиями."
        - "Записывать задержки, токены, исходы и выборочную обратную связь с ограничением хранения."
        - "Локализовать по трассировкам ошибки этапов и превращать повторы в eval-кейсы."
    answer:
      en: "Every user task gets one trace id that all spans attach to, model calls, retrieval and tool calls, each tagged with the prompt, model, index and code versions, so a trace answers not only what broke but which change broke it. Each span records latency, tokens, cost, outcome and error code, and user feedback carries the same id. Content is the sensitive part, so structure and metrics are kept for every task, while full payloads are kept by tail-based sampling: every failed task, low judge score or thumbs-down, plus a small fixed share of successes as a baseline, with masked fields and short retention. Then a failure reads directly: a retrieval span that returned nothing followed by a confident answer goes into an ungrounded-answer bucket, not a model bucket. I'd measure the share of failures attributed to a stage, time to diagnose and payloads that escaped masking, and recurring buckets become eval cases. The boundary: a wrong but fluent answer looks like a success, so its payload survives only if feedback or a judge flags it."
      ru: "Каждая пользовательская задача получает один trace id, к которому привязаны все spans — вызовы модели, retrieval и вызовы инструментов, — и каждый помечен версиями промпта, модели, индекса и кода, так что трасса отвечает не только на вопрос, что сломалось, но и после какого изменения. На каждом span пишу задержку, токены, стоимость, исход и код ошибки, а пользовательская обратная связь несёт тот же идентификатор. Чувствительно именно содержимое, поэтому структуру и метрики храню для всех задач, а полные тексты — по tail-based sampling: каждая неудачная задача, низкая оценка судьи или дизлайк плюс небольшая фиксированная доля успешных как база для сравнения, с маскированием полей и коротким сроком хранения. Тогда сбой читается прямо: span поиска, вернувший пустоту, после которого идёт уверенный ответ, попадает в корзину необоснованных ответов, а не ошибок модели. Измерял бы долю сбоев, отнесённых к конкретному этапу, время диагностики и тексты, проскочившие маскирование, а повторяющиеся корзины превращаю в eval-кейсы. Граница: неверный, но гладкий ответ выглядит как успех, поэтому его полный текст сохранится, только если его отметит обратная связь или судья."
    reading: ["google-sre-book","anthropic-evals-for-agents"]
  - id: "eval-prompt-rollback"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "How would you version prompts and dependent configuration so an observed regression can be rolled back reproducibly?"
      ru: "Как версионировать промпты и зависимые настройки для воспроизводимого отката обнаруженной регрессии?"
    tests:
      en: "Whether rollback restores the actual system configuration."
      ru: "Умение восстановить при откате реальную конфигурацию системы."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Version the full configuration as one immutable bundle: prompt, model snapshot, parameters, tools and retrieval index."
        - "Pin model snapshots rather than aliases, since a floating alias changes behaviour without a deploy."
        - "Log the bundle id on every request, and confirm a rollback by rerunning the failing cases on it."
      ru:
        - "Версионировать всю конфигурацию одним неизменяемым набором: промпт, снимок модели, параметры, инструменты и индекс поиска."
        - "Закреплять конкретные снимки моделей, а не псевдонимы: плавающий псевдоним меняет поведение без деплоя."
        - "Записывать id набора в каждом запросе и подтверждать откат повторным прогоном упавших кейсов на восстановленном наборе."
    reading: ["google-sre-book"]
    start_here: ["engineering"]
    priority: 80
    answer:
      en: "I would version a release bundle, not just a prompt string: model identifier, decoding settings, tool schemas, retrieval configuration, relevant index version and application code all affect behaviour. Each trace should identify that bundle so a reported regression can be reproduced as closely as the provider allows. I would compare the candidate and previous bundle on held-out cases, inspect critical failures separately and define a rollback trigger before rollout. Returning traffic to a known bundle is useful only if its dependencies still exist and remain authorised. Index changes may need a retained compatible version, while an external action cannot be undone merely by restoring a prompt. I would therefore separate configuration rollback from reconciliation of side effects. The operational check is a rehearsed switch and recovery path; perfect reproducibility cannot be promised when a provider changes an unpinned model or service."
      ru: "Я версионировал бы пакет релиза, а не только строку промпта: идентификатор модели, параметры генерации, схемы инструментов, поиск, нужная версия индекса и код приложения влияют на поведение. Каждая трасса указывает пакет, чтобы воспроизвести регрессию настолько точно, насколько позволяет провайдер. Я сравнил бы новый и прежний пакеты на отложенных кейсах, отдельно разобрал критические ошибки и определил триггер отката до rollout. Возврат трафика полезен лишь тогда, когда зависимости прежнего пакета ещё существуют и разрешены. Для изменения индекса может понадобиться сохранённая совместимая версия, а внешнее действие не отменяется восстановлением промпта. Поэтому откат конфигурации нужно отделить от сверки побочных эффектов. Эксплуатационная проверка — отрепетированное переключение и восстановление; идеальная воспроизводимость невозможна, если провайдер меняет незакреплённую модель или сервис. Эти ограничения я записал бы заранее и предусмотрел понятный отказ, если безопасного возврата уже нет."
  - id: "eval-online"
    tracks: ["engineering","leadership"]
    roles: ["eval-engineer"]
    type: "system_design"
    text:
      en: "Design online evaluation for an AI feature: choose what to log, review manually and compare in an experiment."
      ru: "Спроектируйте онлайн-оценку AI-функции: что логировать, проверять вручную и сравнивать экспериментом?"
    tests:
      en: "Whether experimental outcomes are distinguished from passive correlations."
      ru: "Умение отличать результаты эксперимента от пассивных корреляций."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "perplexity"
    added: "2026-09-26"
    outline:
      en:
        - "Log inputs, outputs, versions and downstream outcomes per request, within consent and retention limits."
        - "Review a stratified sample manually to find failure types, but treat logged correlations as hypotheses."
        - "Establish causal effects with a randomised experiment, a pre-registered primary metric, guardrails and adequate power."
      ru:
        - "Логировать входы, выходы, версии и последующие исходы по каждому запросу в рамках согласия и сроков хранения."
        - "Вручную разбирать стратифицированную выборку для поиска типов ошибок, но считать корреляции из логов гипотезами."
        - "Подтверждать причинный эффект рандомизированным экспериментом с заранее заданной основной метрикой, защитными метриками и достаточной мощностью."
    reading: ["hamel-evals","paper-heart"]
  - id: "eval-agent-outcomes"
    tracks: ["engineering"]
    roles: ["eval-engineer"]
    type: "system_design"
    text:
      en: "How should evaluation of a tool-using agent differ from grading one generated response?"
      ru: "Чем оценка агента с инструментами должна отличаться от проверки одного сгенерированного ответа?"
    tests:
      en: "Whether final state, trajectory and repeated-run reliability are all inspected."
      ru: "Учёт конечного состояния, траектории и надёжности повторных запусков."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 31
    outline:
      en:
        - "Check the final environment state, not just the agent's success message."
        - "Grade task completion separately from unsafe or wasteful trajectories."
        - "Repeat trials and report reliability across runs with clean, controlled environments."
      ru:
        - "Проверять конечное состояние среды, а не сообщение агента об успехе."
        - "Отдельно оценивать выполнение задачи и опасные либо расточительные траектории."
        - "Повторять испытания в чистых контролируемых средах и показывать надёжность между запусками."
    answer:
      en: "The main difference: an agent has a result in the environment, and that is what you check, not the text in which it reported success. Saying it is done costs nothing, so evaluation reads the final state: was the record created, was the mail sent, what status is the ticket in. The second dimension is the trajectory: a task can be completed at the cost of extra calls, wasted money, or a dangerous action like deletion, and that is graded separately from completion, otherwise a bad path is masked by a good outcome. The third is repeatability: one lucky run proves nothing; you need several trials from the same clean environment state and a measured success rate, because the agent is non-deterministic. The limit: all this needs isolated environments with reproducible state; they are expensive and always poorer than reality, so some failure modes appear only in production."
      ru: "Главное отличие в том, что у агента есть результат в среде, и проверять надо именно его, а не текст, которым агент отчитался об успехе. Слово «готово» ничего не стоит, поэтому оценка читает конечное состояние: создана ли запись, отправлено ли письмо, в каком статусе тикет. Второе измерение — траектория: задача может быть выполнена ценой лишних вызовов, потраченных денег или опасного действия вроде удаления, и это оценивается отдельно от факта выполнения, иначе плохой путь маскируется хорошим исходом. Третье — повторяемость: один удачный прогон ничего не доказывает, нужны несколько испытаний из одинакового чистого состояния среды и измеренная доля успехов, потому что агент недетерминирован. Граница: всё это требует изолированных сред с воспроизводимым состоянием, они дороги и всегда беднее реальности, поэтому часть режимов отказа проявится только в проде."
    reading: ["anthropic-evals-for-agents"]
  - id: "eval-emergent-capability"
    tracks: ["engineering"]
    roles: ["research-engineer"]
    type: "applied_scenario"
    text:
      en: "Design an experiment for a suspected emergent capability or bias in a large model, with controls against misleading task framing."
      ru: "Спроектируйте эксперимент для предполагаемой новой способности или смещения большой модели с контролем влияния формулировки задачи."
    tests:
      en: "Whether a capability claim is testable and alternative explanations are considered."
      ru: "Умение проверять утверждение о способности и рассматривать альтернативные объяснения."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    added: "2026-09-26"
    outline:
      en:
        - "Turn the claim into a prediction with a metric, a threshold and a result that would refute it."
        - "Control framing: paraphrased prompts, shuffled options, counterbalanced order, and continuous metrics beside exact match."
        - "Rule out contamination and scoring artefacts with fresh items, smaller-model baselines and repeated samples."
      ru:
        - "Превратить утверждение в предсказание с метрикой, порогом и результатом, который его опроверг бы."
        - "Контролировать формулировку: перефразированные промпты, перемешанные варианты, сбалансированный порядок и непрерывные метрики рядом с точным совпадением."
        - "Исключить загрязнение и артефакты оценки: новые задания, сравнение с меньшими моделями и повторные сэмплы."
    reading: ["paper-emergence-mirage"]
  - id: "eval-upgrade-complaint"
    tracks: ["engineering","leadership"]
    roles: ["eval-engineer"]
    type: "applied_scenario"
    text:
      en: "A customer reports worse answers after a model upgrade. How do you verify the regression and decide what to restore or change?"
      ru: "Клиент жалуется на худшие ответы после обновления модели. Как проверить регрессию и решить, что восстановить или изменить?"
    tests:
      en: "Whether concrete customer failures drive reproduction and remediation."
      ru: "Умение воспроизвести реальные клиентские ошибки и выбрать исправление."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 59
    outline:
      en:
        - "Collect the customer's exact failing requests and list every change shipped with the upgrade, not only the model."
        - "Replay old and new configurations on identical inputs with repeated samples and blind side-by-side grading."
        - "Choose the remedy by cause: fix configuration, adapt the prompt or pin the version; add cases to the release gate."
      ru:
        - "Собрать точные неудачные запросы клиента и перечислить все изменения, вышедшие с обновлением, а не только модель."
        - "Прогнать старую и новую конфигурацию на одинаковых входах с повторными сэмплами и слепым попарным сравнением."
        - "Выбрать исправление по причине: починить конфигурацию, адаптировать промпт или закрепить версию; добавить кейсы в критерии допуска."
    answer:
      en: "A complaint is a lead, not yet a confirmed regression, so I'd start from the customer's concrete failing requests rather than our aggregate evals, which didn't flag it. First I'd establish what actually changed: the model version, but also default parameters, system prompt, tool schemas, output limits and retrieval, any of which can ship with an upgrade. Then I'd replay the same inputs on old and new configurations with everything else pinned, several samples each because outputs vary, and grade them side by side, blind, against criteria the customer agrees describe the failure. If the gap survives, I'd search traffic for similar requests to size it. The remedy follows the cause: a configuration bug gets fixed; a prompt tuned to the old model's quirks gets adapted, often with the customer; a genuine capability loss on their slice justifies pinning the previous version for a bounded window while a fix lands. Either way the cases join the release gate. Pinning is temporary because old versions retire, and if paired replay shows nothing beyond sampling noise, the regression isn't confirmed."
      ru: "Жалоба — это зацепка, а не подтверждённая регрессия, поэтому начинал бы я с конкретных неудачных запросов клиента, а не с наших агрегированных eval, которые проблему не отметили. Сначала выяснил бы, что на самом деле изменилось: версия модели, но и параметры по умолчанию, системный промпт, схемы инструментов, выходные лимиты и retrieval — любое из этого может приехать вместе с обновлением. Затем прогнал бы те же входы на старой и новой конфигурации, зафиксировав всё остальное, по нескольку сэмплов на каждый, потому что ответы варьируются, и сравнил бы их попарно вслепую по критериям, которые клиент признаёт описанием сбоя. Если разрыв сохраняется, поискал бы похожие запросы в трафике, чтобы оценить масштаб. Исправление следует из причины: ошибку конфигурации чиним; промпт, подогнанный под особенности старой модели, адаптируем, часто вместе с клиентом; реальная потеря способностей на его срезе оправдывает закрепление прежней версии на ограниченный срок, пока готовится исправление. В любом случае эти кейсы попадают в критерии допуска релизов. Закрепление временное, потому что старые версии выводят из эксплуатации, а если парный прогон не показывает ничего сверх шума сэмплирования, регрессия не подтверждена."
    reading: ["hamel-evals"]
  - id: "eval-frontier-harness"
    tracks: ["engineering"]
    roles: ["eval-engineer"]
    type: "system_design"
    text:
      en: "Build the evaluation harness for a new model release, covering reproducibility, execution isolation and comparable results."
      ru: "Спроектируйте eval-harness для новой модели с воспроизводимостью, изоляцией исполнения и сопоставимыми результатами."
    tests:
      en: "Whether evaluation infrastructure can support trustworthy comparisons."
      ru: "Умение построить инфраструктуру для достоверного сравнения."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "google"
    added: "2026-09-26"
    outline:
      en:
        - "Pin everything that shapes a score: dataset version, prompt template, decoding settings, grader and seeds."
        - "Run model-generated code in isolated, network-restricted sandboxes with resource limits and clean state per task."
        - "Report means over repeated samples with confidence intervals, and rerun a baseline model to detect harness drift."
      ru:
        - "Закрепить всё, что влияет на оценку: версию датасета, шаблон промпта, параметры декодирования, оценщика и seed."
        - "Исполнять сгенерированный моделью код в изолированных песочницах с ограничением сети и ресурсов и чистым состоянием на задачу."
        - "Показывать средние по повторным сэмплам с доверительными интервалами и перезапускать baseline-модель, чтобы ловить дрейф harness."
    reading: ["anthropic-evals-for-agents","openai-evaluation-best-practices"]
  - id: "eval-production-actions"
    tracks: ["engineering","leadership"]
    type: "system_design"
    text:
      en: "How would you change evaluation when an LLM workflow moves from suggesting actions to executing them in production?"
      ru: "Как изменить оценку LLM-процесса при переходе от предложений к исполнению действий в production?"
    tests:
      en: "Whether action consequences change the acceptance criteria."
      ru: "Умение учитывать последствия действий в критериях допуска."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "palantir"
    added: "2026-09-26"
    outline:
      en:
        - "Grade outcomes in the environment, not the proposal text: what changed, and was it permitted."
        - "Weight errors by consequence and reversibility; irreversible actions need near-zero tolerance or human approval."
        - "Test in sandboxed replicas, then use shadow mode and staged rollout with action logs and a kill switch."
      ru:
        - "Оценивать исход в среде, а не текст предложения: что изменилось и было ли это разрешено."
        - "Взвешивать ошибки по последствиям и обратимости; для необратимых действий нужен почти нулевой допуск или одобрение человека."
        - "Проверять в изолированных копиях среды, затем переходить к теневому режиму и поэтапной выкатке с журналом действий и аварийным отключением."
    reading: ["anthropic-evals-for-agents","owasp-llm-top-10"]
    start_here: ["engineering"]
    priority: 79
    answer:
      en: "Once a workflow executes actions, evaluating fluent advice is insufficient: I need to inspect the resulting state and whether the action was permitted. I would test tool selection, arguments, authority, confirmation where required, and the consequences of partial failure. A timeout after a write is especially important because retrying may duplicate an operation that already succeeded. The evaluation should reconcile by operation identity and distinguish safe recovery from a repeated effect. I would use isolated synthetic services for destructive cases and check tenant boundaries, revoked access, exhausted budgets and stopping behaviour. A high average task-success rate cannot compensate for an unauthorised action, so critical failures block the release separately. Logs should identify the versions and external effects without retaining unnecessary sensitive content. These tests provide evidence for the scenarios covered; they do not make every future model-driven action safe."
      ru: "Когда workflow исполняет действия, оценки убедительного совета недостаточно: нужно проверять итоговое состояние и разрешённость операции. Я проверял бы выбор инструмента, аргументы, полномочия, нужное подтверждение и последствия частичного отказа. Особенно важен таймаут после записи: повтор способен продублировать уже успешную операцию. Оценка должна сверять результат по идентичности операции и отличать безопасное восстановление от повторного эффекта. Для разрушительных кейсов я использовал бы изолированные синтетические сервисы и проверял границы арендаторов, отозванный доступ, исчерпанный бюджет и остановку. Высокая средняя успешность не компенсирует запрещённое действие, поэтому критические ошибки блокируют релиз отдельно. Логи связывают версии и внешние эффекты без ненужного чувствительного содержимого. Проверки дают свидетельства по покрытым сценариям, но не делают безопасным любое будущее действие модели. Новые полномочия или инструменты требуют пересмотра набора и границ, а не доверия прежнему общему баллу."
  - id: "eval-multiple-good-answers"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "Two qualified clinicians produce different good notes from the same consultation. How would you evaluate a generated note fairly?"
      ru: "Два квалифицированных врача составляют разные, но хорошие записи одной консультации. Как корректно оценить сгенерированную запись?"
    tests:
      en: "Whether evaluation permits valid variation while checking omissions and unsupported content."
      ru: "Умение допускать корректную вариативность, проверяя пропуски и неподтверждённое содержание."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Score against a checklist of clinically required facts from the consultation, not similarity to one note."
        - "Check every statement in the generated note for support in the transcript, and flag unsupported content separately."
        - "Treat agreement between the two clinicians as the ceiling, and calibrate any automated judge against them."
      ru:
        - "Оценивать по перечню клинически обязательных фактов из консультации, а не по сходству с одной записью."
        - "Проверять каждое утверждение сгенерированной записи на подтверждение в расшифровке и отдельно отмечать неподтверждённое."
        - "Принять согласие двух врачей за потолок и калибровать любого автоматического оценщика по их оценкам."
    reading: ["anthropic-evals-for-agents", "who-large-multimodal-health"]
  - id: "eval-behaviour-brainstorm"
    tracks: ["engineering"]
    roles: ["research-engineer", "eval-engineer"]
    type: "knowledge"
    text:
      en: "In a short unscripted call, propose testable ideas about a language model's behaviour that need no insider access, only careful observation."
      ru: "В коротком разговоре без подготовки предложите проверяемые идеи о поведении языковой модели, для которых нужен не внутренний доступ, а внимательное наблюдение."
    tests:
      en: "Whether you generate concrete, testable hypotheses about model behaviour quickly."
      ru: "Умение быстро выдвигать конкретные проверяемые гипотезы о поведении модели."
    provenance: "published"
    evidence:
      - source: "goncharov-anthropic-fellowship"
        company: "anthropic"
    added: "2026-09-29"
    outline:
      en:
        - "State each idea as a behaviour, a controlled prompt change and the measurable outcome you expect."
        - "Draw on observable levers: position of information, option order, length, persona, language and repeated sampling."
        - "Say how many samples and which control would separate a real effect from noise or prompt wording."
      ru:
        - "Формулировать каждую идею как поведение, контролируемое изменение промпта и ожидаемый измеримый результат."
        - "Опираться на наблюдаемые рычаги: позицию информации, порядок вариантов, длину, персону, язык и повторные сэмплы."
        - "Назвать, сколько сэмплов и какой контроль отличат реальный эффект от шума или формулировки промпта."
    reading: ["paper-lost-in-the-middle"]
  - id: "eval-ml-task-framing"
    tracks: ["engineering"]
    roles: ["ml-engineer"]
    type: "knowledge"
    text:
      en: "Frame a business problem as a machine-learning task: choose and justify the quality metric, and explain how you would collect and validate the data."
      ru: "Сформулируйте бизнес-задачу как задачу машинного обучения: выберите и обоснуйте метрику качества и объясните, как соберёте и проверите данные."
    tests:
      en: "Whether the metric and data follow from the business goal rather than habit."
      ru: "Следуют ли метрика и данные из бизнес-цели, а не из привычки."
    provenance: "published"
    evidence:
      - source: "tbank-career-platform-ml"
        company: "t-bank"
        role: "ml-engineer"
    added: "2026-09-29"
    outline:
      en:
        - "Translate the business decision into a prediction target, the action it triggers and the cost of each error."
        - "Pick the offline metric from those error costs, and name the online business metric it should move."
        - "Validate the data: label delay and leakage, time-based splits, and drift between training and serving."
      ru:
        - "Перевести бизнес-решение в целевую переменную, действие, которое она запускает, и цену каждой ошибки."
        - "Выбрать офлайн-метрику исходя из цены ошибок и назвать онлайн-метрику бизнеса, которую она должна сдвинуть."
        - "Проверить данные: задержку и утечку меток, разбиение по времени и расхождение между обучением и продакшеном."
    reading: ["google-rules-of-ml"]
  - id: "eval-prompt-target-share"
    tracks: ["engineering"]
    roles: ["applied-ai-engineer", "eval-engineer"]
    type: "applied_scenario"
    text:
      en: "Modify a prompt so that a target share of the model's outputs matches the desired result, and show how you measured it."
      ru: "Измените промпт так, чтобы заданная доля ответов модели соответствовала нужному результату, и покажите, как вы это измерили."
    tests:
      en: "Whether prompt changes are driven by measurement on a set of cases rather than single examples."
      ru: "Опираются ли правки промпта на измерения по набору примеров, а не на отдельные случаи."
    provenance: "published"
    evidence:
      - source: "taro-anthropic-prompt-engineer-2023"
        company: "anthropic"
        observed: "2023-09"
    added: "2026-09-29"
    outline:
      en:
        - "Define the desired result as a pass-fail check, and build a representative case set first."
        - "Change one thing at a time and sample each case several times, since outputs vary between runs."
        - "Report the share with a confidence interval on held-out cases, so the gain is not overfitting."
      ru:
        - "Сначала задать нужный результат как проверку с бинарным исходом и собрать представительный набор примеров."
        - "Менять по одному элементу за раз и сэмплировать каждый пример несколько раз, поскольку ответы различаются между прогонами."
        - "Показать долю с доверительным интервалом на отложенных примерах, чтобы прирост не оказался подгонкой."
    reading: ["openai-evaluation-best-practices","hamel-evals"]
