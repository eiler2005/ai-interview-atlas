  - id: "eval-agent-outcomes"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "How should evaluation of a tool-using agent differ from grading one generated response?"
      ru: "Чем оценка агента с инструментами должна отличаться от проверки одного сгенерированного ответа?"
    tests:
      en: "Whether final state, trajectory and repeated-run reliability are all inspected."
      ru: "Учёт конечного состояния, траектории и надёжности повторных запусков."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 31
    outline:
      en:
        - "Check the final environment state, not just the agent's success message."
        - "Grade task completion separately from unsafe or wasteful trajectories."
        - "Repeat trials and report reliability across runs with clean, controlled environments."
      ru:
        - "Проверять конечное состояние среды, а не сообщение агента об успехе."
        - "Отдельно оценивать выполнение задачи и опасные либо расточительные траектории."
        - "Повторять испытания в чистых контролируемых средах и показывать надёжность между запусками."
    answer:
      en: "The main difference: an agent has a result in the environment, and that is what you check, not the text in which it reported success. Saying it is done costs nothing, so evaluation reads the final state: was the record created, was the mail sent, what status is the ticket in. The second dimension is the trajectory: a task can be completed at the cost of extra calls, wasted money, or a dangerous action like deletion, and that is graded separately from completion, otherwise a bad path is masked by a good outcome. The third is repeatability: one lucky run proves nothing; you need several trials from the same clean environment state and a measured success rate, because the agent is non-deterministic. The limit: all this needs isolated environments with reproducible state; they are expensive and always poorer than reality, so some failure modes appear only in production."
      ru: "Главное отличие в том, что у агента есть результат в среде, и проверять надо именно его, а не текст, которым агент отчитался об успехе. Слово «готово» ничего не стоит, поэтому оценка читает конечное состояние: создана ли запись, отправлено ли письмо, в каком статусе тикет. Второе измерение — траектория: задача может быть выполнена ценой лишних вызовов, потраченных денег или опасного действия вроде удаления, и это оценивается отдельно от факта выполнения, иначе плохой путь маскируется хорошим исходом. Третье — повторяемость: один удачный прогон ничего не доказывает, нужны несколько испытаний из одинакового чистого состояния среды и измеренная доля успехов, потому что агент недетерминирован. Граница: всё это требует изолированных сред с воспроизводимым состоянием, они дороги и всегда беднее реальности, поэтому часть режимов отказа проявится только в проде."
    reading: ["anthropic-evals-for-agents"]
