  - id: "sd-gateway"
    tracks: ["engineering","leadership"]
    type: "system_design"
    text:
      en: "Design an LLM gateway with provider routing, failover, caching, rate limits and enforceable spending budgets."
      ru: "Спроектируйте LLM gateway с маршрутизацией, failover, кешированием, лимитами запросов и обязательными бюджетами."
    tests:
      en: "Whether provider differences and failure handling preserve the service contract."
      ru: "Умение сохранить контракт сервиса при различиях и отказах провайдеров."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "perplexity"
      - source: "outcome-school-company-wise"
        company: "palantir"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 35
    outline:
      en:
        - "Define provider capabilities and normalise only compatible request semantics."
        - "Enforce tenant quotas and budgets before dispatch, including retries."
        - "Specify failover boundaries for partially streamed responses and side-effecting tool calls."
      ru:
        - "Описать возможности провайдеров и унифицировать только совместимую семантику."
        - "Проверять квоты и бюджеты клиентов до отправки, включая повторы."
        - "Задать границы failover при частично переданном ответе и вызовах с побочными эффектами."
    answer:
      ru: "Gateway существует ради единого контракта поверх разных провайдеров, поэтому сначала я описываю их возможности — потоковую выдачу, вызов инструментов, лимиты контекста, поведение при отказе — и унифицирую только действительно совместимую семантику; остальное выставляю явно, а не эмулирую, иначе клиент получит тихо иное поведение. Квоты и бюджеты проверяю до отправки запроса, отдельно по каждому клиенту, и обязательно учитываю повторы, иначе failover сам съест бюджет; при исчерпании возвращаю понятную ошибку с указанием, когда пробовать снова. Ключ кеша включает модель и параметры, иначе кеш отдаст ответ другой модели. Самое тонкое — границы failover: если часть ответа уже ушла клиенту, переключить провайдера без разрыва потока нельзя, а вызов с побочными эффектами нельзя повторять без идемпотентности. Граница: gateway выравнивает интерфейсы и отказы, но не сгладит разницу в качестве моделей."
    reading: ["stripe-rate-limiters","stripe-idempotency"]
  - id: "sd-consumer-chat"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "Design a streaming chat service for hundreds of millions of users, including capacity, conversation storage and graceful overload behaviour."
      ru: "Спроектируйте потоковый чат для сотен миллионов пользователей с планированием мощности, хранением диалогов и работой при перегрузке."
    tests:
      en: "Whether scale assumptions lead to explicit capacity and reliability decisions."
      ru: "Умение вывести решения по мощности и надёжности из предположений о масштабе."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
      - source: "outcome-school-company-wise"
        company: "openai"
      - source: "outcome-school-company-wise"
        company: "google"
      - source: "outcome-school-company-wise"
        company: "meta"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 37
    outline:
      en:
        - "Estimate concurrent streams, token demand and storage from declared traffic assumptions."
        - "Separate admission control, inference scheduling and durable conversation state."
        - "Plan capacity headroom, cancellation, overload rejection and recovery from partial failure."
      ru:
        - "Оценить число потоков, спрос на токены и хранение по явным предположениям о трафике."
        - "Разделить допуск запросов, планирование инференса и долговременное состояние диалога."
        - "Предусмотреть запас мощности, отмену, отказ при перегрузке и восстановление после частичного сбоя."
    answer:
      ru: "Считать начинаю с явных предположений о трафике: сколько пользователей активны в пик, сколько у них одновременных потоков, какова средняя длина ответа в токенах и требуемая скорость генерации. Из этого выводятся нужная пропускная способность в токенах в секунду и число одновременных сессий, а из длины и срока жизни диалогов — объём хранения. Конкретные числа зависят от продукта, поэтому ценно не само число, а то, что оно выведено из предположения, которое можно оспорить. Архитектурно разделяю три слоя: допуск запросов с очередью и приоритетами, планирование инференса с батчингом и вытеснением, и хранение диалогов в обычной базе отдельно от вычислений. Обязательна отмена: пользователь ушёл — генерация останавливается и освобождает память. При перегрузке отказываю быстро и явно. Граница: запас мощности стоит денег, и при устойчивом дефиците ускорителей деградация обслуживания неизбежна."
    reading: ["google-sre-book","paper-pagedattention"]
