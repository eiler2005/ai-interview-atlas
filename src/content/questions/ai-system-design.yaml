theme: "ai-system-design"
questions:
  - id: "sd-enterprise-rag"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer"]
    type: "system_design"
    text:
      en: "Design a knowledge assistant over ten million enterprise documents with per-user permissions and a continuously changing corpus."
      ru: "Спроектируйте помощника по десяти миллионам корпоративных документов с индивидуальными правами и постоянно меняющимся корпусом."
    tests:
      en: "Whether ingestion, retrieval, access control and serving form an operable system."
      ru: "Умение связать загрузку, поиск, контроль доступа и обслуживание в рабочую систему."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
      - source: "outcome-school-company-wise"
        company: "microsoft"
      - source: "outcome-school-company-wise"
        company: "amazon"
      - source: "outcome-school-company-wise"
        company: "databricks"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 34
    outline:
      en:
        - "Clarify query volume, freshness and permission semantics before sizing."
        - "Separate ingestion and index versions from query-time authorisation and retrieval."
        - "Evaluate grounded answers and test revocation, stale data and partial outages."
      ru:
        - "Уточнить объём запросов, свежесть и семантику прав до расчёта мощности."
        - "Разделить загрузку и версии индекса с проверкой прав и поиском во время запроса."
        - "Оценить обоснованность ответов и проверить отзыв прав, устаревание и частичные отказы."
    answer:
      en: "I clarify peak query volume, content freshness requirements and permission semantics before sizing. The ingestion path versions documents, chunks them, computes embeddings and attaches access metadata. The online path obtains the user's current identity and groups, filters retrieval and supplies authorised context to generation with source citations. Indexing delay and access revocation are separate concerns: stale content may be disclosed, but stale ACLs cannot justify leaking a revoked document. I require bounded authorisation freshness or an authoritative permission check before context leaves retrieval; when neither is available, access fails closed. Cached grants and answers must be invalidated or revalidated. I test grounding and revocation separately, including concurrent permission changes and cache hits. Search outages and reduced coverage should be visible to users without weakening the access boundary."
      ru: "До расчёта ресурсов уточняю пиковую нагрузку, свежесть содержания и семантику прав. Конвейер загрузки версионирует документы, режет на фрагменты, считает эмбеддинги и добавляет метаданные доступа. Онлайн-путь получает текущую идентичность и группы пользователя, фильтрует поиск и передаёт разрешённый контекст генерации со ссылками на источники. Задержка индексации содержания и отзыв прав — разные проблемы: устаревание текста можно обозначить, но устаревший ACL не оправдывает утечку отозванного документа. Требую ограниченной свежести полномочий или проверки в авторитетной системе до выхода контекста из поиска; если это невозможно, доступ закрывается. Кешированные разрешения и ответы инвалидируются или перепроверяются. Отдельно тестирую обоснованность и отзыв доступа, включая одновременные изменения прав и попадания в кеш. Отказы поиска и неполнота выдачи видны пользователю без ослабления границы доступа."
    reading: ["azure-search-document-access","anthropic-contextual-retrieval"]
