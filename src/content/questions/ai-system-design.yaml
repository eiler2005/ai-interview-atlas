      ru: "Спроектируйте надёжную доставку событий на webhook клиентов при тайм-аутах, повторах и недоступности получателей."
    tests:
      en: "Whether delivery guarantees and consumer responsibilities are stated precisely."
      ru: "Умение точно задать гарантии доставки и обязанности получателя."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    added: "2026-09-26"
