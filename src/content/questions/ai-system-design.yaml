theme: "ai-system-design"
questions:
  - id: "sd-enterprise-rag"
    tracks: ["engineering","leadership"]
    type: "system_design"
    text:
      en: "Design a knowledge assistant over ten million enterprise documents with per-user permissions and a continuously changing corpus."
      ru: "Спроектируйте помощника по десяти миллионам корпоративных документов с индивидуальными правами и постоянно меняющимся корпусом."
    tests:
      en: "Whether ingestion, retrieval, access control and serving form an operable system."
      ru: "Умение связать загрузку, поиск, контроль доступа и обслуживание в рабочую систему."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
      - source: "outcome-school-company-wise"
        company: "microsoft"
      - source: "outcome-school-company-wise"
        company: "amazon"
      - source: "outcome-school-company-wise"
        company: "databricks"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 34
    outline:
      en:
        - "Clarify query volume, freshness and permission semantics before sizing."
        - "Separate ingestion and index versions from query-time authorisation and retrieval."
        - "Evaluate grounded answers and test revocation, stale data and partial outages."
      ru:
        - "Уточнить объём запросов, свежесть и семантику прав до расчёта мощности."
        - "Разделить загрузку и версии индекса с проверкой прав и поиском во время запроса."
        - "Оценить обоснованность ответов и проверить отзыв прав, устаревание и частичные отказы."
    answer:
      ru: "До любых расчётов уточняю три вещи: сколько запросов в пик, какая допустима задержка свежести — минуты или сутки, и какова семантика прав, потому что права на документ и права на фрагмент дают разные архитектуры. Дальше система делится надвое. Офлайн-конвейер загружает документы, режет на фрагменты, считает эмбеддинги и собирает версии индекса, сохраняя рядом с каждым фрагментом идентификаторы разрешённых групп. Онлайн-часть на запросе получает актуальные группы пользователя из системы прав и фильтрует поиск по ним, а не отсекает лишнее уже после ранжирования. Проверяю две вещи: обоснованность ответов ссылками на источники и реакцию на отзыв доступа — отдельным тестом, где права забрали, а фрагменты не должны быть видны. Граница: индекс всегда отстаёт от источника, поэтому устаревание и частичные отказы поиска надо показывать пользователю явно, а не молча."
    reading: ["azure-search-document-access","anthropic-contextual-retrieval"]
  - id: "sd-code-assistant"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "Design a repository-aware coding assistant, from indexing and context assembly to applying edits and checking results."
      ru: "Спроектируйте coding assistant для репозитория: от индексации и сборки контекста до применения изменений и проверки результата."
    tests:
      en: "Whether code context, safe edits and task evaluation are connected."
      ru: "Умение связать контекст кода, безопасные изменения и проверку задачи."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
  - id: "sd-support-agent"
    tracks: ["engineering","leadership"]
    type: "system_design"
    text:
      en: "Design a customer-support agent that can execute service actions and transfer the case to a human when needed."
      ru: "Спроектируйте агента поддержки, который выполняет сервисные действия и при необходимости передаёт обращение человеку."
    tests:
      en: "Whether execution authority and human escalation are part of the architecture."
      ru: "Учёт полномочий исполнения и передачи человеку в архитектуре."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 36
    outline:
      en:
        - "Map supported intents to explicit tools and permission boundaries."
        - "Use observed operation outcomes and persistent case state to prevent duplicate actions."
        - "Define escalation triggers and transfer enough context for a human to continue."
      ru:
        - "Связать поддерживаемые обращения с явными инструментами и границами разрешений."
        - "Использовать наблюдаемые исходы операций и состояние обращения против повторных действий."
        - "Задать условия эскалации и передавать контекст для продолжения человеком."
    answer:
      ru: "Начинаю с того, какие обращения агент вообще обслуживает, и превращаю их в явный список инструментов с границами разрешений: статус заказа он смотрит сам, возврат оформляет до порога суммы и с подтверждением, остальное вне его полномочий. Узкая поверхность даёт предсказуемость ценой того, что часть обращений агент не закроет. От повторных действий защищают состояние обращения и наблюдаемые исходы операций: прежде чем оформлять возврат, агент читает, не оформлен ли он уже, а записывающие вызовы идут с ключом идемпотентности. Условия эскалации задаю заранее и по наблюдаемым признакам: клиент просит человека, задача вне набора инструментов, инструмент вернул неопределённый исход, разговор обострился. При передаче человек получает историю, выполненные действия и их результаты, чтобы не начинать с нуля. Граница: агент снимает типовую нагрузку, но на сложных и эмоциональных обращениях его ценность мала."
    reading: ["anthropic-building-effective-agents","anthropic-writing-tools"]
