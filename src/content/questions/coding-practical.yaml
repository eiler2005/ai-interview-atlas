  - id: "code-token-bucket"
    tracks: ["engineering"]
    type: "coding"
    text:
      en: "Implement a token-bucket limiter and explain what must change when several workers enforce the same limit."
      ru: "Реализуйте token-bucket limiter и объясните изменения для общего лимита, применяемого несколькими воркерами."
    tests:
      en: "Whether time accounting and concurrent updates preserve the quota."
      ru: "Умение сохранить квоту при учёте времени и параллельных обновлениях."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
      - source: "outcome-school-company-wise"
        company: "openai"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 39
    outline:
      en:
        - "Refill from elapsed monotonic time and cap tokens at capacity."
        - "Make the check-and-consume operation atomic across competing calls."
        - "Test bursts and time boundaries; state the shared-store or partitioning contract for distributed enforcement."
      ru:
        - "Пополнять токены по монотонному времени с ограничением ёмкости."
        - "Сделать проверку и списание атомарными для конкурирующих вызовов."
        - "Проверить всплески и временные границы; задать контракт общего хранилища или разбиения для распределённого лимита."
    answer:
      en: "The bucket stores a token count and last refill time. On each call I measure elapsed time on a monotonic clock, add elapsed time times the refill rate, clip at capacity, and deduct what was asked for if there's enough. Capacity sets the burst you allow and the rate sets the average pace, the main trade-off. Avoid wall-clock time: a clock change or a sync will give a negative interval or hand out a full bucket. Check and deduct must be one atomic operation under a lock, otherwise two threads see the same last token. I'd test a burst on a full bucket, refusal on an empty one, and recovery after the right interval, injecting a fake clock instead of waiting. A shared limit across workers needs an external counter with a script that refills and deducts atomically, or the quota split per worker: cheaper, less exact at the boundaries."
      ru: "Ведро хранит две величины: текущее число токенов и момент последнего пополнения. На каждом обращении считаю прошедшее время по монотонным часам, добавляю произведение времени на скорость пополнения, обрезаю сверху ёмкостью и списываю запрошенное, если хватает. Ёмкость задаёт допустимый всплеск, скорость — средний темп, и это основной компромисс настройки. Системные часы брать нельзя: перевод времени или синхронизация дадут отрицательный интервал либо подарят полное ведро. Проверка и списание обязаны быть одной атомарной операцией под замком, иначе два потока увидят один и тот же последний токен. Тестировал бы всплеск на полном ведре, отказ на пустом и восстановление ровно через нужный интервал, подставляя часы вместо ожидания. Для общего лимита нескольких воркеров нужен внешний счётчик со скриптом, выполняющим пополнение и списание атомарно, либо деление квоты по воркерам: дешевле, но менее точно у границ."
    reading: ["stripe-rate-limiters"]
  - id: "code-async-batches"
    tracks: ["engineering"]
    type: "coding"
    text:
      en: "Write an asynchronous API batch processor with bounded concurrency, retry jitter and isolated per-item failures."
      ru: "Напишите асинхронный обработчик батча API-запросов с ограничением конкурентности, jitter повторов и изоляцией ошибок элементов."
    tests:
      en: "Whether cancellation, retries and results remain well-defined under partial failure."
      ru: "Умение корректно задать отмену, повторы и результаты при частичных отказах."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
      - source: "outcome-school-company-wise"
        company: "perplexity"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 40
    outline:
      en:
        - "Bound in-flight work and propagate cancellation and deadlines."
        - "Retry only suitable failures with capped backoff and jitter; consider idempotency."
        - "Return per-item outcomes and test timeouts, permanent failures and partial completion."
      ru:
        - "Ограничить число выполняемых запросов и передавать отмену и deadline."
        - "Повторять подходящие ошибки с ограниченным backoff и jitter, учитывая идемпотентность."
        - "Возвращать результат каждого элемента и проверить тайм-ауты, постоянные ошибки и частичный успех."
    answer:
      en: "I use an input queue, a semaphore on the number of concurrent requests, a wrapper around each item that catches its own exceptions and returns either a result or an error, and collection of all outcomes in input order. Cancellation and an overall deadline are passed inward, so that when time runs out the in-flight requests are cancelled too, not only those waiting in the queue. Retry only what is sensible to retry: timeouts, network failures, rate limit responses and server errors, with bounded attempts, exponential backoff and jitter, since without spread the clients synchronise and hit in a wave. For unsafe methods a retry needs an idempotency key, otherwise you get duplicates. One item's failure must not sink the batch, so I return a status per input. I'd test partial success, a permanent error, the deadline firing, and cancellation halfway. Client retries amplify overload, so the cap is mandatory."
      ru: "Каркас такой: очередь входов, семафор на число одновременных запросов, обёртка вокруг каждого элемента, которая ловит собственные исключения и возвращает либо результат, либо ошибку, и сбор всех исходов в порядке входа. Отмена и общий дедлайн передаются внутрь, чтобы по истечении времени снимались и выполняющиеся запросы, а не только ожидающие в очереди. Повторять стоит лишь то, что осмысленно повторять: таймауты, сетевые сбои, ответы о превышении лимита и серверные ошибки, с потолком попыток, экспоненциальной паузой и обязательным jitter, поскольку без разброса клиенты синхронизируются и бьют волной. Для небезопасных методов повтор требует ключа идемпотентности, иначе появятся дубли. Ошибка одного элемента не должна валить батч, поэтому возвращаю статус на каждый вход. Проверял бы частичный успех, постоянную ошибку, срабатывание дедлайна и отмену на середине. Клиентские повторы усиливают перегрузку, так что потолок обязателен."
    reading: ["stripe-idempotency","google-sre-book"]
