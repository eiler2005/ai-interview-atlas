  - id: "code-ai-assisted-build"
    tracks: ["engineering"]
    roles: ["software-engineer", "agent-engineer"]
    type: "applied_scenario"
    text:
      en: "Plan a product with the interviewer, then build it in about two hours with the AI coding tools of your choice and defend its design, code and path to production."
      ru: "Спланируйте продукт вместе с интервьюером, затем примерно за два часа соберите его с любыми AI-инструментами для программирования и защитите решения, код и путь в продакшен."
    tests:
      en: "Whether you scope, build and defend a working product with AI assistance under a time limit."
      ru: "Умение ограничить задачу, собрать и защитить рабочий продукт с помощью AI за отведённое время."
    provenance: "published"
    evidence:
      - source: "sierra-ai-native-interview"
        company: "sierra"
        role: "software-engineer"
    added: "2026-09-29"
    outline:
      en:
        - "Agree the user flow, smallest working slice, time budget and deliberate omissions before delegating bounded pieces."
        - "Give each AI task interfaces, relevant context and acceptance checks; inspect diffs and demonstrate behaviour instead of counting generated code."
        - "Defend architecture, algorithm assumptions and rejected suggestions; distinguish verified behaviour from production gaps and an unfinished prototype."
      ru:
        - "До делегирования ограниченных частей согласовать пользовательский сценарий, минимальный результат, бюджет времени и сознательные исключения."
        - "Давать AI интерфейсы, нужный контекст и критерии приёмки; проверять diff и поведение вместо подсчёта сгенерированного кода."
        - "Защитить архитектуру, допущения алгоритмов и отвергнутые предложения; отделить проверенное поведение от production-пробелов и незавершённого прототипа."
    reading: ["sierra-ai-native-interview","canva-ai-interview-success"]
    start_here: ["engineering"]
    priority: 71
    answer:
      en: "I would first agree what the user must be able to do and demonstrate the smallest complete flow, rather than treat the time limit as a target for generating code. I would split that flow at clear interfaces, give the assistant only the relevant context and acceptance checks, and inspect each change before integrating it. My review would concentrate on the data model, error handling and assumptions that could invalidate the approach. A short decision log would preserve what I rejected and why. In the demonstration I would show an ordinary case and a failure case, then explain what is measured, what is assumed and what remains unfinished. If a dependency or model stalls, I would cut scope while preserving the core flow. A working prototype is evidence of a bounded result; production still needs appropriate access controls, operational checks and validation."
      ru: "Сначала я бы согласовал, что должен суметь пользователь, и показал минимальный полный сценарий, а не превращал лимит времени в цель по объёму кода. Разделил бы этот сценарий по ясным интерфейсам, дал помощнику только нужный контекст и проверки приёмки, а каждую правку изучил до интеграции. Основное внимание уделил бы модели данных, обработке ошибок и допущениям, которые могут сломать подход. В коротком журнале решений сохранил бы, что отверг и почему. На демонстрации показал бы обычный и отказной сценарии, затем объяснил, что измерено, что предполагается и что не закончено. Если зависимость или модель задерживает работу, сократил бы scope с сохранением главного сценария. Рабочий прототип подтверждает ограниченный результат; для production ещё нужны подходящие контроли доступа, эксплуатационные проверки и валидация. Эти пробелы следует назвать явно, даже если показ прошёл успешно."
  - id: "code-agent-pr-review"
    tracks: ["engineering"]
    roles: ["software-engineer", "agent-engineer"]
    type: "applied_scenario"
    text:
      en: "Review and improve a colleague's draft pull request that adds a cross-cutting feature to an unfamiliar codebase, working alongside coding agents."
      ru: "Проверьте и доработайте черновой pull request коллеги со сквозной функцией в незнакомой кодовой базе, работая вместе с coding-агентами."
    tests:
      en: "Whether you judge someone else's change critically instead of accepting what an agent proposes."
      ru: "Умение критически оценить чужое изменение, а не принимать всё, что предлагает агент."
    provenance: "published"
    evidence:
      - source: "sierra-ai-native-interview"
        company: "sierra"
        role: "software-engineer"
    added: "2026-09-29"
    outline:
      en:
        - "Trace the intended behaviour, entry points, callers and existing invariants before asking the agent to explain or change the diff."
        - "Check every affected path, especially authorisation, retries, shared state and migrations; construct a counterexample and a focused regression check."
        - "Separate observed defects from hypotheses, verify agent suggestions and explain the approval decision and residual risks; respect the session's AI limits."
      ru:
        - "До объяснения или правки diff агентом проследить ожидаемое поведение, точки входа, вызывающий код и инварианты."
        - "Проверить все затронутые пути, особенно авторизацию, повторы, общее состояние и миграции; построить контрпример и регрессионную проверку."
        - "Отделить найденные дефекты от гипотез, проверить советы агента и объяснить решение ревью и остаточные риски; соблюдать ограничения AI на сессии."
    reading: ["sierra-ai-native-interview", "canva-ai-interview-success", "anthropic-evals-for-agents"]
    start_here: ["engineering"]
    priority: 72
    answer:
      en: "I would first reconstruct the intended behaviour and trace the entry points affected by the change. An agent's summary can help navigate, but I would verify it against callers and existing invariants before trusting its recommendations. For a cross-cutting feature, the main risk is inconsistent application: one endpoint may check permission while another, a cache or a background job bypasses it. I would separate observed defects from hypotheses and seek a small counterexample for each important concern. The review decision would cite the behaviour demonstrated by a test or trace, rather than the assistant's confidence. I would also inspect error paths, retries and shared state, and reject fixes that weaken tests or broaden scope without justification. A clean diff is not enough for approval when critical paths remain unexamined; I would explain the residual uncertainty and respect the interview's actual limits on AI use."
      ru: "Сначала я бы восстановил ожидаемое поведение и проследил точки входа, затронутые изменением. Резюме агента помогает ориентироваться, но перед доверием рекомендациям я сверил бы его с вызывающим кодом и инвариантами. Главный риск сквозной функции — непоследовательное применение: один endpoint проверяет права, а другой, кеш или фоновая задача обходят проверку. Я отделил бы наблюдаемые дефекты от гипотез и для каждого существенного опасения искал маленький контрпример. Решение ревью опиралось бы на поведение, показанное тестом или трассой, а не на уверенность помощника. Также проверил бы ошибки, повторы и общее состояние, отверг исправления, ослабляющие тесты или необоснованно расширяющие scope. Аккуратного diff недостаточно для одобрения, если критические пути не изучены: остаточную неопределённость нужно объяснить, а действительные ограничения AI на интервью соблюдать. Непроверенный совет не становится найденным багом только потому, что его сформулировала модель."
  - id: "code-product-structure"
    tracks: ["engineering"]
    roles: ["software-engineer"]
    type: "coding"
    text:
      en: "Inside a clone of the product's repository, implement a data structure the product actually uses, asking for AI help only on targeted syntax questions."
      ru: "В клоне репозитория продукта реализуйте структуру данных, которую продукт действительно использует; к AI обращайтесь только с точечными вопросами по синтаксису."
    tests:
      en: "Whether you can read an unfamiliar real codebase and implement a core structure correctly."
      ru: "Умение разобраться в незнакомом реальном коде и правильно реализовать ключевую структуру."
    provenance: "published"
    evidence:
      - source: "exponent-report-cursor-engineer"
        company: "cursor"
        role: "software-engineer"
    added: "2026-09-29"
    outline:
      en:
        - "Locate callers, required operations, operation frequency and tests; derive the representation from that contract."
        - "State invariants and time/memory costs, then challenge the choice with duplicate, empty and changed-constraint examples."
        - "Follow repository conventions and verify behaviour at callers; keep AI help to the targeted syntax questions permitted by this reported session."
      ru:
        - "Найти вызывающий код, нужные операции, их частоту и тесты; вывести представление из этого контракта."
        - "Задать инварианты и затраты времени/памяти; проверить выбор дублями, пустым входом и изменённым ограничением."
        - "Соблюдать соглашения репозитория и проверять поведение у вызывающего кода; помощь AI ограничить вопросами синтаксиса, разрешёнными в описанной сессии."
    reading: ["palantir-existing-systems", "python-ordered-dict", "princeton-directed-graphs"]
    start_here: ["engineering"]
    priority: 73
    answer:
      en: "I would begin with the callers: which operations they require, how often they run, and what behaviour existing tests promise. That contract determines the representation. A fast lookup alone is not enough if updates, ordering or expiry dominate the workload. I would state the invariants and time and memory costs, then trace small counterexamples before committing to the design. For example, updating an expiring entry must not let an old queued expiry delete its replacement. Empty input, duplicate keys and boundary times make useful probes because they expose assumptions that normal examples hide. I would follow the repository's conventions and keep AI assistance to targeted syntax questions, as this reported task specifies. The final explanation would connect the chosen structure to product behaviour and identify the workload change that would justify replacing it; a structure is not universally best because its average lookup is constant time."
      ru: "Я начал бы с вызывающего кода: какие операции нужны, как часто выполняются и какое поведение обещают существующие тесты. Представление определяется этим контрактом. Быстрого поиска недостаточно, если основную нагрузку дают обновления, порядок или сроки действия. Я задал бы инварианты, затраты времени и памяти, затем разобрал маленькие контрпримеры до окончательного выбора. Например, после обновления записи старое событие истечения не должно удалить её новую версию. Пустой вход, повторные ключи и граничное время полезны тем, что выявляют скрытые обычными примерами допущения. Я следовал бы соглашениям репозитория и ограничил помощь AI точечными вопросами синтаксиса, как требует описанная задача. Финальное объяснение связывает структуру с поведением продукта и называет изменение нагрузки, при котором её стоит заменить. Среднее константное время поиска само по себе не делает структуру универсально лучшей; нужно проверить стоимость остальных операций и поддержания согласованности."
