  - id: "code-refactoring"
    tracks: ["engineering","leadership"]
    type: "coding"
    text:
      en: "Refactor a small, poorly structured program with passing tests. Explain the first change and how you preserve observable behaviour."
      ru: "Отрефакторите небольшую плохо структурированную программу с проходящими тестами. Объясните первое изменение и сохранение наблюдаемого поведения."
    tests:
      en: "Whether improvements are incremental and justified by maintainability."
      ru: "Умение улучшать код постепенно с понятной пользой для сопровождения."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    added: "2026-09-26"
    start_here: ["leadership"]
    priority: 63
    outline:
      en:
        - "Pin down observable behaviour first, adding characterisation tests where existing tests assert too little."
        - "Make the first change small and mechanical, such as extracting a function, running tests after each step."
        - "Justify each step by a maintenance cost it removes, and never mix refactoring with behaviour changes."
      ru:
        - "Сначала зафиксировать наблюдаемое поведение, добавив характеризующие тесты там, где существующие проверяют слишком мало."
        - "Сделать первое изменение маленьким и механическим, например выделить функцию, прогоняя тесты после каждого шага."
        - "Обосновывать каждый шаг устранённой ценой сопровождения и никогда не смешивать рефакторинг с изменением поведения."
    answer:
      en: "Before touching anything I'd settle what observable behaviour means here — return values, error messages, side effects like written files or output order — and whether the passing tests actually assert it. Passing tests only protect what they check, so where coverage is thin I'd first add characterisation tests that record what the code does now, including the odd cases I'd be tempted to fix. The first change should be small, mechanical and easy to revert: usually extracting a function from the longest block or naming a magic value, then running the tests. Each step goes in its own commit, and I never mix a refactoring with a behaviour change, since a failing test then can't say which one broke it; a bug I find gets fixed separately, with its own test. I'd justify each step by a cost it removes, such as a rule duplicated in three places or logic you can't test in isolation, not by taste. If the code is about to be replaced or rarely changes, the cheapest refactoring is none."
      ru: "Прежде чем что-то трогать, я бы договорился, что здесь считается наблюдаемым поведением: возвращаемые значения, сообщения об ошибках, побочные эффекты вроде записанных файлов или порядка вывода, — и проверил, действительно ли проходящие тесты это фиксируют. Проходящие тесты защищают только то, что проверяют, поэтому там, где покрытие тонкое, сначала добавил бы характеризующие тесты, которые записывают, что код делает сейчас, включая странные случаи, которые так и хочется исправить. Первое изменение должно быть маленьким, механическим и легко откатываемым: обычно выделить функцию из самого длинного блока или дать имя магическому значению, затем прогнать тесты. Каждый шаг — отдельный коммит, и рефакторинг я никогда не смешиваю с изменением поведения: иначе упавший тест не скажет, что именно сломалось; найденную ошибку исправляю отдельно, со своим тестом. Каждый шаг обосновываю ценой, которую он убирает, — правилом, повторённым в трёх местах, логикой, которую нельзя проверить изолированно, — а не вкусом. Если код скоро заменят или он почти не меняется, самый дешёвый рефакторинг — никакого."
    reading: ["palantir-existing-systems","refactoring-catalog"]
  - id: "code-pagination"
