theme: "coding-practical"
questions:
  - id: "code-causal-attention"
    tracks: ["engineering"]
    type: "coding"
    text:
      en: "Implement scaled dot-product attention with a causal mask and tests that would expose attention to future tokens."
      ru: "Реализуйте scaled dot-product attention с causal mask и тестами, выявляющими доступ к будущим токенам."
    tests:
      en: "Whether shapes, masking and numerical stability are correct in executable code."
      ru: "Умение корректно реализовать размерности, маскирование и численную устойчивость."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
      - source: "outcome-school-company-wise"
        company: "google"
      - source: "outcome-school-company-wise"
        company: "amazon"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 38
    outline:
      en:
        - "Check batch, sequence and head dimensions before implementing score multiplication."
        - "Use stable softmax after masking disallowed positions."
        - "Test small hand-computable cases and ensure changing future inputs cannot change earlier outputs."
      ru:
        - "Проверить размерности батча, последовательности и голов до вычисления scores."
        - "Использовать устойчивый softmax после маскирования запрещённых позиций."
        - "Проверить малые ручные примеры и неизменность ранних выходов при изменении будущих входов."
    answer:
      ru: "Начал бы с явного контракта по размерностям: батч, головы, длина, размер головы, и проверка формы на входе, потому что большинство ошибок тут именно в перепутанных осях и в молчаливом broadcast. Дальше scores как произведение Q на транспонированный K по последней оси, деление на корень из размера головы, наложение нижнетреугольной маски значением минус бесконечность, устойчивый softmax с вычитанием построчного максимума и умножение на V. Маска обязательно до softmax: зануление весов после нормировки неверно, сумма уже испорчена будущими позициями. Тесты делал бы двух видов: крошечный пример с числами, посчитанными вручную, и главное — тест причинности, где меняем токены после позиции и убеждаемся, что выходы до неё не изменились. Отдельно проверил бы полностью замаскированную строку. Это учебная реализация: она не даёт экономии памяти как flash-внимание и не покрывает кеширование на инференсе."
    reading: ["paper-attention"]
