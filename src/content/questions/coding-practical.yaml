      ru: "Реализуйте multi-head attention, затем измените код так, чтобы несколько query-голов делили пару голов key и value."
    tests:
      en: "Whether tensor layout and head grouping are implemented consistently."
      ru: "Умение согласованно реализовать расположение тензоров и группировку голов."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "google"
    added: "2026-09-26"
    outline:
      en:
        - "Fix shapes first: batch, sequence, heads and head dimension; require query heads divisible by KV heads."
        - "Map query head h to KV head h // group_size; when expanding, use repeat_interleave, not tile."
        - "Test that equal head counts reproduce multi-head attention and a single KV head gives multi-query attention."
      ru:
        - "Сначала зафиксировать размерности: батч, последовательность, головы и размер головы; требовать, чтобы число query-голов делилось на число KV-голов."
        - "Сопоставить query-голову h с KV-головой h // group_size; при расширении использовать repeat_interleave, а не tile."
        - "Проверить, что при равном числе голов получается обычный multi-head attention, а при одной KV-голове — multi-query."
    reading: ["paper-gqa","paper-attention"]
