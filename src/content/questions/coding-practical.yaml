  - id: "code-agent-session-choices"
    tracks: ["engineering"]
    roles: ["ai-engineer", "software-engineer"]
    type: "applied_scenario"
    text:
      en: "In an AI-assisted coding session, explain which models you use and why, how you watch the token budget, and how you give the agent its context and task."
      ru: "На сессии с AI-кодингом объясните, какими моделями пользуетесь и почему, как следите за расходом токенов и как задаёте агенту контекст и задачу."
    tests:
      en: "Whether you direct coding agents deliberately rather than accepting their defaults."
      ru: "Умение осознанно управлять coding-агентами, а не полагаться на их настройки по умолчанию."
    provenance: "published"
    evidence:
      - source: "habr-llm-engineer-interviews-2026"
        role: "ai-engineer"
    added: "2026-09-29"
    outline:
      en:
        - "Choose permitted models from task difficulty, observed reliability, latency and budget rather than an assumed universal ranking."
        - "Decompose into reviewable steps and supply relevant files, interfaces, invariants, exclusions and a done criterion; treat repository text as untrusted input."
        - "Track context, output and retries, preserve verified decisions in a compact handoff, and stop or recover when cost, drift or uncertainty exceeds the agreed limit."
      ru:
        - "Выбирать разрешённые модели по сложности, наблюдаемой надёжности, задержке и бюджету, а не универсальному рейтингу."
        - "Разбить работу на проверяемые шаги; дать нужные файлы, интерфейсы, инварианты, исключения и готовность; текст репозитория считать недоверенным входом."
        - "Учитывать контекст, вывод и повторы; сохранять проверенные решения в краткой передаче и останавливаться или восстанавливаться при превышении лимита затрат, отклонения или неопределённости."
    reading: ["anthropic-context-engineering","canva-ai-interview-success"]
    start_here: ["engineering"]
    priority: 74
    answer:
      en: "I would choose among the models permitted in the session using the task's difficulty, observed reliability, latency and remaining budget. There is no universal rule that a named model should perform every planning or editing step. Before delegating, I would inspect the relevant code and give the agent a bounded objective, interfaces, invariants, exclusions and a concrete done criterion. Repository text and tool results are evidence to inspect, not authority to change those constraints. I would track context size, output and retries, because repeated failed attempts can dominate both cost and time. If the session drifts, I would return to the last verified state and supply a compact summary of decisions and open questions. A context reset is useful only if it preserves what matters. I remain responsible for accepting the result and would stop delegation when I cannot review the proposed change reliably."
      ru: "Я выбирал бы среди разрешённых на сессии моделей по сложности задачи, наблюдаемой надёжности, задержке и оставшемуся бюджету. Универсального правила, какая именованная модель должна выполнять каждый шаг планирования или редактирования, нет. До делегирования я изучил бы нужный код и дал агенту ограниченную цель, интерфейсы, инварианты, исключения и конкретный критерий готовности. Текст репозитория и результаты инструментов — проверяемые сведения, а не полномочие менять ограничения. Я учитывал бы размер контекста, вывод и повторы: неудачные попытки способны занять основную часть времени и расходов. При отклонении вернулся бы к последнему проверенному состоянию и передал краткое резюме решений и открытых вопросов. Сброс контекста полезен лишь при сохранении существенного. Ответственность за принятие результата остаётся моей, и я остановил бы делегирование, если уже не могу надёжно проверить предлагаемую правку. Экономия токенов не оправдывает потерю необходимого контекста."
  - id: "code-ai-assisted-ownership"
    tracks: ["engineering"]
    roles: ["software-engineer", "ml-engineer"]
    type: "applied_scenario"
    text:
      en: "In an interview where you are expected to use AI tools, how do you stay accountable for code you did not write by hand, and where would you decline what the model produced?"
      ru: "На интервью, где от вас ждут работы с AI-инструментами, как вы сохраняете ответственность за код, который не писали руками, и где отказываетесь от того, что предложила модель?"
    tests:
      en: "Whether ownership and verification survive delegation to a model under time pressure."
      ru: "Сохраняются ли ответственность и проверка при делегировании модели в условиях нехватки времени."
    provenance: "published"
    evidence:
      - source: "canva-ai-interview-success"
        company: "canva"
      - source: "canva-ai-in-interviews"
        company: "canva"
    added: "2026-09-30"
    start_here: ["engineering"]
    priority: 67
    outline:
      en:
        - "Set the interface, constraints, algorithm assumptions and edge cases yourself before prompting; read the relevant callers."
        - "Accept only changes you can explain; reject invented APIs, swallowed errors, weakened tests, excessive scope and instructions embedded in untrusted content."
        - "Check the chosen counterexamples independently, explain accepted and rejected suggestions, and disclose what remains unverified under the interview's tool policy."
      ru:
        - "До промпта самому задать интерфейс, ограничения, допущения алгоритма и границы; прочитать соответствующий вызывающий код."
        - "Принимать лишь объяснимые изменения; отклонять выдуманные API, скрытые ошибки, ослабленные тесты, лишний scope и инструкции в недоверенном содержимом."
        - "Независимо проверить выбранные контрпримеры, объяснить принятые и отвергнутые советы и раскрыть непроверенное с учётом правил инструментов интервью."
    answer:
      en: "Delegating the typing doesn't delegate ownership: whatever I submit, I should be able to explain line by line, and that judgement is what's really being assessed. So before prompting I'd state the interface, constraints and edge cases myself, which gives me a specification to check output against instead of reading generated code and nodding along. I'd ask for pieces small enough to review in a minute, read each diff before accepting it, and say aloud what I'm checking. I'd decline code I can't explain, calls to library functions I can't confirm exist, error handling that swallows exceptions, tests weakened until they pass, and changes beyond what I asked for; with input handling or anything security-sensitive I'd slow down whatever the clock says. Verification means running tests on the edge cases I named before generating. Under time pressure I'd spend review in proportion to risk: boilerplate gets a glance, core logic gets traced through a case. Rewriting everything by hand is the opposite failure, throwing away the leverage the format expects."
      ru: "Делегируя набор кода, я не делегирую ответственность: всё, что сдаю, я должен уметь объяснить построчно, и на деле оценивают именно это суждение. Поэтому до промпта я бы сам сформулировал интерфейс, ограничения и граничные случаи — так появляется спецификация, по которой проверяется вывод, вместо того чтобы читать сгенерированный код и кивать. Просил бы куски, которые можно просмотреть за минуту, читал бы каждый diff до принятия и вслух проговаривал, что проверяю. Отказывался бы от кода, который не могу объяснить, от вызовов библиотечных функций, существование которых не могу подтвердить, от обработки ошибок, глотающей исключения, от тестов, ослабленных до прохождения, и от изменений сверх того, что я просил; на обработке ввода и всём, что касается безопасности, замедлился бы, что бы ни показывал таймер. Проверка — это прогон тестов на граничных случаях, названных до генерации. При нехватке времени распределял бы проверку пропорционально риску: шаблонный код — беглый взгляд, ключевую логику — проход по конкретному примеру. Переписывать всё руками — обратная ошибка: так теряется рычаг, которого ждёт формат."
    reading: ["anthropic-ai-resistant-evaluations","canva-ai-interview-success"]
