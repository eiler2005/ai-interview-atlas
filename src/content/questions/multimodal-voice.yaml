theme: "multimodal-voice"
questions:
  - id: "mm-visual-input"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Compare projection layers, cross-attention and token-based integration for giving a language model access to images."
      ru: "Сравните проекционные слои, cross-attention и токенное представление для подключения изображений к языковой модели."
    tests:
      en: "Whether image encoding is separated from cross-modal fusion."
      ru: "Умение различать кодирование изображения и объединение модальностей."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "meta"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 32
    outline:
      en:
        - "Separate the vision encoder from the interface to the language model."
        - "Compare projected image tokens with cross-attention to visual features."
        - "Discuss visual token budget, spatial detail and training alignment."
      ru:
        - "Отделить visual encoder от интерфейса с языковой моделью."
        - "Сравнить проекцию токенов изображения с cross-attention к визуальным признакам."
        - "Обсудить бюджет визуальных токенов, пространственные детали и обучение выравниванию."
    answer:
      en: "Two choices matter: the image encoder and its interface to the language model. The encoder is usually taken off the shelf; the fork is at the interface. A projection maps patches into tokens of the language model's space and they simply take their place in the shared sequence: simple to build, fits many decoder architectures, but every visual token occupies context window and compute time. Cross-attention leaves visual features outside and adds cross-attention layers into the blocks, as in Flamingo: the text sequence doesn't grow, but you have to change the architecture and train new layers. The choice is decided by the visual token budget: fine detail, text inside the image and high resolution demand either more tokens or tiling. I'd compare the options on tasks needing spatial precision, not on general descriptions. Either way an alignment stage is required: without training on pairs the modalities won't meet."
      ru: "Тут два независимых вопроса: чем кодировать изображение и как подмешать результат к языковой модели. Кодировщик обычно берут готовый, а вот на интерфейсе развилка. Проекция переводит патчи в токены пространства языковой модели, и они просто встают в общую последовательность: делается просто, работает с любым декодером, но каждый визуальный токен занимает окно контекста и время вычисления. Cross-attention оставляет визуальные признаки снаружи и добавляет в блоки слои перекрёстного внимания к ним, как во Flamingo: длина текстовой последовательности не растёт, зато нужно менять архитектуру и обучать новые слои. Решает выбор бюджет визуальных токенов: мелкие детали, текст на картинке и высокое разрешение требуют либо больше токенов, либо тайлинга. Я бы сравнил варианты на задачах с пространственной точностью, а не на общих описаниях. В любом случае нужен этап выравнивания: без обучения на парах модальности не сойдутся."
    reading: ["paper-flamingo"]
