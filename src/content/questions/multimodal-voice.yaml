  - id: "mm-speech-quality"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "How would you evaluate speech recognition beyond word error rate and synthetic speech when many renditions are acceptable?"
      ru: "Как оценивать распознавание речи помимо WER, а синтез — при множестве допустимых вариантов звучания?"
    tests:
      en: "Whether task-critical errors and perceptual quality are measured separately."
      ru: "Умение отдельно измерять критические ошибки задачи и воспринимаемое качество."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
  - id: "mm-accents"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "How would you improve and evaluate speech recognition for mixed-language utterances and different accents?"
      ru: "Как улучшать и проверять распознавание смешанных языков в реплике и разных акцентов?"
    tests:
      en: "Whether subgroup coverage and domain errors are visible in evaluation."
      ru: "Учёт покрытия групп и доменных ошибок в оценке."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 33
    outline:
      en:
        - "Build evaluation slices for languages, accents, noise and code-switching."
        - "Inspect entity and task-critical errors alongside aggregate word error rate."
        - "Validate any adaptation on held-out speakers and domains to detect regressions."
      ru:
        - "Собрать срезы по языкам, акцентам, шуму и переключению языков."
        - "Проверять ошибки сущностей и критичные для задачи ошибки наряду с общим WER."
        - "Проверять адаптацию на отложенных говорящих и доменах для выявления регрессий."
    answer:
      en: "You start not with the model but with sliced evaluation: an overall WER on an averaged set hides exactly the groups the work exists for. I'd build separate slices by language, by accent and region, by level and type of noise, and by utterances that switch language mid phrase, making sure each slice holds enough different speakers. Then task level metrics, not just WER: are names, amounts, numbers and the other entities that an action depends on recognised correctly, since one corrupted digit costs more than a dozen small errors. Improvement usually comes from data and adaptation: fine-tuning on the domain, a glossary of terms in the prompt, text normalisation. I check the result on held out speakers and domains, otherwise we get memorisation rather than robustness. A model that is strong on average can easily sag on one particular accent, and the labelling itself can be biased too."
      ru: "Начинать надо не с модели, а с оценки по срезам: общий WER на усреднённом наборе прячет ровно те группы, ради которых работа и затевается. Я бы собрал отдельные срезы по языкам, по акцентам и регионам, по уровню и типу шума и по репликам с переключением языка внутри фразы, следя, чтобы в каждом срезе было достаточно разных говорящих. Дальше метрики по задаче, а не только WER: правильно ли распознаны имена, суммы, номера и прочие сущности, от которых зависит действие, ведь одна испорченная цифра дороже десятка мелких ошибок. Улучшают обычно данными и адаптацией: дообучение на домене, словарь терминов в подсказке, нормализация текста. Результат проверяю на отложенных говорящих и доменах, иначе получим запоминание, а не устойчивость. Модель, сильная в среднем, вполне может проседать на конкретном акценте, и сама разметка тоже бывает смещена."
    reading: ["paper-whisper"]
