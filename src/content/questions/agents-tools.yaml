theme: "agents-tools"
questions:
  - id: "agt-react"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "What does interleaving reasoning with tool observations add to a language-model agent compared with reasoning alone?"
      ru: "Что даёт чередование рассуждений и наблюдений от инструментов по сравнению с одними рассуждениями модели?"
    tests:
      en: "Whether external feedback changes the agent's next action."
      ru: "Понимание влияния внешней обратной связи на следующее действие."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 17
    outline:
      en:
        - "Distinguish a planned action from an observation returned by the environment."
        - "Use observations to update the next step and detect failed assumptions."
        - "Discuss tool failures and the extra latency of repeated interaction."
      ru:
        - "Отличать запланированное действие от наблюдения, возвращённого средой."
        - "Использовать наблюдения для следующего шага и выявления неверных предположений."
        - "Обсудить ошибки инструментов и задержку повторных взаимодействий."
    answer:
      en: "Interleaving gives the model what its own reasoning cannot: a planned action and an observation returned by the environment are different things, and the observation can interrupt a chain of plausible but wrong assumptions. The mechanism is simple. The model states a step, calls a tool, gets a result, and builds the next step on it, so an observation can disconfirm a bad hypothesis before the final answer. You pay in latency and cost: every round is another call and more context, and tools return errors, empty results and junk the model must tell apart from fact. I would measure the share of tasks where an observation changed the plan, and the share of steps spent repeating one call. The limit: external feedback helps only while the environment answers honestly. If a tool is silently wrong, the loop only entrenches the error more confidently."
      ru: "Чередование даёт модели то, чего нет в её собственных рассуждениях: запланированное действие и наблюдение, вернувшееся из среды, — разные вещи, и наблюдение может прервать цепочку правдоподобных, но неверных допущений. Механизм простой: модель формулирует шаг, вызывает инструмент, получает результат и строит следующий шаг уже на нём, поэтому наблюдение может опровергнуть ошибочную гипотезу до финального ответа, хотя это не гарантировано. Платим задержкой и стоимостью: каждый круг — это лишний вызов и лишний контекст, а сами инструменты возвращают ошибки, пустые выдачи и мусор, который модель обязана отличать от факта. Я бы измерил долю задач, где наблюдение изменило план, и долю шагов, потраченных на повтор одного и того же вызова. Граница в том, что внешняя обратная связь помогает, только пока среда отвечает честно: при молчаливо неверном инструменте цикл лишь увереннее закрепляет ошибку."
    reading: ["paper-react"]
  - id: "agt-retries"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "Design recovery from tool errors and timeouts, including cases where a timed-out call may already have changed external state."
      ru: "Спроектируйте восстановление после ошибок и тайм-аутов инструментов, включая случай, когда операция уже изменила внешнее состояние."
    tests:
      en: "Whether retries preserve correctness as well as availability."
      ru: "Умение сохранить корректность при повторных попытках."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 18
    outline:
      en:
        - "Classify transient, permanent and ambiguous outcomes before retrying."
        - "Use idempotency keys or reconcile external state after uncertain writes."
        - "Bound attempts and deadlines; add backoff, jitter and an escalation path."
      ru:
        - "Различать временные, постоянные и неопределённые исходы до повтора."
        - "Использовать ключи идемпотентности или сверять состояние после неопределённых записей."
        - "Ограничить попытки и время; добавить backoff, jitter и эскалацию."
    answer:
      en: "Before retrying, I classify the outcome: transient failure, permanent failure or ambiguous completion. A timeout on a write is ambiguous because the operation may still be running or already committed. For writes, I persist a client-generated idempotency key with the task and reuse it under the provider's documented guarantees. Without that guarantee, a state read alone is insufficient: it may be stale while the original operation remains in flight. I require an authoritative terminal outcome or reconciliation; otherwise I stop automated retries. Safe retries have an attempt budget, overall deadline and exponential backoff with jitter. When that budget expires, I escalate with the operation history and unresolved status. Idempotency depends on provider semantics, retention and key scope; merely attaching a key does not make a write safe."
      ru: "Перед повтором различаю временную ошибку, постоянную и неопределённое завершение. Таймаут записи неопределёнен: операция может ещё выполняться или уже завершиться. Для записи сохраняю с задачей клиентский ключ идемпотентности и повторно использую его в рамках гарантий провайдера. Без такой гарантии одного чтения состояния недостаточно: оно может устареть, пока исходный запрос ещё выполняется. Требую авторитетного окончательного статуса или сверки результата, иначе прекращаю автоматические повторы. Безопасные повторы ограничиваю числом попыток, общим дедлайном и экспоненциальным backoff с jitter. После исчерпания бюджета передаю человеку историю операции и нерешённый статус. Идемпотентность зависит от семантики провайдера, срока хранения и области действия ключа: само наличие ключа не делает запись безопасной."
    reading: ["stripe-idempotency"]
