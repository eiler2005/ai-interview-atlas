theme: "agents-tools"
questions:
  - id: "agt-react"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "What does interleaving reasoning with tool observations add to a language-model agent compared with reasoning alone?"
      ru: "Что даёт чередование рассуждений и наблюдений от инструментов по сравнению с одними рассуждениями модели?"
    tests:
      en: "Whether external feedback changes the agent's next action."
      ru: "Понимание влияния внешней обратной связи на следующее действие."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 17
    outline:
      en:
        - "Distinguish a planned action from an observation returned by the environment."
        - "Use observations to update the next step and detect failed assumptions."
        - "Discuss tool failures and the extra latency of repeated interaction."
      ru:
        - "Отличать запланированное действие от наблюдения, возвращённого средой."
        - "Использовать наблюдения для следующего шага и выявления неверных предположений."
        - "Обсудить ошибки инструментов и задержку повторных взаимодействий."
    answer:
      en: "Reasoning alone can't check its own premises: if the model assumes a wrong fact in step two, every later step builds on it, and the chain gets more fluent, not more correct. Interleaving adds the one channel that can contradict the model. It states a thought, takes an action, and the observation that comes back, not the plan, decides the next step, so an empty search or an unexpected value forces a revision before the final answer. The reasoning, in turn, tracks progress and chooses the next action, which acting alone lacks. The cost is latency, another model call and more context per round, plus tool errors, empty results and junk the model must not mistake for fact. I'd run the same tasks three ways, reasoning only, acting only and interleaved, and compare success rate, cost per task and how often the agent recovers after a failed call. The boundary: when the model already knows the answer, uninformative results can derail it, and a silently wrong tool makes it confidently wrong."
      ru: "Одни рассуждения не умеют проверять собственные посылки: если модель на втором шаге приняла неверный факт, все следующие шаги строятся на нём, и цепочка становится глаже, но не вернее. Чередование добавляет единственный канал, способный модели возразить. Она формулирует мысль, выполняет действие, и следующий шаг определяет вернувшееся наблюдение, а не план, поэтому пустой поиск или неожиданное значение заставляют пересмотреть ход ещё до финального ответа. Рассуждение, в свою очередь, отслеживает прогресс и выбирает следующее действие — именно этого не хватает одним действиям. Платим задержкой, лишним вызовом модели и лишним контекстом на каждом круге, а ещё ошибками инструментов, пустыми выдачами и мусором, который модель не должна принять за факт. Я бы прогнал одни и те же задачи тремя способами — только рассуждения, только действия и чередование — и сравнил долю успеха, стоимость задачи и то, как часто агент восстанавливается после неудачного вызова. Граница: если модель и так знает ответ, неинформативные результаты могут сбить её с толку, а молча ошибающийся инструмент делает её уверенно неправой."
    reading: ["paper-react"]
  - id: "agt-retries"
    tracks: ["engineering"]
    roles: ["agent-engineer"]
    type: "system_design"
    text:
      en: "Design recovery from tool errors and timeouts, including cases where a timed-out call may already have changed external state."
      ru: "Спроектируйте восстановление после ошибок и тайм-аутов инструментов, включая случай, когда операция уже изменила внешнее состояние."
    tests:
      en: "Whether retries preserve correctness as well as availability."
      ru: "Умение сохранить корректность при повторных попытках."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 18
    outline:
      en:
        - "Classify transient, permanent and ambiguous outcomes before retrying."
        - "Use idempotency keys or reconcile external state after uncertain writes."
        - "Bound attempts and deadlines; add backoff, jitter and an escalation path."
      ru:
        - "Различать временные, постоянные и неопределённые исходы до повтора."
        - "Использовать ключи идемпотентности или сверять состояние после неопределённых записей."
        - "Ограничить попытки и время; добавить backoff, jitter и эскалацию."
    answer:
      en: "Before retrying, I classify the outcome: transient failure, permanent failure or ambiguous completion. A timeout on a write is ambiguous because the operation may still be running or already committed. For writes, I persist a client-generated idempotency key with the task and reuse it under the provider's documented guarantees. Without that guarantee, a state read alone is insufficient: it may be stale while the original operation remains in flight. I require an authoritative terminal outcome or reconciliation; otherwise I stop automated retries. Safe retries have an attempt budget, overall deadline and exponential backoff with jitter. When that budget expires, I escalate with the operation history and unresolved status. Idempotency depends on provider semantics, retention and key scope; merely attaching a key does not make a write safe."
      ru: "Перед повтором различаю временную ошибку, постоянную и неопределённое завершение. Таймаут записи неопределёнен: операция может ещё выполняться или уже завершиться. Для записи сохраняю с задачей клиентский ключ идемпотентности и повторно использую его в рамках гарантий провайдера. Без такой гарантии одного чтения состояния недостаточно: оно может устареть, пока исходный запрос ещё выполняется. Требую авторитетного окончательного статуса или сверки результата, иначе прекращаю автоматические повторы. Безопасные повторы ограничиваю числом попыток, общим дедлайном и экспоненциальным backoff с jitter. После исчерпания бюджета передаю человеку историю операции и нерешённый статус. Идемпотентность зависит от семантики провайдера, срока хранения и области действия ключа: само наличие ключа не делает запись безопасной."
    reading: ["stripe-idempotency"]
  - id: "agt-structured-output"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "How do schema-constrained responses differ from function calls, and which component actually executes an action?"
      ru: "Чем ответ по схеме отличается от function calling и какой компонент действительно исполняет действие?"
    tests:
      en: "Whether valid syntax is distinguished from authorised execution."
      ru: "Умение отличать валидный формат от разрешённого исполнения."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Separate constrained response formatting from a request to call a tool; neither executes or authorises an action by itself."
        - "Validate completion status, schema and business rules, including refusal, truncation and unsupported evidence; syntactic validity is not factual correctness."
        - "Keep execution, least privilege, confirmation and bounded recovery in application code; test a valid-looking but unauthorised request."
      ru:
        - "Отделить ограничение формата ответа от запроса инструмента; ни то, ни другое само не исполняет и не разрешает действие."
        - "Проверять статус завершения, схему и бизнес-правила, включая отказ, усечение и неподтверждённые основания; синтаксис не гарантирует факты."
        - "Исполнение, минимальные права, подтверждение и ограниченное восстановление держать в коде приложения; проверить внешне корректный, но запрещённый запрос."
    reading: ["claude-tool-use", "claude-structured-outputs"]
    start_here: ["engineering"]
    priority: 75
    answer:
      en: "A schema-constrained response controls the shape of returned data; a tool call requests an operation with arguments. Neither one executes an action or proves that it is authorised. The application must inspect completion status, validate the payload and enforce domain rules before dispatch. A response can be refused or truncated, and even a structurally valid object can contain a wrong account, an invented evidence identifier or an impossible amount. I would distinguish a recoverable formatting failure from a denied action, cap retries and return an explicit failure when recovery is exhausted. For consequential operations, permissions and any required confirmation remain bound to the actual arguments in application code. I would test a valid-looking request that crosses a tenant boundary as well as malformed output. Structured generation reduces parsing failures, but it does not establish truth, business validity or permission."
      ru: "Ответ с ограничением по схеме управляет формой данных, а вызов инструмента запрашивает операцию с аргументами. Ни один механизм сам не исполняет действие и не доказывает его разрешённость. До диспетчеризации приложение проверяет статус завершения, содержимое и предметные правила. Возможны отказ или усечение, а структурно правильный объект может содержать неверный счёт, выдуманный идентификатор основания или невозможную сумму. Я отделил бы исправимую ошибку формата от запрещённого действия, ограничил повторы и вернул явную ошибку после исчерпания восстановления. Для значимых операций права и нужное подтверждение остаются связанными с конкретными аргументами в коде приложения. Проверил бы не только неверный формат, но и внешне корректный запрос через границу арендаторов. Структурированная генерация сокращает ошибки разбора, но не устанавливает истинность, выполнение бизнес-правил или полномочия. Эти проверки не следует отдавать той же модели, которая предложила действие."
  - id: "agt-mcp"
    tracks: ["engineering"]
    roles: ["agent-engineer"]
    type: "knowledge"
    text:
      en: "What does MCP standardise between an AI application and an external service that a model's function-call format does not?"
      ru: "Что MCP стандартизирует между AI-приложением и внешним сервисом сверх формата function call модели?"
    tests:
      en: "Whether protocol transport and capabilities are separated from model decisions."
      ru: "Умение отличать транспорт и возможности протокола от решений модели."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "microsoft"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 48
    outline:
      en:
        - "Separate the model's choice of a call from how a client discovers and reaches a server."
        - "Name what the protocol fixes: transport, capability discovery, and typed tools, resources and prompts."
        - "Discuss the trust boundary: a connected server supplies both capabilities and untrusted content."
      ru:
        - "Отделить выбор вызова моделью от того, как клиент находит сервер и обращается к нему."
        - "Назвать, что фиксирует протокол: транспорт, обнаружение возможностей и типизированные инструменты, ресурсы и промпты."
        - "Обсудить границу доверия: подключённый сервер поставляет и возможности, и недоверенный контент."
    answer:
      en: "A function-call format describes only the shape of the arguments a model emits. It says nothing about where the tool lives, how the application learns the tool exists, or how the result comes back. MCP standardises that surrounding layer — a client-server handshake, capability discovery, and typed primitives for tools, resources and prompts over a defined transport — so the same server works with any compliant application, within the capabilities both sides declare at the handshake, and a tool can be added without changing the model or redeploying the client. Execution and authority stay outside the model: the host application still decides which servers are connected and what each may do. I would judge it by how much integration code disappears per new tool. The trade-off is the trust boundary it creates: a connected server contributes tool descriptions and returns content, both of which reach the context as untrusted input, so a third-party server is a supply-chain and prompt-injection surface."
      ru: "Формат function call описывает одно: форму аргументов, которые выдаёт модель. Он ничего не говорит о том, где живёт инструмент, как приложение узнаёт о его существовании и как возвращается результат. MCP стандартизирует именно этот окружающий слой — рукопожатие клиента и сервера, обнаружение возможностей и типизированные примитивы для инструментов, ресурсов и промптов поверх заданного транспорта, — поэтому один и тот же сервер работает с любым совместимым приложением в пределах возможностей, которые обе стороны объявили при рукопожатии, а инструмент добавляется без изменения модели и переразвёртывания клиента. Исполнение и полномочия остаются вне модели: приложение-хост по-прежнему решает, какие серверы подключены и что каждому разрешено. Пользу я бы оценивал тем, сколько интеграционного кода исчезает на каждый новый инструмент. Плата — возникающая граница доверия: подключённый сервер даёт и описания инструментов, и возвращаемый контент, а это попадает в контекст как недоверенный ввод, поэтому сторонний сервер — поверхность атаки и через цепочку поставок, и через prompt injection."
    reading: ["mcp-specification", "mcp-security-20260728"]
  - id: "agt-tool-surface"
    tracks: ["engineering"]
    roles: ["agent-engineer"]
    type: "system_design"
    text:
      en: "How would you select, name and document tools so that a model chooses the right operation and arguments?"
      ru: "Как выбрать, назвать и описать инструменты, чтобы модель верно выбирала операцию и аргументы?"
    tests:
      en: "Whether tool design reduces ambiguity and measurable misuse."
      ru: "Умение уменьшать неоднозначность и измеримые ошибки вызовов."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 19
    outline:
      en:
        - "Expose cohesive operations with unambiguous names and validated schemas."
        - "Return relevant, bounded results and actionable error messages."
        - "Evaluate tool selection and arguments on realistic tasks, then remove confusing overlap."
      ru:
        - "Выделить целостные операции с понятными именами и проверяемыми схемами."
        - "Возвращать ограниченные релевантные результаты и понятные ошибки."
        - "Проверять выбор инструмента и аргументов на реальных задачах и устранять неоднозначное дублирование."
    answer:
      en: "The model chooses a tool only from its name, description and schema, so every pair of overlapping tools is a decision it can get wrong, and every free-text argument is a place to invent a value. I'd shape tools around the agent's tasks, not the API's endpoints: a search instead of a list that dumps every record, names prefixed by service, enumerations wherever options are finite, and a strict schema so validation rejects a bad argument before the downstream system sees it. The real trade-off is granularity: a few high-level tools cut selection errors but make arguments complex, while many thin ones keep arguments simple but make selection ambiguous and chains longer. Results are paginated and capped, and an error says what to change. On a fixed set of realistic tasks I'd measure the share of calls with the right tool and valid arguments and the tokens per task, before and after each merge or rename. The boundary: once the set grows into dozens of tools, selection degrades even with good descriptions, so I'd load tools per task."
      ru: "Модель выбирает инструмент только по имени, описанию и схеме, поэтому каждая пара пересекающихся инструментов — это развилка, на которой она может ошибиться, а каждый аргумент свободным текстом — место, где можно выдумать значение. Инструменты я бы строил вокруг задач агента, а не эндпоинтов API: поиск вместо списка, вываливающего все записи, имена с префиксом сервиса, перечисления везде, где вариантов конечное число, и строгая схема, чтобы неверный аргумент отсекала валидация раньше, чем его увидит внешняя система. Настоящий компромисс — гранулярность: несколько высокоуровневых инструментов снижают ошибки выбора, но усложняют аргументы, а много тонких оставляют аргументы простыми, но делают выбор неоднозначным, а цепочки длиннее. Результаты разбиты на страницы и ограничены по объёму, а ошибка говорит, что именно исправить. На фиксированном наборе реалистичных задач я бы измерял долю вызовов с верным инструментом и корректными аргументами и токены на задачу — до и после каждого слияния или переименования. Граница: когда инструментов становятся десятки, выбор ухудшается даже при хороших описаниях, поэтому я бы подгружал инструменты под задачу."
    reading: ["anthropic-writing-tools"]
  - id: "agt-multi-agent"
    tracks: ["engineering","leadership"]
    type: "knowledge"
    text:
      en: "When does splitting work among agents improve results, and when do coordination costs dominate?"
      ru: "Когда разделение работы между агентами улучшает результат, а когда преобладают затраты на координацию?"
    tests:
      en: "Whether task independence and shared-state conflicts guide orchestration."
      ru: "Умение учитывать независимость задач и конфликты общего состояния."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 50
    outline:
      en:
        - "Identify independent subtasks whose results can be combined without frequent shared-state updates."
        - "Define delegation boundaries, completion criteria and a synthesis step that checks conflicting findings."
        - "Compare with one agent at a comparable total budget; count duplicate work, coordination failures, cost and latency."
      ru:
        - "Выделить независимые подзадачи, результаты которых объединяются без частого обновления общего состояния."
        - "Задать границы делегирования, критерии готовности и синтез с проверкой противоречащих выводов."
        - "Сравнить с одним агентом при сопоставимом общем бюджете; учесть повторы работы, ошибки координации, стоимость и задержку."
    answer:
      en: "Splitting helps when the work genuinely decomposes: subtasks that can run without seeing each other's intermediate state, and whose results a synthesis step can combine — broad search over many sources is the clean case, because breadth is parallel and each branch is independent. It stops helping when agents must agree as they go. Every handoff is a lossy summary through natural language, so shared mutable state produces conflicting edits, duplicated effort and contradictory findings that someone has to reconcile. I would define delegation boundaries and completion criteria per subagent, then make synthesis an explicit step that surfaces disagreement rather than averaging it away. The honest comparison is against one agent given the same total token budget, counting duplicate work, coordination failures, cost and wall-clock latency. Multi-agent often wins latency and loses cost, and if a task is inherently sequential, coordination overhead is pure loss."
      ru: "Разделение помогает, когда работа действительно декомпозируется: подзадачи выполняются, не видя промежуточного состояния друг друга, а их результаты способен собрать шаг синтеза. Чистый случай — широкий поиск по множеству источников: широта параллельна, и каждая ветка независима. Помогать перестаёт там, где агенты обязаны согласовываться по ходу. Любая передача — это сжатие с потерями через естественный язык, поэтому общее изменяемое состояние даёт конфликтующие правки, повторную работу и противоречивые выводы, которые кому-то придётся сводить. Я бы задал границы делегирования и критерии готовности для каждого подагента, а синтез сделал отдельным шагом, который показывает расхождения, а не усредняет их. Честное сравнение — против одного агента с тем же общим бюджетом токенов, с подсчётом повторов работы, сбоев координации, стоимости и полного времени. Мультиагентность часто выигрывает по задержке и проигрывает по стоимости, а на последовательной по своей природе задаче накладные расходы координации — чистый убыток."
    reading: ["anthropic-multi-agent-research"]
  - id: "agt-memory"
    tracks: ["engineering"]
    roles: ["agent-engineer"]
    type: "system_design"
    text:
      en: "Design memory for an agent that works across many sessions: what is persisted, retrieved, revised and forgotten?"
      ru: "Спроектируйте память агента, работающего в нескольких сессиях: что сохранять, извлекать, пересматривать и забывать?"
    tests:
      en: "Whether durable state is distinguished from transient context."
      ru: "Умение различать долговременное состояние и текущий контекст."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 49
    outline:
      en:
        - "Separate the working context of one session from state that must outlive it."
        - "Write memory from confirmed outcomes, with provenance and a revision path, not from every utterance."
        - "Retrieve by relevance to the current task and expire or supersede stale entries."
      ru:
        - "Отделить рабочий контекст одной сессии от состояния, которое должно её пережить."
        - "Записывать в память подтверждённые итоги с происхождением и возможностью правки, а не каждую реплику."
        - "Извлекать по релевантности текущей задаче, удаляя или замещая устаревшие записи."
    answer:
      en: "I'd keep two stores with different lifecycles: the session's working context, filled and discarded, and durable memory, where only confirmed things graduate: stable preferences, decisions with their rationale, task outcomes. The real choice is what gets written. I extract at write time into structured records, subject, attribute, value, source and timestamp, rather than embedding raw transcripts, because a keyed record can be superseded when the user changes their mind, while two contradictory transcript chunks both stay retrievable. The cost is lost detail, so raw episodes are kept briefly as a fallback, not as memory. Retrieval returns a handful of records relevant to the current task, never the whole history, which would recreate the context problem. Forgetting is explicit: expiry for time-bound facts, supersession by key, deletion on request. I'd replay multi-session tasks with memory off and on, measuring success, the share of recalled records actually used and errors caused by stale ones. The boundary: memory the model inferred rather than was told reinforces its own mistakes, so inferences get lower trust or aren't stored."
      ru: "Я бы держал два хранилища с разным жизненным циклом: рабочий контекст сессии, который наполняется и выбрасывается, и долговременную память, куда попадает только подтверждённое — устойчивые предпочтения, решения с обоснованием, итоги задач. Главный выбор — что именно записывать. Я извлекаю факты уже при записи в структурированные записи — субъект, атрибут, значение, источник и время, — а не превращаю в эмбеддинги сырые транскрипты, потому что запись с ключом можно заместить, когда пользователь передумал, а два противоречащих друг другу куска транскрипта так и останутся оба доступными для поиска. Плата — потеря деталей, поэтому сырые эпизоды храню недолго как запасной источник, а не как память. Извлечение возвращает несколько записей, релевантных текущей задаче, а не всю историю: подмешивание всего воспроизвело бы ту самую проблему контекста. Забывание задаю явно: срок жизни для фактов, привязанных ко времени, замещение по ключу и удаление по запросу. Я бы прогнал многосессионные задачи с памятью и без неё и измерил долю успеха, долю извлечённых записей, которые реально использовались, и ошибки из-за устаревших записей. Граница: память, которую модель вывела сама, а не услышала, закрепляет её собственные ошибки, поэтому выводы получают пониженное доверие или не сохраняются вовсе."
    reading: ["anthropic-context-engineering"]
  - id: "agt-tool-choice"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "How should an agent decide whether to answer directly or obtain fresh information with a tool?"
      ru: "Как агент должен решать, ответить сразу или получить свежие сведения через инструмент?"
    tests:
      en: "Whether uncertainty, freshness and tool cost influence the decision."
      ru: "Учёт неопределённости, свежести и стоимости вызова."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Classify the question first: stable knowledge, time-sensitive facts, or private data the model cannot have."
        - "Weigh the cost of a wrong direct answer against the tool's latency, price and failure risk."
        - "Measure unnecessary and missed calls on labelled cases; force or forbid tools where policy requires."
      ru:
        - "Сначала классифицировать вопрос: устойчивое знание, факты, зависящие от времени, или закрытые данные, которых у модели нет."
        - "Сопоставить цену неверного прямого ответа с задержкой, стоимостью и риском сбоя вызова."
        - "Измерить лишние и пропущенные вызовы на размеченных примерах; где требует политика, принудительно включать или запрещать инструменты."
    reading: ["claude-tool-use"]
  - id: "agt-termination"
    tracks: ["engineering"]
    roles: ["agent-engineer"]
    type: "system_design"
    text:
      en: "Define completion and stopping conditions for an agent loop so it cannot spend indefinitely on an unfinished task."
      ru: "Задайте критерии завершения и остановки агентного цикла, исключающие бесконечные затраты на незавершённую задачу."
    tests:
      en: "Whether progress, budgets and terminal states are explicit."
      ru: "Умение явно задать прогресс, бюджет и конечные состояния."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 20
    outline:
      en:
        - "Separate success, blocked, cancelled and budget-exhausted outcomes."
        - "Track progress using observable state, with step, cost and time limits."
        - "Checkpoint enough state to resume or hand off without repeating side effects."
      ru:
        - "Разделить успех, блокировку, отмену и исчерпание бюджета."
        - "Отслеживать прогресс по наблюдаемому состоянию с лимитами шагов, стоимости и времени."
        - "Сохранить состояние для продолжения или передачи без повторных побочных эффектов."
    answer:
      en: "The loop has to end in an explicit terminal state, and there are several: success, blocked, cancelled by the user, and budget exhausted. They cannot be merged, because the response differs: success closes the task, blocked needs a human, and budget exhausted says honestly that we never learned whether the task was doable. I define progress from observable state in the environment, not from the model's confidence, and alongside it I keep hard limits on steps, money and time; without them an agent will cycle through options forever on an unsolvable task. The cost is obvious: some genuinely long tasks get cut off, so on stopping you save state, what was done and which side effects are already applied, so a resume or handoff does not repeat them. The limit: budgets bound spend, not quality, and an agent can stop on time with a formally complete but useless result."
      ru: "Цикл обязан заканчиваться явным конечным состоянием, и таких состояний несколько: успех, блокировка, отмена пользователем и исчерпание бюджета. Смешивать их нельзя, потому что реакция разная: успех закрывает задачу, блокировка требует человека, а исчерпание бюджета честно говорит, что мы так и не узнали, выполнима ли задача. Прогресс определяю по наблюдаемому состоянию среды, а не по уверенности модели, и вместе с этим держу жёсткие лимиты шагов, денег и времени — без них агент способен бесконечно перебирать варианты на нерешаемой задаче. Плата очевидна: часть по-настоящему длинных задач оборвётся, поэтому при остановке важно сохранить состояние — что сделано и какие побочные эффекты уже применены, чтобы продолжение или передача человеку не повторили их заново. Граница: лимиты ограничивают расход, но не качество, и агент может остановиться вовремя с формально готовым, но негодным результатом."
    reading: ["anthropic-building-effective-agents"]
  - id: "agt-reversibility"
    tracks: ["engineering","leadership"]
    type: "system_design"
    text:
      en: "How would you make an agent's production actions reversible where possible and auditable where reversal is impossible?"
      ru: "Как сделать действия агента в production обратимыми там, где это возможно, и проверяемыми там, где откат невозможен?"
    tests:
      en: "Whether compensating actions and durable evidence are planned before execution."
      ru: "Умение заранее продумать компенсационные действия и журнал исполнения."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "palantir"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 60
    outline:
      en:
        - "Classify each tool action before release as reversible, compensable within a window, or irreversible."
        - "Prefer native undo such as drafts, soft deletes and delayed sends; register a tested compensation for the rest."
        - "Write intent, exact arguments and authoriser to an append-only log before acting; rehearse reconstruction from it."
      ru:
        - "До выпуска инструмента отнести каждое действие к обратимым, компенсируемым в пределах окна или необратимым."
        - "Предпочитать встроенную отмену: черновики, мягкое удаление, отложенную отправку; для остального регистрировать проверенную компенсацию."
        - "До действия писать намерение, точные аргументы и автора разрешения в журнал только на добавление; репетировать восстановление по нему."
    answer:
      en: "Reversibility has to be designed into each tool before the agent can call it, so I'd classify every action as reversible, compensable or irreversible. Where possible I'd shape the tool so undo is native: drafts instead of sends, soft deletes with retention, scheduled actions with a cancel window, versioned configuration. Compensation is weaker than rollback, since a refund after a charge is a new action that can fail and leaves traces, so each compensable action is registered with its compensating action and the window in which it still works. Before executing, the runner writes an intent record to an append-only log the agent can't modify: exact arguments, an idempotency key, who authorised it, policy and model versions; afterwards, the external system's result. Irreversible actions get stricter gates: previews, limits or human approval. I'd rehearse compensations regularly and test whether the log alone reconstructs any action. The boundary: an audit trail enables accountability and repair, not undo, so for irreversible actions with serious consequences the real control is not letting the agent act alone."
      ru: "Обратимость надо заложить в каждый инструмент до того, как агент сможет его вызвать, поэтому я бы разделил все действия на обратимые, компенсируемые и необратимые. Где можно, инструмент стоит устроить так, чтобы отмена была встроенной: черновик вместо отправки, мягкое удаление со сроком хранения, отложенное действие с окном отмены, версионируемая конфигурация. Компенсация слабее отката: возврат денег после списания — это новое действие, которое тоже может не пройти и оставляет следы, поэтому для каждого компенсируемого действия регистрируется компенсирующее и окно, в котором оно ещё работает. Перед исполнением runner пишет запись о намерении в журнал только на добавление, который агент изменить не может: точные аргументы, ключ идемпотентности, кто разрешил, версии политики и модели, — а после исполнения туда же ложится результат внешней системы. Необратимые действия проходят более строгий контроль: предпросмотр, лимиты или подтверждение человеком. Компенсации я бы регулярно репетировал и проверял, восстанавливается ли любое действие по одному журналу. Граница: журнал даёт подотчётность и возможность исправить последствия, но не отмену, поэтому для необратимых действий с серьёзными последствиями настоящий контроль — не давать агенту действовать в одиночку."
    reading: ["stripe-idempotency","azure-compensating-transaction"]
  - id: "agt-approval"
    tracks: ["engineering","leadership"]
    roles: ["agent-engineer"]
    type: "system_design"
    text:
      en: "Design human approval for consequential agent actions, including how approval remains bound to the exact action being executed."
      ru: "Спроектируйте подтверждение человеком значимых действий агента, связав разрешение с конкретным исполняемым действием."
    tests:
      en: "Whether approval controls are enforced outside the model."
      ru: "Умение обеспечить контроль разрешений вне модели."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
      - source: "outcome-school-company-wise"
        company: "palantir"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 21
    outline:
      en:
        - "Preview the concrete action, target and consequences before approval."
        - "Bind approval to validated arguments and recheck authorisation at execution."
        - "Record the decision and execution result; expire approval after material changes."
      ru:
        - "Показать конкретное действие, адресата и последствия до подтверждения."
        - "Связать разрешение с проверенными аргументами и повторно проверить права при исполнении."
        - "Записать решение и результат; аннулировать разрешение при существенном изменении действия."
    answer:
      en: "Approval works only if the person sees the concrete action, not the intent: recipient, amount, object and how reversible the consequences are, exactly as they will go to the external system. So permission binds not to the conversation or the session but to the validated arguments of one specific call: we freeze them, show them, and at execution recheck the initiator's rights and that fields are unchanged. If the model changed even one material argument after approval, the old permission is void and a new one is requested. I make execution idempotent so a retry after a network failure is not a second charge, and I log the decision, its author, time and result. The limit: this protects against mistaken and externally prompted actions, but under a stream of requests it degenerates into a formality: people approve without looking, so only actions whose cost of error is real deserve it."
      ru: "Подтверждение работает, только если человек видит конкретное действие, а не намерение: адресата, сумму, объект и обратимость последствий ровно в том виде, в каком они уйдут во внешнюю систему. Поэтому разрешение привязывается не к диалогу и не к сессии, а к проверенным аргументам конкретного вызова: их фиксируем, показываем, а при исполнении заново проверяем права инициатора и неизменность полей. Если модель после подтверждения изменила хотя бы один значимый аргумент, прежнее разрешение аннулируется и запрашивается новое. Само исполнение делаю идемпотентным, чтобы повтор после сетевого сбоя не стал вторым списанием, а решение, автора, время и результат записываю в журнал. Граница: такой контроль защищает от ошибочных и подсказанных извне действий, но при потоке запросов вырождается в формальность — человек подтверждает не глядя, поэтому подтверждать стоит лишь действия, значимые по цене ошибки."
    reading: ["anthropic-building-effective-agents","stripe-idempotency"]
  - id: "agt-goal-drift"
    tracks: ["engineering"]
    roles: ["agent-engineer"]
    type: "applied_scenario"
    text:
      en: "A long-running agent confidently pursues the wrong objective. How do you locate where its task state diverged and recover?"
      ru: "После долгой работы агент уверенно решает не ту задачу. Как найти момент расхождения состояния с целью и восстановить работу?"
    tests:
      en: "Whether diagnosis uses task state and observations rather than confidence in prose."
      ru: "Умение опираться на состояние задачи и наблюдения, а не уверенный текст."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Compare persisted task state and tool observations against the original goal, ignoring the agent's narrative."
        - "Find the step where a summary, context compaction or misread observation replaced a constraint."
        - "Resume from the last consistent checkpoint, and add periodic checks of progress against the written goal."
      ru:
        - "Сверить сохранённое состояние задачи и наблюдения инструментов с исходной целью, не опираясь на рассказ агента."
        - "Найти шаг, где резюме, сжатие контекста или неверно прочитанное наблюдение подменило ограничение."
        - "Продолжить с последней согласованной контрольной точки и добавить регулярную сверку прогресса с записанной целью."
    reading: ["anthropic-context-engineering"]
    start_here: ["engineering"]
    priority: 76
    answer:
      en: "I would compare the current plan with the last verified objective, constraints and completion criteria, then find the first decision that introduced a different goal. The cause might be an ambiguous handoff, stale memory, a misleading tool result or an instruction embedded in retrieved content. I would not simply ask the same drifting session to try harder. I would preserve useful verified work, discard unsupported assumptions and restart from a concise task state that distinguishes facts, decisions and open questions. Any external effects need reconciliation before replaying steps. To reduce recurrence, I would checkpoint the objective at meaningful transitions and keep a bounded budget and explicit stop reasons. The check is whether subsequent actions advance the agreed outcome without violating constraints. Summarisation helps with context pressure, but a summary that removes a critical restriction can itself cause the drift."
      ru: "Я сравнил бы текущий план с последней проверенной целью, ограничениями и критериями завершения, затем нашёл первое решение, подменившее цель. Причиной может быть неоднозначная передача, устаревшая память, вводящий в заблуждение результат инструмента или инструкция в найденном содержимом. Просьбы к той же отклонившейся сессии постараться лучше недостаточно. Я сохранил бы полезную проверенную работу, отбросил неподтверждённые допущения и начал заново с краткого состояния, где разделены факты, решения и открытые вопросы. До повторения шагов нужно сверить уже произошедшие внешние эффекты. Для профилактики я проверял бы цель при существенных переходах, ограничивал бюджет и фиксировал причины остановки. Критерий — продвижение следующих действий к согласованному результату без нарушения ограничений. Сжатие помогает при нехватке контекста, но резюме, потерявшее важный запрет, само может стать причиной отклонения. Поэтому проверять нужно и содержание передачи, а не только её длину."
  - id: "agt-coding-harness"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "For a coding agent, how would you separate the model's contribution from the harness's contribution to reliable task completion?"
      ru: "Как для coding agent отделить вклад модели от вклада harness в надёжное завершение задачи?"
    tests:
      en: "Whether controlled comparisons can identify the source of improvements."
      ru: "Умение установить источник улучшения контролируемым сравнением."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    added: "2026-09-26"
    outline:
      en:
        - "Define task success through independent behavioural checks, execution boundaries and resource budgets, not a model's assertion of completion."
        - "Compare model and harness changes separately on the same tasks and repeat stochastic attempts; version context, tools and test environment."
        - "Inspect traces for invalid edits, test weakening, environment failures and retries; report uncertainty and failures that an aggregate score hides."
      ru:
        - "Задать успех независимыми проверками поведения, границами исполнения и бюджетами, а не заявлением модели о готовности."
        - "Отдельно сравнить изменения модели и обвязки на тех же задачах с повторными попытками; версионировать контекст, инструменты и тестовое окружение."
        - "Разобрать трассы неверных правок, ослабления тестов, сбоев окружения и повторов; показать неопределённость и скрытые средним ошибки."
    reading: ["anthropic-evals-for-agents"]
    start_here: ["engineering"]
    priority: 77
    answer:
      en: "I would define success through behaviour checked outside the coding agent, then hold the tasks and resource budget fixed while changing the model or the harness separately. The harness includes context assembly, tool permissions, execution isolation, tests, retries and stopping rules; an improvement in any of these can look like a smarter model. I would version those components, repeat uncertain cases and inspect failed traces rather than report only an aggregate pass rate. A patch that passes because the agent weakened the tests is a harness failure, so acceptance checks need protection from the submitted change. Conversely, a broken dependency or timeout can make capable model output fail for environmental reasons. I would report those categories and total cost per accepted task separately. This comparison identifies contributions within the tested setup; it does not establish a universal ranking across repositories or budgets."
      ru: "Я определил бы успех через поведение, проверяемое вне coding-агента, затем фиксировал задачи и бюджет, меняя модель и обвязку по отдельности. Обвязка включает сборку контекста, права инструментов, изоляцию исполнения, тесты, повторы и остановку; улучшение любого компонента может выглядеть как более умная модель. Я версионировал бы компоненты, повторял неопределённые кейсы и разбирал неудачные трассы вместо одного среднего pass rate. Если правка проходит из-за ослабления тестов агентом, это отказ обвязки: критерии приёмки нужно защитить от самой правки. И наоборот, сломанная зависимость или таймаут могут провалить хороший результат по причинам окружения. Эти категории и полную стоимость принятой задачи я показал бы отдельно. Сравнение выявляет вклад в проверенной конфигурации, но не устанавливает универсальный рейтинг для любых репозиториев и бюджетов. Заявление агента о готовности не заменяет независимую проверку результата."
  - id: "agt-erp-writes"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer"]
    type: "system_design"
    text:
      en: "Design an agent that creates and updates work orders in a live ERP without duplicating or silently corrupting business operations."
      ru: "Спроектируйте агента, создающего и обновляющего наряды в действующей ERP без дублирования или незаметного искажения операций."
    tests:
      en: "Whether business invariants survive uncertain model and network behaviour."
      ru: "Умение сохранить бизнес-инварианты при неопределённости модели и сети."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "palantir"
    added: "2026-09-26"
    start_here: ["leadership"]
    priority: 64
    outline:
      en:
        - "Keep the model on proposals: a typed command validated against ERP business rules before any write."
        - "Derive a stable business key for idempotent creation, and update with a version check, never last-write-wins."
        - "Reconcile ambiguous outcomes before retrying, log proposal against effect, and test duplicate events and concurrent edits."
      ru:
        - "Оставить модели только предложения: типизированную команду, проверенную по бизнес-правилам ERP до любой записи."
        - "Выводить стабильный бизнес-ключ для идемпотентного создания и обновлять с проверкой версии, а не перезаписью вслепую."
        - "Сверять неоднозначные исходы до повтора, журналировать предложение и эффект, проверить дубли событий и одновременные правки."
    answer:
      en: "I'd keep the model off the ERP's write path: it produces a typed command — create or update a work order, with explicit fields — and deterministic code validates it against business rules before any write: the asset exists, the status transition is allowed, no open order already covers this job. Duplicates are prevented by a stable business key derived from the triggering event, not from the model's wording, used as an idempotency key, so a retried tool call or a re-run agent finds the existing order instead of creating a second. Updates carry the record version they read and fail on conflict, because a planner may have edited the order in between, and silent last-write-wins is how corruption goes unnoticed. After a timeout the agent looks up that key before retrying. Each write logs the proposal, the validated command and the ERP's response, and I'd test duplicate events, concurrent edits and injected timeouts. Validation stops illegal states, not plausible wrong ones like a valid order on the wrong asset, so high-impact changes need approval."
      ru: "Я бы не пускал модель на путь записи в ERP: она выдаёт типизированную команду — создать или обновить наряд с явными полями, — а детерминированный код проверяет её по бизнес-правилам до любой записи: оборудование существует, переход статуса разрешён, открытого наряда на эту работу ещё нет. Дубли предотвращает стабильный бизнес-ключ, выведенный из исходного события, а не из формулировки модели и используемый как ключ идемпотентности, поэтому повторный вызов инструмента или перезапущенный агент находит существующий наряд, а не создаёт второй. Обновление несёт версию записи, которую прочитало, и отклоняется при конфликте: планировщик мог изменить наряд в промежутке, а молчаливая перезапись вслепую — именно тот путь, которым искажения проходят незамеченными. После таймаута агент сначала ищет запись по этому ключу и лишь потом повторяет. Каждая запись журналирует предложение, проверенную команду и ответ ERP; тестировал бы дубли событий, одновременные правки и искусственные таймауты. Проверка отсекает недопустимые состояния, но не правдоподобно неверные вроде корректного наряда не на то оборудование, поэтому значимые изменения требуют подтверждения."
    reading: ["stripe-idempotency"]
