  - id: "agt-tool-surface"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "How would you select, name and document tools so that a model chooses the right operation and arguments?"
      ru: "Как выбрать, назвать и описать инструменты, чтобы модель верно выбирала операцию и аргументы?"
    tests:
      en: "Whether tool design reduces ambiguity and measurable misuse."
      ru: "Умение уменьшать неоднозначность и измеримые ошибки вызовов."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 19
    outline:
      en:
        - "Expose cohesive operations with unambiguous names and validated schemas."
        - "Return relevant, bounded results and actionable error messages."
        - "Evaluate tool selection and arguments on realistic tasks, then remove confusing overlap."
      ru:
        - "Выделить целостные операции с понятными именами и проверяемыми схемами."
        - "Возвращать ограниченные релевантные результаты и понятные ошибки."
        - "Проверять выбор инструмента и аргументов на реальных задачах и устранять неоднозначное дублирование."
    answer:
      en: "I design a tool as one coherent operation the model picks by a single clear name, not as a thin wrapper over an endpoint. The name states intent, the schema stays minimal and checkable, with enumerations instead of free text wherever the options are finite, so a bad argument is rejected by validation, not by the downstream system. Results need bounds: return the relevant fields and a sensible volume, otherwise the context fills with noise and the next choice gets worse. Write errors so the next step follows from them, not just a code. I test this on realistic tasks: run a set of requests, measure how often the right tool and the right arguments were chosen, then remove near-identical operations the model confuses. A description can't replace a missing operation, and if the action is not in the set, the model will improvise it out of unsuitable ones."
      ru: "Инструмент стоит проектировать как целостную операцию, которую модель выбирает по одному понятному имени, а не как тонкую обёртку над эндпоинтом. Имя говорит о намерении, схема остаётся минимальной и проверяемой, с перечислениями вместо свободного текста там, где вариантов конечное число, — тогда неверный аргумент отсекается валидацией, а не внешней системой. Результат нужно ограничивать: возвращать релевантные поля и разумный объём, иначе контекст забивается мусором и следующий выбор портится. Ошибку формулируйте так, чтобы из неё следовал следующий шаг, а не просто код. Проверяю это на реальных задачах: прогоняю набор запросов и меряю долю верно выбранного инструмента и корректных аргументов, потом убираю почти одинаковые операции, между которыми модель путается. Граница: описание не заменит недостающую операцию — если нужного действия в наборе нет, модель начнёт собирать его из неподходящих."
    reading: ["anthropic-writing-tools"]
