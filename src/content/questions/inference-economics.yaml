        - "Weight storage is parameter count times bytes per parameter, before quantisation metadata."
        - "Add architecture-specific KV storage for the chosen concurrent sequences."
        - "Reserve activations, workspace and allocator headroom; state any sharding assumptions."
      ru:
        - "Память весов — число параметров на байты на параметр, без метаданных квантования."
        - "Добавить KV-память конкретной архитектуры для заданных параллельных последовательностей."
        - "Заложить активации, рабочие буферы и запас аллокатора; явно указать шардирование."
    answer:
      en: "I would state a hypothetical architecture before budgeting: 70 billion parameters, 80 layers, eight KV heads and head width 128. BF16 weights occupy about 140 GB; int8 roughly 70 GB and four-bit roughly 35 GB, excluding quantisation metadata. For BF16 KV, bytes equal 2 times concurrency times layers times tokens times KV heads times head width times two. Choosing 8,192 tokens and four concurrent sequences gives 10 GiB of KV cache. On two hypothetical 80 GiB accelerators, tensor parallelism could split weights and KV heads, leaving roughly 9.8 GiB per device for activations, buffers, fragmentation and headroom. I would verify actual usable memory and peak allocations, then lower concurrency if needed. This is a capacity estimate, not evidence that the configuration meets a latency SLO."
      ru: "Сначала задаю условную архитектуру: 70 млрд параметров, 80 слоёв, восемь KV-голов размерности 128. Веса BF16 занимают около 140 ГБ, int8 — 70 ГБ, четыре бита — 35 ГБ без метаданных квантования. Для KV в BF16 число байтов равно 2 × конкурентность × слои × токены × KV-головы × размер головы × 2. Выбираю контекст 8192 токена и четыре одновременные последовательности: KV-кеш занимает 10 ГиБ. На двух условных ускорителях по 80 ГиБ tensor parallelism может разделить веса и KV-головы, оставив примерно по 9,8 ГиБ на активации, буферы, фрагментацию и запас. Проверяю реально доступную память и пиковые выделения, при необходимости снижаю конкурентность. Это оценка вместимости, а не доказательство выполнения SLO по задержке."
    reading: ["paper-pagedattention"]
