  - id: "inf-cost-reduction"
    tracks: ["engineering","leadership"]
    roles: ["inference-engineer"]
    type: "applied_scenario"
    text:
      en: "You are asked to reduce serving cost by an order of magnitude. Rank the levers and explain how you would test whether that target is achievable."
      ru: "Вам поручили снизить стоимость инференса на порядок. Расставьте меры по приоритету и объясните, как проверить достижимость цели."
    tests:
      en: "Whether savings are measured under explicit quality and latency constraints."
      ru: "Умение оценить экономию при явных ограничениях качества и задержки."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "microsoft"
      - source: "outcome-school-company-wise"
        company: "amazon"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 10
    outline:
      en:
        - "Measure cost per successful task at the required quality and SLO."
        - "Compare smaller models, shorter contexts, reuse, batching and precision changes."
        - "Benchmark each change and check whether the combined savings actually reach the target."
      ru:
        - "Измерить стоимость успешной задачи при нужном качестве и SLO."
        - "Сравнить меньшие модели, сокращение контекста, переиспользование, батчинг и точность."
        - "Измерить каждое изменение и проверить, достигается ли цель в совокупности."
    answer:
      en: "First I fix the metric: not price per million tokens, but the cost of one successfully completed task at a given quality and SLO, otherwise any saving turns into a quiet product regression. Then the levers in decreasing order of expected effect: a smaller model or a distilled one where quality holds; cutting context and reusing work, meaning prompt caching and caching of repeated answers; server side measures such as continuous batching and decent utilisation; and only then quantisation and precision work. The first levers reduce work and the last reduce price per unit, and their ceilings differ. I'd turn each change on separately, measuring quality on an eval set and latency at the tails. An important limit: a tenfold saving rarely comes from one lever, and if the product of honestly measured effects falls short, say so before the work starts."
      ru: "Первым делом фиксирую метрику: не цена за миллион токенов, а стоимость одной успешно решённой задачи при заданном качестве и SLO, иначе любая экономия окажется тихим ухудшением продукта. Дальше меры по убыванию ожидаемого эффекта: модель поменьше или дистиллят там, где качество выдерживает; сокращение контекста и переиспользование, то есть кеширование промпта и повторяющихся ответов; серверные меры вроде непрерывного батчинга и нормальной утилизации; и лишь потом квантование и работа с точностью. Порядок такой потому, что первые меры уменьшают объём работы, а последние — цену единицы работы, и потолок у них разный. Каждое изменение включал бы отдельно, с замером качества на eval-наборе и задержки на хвостах. Важная граница: десятикратную экономию редко даёт одна мера, и если произведение честно измеренных эффектов не дотягивает, сказать об этом надо до начала работ."
    reading: ["hf-llm-optims","google-sre-book"]
  - id: "inf-tail-regression"
    tracks: ["engineering"]
    roles: ["inference-engineer"]
    type: "applied_scenario"
    text:
      en: "After a deployment, p99 latency doubles although model weights are unchanged. How do you isolate the cause?"
      ru: "После релиза p99 задержки удвоился, хотя веса модели не менялись. Как локализовать причину?"
    tests:
      en: "Whether diagnosis separates queueing, scheduling, dependencies and traffic changes."
      ru: "Умение разделить ожидание, планирование, зависимости и изменения трафика."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
      - source: "outcome-school-company-wise"
        company: "amazon"
      - source: "outcome-school-company-wise"
        company: "databricks"
      - source: "outcome-school-company-wise"
        company: "perplexity"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 11
    outline:
      en:
        - "Compare traffic mix, queue time and per-stage latency before and after release."
        - "Inspect cache hit rates, batching, dependency tails and resource saturation."
        - "Reproduce one hypothesis at a time and use a rollback or canary to verify causality."
      ru:
        - "Сравнить состав трафика, время в очереди и задержки этапов до и после релиза."
        - "Проверить попадания в кеш, батчинг, хвосты зависимостей и насыщение ресурсов."
        - "Проверять гипотезы по одной и подтвердить причинность откатом или canary."
    answer:
      en: "With unchanged weights, I examine traffic, scheduling and infrastructure. First I compare prompt and output lengths, request types and new clients before and after release. On slow request traces, I inspect queueing, prefill, decode and dependency durations; adding separate stage p99 values would not give end-to-end p99. Then I check prompt-cache hits, batch sizes, KV evictions, dependency tails and saturation of memory, bandwidth and threads, including neighbouring workloads. I change one factor at a time to keep effects distinguishable. A rollback provides useful evidence, but causal confidence requires comparable traffic and conditions, ideally a controlled canary. I would verify that both the workload mix and tail latency recover before attributing the regression to a release. Several bottlenecks can contribute, so there may be no single cause."
      ru: "Веса не менялись, значит, причину ищу в трафике, планировании и окружении. Сначала сравниваю до и после релиза состав нагрузки: распределение длин промпта и ответа, доли типов запросов, появление новых клиентов. В трассах медленных запросов проверяю длительности очереди, prefill, decode и вызовов зависимостей: складывать отдельные p99 этапов для получения сквозного p99 нельзя. Затем проверяю попадания в кеш промптов, фактические размеры батчей и вытеснения KV, хвосты зависимостей и насыщение по памяти, полосе и потокам, включая соседей по железу. Гипотезы проверяю по одной, иначе несколько одновременных правок смешают эффекты. Откат даёт полезное свидетельство, но причинный вывод требует сопоставимого трафика и условий, лучше контролируемого canary. Проверяю восстановление хвоста вместе с составом нагрузки, прежде чем связывать регрессию с релизом. Стоит помнить, что хвост часто складывается из множества мелких независимых задержек, и единственной причины может не оказаться вовсе."
    reading: ["paper-tail-at-scale"]
