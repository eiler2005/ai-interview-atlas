  - id: "inf-cost-reduction"
    tracks: ["engineering","leadership"]
    roles: ["inference-engineer"]
    type: "applied_scenario"
    text:
      en: "You are asked to reduce serving cost by an order of magnitude. Rank the levers and explain how you would test whether that target is achievable."
      ru: "Вам поручили снизить стоимость инференса на порядок. Расставьте меры по приоритету и объясните, как проверить достижимость цели."
    tests:
      en: "Whether savings are measured under explicit quality and latency constraints."
      ru: "Умение оценить экономию при явных ограничениях качества и задержки."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "microsoft"
      - source: "outcome-school-company-wise"
        company: "amazon"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 10
    outline:
      en:
        - "Measure cost per successful task at the required quality and SLO."
        - "Compare smaller models, shorter contexts, reuse, batching and precision changes."
        - "Benchmark each change and check whether the combined savings actually reach the target."
      ru:
        - "Измерить стоимость успешной задачи при нужном качестве и SLO."
        - "Сравнить меньшие модели, сокращение контекста, переиспользование, батчинг и точность."
        - "Измерить каждое изменение и проверить, достигается ли цель в совокупности."
    answer:
      en: "I'd rank levers by where the money goes, starting from a breakdown in cost per successful task at the required quality and latency SLO: input versus output tokens, the repeated share of input, and accelerator utilisation. Each output token needs its own decode step, so if output dominates, prompt caching barely helps; the levers are a smaller or distilled model for the traffic it can handle, and shorter answers. If long repeated prompts dominate, prefix caching and trimmed context come first. If utilisation is low, batching and right-sized capacity can beat any model change. Quantisation makes each step cheaper but removes no work, and its ceiling is a few-fold gain, not tenfold. Levers interact: a smaller model shrinks what caching and quantisation can still save, so multiplying separate gains overstates the total. I'd measure each lever alone, then prove the combined stack on replayed production traffic against the quality bar and p99. If cost is mostly output from a model that can't shrink without failing the bar, tenfold may not exist, and I'd say so upfront."
      ru: "Меры я бы ранжировал по тому, куда реально уходят деньги, начиная с разбивки в стоимости успешной задачи при нужном качестве и SLO по задержке: входные токены против выходных, повторяющаяся доля входа и утилизация ускорителей. Каждый выходной токен требует своего шага decode, поэтому если доминирует выход, кеширование промпта почти не помогает, и рычаги другие: модель поменьше или дистиллят для той части трафика, с которой она справляется, и более короткие ответы. Если доминируют длинные повторяющиеся промпты, первыми идут кеширование префикса и сокращение контекста. Если утилизация низкая, батчинг и подгонка мощностей под нагрузку могут дать больше любой смены модели. Квантование удешевляет каждый шаг, но не убирает работу, и его потолок — выигрыш в несколько раз, а не на порядок. Меры взаимодействуют: меньшая модель сокращает то, что ещё могут сэкономить кеш и квантование, так что произведение отдельных выигрышей завышает итог. Каждую меру мерил бы отдельно, а связку целиком проверял на воспроизведённом продовом трафике против планки качества и p99. Если стоимость — это в основном выход модели, которую нельзя уменьшить без провала по качеству, десятикратной экономии может не существовать, и сказать это надо заранее."
    reading: ["hf-llm-optims","google-sre-book"]
  - id: "inf-tail-regression"
    tracks: ["engineering"]
    roles: ["inference-engineer"]
    type: "applied_scenario"
    text:
      en: "After a deployment, p99 latency doubles although model weights are unchanged. How do you isolate the cause?"
      ru: "После релиза p99 задержки удвоился, хотя веса модели не менялись. Как локализовать причину?"
    tests:
      en: "Whether diagnosis separates queueing, scheduling, dependencies and traffic changes."
      ru: "Умение разделить ожидание, планирование, зависимости и изменения трафика."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
      - source: "outcome-school-company-wise"
        company: "amazon"
      - source: "outcome-school-company-wise"
        company: "databricks"
      - source: "outcome-school-company-wise"
        company: "perplexity"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 11
    outline:
      en:
        - "Compare traffic mix, queue time and per-stage latency before and after release."
        - "Inspect cache hit rates, batching, dependency tails and resource saturation."
        - "Reproduce one hypothesis at a time and use a rollback or canary to verify causality."
      ru:
        - "Сравнить состав трафика, время в очереди и задержки этапов до и после релиза."
        - "Проверить попадания в кеш, батчинг, хвосты зависимостей и насыщение ресурсов."
        - "Проверять гипотезы по одной и подтвердить причинность откатом или canary."
    answer:
      en: "With weights unchanged I'd search around the model, starting with where slow requests spend their time: queue wait, prefill, decode and dependency calls, read from traces of tail requests before and after the release, because stage p99s don't add up to the end-to-end p99. Each component points somewhere different. Longer queueing means capacity fell or load rose: a lower batch limit, a missing replica or a new co-located workload pushes utilisation toward one, where waiting grows nonlinearly, so a small loss can double the tail. Longer prefill suggests a changed system prompt or template broke the shared prefix and collapsed the prefix-cache hit rate. Longer decode points to longer outputs or KV evictions forcing recomputation. Longer dependency time is a retrieval or tool tail. I'd also compare the traffic mix, since a new client brings longer prompts without any code change. Then one hypothesis at a time, confirmed by rollback or canary; a canary proves causality only under comparable traffic and neighbours, otherwise I'd replay recorded traffic against both versions."
      ru: "Раз веса не менялись, ищу вокруг модели и начинаю с того, на что медленные запросы тратят время: ожидание в очереди, prefill, decode и вызовы зависимостей, по трассам хвостовых запросов до и после релиза, потому что p99 отдельных этапов не складываются в сквозной p99. Каждая составляющая указывает в свою сторону. Выросла очередь — значит, упала мощность или выросла нагрузка: меньший лимит батча, пропавшая реплика или новый сосед по железу толкают утилизацию к единице, где ожидание растёт нелинейно, и небольшая потеря способна удвоить хвост. Вырос prefill — вероятно, изменённый системный промпт или шаблон сломал общий префикс и обрушил долю попаданий в кеш префиксов. Вырос decode — ищу удлинившиеся ответы или вытеснения KV с пересчётом. Выросло время зависимостей — это хвост поиска или инструмента. Ещё сравниваю состав трафика: новый клиент приносит длинные промпты без единой правки кода. Дальше проверяю гипотезы по одной и подтверждаю откатом или canary; canary доказывает причинность только при сопоставимом трафике и соседях, иначе прогоняю записанный трафик через обе версии."
    reading: ["paper-tail-at-scale"]
  - id: "inf-chunked-prefill"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Why can splitting prefill into chunks help mixed prompt and decode traffic, and what trade-off does chunk size introduce?"
      ru: "Почему разбиение prefill на части помогает смешанному трафику и какой компромисс задаёт размер части?"
    tests:
      en: "Whether throughput and decode stalls are considered together."
      ru: "Совместный учёт пропускной способности и пауз декодирования."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Explain the stall: a long prefill monopolises an iteration, so every running decode waits and inter-token latency spikes."
        - "Mix prefill chunks with decodes under a per-iteration token budget; smaller chunks smooth decode but raise TTFT and overhead."
        - "Sweep the token budget on mixed traffic, plotting p99 inter-token latency against TTFT and throughput."
      ru:
        - "Объяснить паузу: длинный prefill занимает итерацию целиком, все идущие декодирования ждут, и задержка между токенами подскакивает."
        - "Смешивать в итерации части prefill с decode в пределах бюджета токенов; мелкие части сглаживают decode, но растят TTFT и накладные расходы."
        - "Перебрать бюджет токенов на итерацию на смешанном трафике и сопоставить p99 задержки между токенами с TTFT и пропускной способностью."
    reading: ["vllm-docs","paper-sarathi-serve"]
  - id: "inf-disaggregation"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "When would you separate prefill and decode onto different workers, and how would you price the KV transfer overhead?"
      ru: "Когда стоит разделить prefill и decode между воркерами и как оценить накладные расходы передачи KV?"
    tests:
      en: "Whether independent scaling is weighed against transport and operational complexity."
      ru: "Умение сопоставить независимое масштабирование со стоимостью передачи и эксплуатации."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Separate phases when prefill bursts break decode latency SLOs or the two phases want different parallelism and hardware."
        - "Price transfer as KV bytes per token times prompt length over link bandwidth, overlapped layer by layer with prefill."
        - "Compare goodput per GPU against colocated chunked prefill, including transfer tail latency and rebalancing the worker ratio."
      ru:
        - "Разделять фазы, когда всплески prefill ломают SLO по задержке decode или фазам нужны разный параллелизм и оборудование."
        - "Оценить передачу как байты KV на токен, умноженные на длину промпта и делённые на пропускную способность канала, с послойным перекрытием с prefill."
        - "Сравнить goodput на GPU с совмещённой схемой и chunked prefill, учитывая хвост задержки передачи и перебалансировку числа воркеров."
    reading: ["vllm-docs","paper-distserve"]
