theme: "inference-economics"
questions:
  - id: "inf-prefill-decode"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Contrast prefill with autoregressive decode and explain when compute or memory bandwidth becomes the bottleneck."
      ru: "Сравните prefill и авторегрессионное декодирование: когда узким местом становятся вычисления, а когда пропускная способность памяти?"
    tests:
      en: "Whether bottlenecks are conditioned on workload and batch size."
      ru: "Умение определять узкое место с учётом нагрузки и батча."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 6
    outline:
      en:
        - "Prefill processes prompt positions in parallel; decode advances autoregressively."
        - "Small-batch decode often reads weights with limited arithmetic reuse."
        - "Profile sequence lengths and batching before declaring either phase compute- or bandwidth-bound."
      ru:
        - "Prefill обрабатывает позиции промпта параллельно, decode идёт авторегрессионно."
        - "При малом батче decode часто читает веса с низким повторным использованием вычислений."
        - "Профилировать длины и батчинг до вывода о вычислительном или memory-bound ограничении."
    answer:
      ru: "Prefill считает все позиции промпта за один проход и заполняет матричные блоки, поэтому обычно упирается в вычисления. Decode идёт авторегрессионно, по токену за итерацию: на каждом шаге приходится прочитать все веса слоя ради арифметики над одним токеном каждой последовательности, так что при малом батче арифметическая интенсивность низкая и ограничением становится пропускная способность памяти. Батчинг сдвигает границу — чем больше последовательностей идёт одновременно, тем лучше переиспользуются прочитанные веса и тем ближе decode к вычислительному пределу, но растёт KV-кеш и чтение самого кеша. Поэтому до любой оптимизации я бы снял профиль на реальном распределении длин промпта и ответа и посмотрел раздельно по фазам на достигнутую полосу памяти и утилизацию вычислителей. Граница: на очень длинных контекстах доминирует чтение кеша, и простое деление на две фазы перестаёт объяснять наблюдаемое."
    reading: ["hf-llm-optims"]
  - id: "inf-continuous-batching"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Explain iteration-level batching and how requests enter and leave a running inference batch."
      ru: "Объясните батчинг на уровне итераций: как запросы добавляются в выполняющийся батч и покидают его?"
    tests:
      en: "Whether scheduling is connected to utilisation, fairness and waiting time."
      ru: "Понимание связи планировщика с утилизацией, справедливостью и ожиданием."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 7
    outline:
      en:
        - "Admit new sequences at iteration boundaries and remove completed ones."
        - "Enforce token and KV-memory budgets rather than request count alone."
        - "Measure queueing and starvation alongside throughput."
      ru:
        - "Добавлять последовательности на границах итераций и удалять завершённые."
        - "Ограничивать токены и KV-память, а не только число запросов."
        - "Измерять ожидание и голодание запросов наряду с throughput."
    answer:
      ru: "Батчинг на уровне итераций означает, что планировщик пересобирает состав батча на каждом шаге генерации, а не ждёт, пока доработают все: новая последовательность входит на ближайшей границе итерации, а выдавшая стоп-токен или упёршаяся в лимит длины уходит сразу и освобождает место. Так утилизация не проваливается из-за одного длинного ответа. Платим сложностью планировщика и риском, что часть запросов будет вытесняться или ждать дольше остальных. Ограничивать надо не количество запросов, а суммарные токены шага и доступную KV-память, иначе пул кеша кончится и начнутся вытеснения с пересчётом. Я бы следил не только за throughput, но и за временем до первого токена, распределением ожидания в очереди и долей запросов, простоявших дольше порога. Планировщик не лечит перегрузку: при устойчивом превышении ёмкости нужен отказ или деградация, а не более хитрая очередь."
    reading: ["paper-pagedattention"]
  - id: "inf-paged-cache"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "How does paging the KV cache reduce waste, and what remains for the scheduler to solve?"
      ru: "Как страничная организация KV-кеша сокращает потери памяти и какие задачи остаются планировщику?"
    tests:
      en: "Whether memory management is distinguished from request scheduling."
      ru: "Умение отличать управление памятью от планирования запросов."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
  - id: "inf-speculation"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Explain exact speculative decoding, its acceptance step and workloads where the draft model adds overhead instead of speed."
      ru: "Объясните точное speculative decoding, проверку предложенных токенов и случаи, когда draft-модель лишь добавляет накладные расходы."
    tests:
      en: "Whether speedup is explained without promising a universal quality or latency benefit."
      ru: "Понимание условий ускорения без универсальных обещаний."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 8
    outline:
      en:
        - "A smaller model proposes several tokens for parallel target verification."
        - "Describe acceptance and correction sampling that preserve the target distribution."
        - "Evaluate acceptance rate, draft cost and available parallel compute."
      ru:
        - "Малая модель предлагает несколько токенов для параллельной проверки целевой моделью."
        - "Описать принятие и корректирующий сэмплинг, сохраняющие распределение целевой модели."
        - "Оценить долю принятых токенов, стоимость draft и доступные параллельные вычисления."
    answer:
      ru: "Схема такая: дешёвая draft-модель генерирует несколько токенов вперёд, а целевая модель проверяет их одним параллельным проходом и за свой единственный шаг подтверждает сразу несколько позиций. Точность сохраняется честно: каждый предложенный токен принимается по сравнению вероятностей целевой и draft-модели, а при отказе токен пересэмплируется из скорректированного распределения, так что итоговое распределение совпадает с распределением целевой модели. Выигрыш определяется тремя величинами: средней долей принятых токенов, стоимостью прогона draft и наличием свободных вычислений под проверку. Мерить я бы стал среднее число принятых токенов за проход и сквозную задержку с draft-моделью и без неё на собственной нагрузке, а не на демонстрационном примере. Если сервер и так compute-bound из-за большого батча или домен расходится с обучением draft, доля принятия падает и лишний проход проверки превращается в замедление."
    reading: ["paper-speculative-decoding"]
