theme: "inference-economics"
questions:
  - id: "inf-reasoning-budget"
    tracks: ["engineering", "leadership"]
    type: "applied_scenario"
    text:
      en: "A service can spend more on one reasoning run or generate several candidates and verify them. How would you allocate compute under a latency deadline?"
      ru: "Сервис может потратить больше вычислений на один reasoning-запуск или получить несколько кандидатов и проверить их. Как распределить бюджет при ограничении задержки?"
    tests:
      en: "Whether compute allocation follows measured task value and includes verification overhead."
      ru: "Умение распределять вычисления по измеренной пользе для задачи с учётом расходов на проверку."
    provenance: "generated"
    basis: ["radar:inference-economics"]
    added: "2026-09-29"
    start_here: ["engineering"]
    priority: 45
    outline:
      en:
        - "Compare strategies on the same held-out tasks, including verifier cost and wall-clock latency."
        - "Measure success by task difficulty and deploy a routing rule that does not require knowing the correct answer."
        - "Set stopping and fallback rules; report total spend per successful task and deadline misses."
      ru:
        - "Сравнить стратегии на одинаковых отложенных задачах, включая стоимость проверяющего и полную задержку."
        - "Измерить успех по сложности задач и выбрать правило маршрутизации, которому не нужен правильный ответ."
        - "Задать остановку и резервный сценарий; показать все расходы на успешную задачу и нарушения срока."
    answer:
      en: "I would treat this as an empirical allocation question, not a preference. On the same held-out tasks I would run one long reasoning pass and a sample-and-verify strategy at several budgets, then compare success per unit of spend and per unit of wall-clock time, counting the verifier's own tokens and latency as part of the cost: a verifier that doubles latency can lose on a deadline it would win on cost. Sampling parallelises, so it often fits a deadline that a single long pass misses, but it only helps when a cheap check can tell candidates apart; without that, extra candidates add spend and no accuracy. Because the gain varies with difficulty, small where one pass already succeeds or nothing does and largest in between, I would route by an observable feature available before the answer exists, never by correctness. Then a hard token and time ceiling with a defined fallback, reporting spend per successful task and deadline misses. Where no strategy succeeds at any budget, extra test-time compute is wasted and a stronger model is the lever."
      ru: "Я бы решал это измерением, а не предпочтением. На одних и тех же отложенных задачах я бы прогнал один длинный reasoning-проход и стратегию «несколько кандидатов плюс проверка» на нескольких бюджетах, а затем сравнил успех на единицу расходов и на единицу полного времени, считая токены и задержку проверяющего частью стоимости: проверяющий, удваивающий задержку, может проиграть по сроку там, где выиграл бы по деньгам. Сэмплирование распараллеливается и потому часто укладывается в срок, который один длинный проход не выдерживает, но помогает лишь тогда, когда дешёвая проверка действительно различает кандидатов; иначе лишние кандидаты добавляют расход и не добавляют точности. Так как выигрыш зависит от сложности — он мал там, где уже справляется один проход или не справляется ничто, и максимален между ними, — я бы маршрутизировал по наблюдаемому признаку, доступному до появления ответа, а никогда по правильности. Дальше жёсткий предел по токенам и времени с описанным резервным сценарием и отчёт: расходы на успешную задачу и нарушения срока. Там, где ни одна стратегия не справляется ни при каком бюджете, дополнительные вычисления на инференсе уходят впустую, и рычагом становится более сильная модель."
    reading: ["paper-test-time-compute", "openai-evaluation-best-practices"]
  - id: "inf-reasoning-incomplete"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "A reasoning API request consumes tokens but returns no usable answer. How would you diagnose it and design a bounded recovery policy?"
      ru: "Запрос к reasoning API расходует токены, но не возвращает пригодный ответ. Как найти причину и организовать восстановление с ограниченным бюджетом?"
    tests:
      en: "Whether token accounting, completion status and retry budgets are treated separately."
      ru: "Умение различать учёт токенов, статус завершения и бюджет повторов."
    provenance: "generated"
    basis: ["radar:inference-economics"]
    added: "2026-09-29"
    start_here: ["engineering"]
    priority: 70
    outline:
      en:
        - "Inspect completion status, token usage, context size and the provider's output-limit semantics."
        - "Distinguish exhaustion from tool errors, refusal and timeout before choosing recovery."
        - "Bound total attempts, spend and elapsed time; measure recovery success and avoid duplicate tool actions."
      ru:
        - "Проверить статус, расход токенов, размер контекста и смысл выходного лимита у провайдера."
        - "До восстановления отличить исчерпание лимита от ошибки инструмента, отказа и таймаута."
        - "Ограничить попытки, расходы и полное время; измерять успех восстановления и исключать повторные действия инструментов."
    answer:
      en: "Billed tokens and a usable answer are separate facts, so I'd read the completion status first. A reasoning model's hidden tokens count against the same output limit and are billed, so a request can hit that limit mid-reasoning and come back incomplete with little or no visible text. That's a different failure from a refusal, a content-filter stop, a tool error inside an agent loop, or a client timeout where the server may still finish and charge. So I'd log the status and its reason, reasoning versus visible tokens, input size, and the configured limit and effort. Recovery follows the cause: for exhaustion, one retry with a larger output allowance, lower effort or a smaller context, never an identical replay that mostly reproduces the failure. Everything sits under one cap on attempts, spend and elapsed time, and tool calls carry idempotency keys so a retry can't repeat a side effect. I'd track recovered-answer rate and spend per recovery. A task that exhausts generous budgets needs decomposition or a human, not more tokens."
      ru: "Оплаченные токены и пригодный ответ — разные факты, поэтому первым делом я бы посмотрел статус завершения. Скрытые токены рассуждения у reasoning-модели входят в тот же выходной лимит и оплачиваются, так что запрос может упереться в лимит посреди рассуждения и вернуться незавершённым почти без видимого текста. Это другой сбой, чем отказ модели, остановка фильтром контента, ошибка инструмента внутри агентного цикла или клиентский таймаут, при котором сервер может всё же доработать и выставить счёт. Поэтому в лог идут статус и его причина, токены рассуждения отдельно от видимых, размер входа, заданный лимит и уровень усилий. Восстановление зависит от причины: при исчерпании — один повтор с большим выходным лимитом, меньшим уровнем усилий или более коротким контекстом, но никогда не точная копия запроса, которая в основном воспроизводит тот же сбой. Всё это живёт под одним потолком на попытки, расходы и общее время, а вызовы инструментов несут ключи идемпотентности, чтобы повтор не продублировал побочный эффект. Отслеживал бы долю восстановленных ответов и расходы на каждое восстановление. Задачу, которая исчерпывает щедрый бюджет, надо декомпозировать или отдать человеку, а не заливать токенами."
    reading: ["openai-reasoning-models"]
  - id: "inf-prefill-decode"
    tracks: ["engineering"]
    roles: ["inference-engineer"]
    type: "knowledge"
    text:
      en: "Contrast prefill with autoregressive decode and explain when compute or memory bandwidth becomes the bottleneck."
      ru: "Сравните prefill и авторегрессионное декодирование: когда узким местом становятся вычисления, а когда пропускная способность памяти?"
    tests:
      en: "Whether bottlenecks are conditioned on workload and batch size."
      ru: "Умение определять узкое место с учётом нагрузки и батча."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 6
    outline:
      en:
        - "Prefill processes prompt positions in parallel; decode advances autoregressively."
        - "Small-batch decode often reads weights with limited arithmetic reuse."
        - "Profile sequence lengths and batching before declaring either phase compute- or bandwidth-bound."
      ru:
        - "Prefill обрабатывает позиции промпта параллельно, decode идёт авторегрессионно."
        - "При малом батче decode часто читает веса и почти не переиспользует их в арифметике."
        - "Профилировать длины и батчинг до вывода о вычислительном или memory-bound ограничении."
    answer:
      en: "Prefill computes all prompt positions in one pass and fills large matrix blocks, so unless the prompt is very short it's compute bound. Decode runs autoregressively, one token per iteration: every step has to read all the weights of a layer to do arithmetic over a single token per sequence, so at small batch the arithmetic intensity is low and memory bandwidth becomes the limit. Batching moves that boundary: the more sequences run together, the better the weights you've read are reused and the closer decode gets to the compute limit, but the KV cache grows and so does reading the cache itself. So before any optimisation I'd take a profile on the real distribution of prompt and output lengths and look per phase at achieved memory bandwidth and compute utilisation. The limit: at long contexts decode stays bandwidth bound however large the batch, because each sequence reads its own cache and that traffic isn't shared, so batching stops helping and only a smaller cache does."
      ru: "Prefill считает все позиции промпта за один проход и заполняет матричные блоки, поэтому, если промпт не совсем короткий, упирается в вычисления. Decode идёт авторегрессионно, по токену за итерацию: на каждом шаге приходится прочитать все веса слоя ради арифметики над одним токеном каждой последовательности, так что при малом батче арифметическая интенсивность низкая и ограничением становится пропускная способность памяти. Батчинг сдвигает границу — чем больше последовательностей идёт одновременно, тем лучше переиспользуются прочитанные веса и тем ближе decode к вычислительному пределу, но растёт KV-кеш и чтение самого кеша. Поэтому до любой оптимизации я бы снял профиль на реальном распределении длин промпта и ответа и посмотрел раздельно по фазам на достигнутую пропускную способность памяти и утилизацию вычислителей. Граница: на длинных контекстах decode остаётся ограниченным пропускной способностью памяти при любом батче, потому что каждая последовательность читает собственный кеш и этот трафик не разделяется, так что батчинг перестаёт помогать и выручает только уменьшение кеша."
    reading: ["hf-llm-optims"]
  - id: "inf-continuous-batching"
    tracks: ["engineering"]
    roles: ["inference-engineer"]
    type: "knowledge"
    text:
      en: "Explain iteration-level batching and how requests enter and leave a running inference batch."
      ru: "Объясните батчинг на уровне итераций: как запросы добавляются в выполняющийся батч и покидают его?"
    tests:
      en: "Whether scheduling is connected to utilisation, fairness and waiting time."
      ru: "Понимание связи планировщика с утилизацией, справедливостью и ожиданием."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 7
    outline:
      en:
        - "Admit new sequences at iteration boundaries and remove completed ones."
        - "Enforce token and KV-memory budgets rather than request count alone."
        - "Measure queueing and starvation alongside throughput."
      ru:
        - "Добавлять последовательности на границах итераций и удалять завершённые."
        - "Ограничивать токены и KV-память, а не только число запросов."
        - "Измерять ожидание и голодание запросов наряду с throughput."
    answer:
      en: "The scheduler rebuilds the batch at every generation step instead of waiting for everyone to finish: a new sequence joins at the next iteration boundary, and one that emitted a stop token or hit its length limit leaves immediately and frees the slot. That way utilisation doesn't collapse because of one long answer. We pay with scheduler complexity and the risk that some requests get preempted or wait longer than the rest. What you cap is not the number of requests but the total tokens per step and the available KV memory, otherwise the cache pool runs dry and you start evicting and recomputing. I'd watch not only throughput but time to first token, the distribution of queue wait and the share of requests that waited past a threshold. A scheduler doesn't cure overload: with sustained excess demand you need rejection or degradation, not a cleverer queue."
      ru: "Батчинг на уровне итераций означает, что планировщик пересобирает состав батча на каждом шаге генерации, а не ждёт, пока доработают все: новая последовательность входит на ближайшей границе итерации, а выдавшая стоп-токен или упёршаяся в лимит длины уходит сразу и освобождает место. Так утилизация не проваливается из-за одного длинного ответа. Платим сложностью планировщика и риском, что часть запросов будет вытесняться или ждать дольше остальных. Ограничивать надо не количество запросов, а суммарные токены шага и доступную KV-память, иначе пул кеша кончится и начнутся вытеснения с пересчётом. Я бы следил не только за throughput, но и за временем до первого токена, распределением ожидания в очереди и долей запросов, простоявших дольше порога. Планировщик не лечит перегрузку: при устойчивом превышении ёмкости нужен отказ или деградация, а не более хитрая очередь."
    reading: ["paper-pagedattention"]
  - id: "inf-paged-cache"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "How does paging the KV cache reduce waste, and what remains for the scheduler to solve?"
      ru: "Как страничная организация KV-кеша сокращает потери памяти и какие задачи остаются планировщику?"
    tests:
      en: "Whether memory management is distinguished from request scheduling."
      ru: "Умение отличать управление памятью от планирования запросов."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 44
    outline:
      en:
        - "Explain fragmentation from contiguous allocation sized for the longest possible answer."
        - "Describe fixed-size blocks with an indirection table and blocks shared between requests."
        - "Name what paging leaves open: admission, preemption and fairness remain scheduling policy."
      ru:
        - "Объяснить фрагментацию при непрерывном выделении памяти под самый длинный возможный ответ."
        - "Описать блоки фиксированного размера с таблицей косвенности и общие блоки между запросами."
        - "Назвать нерешённое: приём, вытеснение и справедливость остаются политикой планировщика."
    answer:
      en: "Paging attacks fragmentation, not scarcity. If each request reserves one contiguous span sized for the longest answer it might produce, most of that reservation sits idle, and the free memory left over is unusable because it is scattered, so concurrency collapses well before the device is full. Paging stores the cache in fixed-size blocks with a per-request table mapping logical positions to physical blocks, so growth is incremental, internal waste is bounded by one partly filled block, and identical prefixes or parallel samples can point at shared blocks copied only on write. What it leaves untouched is policy: who is admitted when blocks run out, whose blocks are evicted or recomputed, and how long a request may wait. I would measure achieved batch size, the share of memory actually holding live tokens, preemption rate and p99 latency — paging widens the pipe, and a poor scheduler can still starve requests."
      ru: "Страничная организация борется с фрагментацией, а не с нехваткой памяти. Если каждый запрос резервирует один непрерывный отрезок под самый длинный возможный ответ, большая часть резерва простаивает, а оставшаяся свободная память непригодна, потому что разбросана, — и параллелизм падает задолго до реального заполнения устройства. Страницы хранят кеш блоками фиксированного размера с таблицей на запрос, отображающей логические позиции в физические блоки: рост идёт постепенно, внутренние потери ограничены одним неполным блоком, а одинаковые префиксы или параллельные сэмплы могут ссылаться на общие блоки, копируемые только при записи. Нетронутой остаётся политика: кого принимать, когда блоки закончились, чьи блоки вытеснять или пересчитывать и сколько запрос может ждать. Я бы измерял достигнутый размер батча, долю памяти, реально занятой живыми токенами, частоту вытеснений и p99 задержки: страницы увеличивают вместимость, но плохой планировщик всё равно может оставить часть запросов голодать."
    reading: ["paper-pagedattention"]
  - id: "inf-speculation"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Explain exact speculative decoding, its acceptance step and workloads where the draft model adds overhead instead of speed."
      ru: "Объясните точное speculative decoding, проверку предложенных токенов и случаи, когда draft-модель лишь добавляет накладные расходы."
    tests:
      en: "Whether speedup is explained without promising a universal quality or latency benefit."
      ru: "Понимание условий ускорения без универсальных обещаний."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 8
    outline:
      en:
        - "A smaller model proposes several tokens for parallel target verification."
        - "Describe acceptance and correction sampling that preserve the target distribution."
        - "Evaluate acceptance rate, draft cost and available parallel compute."
      ru:
        - "Малая модель предлагает несколько токенов для параллельной проверки целевой моделью."
        - "Описать принятие и корректирующий сэмплинг, сохраняющие распределение целевой модели."
        - "Оценить долю принятых токенов, стоимость draft и доступные параллельные вычисления."
    answer:
      en: "The scheme is this: a cheap draft model generates several tokens ahead, and the target model verifies them in one parallel pass, confirming several positions within its single step. Accuracy is preserved honestly: each proposed token is accepted by comparing the target and draft probabilities, and on rejection the token is resampled from a corrected distribution, so the final distribution matches the target model's. The gain is set by three quantities: the average share of accepted tokens, the cost of running the draft, and spare compute available for verification. I'd measure the average number of accepted tokens per pass and end to end latency with and without the draft model on my own workload, not on a demo example. Large compute-bound batches leave less spare compute; draft-target mismatch lowers acceptance. Either can erase the speedup or cause a slowdown."
      ru: "Схема такая: дешёвая draft-модель генерирует несколько токенов вперёд, а целевая модель проверяет их одним параллельным проходом и за свой единственный шаг подтверждает сразу несколько позиций. Точность сохраняется честно: каждый предложенный токен принимается по сравнению вероятностей целевой и draft-модели, а при отказе токен пересэмплируется из скорректированного распределения, так что итоговое распределение совпадает с распределением целевой модели. Выигрыш определяется тремя величинами: средней долей принятых токенов, стоимостью прогона draft и наличием свободных вычислений под проверку. Мерить я бы стал среднее число принятых токенов за проход и сквозную задержку с draft-моделью и без неё на собственной нагрузке, а не на демонстрационном примере. Большой compute-bound батч оставляет меньше свободных вычислений, а расхождение draft и целевой модели снижает долю принятия. Любой из этих факторов может свести выигрыш к нулю или вызвать замедление."
    reading: ["paper-speculative-decoding"]
  - id: "inf-prefix-cache"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "What makes a prompt prefix reusable, and which changes invalidate or reduce the value of a prefix cache?"
      ru: "Когда префикс промпта можно переиспользовать и какие изменения обесценивают или инвалидируют кеш?"
    tests:
      en: "Whether exact reuse, cache lifetime and tenant isolation are considered."
      ru: "Учёт точного совпадения, срока жизни кеша и изоляции клиентов."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 43
    outline:
      en:
        - "State the condition for reuse: an identical token prefix under the same model and serving configuration."
        - "Order the prompt so the stable part comes first and volatile content comes last."
        - "Bound cache lifetime and scope entries so one tenant cannot read another's prefix."
      ru:
        - "Сформулировать условие переиспользования: одинаковый префикс токенов при той же модели и конфигурации."
        - "Расположить промпт так, чтобы стабильная часть шла первой, а изменчивая — последней."
        - "Ограничить срок жизни кеша и область записей, чтобы один клиент не читал префикс другого."
    answer:
      en: "Reuse is exact and token-level, not semantic: the cache holds attention state for a prefix, and a request reuses it only while its tokens match from position zero under the same model version, precision and parallel layout. One changed character near the start invalidates everything after it, which dictates prompt layout — system rules, tool definitions and long documents first; the user turn, timestamps, retrieved snippets and per-request identifiers last. Cache memory competes with the KV cache of live requests, and entries expire, so I would measure hit rate, the share of prefill tokens served from cache, time to first token with and without it, and cost per request. Two limits: caching removes prefill work only, so a short-prompt long-answer workload gains almost nothing, and entries must be scoped per tenant, because a shared cache turns time to first token into a side channel: a fast response confirms that someone else sent the same prefix, which lets an attacker test guesses about another tenant's prompt."
      ru: "Переиспользование точное и на уровне токенов, а не семантическое: кеш хранит состояние внимания для префикса, и запрос использует его лишь пока его токены совпадают с нулевой позиции при той же версии модели, точности и схеме параллелизма. Один изменённый символ в начале обесценивает всё, что идёт после, — отсюда порядок промпта: системные правила, описания инструментов и длинные документы вперёд; реплика пользователя, метки времени, найденные фрагменты и идентификаторы запроса в конец. Память кеша конкурирует с KV-кешем живых запросов, а записи истекают, поэтому я бы измерял долю попаданий, долю токенов prefill, отданных из кеша, время до первого токена с ним и без него и стоимость запроса. Два ограничения: кеш убирает только prefill, поэтому короткий промпт с длинным ответом почти ничего не выигрывает, а записи должны быть изолированы по клиентам, иначе общий кеш превращает время до первого токена в побочный канал: быстрый ответ подтверждает, что такой же префикс уже присылал кто-то другой, и это позволяет проверять догадки о чужом промпте."
    reading: ["claude-prompt-caching"]
