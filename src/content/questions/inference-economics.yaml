  - id: "inf-memory-budget"
    tracks: ["engineering"]
    roles: ["inference-engineer"]
    type: "applied_scenario"
    text:
      en: "Estimate a serving memory budget for a 70-billion-parameter model, explicitly choosing precision, context and concurrency assumptions."
      ru: "Оцените память для обслуживания модели с 70 млрд параметров, явно задав точность, контекст и конкурентность."
    tests:
      en: "Whether weights, cache and runtime headroom are all budgeted."
      ru: "Умение учесть веса, кеш и запас памяти во время выполнения."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 9
    outline:
      en:
        - "Weight storage is parameter count times bytes per parameter, before quantisation metadata."
        - "Add architecture-specific KV storage for the chosen concurrent sequences."
        - "Reserve activations, workspace and allocator headroom; state any sharding assumptions."
      ru:
        - "Память весов — число параметров на байты на параметр, без метаданных квантования."
        - "Добавить KV-память конкретной архитектуры для заданных параллельных последовательностей."
        - "Заложить активации, рабочие буферы и запас аллокатора; явно указать шардирование."
    answer:
      en: "I would state a hypothetical architecture before budgeting: 70 billion parameters, 80 layers, eight KV heads and head width 128. BF16 weights occupy about 140 GB, which is about 130 GiB; int8 roughly 70 GB and four-bit roughly 35 GB, excluding quantisation metadata. For BF16 KV, bytes equal 2 times concurrency times layers times tokens times KV heads times head width times two. Choosing 8,192 tokens and four concurrent sequences gives 10 GiB of KV cache. On two hypothetical 80 GiB accelerators, tensor parallelism could split weights and KV heads, leaving roughly 9.8 GiB per device for activations, buffers, fragmentation and headroom. I would verify actual usable memory and peak allocations, then lower concurrency if needed. This is a capacity estimate, not evidence that the configuration meets a latency SLO."
      ru: "Сначала задаю условную архитектуру: 70 млрд параметров, 80 слоёв, восемь KV-голов размерности 128. Веса BF16 занимают около 140 ГБ, то есть примерно 130 ГиБ; int8 — 70 ГБ, четыре бита — 35 ГБ без метаданных квантования. Для KV в BF16 число байтов равно 2 × конкурентность × слои × токены × KV-головы × размер головы × 2. Выбираю контекст 8192 токена и четыре одновременные последовательности: KV-кеш занимает 10 ГиБ. На двух условных ускорителях по 80 ГиБ tensor parallelism может разделить веса и KV-головы, оставив примерно по 9,8 ГиБ на активации, буферы, фрагментацию и запас. Проверяю реально доступную память и пиковые выделения, при необходимости снижаю конкурентность. Это оценка вместимости, а не доказательство выполнения SLO по задержке."
    reading: ["paper-pagedattention"]
  - id: "inf-latency-metrics"
    tracks: ["engineering","leadership"]
    roles: ["inference-engineer"]
    type: "knowledge"
    text:
      en: "Distinguish time to first token, time per output token, inter-token latency and throughput when comparing serving systems."
      ru: "Разграничьте time to first token, time per output token, inter-token latency и throughput при сравнении систем инференса."
    tests:
      en: "Whether user-visible delay is separated from aggregate capacity."
      ru: "Умение отличать задержку для пользователя от совокупной пропускной способности."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "microsoft"
      - source: "outcome-school-company-wise"
        company: "perplexity"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 56
    outline:
      en:
        - "Define TTFT as queueing plus prefill, TPOT and inter-token latency as decode pace, throughput as aggregate capacity."
        - "Explain how larger batches trade each user's decode speed for throughput, and how admitted prefills stall decodes."
        - "Compare at matched load and length distributions: p50 and p99 per latency metric, throughput within the targets."
      ru:
        - "Определить TTFT как очередь плюс prefill, TPOT и inter-token latency как темп декодирования, throughput как ёмкость."
        - "Объяснить, как больший батч обменивает скорость декодирования для пользователя на throughput и как prefill прерывает декодирование."
        - "Сравнивать при одинаковой нагрузке и распределении длин: p50 и p99 по каждой задержке, throughput в пределах целей."
    answer:
      en: "Three of these describe what one user experiences and throughput describes capacity, so under load they pull in opposite directions. Time to first token runs from request arrival to the first token: queueing plus prefill, so it grows with prompt length and queue depth. Time per output token is the average decode pace after that, end-to-end time minus TTFT divided by the remaining tokens. Inter-token latency is that pace as a distribution of individual gaps, exposing stalls an average hides, for example when the scheduler admits a long prefill and every running decode pauses. Throughput is aggregate tokens or requests per second. Larger batches raise throughput and slow each user's decode, so a throughput figure means nothing without the latency it was bought at. I'd compare systems at matched request rate and length distributions, report p50 and p99 for each latency metric, and quote throughput as the highest load still meeting the latency targets. Token counts aren't comparable across tokenisers, and offline batch jobs care only about throughput and cost."
      ru: "Три из этих метрик описывают то, что чувствует один пользователь, а throughput — ёмкость системы, поэтому под нагрузкой они тянут в разные стороны. Time to first token — от поступления запроса до первого токена: ожидание в очереди плюс prefill, так что он растёт с длиной промпта и глубиной очереди. Time per output token — средний темп декодирования после этого: сквозное время минус TTFT, делённое на оставшиеся токены. Inter-token latency — тот же темп как распределение отдельных интервалов, и оно показывает остановки, которые прячет среднее, например когда планировщик берёт длинный prefill и все идущие декодирования замирают. Throughput — суммарные токены или запросы в секунду. Батч побольше поднимает throughput и замедляет декодирование для каждого пользователя, поэтому цифра пропускной способности ничего не значит без задержки, которой она куплена. Я бы сравнивал системы при одинаковой интенсивности запросов и одинаковых распределениях длин, показывал p50 и p99 по каждой метрике задержки, а throughput указывал как максимальную нагрузку, при которой цели по задержке ещё выполняются. Число токенов несопоставимо между токенизаторами, а офлайн-обработке батчами важны только throughput и стоимость."
    reading: ["vllm-docs"]
