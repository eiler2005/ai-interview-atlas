  - id: "pt-lora"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Derive the low-rank weight update used by LoRA and propose an experiment for choosing its rank."
      ru: "Выведите низкоранговое обновление весов LoRA и предложите эксперимент для выбора ранга."
    tests:
      en: "Whether parameter savings are linked to adaptation capacity and validation."
      ru: "Умение связать экономию параметров с выразительностью адаптации и проверкой качества."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 24
    outline:
      en:
        - "Represent the update as ΔW = BA and state both matrix shapes."
        - "Compare trainable parameter counts with a full weight matrix."
        - "Tune rank and target modules on held-out tasks; check regressions and merging constraints."
      ru:
        - "Записать обновление ΔW = BA и размерности обеих матриц."
        - "Сравнить число обучаемых параметров с полной матрицей весов."
        - "Выбрать ранг и модули по отложенным задачам; проверить регрессии и ограничения слияния."
    answer:
      en: "LoRA freezes the original weight matrix and trains a low-rank correction instead: ΔW = BA, where B is d by r, A is r by k, and r is much smaller than both d and k. Instead of d times k trainable parameters you are left with r times the sum of d and k, orders of magnitude fewer at small rank, and at inference the correction can be merged into the base weights with no extra latency. The constraint is that rank sets capacity: too small an r simply can't hold the behaviour change you need. The experiment is straightforward. Fix the data and the set of target modules, vary only r over a grid, and compare quality on held-out tasks while checking for regressions in general capability. Merging the adapter is convenient, but it gives up keeping several adapters on one base and switching them per request."
      ru: "LoRA замораживает исходную матрицу весов и учит вместо неё низкоранговую поправку: ΔW = BA, где B имеет размер d на r, A — размер r на k, а r много меньше и d, и k. Вместо d×k обучаемых параметров остаётся r×(d+k), то есть при малом ранге экономия на порядки, и при инференсе поправку можно сложить с базовыми весами, не платя дополнительной задержкой. Ограничение в том, что ранг задаёт выразительность: слишком малый r просто не вмещает нужное изменение поведения. Эксперимент прямолинейный — зафиксировать данные и набор модулей, менять только r по сетке значений и сравнивать качество на отложенных задачах, одновременно проверяя регрессии общих способностей. Граница: слияние адаптера удобно, но лишает возможности держать на одной базе несколько адаптеров и переключать их по запросу."
    reading: ["paper-lora"]
  - id: "pt-qlora"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "How does QLoRA reduce finetuning memory, and which tensors remain trainable or require higher precision?"
      ru: "Как QLoRA сокращает память дообучения и какие тензоры остаются обучаемыми или требуют большей точности?"
    tests:
      en: "Whether quantised base weights are separated from adapter optimisation."
      ru: "Умение отличать квантованные базовые веса от оптимизации адаптеров."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 25
    outline:
      en:
        - "Keep the base model quantised and frozen while training low-rank adapters."
        - "Explain NF4, double quantisation and paged optimisers as separate memory mechanisms."
        - "Account for dequantisation compute and remaining activation memory."
      ru:
        - "Сохранить базовую модель квантованной и замороженной, обучая низкоранговые адаптеры."
        - "Разделить роли NF4, двойного квантования и paged optimizers."
        - "Учесть вычисления деквантования и сохраняющуюся память активаций."
    answer:
      en: "QLoRA saves memory by keeping base weights quantised to four bits and frozen while only low-rank adapters are trained: gradients and optimiser states exist for those alone, and they were exactly what ate most of the memory in full finetuning. Three mechanisms work together: NF4, a quantisation format designed for normally distributed weights; double quantisation, which compresses the quantisation constants themselves; and paged optimisers, which move optimiser states into host memory during spikes. You pay in compute, because weights are dequantised to the compute precision on every matrix multiply, which can slow training depending on implementation. Activation memory does not go anywhere and grows with sequence length and batch size, so on long context it becomes the binding constraint again. The limit: this is a way to fit finetuning into less memory, not a way to guarantee full-finetuning quality on any task."
      ru: "QLoRA экономит память тем, что базовые веса хранятся квантованными в четырёх битах и остаются замороженными, а обучаются только низкоранговые адаптеры: градиенты и состояния оптимизатора существуют лишь для них, а именно они съедали основную часть памяти при полном дообучении. Три приёма работают вместе: NF4 — формат квантования, рассчитанный на нормально распределённые веса; двойное квантование сжимает сами константы квантования; paged optimizers выносят состояния оптимизатора в память процессора при всплесках. Платим вычислениями: веса деквантуются в вычислительную точность на каждом матричном умножении, что может замедлить обучение в зависимости от реализации. Память активаций при этом никуда не исчезает и растёт с длиной последовательности и батчем, так что на длинном контексте она снова становится ограничением. Граница: это способ уместить дообучение в меньшую память, а не способ гарантированно получить качество полного дообучения на любой задаче."
    reading: ["paper-qlora"]
