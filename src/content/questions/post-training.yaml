  - id: "pt-method-choice"
    tracks: ["engineering","leadership"]
    type: "applied_scenario"
    text:
      en: "Choose between prompt changes, retrieval and finetuning for a failing AI feature; include data freshness, latency and total cost."
      ru: "Выберите между изменением промпта, retrieval и дообучением для неудачной AI-функции; учтите свежесть данных, задержку и полную стоимость."
    tests:
      en: "Whether the intervention matches the observed failure mode."
      ru: "Умение выбрать вмешательство по выявленной причине ошибки."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
      - source: "outcome-school-company-wise"
        company: "microsoft"
      - source: "outcome-school-company-wise"
        company: "databricks"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 26
    outline:
      en:
        - "Classify missing knowledge, poor instructions and unwanted behaviour separately."
        - "Establish a prompt baseline; test retrieval for fresh attributable knowledge."
        - "Use finetuning when representative examples justify it, then compare lifecycle cost and held-out quality."
      ru:
        - "Разделить нехватку знаний, плохие инструкции и нежелательное поведение."
        - "Задать промптовый baseline; проверить retrieval для свежих знаний с источниками."
        - "Дообучать при достаточных характерных примерах и сравнить полную стоимость и отложенное качество."
    answer:
      en: "I find the cause of the failures first, because three different diseases are cured differently: the model lacks knowledge, the task was explained badly, or it has persistent unwanted behaviour and format. Going through a sample of real failures is cheaper than any training. Bad instructions are fixed by the prompt, which is always the baseline everything else is compared against. Missing fresh or private knowledge is covered by retrieval: data updates without retraining, answers get source citations, and you pay in search latency and index quality. I take finetuning once enough representative examples of the wanted behaviour have accumulated, and count the full cost: labelling, training, version maintenance, and repeating all of it when the base model changes. I decide on a held-out set, not on impressions. The limit: finetuning barely helps with facts going stale, and retrieval will not fix behaviour if the model ignores what it found."
      ru: "Сначала нахожу причину отказов, потому что три разные болезни лечатся по-разному: модели не хватает знаний, ей плохо объяснили задачу или у неё устойчиво нежелательное поведение и формат. Разобрать выборку реальных провалов дешевле любого обучения. Плохие инструкции лечит промпт, и он же всегда даёт baseline, с которым сравнивается остальное. Нехватку свежих или закрытых знаний закрывает retrieval: данные обновляются без переобучения, ответ получает ссылки на источники, платим задержкой поиска и качеством индекса. Дообучение беру, когда набралось достаточно характерных примеров нужного поведения, и считаю полную стоимость: разметка, обучение, обслуживание версий и повторение всего этого при смене базовой модели. Решение принимаю по отложенной выборке, а не по впечатлениям. Граница: дообучение почти не спасает от устаревающих фактов, а retrieval не исправит поведение, если модель игнорирует найденное."
    reading: ["paper-rag","paper-lora"]
