theme: "post-training"
questions:
  - id: "pt-rlhf"
    tracks: ["engineering"]
    roles: ["research-engineer"]
    type: "knowledge"
    text:
      en: "Walk through a preference-based RLHF pipeline and explain the roles of the reward model and reference-policy penalty."
      ru: "Разберите RLHF на предпочтениях и объясните роль reward model и штрафа за отклонение от опорной политики."
    tests:
      en: "Whether data collection, reward fitting and policy optimisation are distinguished."
      ru: "Умение различать сбор данных, обучение награды и оптимизацию политики."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 22
    outline:
      en:
        - "Separate demonstrations, preference pairs and policy rollouts."
        - "Explain reward-model training and policy optimisation with a reference constraint."
        - "Evaluate held-out human preferences and reward overoptimisation."
      ru:
        - "Разделить демонстрации, пары предпочтений и траектории политики."
        - "Объяснить обучение модели награды и оптимизацию политики с ограничением относительно опорной модели."
        - "Проверить отложенные человеческие предпочтения и переоптимизацию награды."
    answer:
      en: "RLHF splits into three stages that differ by data. First demonstrations: examples of desired answers, on which the base model is finetuned with supervised learning. Then preference pairs: a person sees several answers to one prompt and ranks them, and on those comparisons you train a reward model, a separate model predicting which answer a person picks. In the third stage the policy is optimised against that reward on its own rollouts, with a penalty for diverging from the reference model added to the objective, usually a KL divergence; without it the policy drifts to where reward is high and the text has degraded. That is the trade-off: push harder on reward and you reach its overoptimisation sooner. Check on held-out human preferences, not on the reward itself, and watch how divergence from the reference tracks the real gain. The reward model inherits annotator bias, and optimisation amplifies it."
      ru: "RLHF раскладывается на три этапа, различающихся данными. Сначала демонстрации: примеры желаемых ответов, на которых базовую модель дообучают обычным способом с учителем. Затем пары предпочтений: человеку показывают несколько ответов на один промпт и просят их упорядочить, и на этих сравнениях учится reward model — отдельная модель, предсказывающая, какой ответ человек выберет. На третьем этапе политика оптимизируется по этой награде уже на собственных траекториях, а к цели добавляется штраф за расхождение с опорной моделью, обычно KL-дивергенция: без него политика уходит туда, где награда высока, а текст деградировал. В этом и компромисс: сильнее давим на награду — быстрее ловим её переоптимизацию. Проверять нужно на отложенных человеческих предпочтениях, а не по самой награде, и смотреть, как расхождение с опорной моделью соотносится с реальным выигрышем. Граница: reward model наследует смещения разметчиков, а оптимизация их усиливает."
    reading: ["paper-instructgpt"]
  - id: "pt-dpo"
    tracks: ["engineering"]
    roles: ["research-engineer"]
    type: "knowledge"
    text:
      en: "Compare DPO with PPO-based RLHF, including the assumptions behind offline preference learning and reasons to collect fresh rollouts."
      ru: "Сравните DPO с RLHF на PPO, включая предпосылки обучения по офлайн-предпочтениям и причины собирать новые траектории."
    tests:
      en: "Whether a simpler objective is distinguished from universally better alignment."
      ru: "Умение не путать простоту функции потерь с универсальным превосходством."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
      - source: "habr-llm-engineer-interviews-2026"
        role: "ai-engineer"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 23
    outline:
      en:
        - "Describe the preference objective using policy and reference log-probabilities."
        - "Explain how it avoids a separately trained reward model in the basic formulation."
        - "Discuss preference coverage and distribution shift rather than declaring online RL obsolete."
      ru:
        - "Описать функцию предпочтений через логарифмы вероятностей политики и опорной модели."
        - "Объяснить отсутствие отдельно обучаемой reward model в базовом варианте."
        - "Обсудить покрытие предпочтений и сдвиг распределения без тезиса об устаревании online RL."
    answer:
      en: "DPO starts from the same KL-regularised objective as PPO-based RLHF but uses its closed-form optimum: the reward becomes implicit, β times the log ratio of policy to reference probability, plus a term depending only on the prompt. In the Bradley–Terry preference model that term cancels, so the loss is written directly on the policy: a logistic loss on β times the gap between chosen and rejected log ratios. β plays the KL penalty's role, and there's no reward model, value network or sampling loop. The price is an assumption: fixed pairs must cover what the policy will generate, since the loss shapes only responses in pairs and can lower the likelihood of both answers or drift toward length. PPO scores fresh rollouts from the current policy, catching errors where they occur, at the cost of a reward model that can be exploited. I'd compare held-out win rate against the reference, KL and length drift. A simpler loss isn't better alignment: when the change needed is large or the reward is verifiable, fresh rollouts earn their cost."
      ru: "DPO исходит из той же цели с KL-регуляризацией, что и RLHF на PPO, но берёт её решение в замкнутой форме: награда становится неявной — β, умноженное на логарифм отношения вероятностей политики и опорной модели, плюс слагаемое, зависящее только от промпта. В модели предпочтений Брэдли–Терри это слагаемое сокращается, и функция потерь записывается прямо на политике: логистическая потеря от β, умноженного на разность логарифмических отношений для выбранного и отвергнутого ответов. β играет роль штрафа KL, а reward model, value-сети и цикла генерации нет. Цена — предпосылка: фиксированные пары должны покрывать то, что будет генерировать политика, ведь функция потерь формирует только ответы из пар и может снижать вероятность обоих ответов или сдвигать модель к длинным ответам. PPO оценивает свежие траектории текущей политики и ловит ошибки там, где они реально возникают, ценой reward model, которую можно обмануть. Сравнивал бы долю побед над опорной моделью на отложенных промптах, KL и дрейф длины. Простая функция потерь не означает лучшего выравнивания: если нужно крупное изменение поведения или награда проверяема, свежие траектории окупают свою цену."
    reading: ["paper-dpo"]
  - id: "pt-grpo"
    tracks: ["engineering"]
    roles: ["research-engineer"]
    type: "knowledge"
    text:
      en: "Explain group-relative policy optimisation and the trade-offs of estimating advantages without a learned value model."
      ru: "Объясните GRPO и компромиссы оценки advantage без обученной value model."
    tests:
      en: "Whether relative rewards and variance are connected to sample groups."
      ru: "Понимание связи относительных наград и дисперсии с группами ответов."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 63
    outline:
      en:
        - "Sample several completions per prompt and estimate advantages relative to their group rewards."
        - "Explain the avoided value-model memory and the remaining rollout and reward-computation costs."
        - "Inspect groups with little reward variation; compare held-out task success and training stability."
      ru:
        - "Получить несколько ответов на промпт и оценить advantage относительно наград внутри группы."
        - "Объяснить экономию памяти value model и оставшиеся затраты на генерацию и вычисление наград."
        - "Проверить группы с малым разбросом наград; сравнить успех на отложенных задачах и устойчивость обучения."
    answer:
      en: "GRPO replaces PPO's learned critic with the group itself as the baseline. For each prompt it samples a group of completions from the current policy, scores them, and sets each one's advantage to its reward minus the group mean, divided by the group's standard deviation; with outcome rewards that value applies to every token. The update is PPO's clipped objective, with KL to the reference model added to the loss rather than folded into the reward. Dropping the value model, usually comparable in size to the policy, saves its memory and training, but rollouts remain the main cost: several samples per prompt, reward computation, reference forward passes. The baseline is noisy for small groups, and when every completion earns the same reward all advantages are zero, so that prompt gives no gradient beyond the KL term; dividing by a tiny spread also amplifies near-unanimous groups. I'd log the share of zero-variance groups, filter prompts by difficulty, and compare held-out success, KL, length and reward stability. A learned critic earns its cost when credit must be assigned across long multi-step trajectories."
      ru: "GRPO заменяет обучаемого критика из PPO самой группой ответов в роли baseline. На каждый промпт текущая политика генерирует группу ответов, их оценивают, и advantage каждого — это разность его награды и среднего по группе, делённая на стандартное отклонение группы; при награде за результат это значение получает каждый токен ответа. Обновление — clipped-цель PPO, а KL к опорной модели добавляется прямо в функцию потерь, а не вшивается в награду. Отказ от value model, обычно сопоставимой по размеру с политикой, экономит её память и обучение, но главная статья расходов остаётся: несколько генераций на промпт, вычисление наград, проходы опорной модели. Baseline шумный при маленьких группах, а если все ответы получили одинаковую награду, все advantage равны нулю и промпт не даёт градиента, кроме слагаемого KL; деление на крошечный разброс к тому же раздувает почти единогласные группы. Я бы логировал долю групп с нулевой дисперсией, фильтровал промпты по сложности и сравнивал успех на отложенных задачах, KL, длину ответов и устойчивость награды. Обучаемый критик окупается, когда вклад отдельных шагов нужно оценивать на длинных многошаговых траекториях."
    reading: ["paper-deepseekmath-grpo"]
  - id: "pt-lora"
    tracks: ["engineering"]
    roles: ["research-engineer"]
    type: "knowledge"
    text:
      en: "Derive the low-rank weight update used by LoRA and propose an experiment for choosing its rank."
      ru: "Выведите низкоранговое обновление весов LoRA и предложите эксперимент для выбора ранга."
    tests:
      en: "Whether parameter savings are linked to adaptation capacity and validation."
      ru: "Умение связать экономию параметров с выразительностью адаптации и проверкой качества."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 24
    outline:
      en:
        - "Represent the update as ΔW = BA and state both matrix shapes."
        - "Compare trainable parameter counts with a full weight matrix."
        - "Tune rank and target modules on held-out tasks; check regressions and merging constraints."
      ru:
        - "Записать обновление ΔW = BA и размерности обеих матриц."
        - "Сравнить число обучаемых параметров с полной матрицей весов."
        - "Выбрать ранг и модули по отложенным задачам; проверить регрессии и ограничения слияния."
    answer:
      en: "LoRA freezes the original weight matrix and trains a low-rank correction instead: ΔW = BA, where B is d by r, A is r by k, and r is much smaller than both d and k. Instead of d times k trainable parameters you are left with r times the sum of d and k, orders of magnitude fewer at small rank, and at inference the correction can be merged into the base weights with no extra latency. The constraint is that rank sets capacity: too small an r simply can't hold the behaviour change you need. The experiment is straightforward. Fix the data and the set of target modules, vary only r over a grid, and compare quality on held-out tasks while checking for regressions in general capability. Merging the adapter is convenient, but it gives up keeping several adapters on one base and switching them per request."
      ru: "LoRA замораживает исходную матрицу весов и учит вместо неё низкоранговую поправку: ΔW = BA, где B имеет размер d на r, A — размер r на k, а r много меньше и d, и k. Вместо d×k обучаемых параметров остаётся r×(d+k), то есть при малом ранге экономия на порядки, и при инференсе поправку можно сложить с базовыми весами, не платя дополнительной задержкой. Ограничение в том, что ранг задаёт выразительность: слишком малый r просто не вмещает нужное изменение поведения. Эксперимент прямолинейный — зафиксировать данные и набор модулей, менять только r по сетке значений и сравнивать качество на отложенных задачах, одновременно проверяя регрессии общих способностей. Граница: слияние адаптера удобно, но лишает возможности держать на одной базе несколько адаптеров и переключать их по запросу."
    reading: ["paper-lora"]
  - id: "pt-qlora"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "How does QLoRA reduce finetuning memory, and which tensors remain trainable or require higher precision?"
      ru: "Как QLoRA сокращает память дообучения и какие тензоры остаются обучаемыми или требуют большей точности?"
    tests:
      en: "Whether quantised base weights are separated from adapter optimisation."
      ru: "Умение отличать квантованные базовые веса от оптимизации адаптеров."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 25
    outline:
      en:
        - "Keep the base model quantised and frozen while training low-rank adapters."
        - "Explain NF4, double quantisation and paged optimisers as separate memory mechanisms."
        - "Account for dequantisation compute and remaining activation memory."
      ru:
        - "Сохранить базовую модель квантованной и замороженной, обучая низкоранговые адаптеры."
        - "Разделить роли NF4, двойного квантования и paged optimizers."
        - "Учесть вычисления деквантования и сохраняющуюся память активаций."
    answer:
      en: "QLoRA saves memory by keeping base weights quantised to four bits and frozen while only low-rank adapters, kept in 16-bit, are trained: gradients flow back through the dequantised base weights, but weight gradients and optimiser states exist for the adapters alone, and those were exactly what ate most of the memory in full finetuning. Three mechanisms work together: NF4, a quantisation format designed for normally distributed weights; double quantisation, which compresses the quantisation constants themselves; and paged optimisers, which move optimiser states into host memory during spikes. You pay in compute, because weights are dequantised to the compute precision on every matrix multiply, which can slow training depending on implementation. Activation memory does not go anywhere and grows with sequence length and batch size, so on long context it becomes the binding constraint again. The limit: this is a way to fit finetuning into less memory, not a way to guarantee full-finetuning quality on any task."
      ru: "QLoRA экономит память тем, что базовые веса хранятся квантованными в четырёх битах и остаются замороженными, а обучаются только низкоранговые адаптеры в 16 битах: градиент проходит назад через деквантованные базовые веса, но градиенты по весам и состояния оптимизатора существуют лишь для адаптеров, а именно они съедали основную часть памяти при полном дообучении. Три приёма работают вместе: NF4 — формат квантования, рассчитанный на нормально распределённые веса; двойное квантование сжимает сами константы квантования; paged optimizers выносят состояния оптимизатора в память процессора при всплесках. Платим вычислениями: веса деквантуются в вычислительную точность на каждом матричном умножении, что может замедлить обучение в зависимости от реализации. Память активаций при этом никуда не исчезает и растёт с длиной последовательности и батчем, так что на длинном контексте она снова становится ограничением. Граница: это способ уместить дообучение в меньшую память, а не способ гарантированно получить качество полного дообучения на любой задаче."
    reading: ["paper-qlora"]
  - id: "pt-adaptation-method"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Compare low-rank adapters, prefix tuning, soft prompt tuning and full finetuning for one task."
      ru: "Сравните низкоранговые адаптеры, prefix tuning, soft prompt tuning и полное дообучение для одной задачи."
    tests:
      en: "Whether data, capacity and deployment constraints guide adaptation."
      ru: "Умение выбирать метод по данным, выразительности и ограничениям развёртывания."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Place each method: LoRA adds low-rank weight updates, prefix tuning trains per-layer key-value prefixes, prompt tuning trains input embeddings."
        - "Weigh capacity against cost: full finetuning stores optimiser states and a model per task; adapters merge or swap per request."
        - "Compare all at matched data on held-out task metrics and general regressions, including serving latency and memory."
      ru:
        - "Расставить методы: LoRA добавляет низкоранговые обновления весов, prefix tuning обучает префиксы key и value в каждом слое, prompt tuning — входные эмбеддинги."
        - "Взвесить выразительность и цену: полное дообучение хранит состояния оптимизатора и модель на каждую задачу, а адаптеры сливаются с весами или подменяются на запрос."
        - "Сравнить все варианты на одинаковых данных по отложенным метрикам задачи и регрессиям общих способностей, включая задержку и память при обслуживании."
    reading: ["paper-lora","paper-prefix-tuning","paper-prompt-tuning"]
  - id: "pt-forgetting"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "After domain finetuning, general capabilities regress. How would you measure and reduce catastrophic forgetting?"
      ru: "После доменного дообучения просели общие способности модели. Как измерить и уменьшить catastrophic forgetting?"
    tests:
      en: "Whether task gains are checked against preserved capabilities."
      ru: "Умение проверять сохранение способностей наряду с успехом на целевой задаче."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Fix a retention suite before training and score base and finetuned checkpoints on it alongside the target task."
        - "Reduce drift with replayed general data, a lower learning rate or fewer steps, adapters, a KL penalty or weight interpolation."
        - "Plot task gain against retention across checkpoints and mixing ratios, and pick a point on that frontier."
      ru:
        - "До обучения зафиксировать набор проверки сохранности и оценить на нём базовый и дообученный чекпоинты вместе с целевой задачей."
        - "Снижать дрейф подмешиванием общих данных, меньшим learning rate или числом шагов, адаптерами, KL-штрафом или интерполяцией весов."
        - "Построить зависимость прироста на задаче от сохранности по чекпоинтам и долям смешивания и выбрать точку на этой границе."
    reading: ["paper-instructgpt","paper-lora-forgets-less"]
  - id: "pt-method-choice"
    tracks: ["engineering","leadership"]
    roles: ["research-engineer"]
    type: "applied_scenario"
    text:
      en: "Choose between prompt changes, retrieval and finetuning for a failing AI feature; include data freshness, latency and total cost."
      ru: "Выберите между изменением промпта, retrieval и дообучением для неудачной AI-функции; учтите свежесть данных, задержку и полную стоимость."
    tests:
      en: "Whether the intervention matches the observed failure mode."
      ru: "Умение выбрать вмешательство по выявленной причине ошибки."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
      - source: "outcome-school-company-wise"
        company: "microsoft"
      - source: "outcome-school-company-wise"
        company: "databricks"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 26
    outline:
      en:
        - "Classify missing knowledge, poor instructions and unwanted behaviour separately."
        - "Establish a prompt baseline; test retrieval for fresh attributable knowledge."
        - "Use finetuning when representative examples justify it, then compare lifecycle cost and held-out quality."
      ru:
        - "Разделить нехватку знаний, плохие инструкции и нежелательное поведение."
        - "Задать промптовый baseline; проверить retrieval для свежих знаний с источниками."
        - "Дообучать при достаточных характерных примерах и сравнить полную стоимость и отложенное качество."
    answer:
      en: "I'd let a diagnostic pick the intervention: rerun a sample of real failures with the right document pasted into the prompt. If they now succeed, the model lacked knowledge, and retrieval fits: facts stay fresh without retraining and answers can cite sources, paid for with a search hop in latency and an index to keep current. If they still fail with the evidence in front of the model, it's instructions or behaviour, so I tighten the prompt with explicit rules and examples; that's cheap and becomes the baseline everything else must beat. Finetuning is for what persists after that, a format, tone or decision pattern the prompt can't hold reliably, once I have enough representative examples to train and still hold some out. Its cost is the lifecycle: labelling, training, evaluation and redoing it when the base model changes, though shorter prompts can cut per-request tokens and latency. I'd compare the options on one held-out set by cost per successful task. Finetuning won't keep facts fresh, and retrieval can't fix a model that ignores what it found."
      ru: "Вмешательство я бы выбирал по диагностике: прогоняю выборку реальных провалов заново, вставив в промпт нужный документ. Если теперь получается, модели не хватало знаний, и подходит retrieval: факты остаются свежими без переобучения, ответы могут ссылаться на источники, а платим задержкой на лишнее обращение к поиску и индексом, который надо поддерживать. Если с нужными сведениями перед глазами модель всё равно ошибается, дело в инструкциях или поведении, и я ужесточаю промпт явными правилами и примерами; это дёшево и становится baseline, который остальное обязано обойти. Дообучение — для того, что остаётся после этого: формат, тон или схема решений, которые промпт не удерживает надёжно, и только когда набралось достаточно характерных примеров, чтобы обучить и ещё оставить часть на отложенную проверку. Его цена — весь жизненный цикл: разметка, обучение, оценка и повторение всего этого при смене базовой модели, хотя более короткие промпты могут снизить токены и задержку на запрос. Сравнивал бы варианты на одной отложенной выборке по стоимости успешной задачи. Дообучение не сделает факты свежими, а retrieval не исправит модель, которая игнорирует найденное."
    reading: ["paper-rag","paper-lora"]
  - id: "pt-training-memory"
    tracks: ["engineering"]
    type: "applied_scenario"
    text:
      en: "Budget memory for full bf16 finetuning of a 7B model with Adam, then recalculate for LoRA and explain your optimiser assumptions."
      ru: "Рассчитайте память полного bf16-дообучения модели 7B с Adam, затем для LoRA; явно задайте предположения об оптимизаторе."
    tests:
      en: "Whether gradients, optimiser state, master weights and activations are all considered."
      ru: "Учёт градиентов, состояния оптимизатора, мастер-весов и активаций."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 61
    outline:
      en:
        - "State the precision and bytes for weights, gradients, Adam moments and any master-weight copy."
        - "For LoRA, separate frozen base weights from trainable adapters and their optimiser state."
        - "Budget activations, temporary buffers and headroom separately; validate peak memory on a representative batch."
      ru:
        - "Задать точность и объём весов, градиентов, моментов Adam и мастер-копии весов, если она есть."
        - "Для LoRA разделить замороженные базовые веса, обучаемые адаптеры и состояние их оптимизатора."
        - "Отдельно учесть активации, временные буферы и запас; измерить пиковую память на характерном батче."
    answer:
      en: "I'd state the precision assumption first, because the total depends on it. With bf16 weights and gradients, an fp32 master copy and Adam's two fp32 moments, it's 2 plus 2 plus 12, so 16 bytes per parameter: about 112 GB for 7 billion parameters before any activation, the accounting the ZeRO paper uses. Lower-precision moments or master weights change that, so I'd name my choice. LoRA removes most of it: the frozen base needs only 2 bytes per parameter, about 14 GB, with no gradients or optimiser state, while adapters of tens of millions of parameters at modest rank carry the full 16 bytes and stay under a gigabyte. What LoRA doesn't remove is activations: backpropagation still runs through every frozen layer to reach the adapters, and activation memory grows with batch, sequence length and depth, so at long contexts it can exceed the weights. I'd budget activations separately, add checkpointing if needed, keep allocator headroom, and confirm peak memory on a representative batch at the longest sequence."
      ru: "Сначала я бы назвал предположение о точности, потому что от него зависит итог. При весах и градиентах в bf16, мастер-копии в fp32 и двух моментах Adam в fp32 получается 2 плюс 2 плюс 12, то есть 16 байт на параметр: около 112 ГБ на 7 млрд параметров ещё без учёта активаций — именно так считает статья о ZeRO. Моменты или мастер-веса в меньшей точности меняют цифру, поэтому свой выбор надо назвать. LoRA убирает большую часть: замороженной базе нужны только её 2 байта на параметр, около 14 ГБ, без градиентов и состояния оптимизатора, а адаптеры на десятки миллионов параметров при умеренном ранге несут полные 16 байт и укладываются меньше чем в гигабайт. Чего LoRA не убирает, так это активаций: обратное распространение всё равно проходит через все замороженные слои, чтобы добраться до адаптеров, а память активаций растёт с батчем, длиной последовательности и глубиной, так что на длинном контексте может превысить веса. Активации я бы считал отдельно, при необходимости включил бы checkpointing, оставил запас аллокатору и подтвердил пиковую память на характерном батче с максимальной длиной."
    reading: ["paper-zero","paper-lora"]
  - id: "pt-verifiable-reward"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "When is a programmatically verifiable reward preferable to a learned reward model, and where can the verifier still be exploited?"
      ru: "Когда программно проверяемая награда предпочтительнее обученной модели награды и как можно обмануть саму проверку?"
    tests:
      en: "Whether verification is treated as a specification with blind spots."
      ru: "Понимание ограничений проверки как спецификации."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Prefer verifiers where correctness is cheap and objective, like exact answers or tests, avoiding reward-model overoptimisation."
        - "Name the blind spots: weak tests, special-cased outputs, parser loopholes, edited graders and right answers from wrong reasoning."
        - "Audit high-reward samples and track the gap between training reward and hidden tests or independent review."
      ru:
        - "Предпочитать программную проверку там, где правильность дешева и объективна — точный ответ или тесты, — избегая переоптимизации модели награды."
        - "Назвать слепые зоны: слабые тесты, подгонку под конкретные случаи, лазейки парсера, правку проверяющего кода и верный ответ из неверного рассуждения."
        - "Вручную проверять выборку траекторий с высокой наградой и следить за разрывом между наградой и скрытыми тестами или независимой проверкой."
    reading: ["paper-deepseek-r1","paper-reward-overoptimization"]
  - id: "pt-reward-hacking"
    tracks: ["engineering"]
    roles: ["research-engineer"]
    type: "applied_scenario"
    text:
      en: "Policy reward keeps rising while humans prefer its outputs less. How would you diagnose and limit reward hacking?"
      ru: "Награда политики растёт, а людям ответы нравятся всё меньше. Как выявить и ограничить reward hacking?"
    tests:
      en: "Whether optimisation of the proxy is distinguished from improvement in the real goal."
      ru: "Умение отличать оптимизацию прокси от достижения реальной цели."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 64
    outline:
      en:
        - "Compare proxy reward with blinded held-out human preferences and inspect newly rewarded behaviours."
        - "Test earlier checkpoints and reduced optimisation strength; improve preference coverage before retraining."
        - "Treat KL control and early stopping as mitigations, not guarantees; distinguish synthetic gold-model evidence from human evaluation."
      ru:
        - "Сопоставить прокси-награду со слепой оценкой людьми на отложенных данных и изучить новые поощряемые признаки."
        - "Проверить ранние checkpoint и меньшую интенсивность оптимизации; расширить покрытие предпочтений до повторного обучения."
        - "Считать контроль KL и раннюю остановку мерами снижения риска, не гарантией; отличать синтетическую эталонную модель от оценки людьми."
    answer:
      en: "Rising reward with falling human preference is the signature of overoptimisation: the policy has moved where the reward model's errors outweigh its signal. I'd confirm it with blinded, held-out human comparisons across checkpoints, plotted against proxy reward and KL from the reference policy, to find where human preference peaked. Then I'd look at what the reward newly pays for, such as length, confident tone, formatting or agreeing with the user, and test those features directly on the reward model. The quick limit is rolling back to the peak checkpoint and rerunning with a stronger KL coefficient or fewer steps. The durable fix is coverage: fresh preferences on the current policy's outputs, where the reward model never trained, then retraining it. Gao, Schulman and Hilton saw gold reward rise then fall with distance from the initial policy, but their gold was a synthetic reward model, not people, so the shape is a hypothesis to check. KL control and early stopping limit drift; they don't make the proxy right."
      ru: "Растущая награда при падающем предпочтении людей — характерный признак переоптимизации: политика ушла туда, где ошибки reward model перевешивают её сигнал. Я бы подтвердил это слепыми сравнениями людьми на отложенных данных по нескольким checkpoint, сопоставив их с прокси-наградой и с KL от опорной политики, чтобы найти, где предпочтение людей было на пике. Затем посмотрел бы, за что награда стала платить: длина, уверенный тон, оформление, согласие с пользователем, — и проверил бы эти признаки напрямую на reward model. Быстрая мера — откатиться к пиковому checkpoint и перезапустить с более сильным KL-коэффициентом или меньшим числом шагов. Надёжная — покрытие: свежие предпочтения на ответах текущей политики, на которых reward model никогда не обучалась, и её повторное обучение. Gao, Schulman и Hilton наблюдали, как эталонная награда сначала растёт, а потом падает с удалением от исходной политики, но эталоном у них была синтетическая reward model, а не люди, поэтому форма кривой — гипотеза для проверки. Контроль KL и ранняя остановка ограничивают дрейф, но не делают прокси правильным."
    reading: ["paper-reward-overoptimization"]
  - id: "pt-distillation"
    tracks: ["engineering"]
    type: "system_design"
    text:
      en: "Design a teacher-to-student distillation process and explain how you would detect capabilities the smaller model fails to retain."
      ru: "Спроектируйте дистилляцию учителя в малую модель и проверку способностей, которые ученик не сохранил."
    tests:
      en: "Whether data coverage and independent evaluation constrain teacher imitation."
      ru: "Учёт покрытия данных и независимой оценки при подражании учителю."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Build prompts covering the capability distribution, including rare languages, long context and refusals, not only easy traffic."
        - "Choose teacher outputs or token-level logit KL, and add on-policy student samples so it learns from its own mistakes."
        - "Evaluate by capability slice against independent labels, not teacher agreement, and flag slices where the student's gap widens."
      ru:
        - "Собрать промпты, покрывающие распределение способностей, включая редкие языки, длинный контекст и отказы, а не только лёгкий трафик."
        - "Выбрать дистилляцию по ответам учителя или по KL логитов на токен и добавить on-policy выборки ученика, чтобы он учился на своих ошибках."
        - "Оценивать по срезам способностей на независимой разметке, а не по согласию с учителем, и отмечать срезы, где отставание ученика растёт."
    reading: ["paper-deepseek-r1","paper-distillation","paper-on-policy-distillation"]
  - id: "pt-constitutional"
    tracks: ["engineering","leadership"]
    type: "knowledge"
    text:
      en: "Explain how Constitutional AI uses principles, self-revision and AI-generated preferences, and identify what human judgement it still depends on."
      ru: "Объясните использование принципов, самокоррекции и AI-предпочтений в Constitutional AI и сохранённую зависимость от человеческих решений."
    tests:
      en: "Whether reduced labelling effort is distinguished from removing human value choices."
      ru: "Умение отличать сокращение разметки от устранения человеческого выбора ценностей."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 65
    outline:
      en:
        - "Separate supervised self-critique and revision from reinforcement learning on AI-generated preferences."
        - "Explain how the selected principles shape critiques, comparisons and the learned preference model."
        - "Identify human choices in the constitution and evaluation; reduced harmfulness labelling does not remove value judgements."
      ru:
        - "Разделить обучение на самокритике и исправлениях и RL по предпочтениям, сгенерированным AI."
        - "Объяснить влияние выбранных принципов на критику, сравнения и обученную модель предпочтений."
        - "Указать человеческий выбор принципов и оценки; сокращение разметки вредности не устраняет ценностные решения."
    answer:
      en: "Constitutional AI replaces human harmlessness labels with model judgements guided by written principles, in two stages. In the supervised stage a helpful model answers harmful prompts, critiques its answer against a principle drawn from the constitution and revises it, and a model is finetuned on the revisions. In the RL stage the model produces answer pairs, a feedback model picks the better one under a sampled principle, and those AI preferences train the preference model used as reward: the RLHF pipeline with machine labels for harmlessness. So the principles shape every critique, every comparison and what the preference model learns. What stays human is substantial: people wrote and selected the principles, helpfulness preferences in the original work were still human labels, the starting model was trained with human feedback, and evaluation was human comparison. I'd measure agreement between AI and human labels on held-out pairs and track over-refusal on benign prompts. It cuts labelling effort; it moves value choices into a document rather than removing them."
      ru: "Constitutional AI заменяет человеческую разметку вредности суждениями модели по записанным принципам, в два этапа. На этапе обучения с учителем полезная модель отвечает на вредные промпты, критикует свой ответ по принципу, взятому из конституции, и исправляет его, а затем модель дообучают на исправленных ответах. На этапе RL модель выдаёт пары ответов, модель обратной связи выбирает лучший по случайно взятому принципу, и на этих AI-предпочтениях учится модель предпочтений, которая служит наградой: это конвейер RLHF, где метки вредности ставит машина. Поэтому принципы определяют каждую критику, каждое сравнение и то, чему учится модель предпочтений. Человеческого остаётся много: люди написали и отобрали принципы, предпочтения по полезности в исходной работе по-прежнему размечали люди, стартовая модель обучена на человеческой обратной связи, а оценка — это сравнения людьми. Я бы измерял согласие AI-меток с человеческими на отложенных парах и следил за лишними отказами на безобидных запросах. Метод сокращает разметку, но не устраняет ценностный выбор, а переносит его в документ."
    reading: ["paper-constitutional-ai"]
  - id: "pt-loss-divergence"
    tracks: ["engineering"]
    roles: ["research-engineer"]
    type: "applied_scenario"
    text:
      en: "A long pretraining run suddenly diverges. How do you investigate data, numerics and optimiser state before resuming from a checkpoint?"
      ru: "В длинном запуске предобучения внезапно расходится loss. Как проверить данные, численную устойчивость и оптимизатор перед продолжением с checkpoint?"
    tests:
      en: "Whether recovery is based on a reproducible diagnosis."
      ru: "Умение восстанавливать обучение на основе воспроизводимой диагностики."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "google"
    added: "2026-09-26"
    outline:
      en:
        - "Locate the first anomalous step in gradient norm, attention-logit and activation magnitudes, and update-to-weight ratios."
        - "Replay from the prior checkpoint with identical data order; a reproduced spike implicates data or numerics, otherwise suspect hardware."
        - "Apply one targeted fix, such as skipping batches, a lower learning rate, tighter clipping or z-loss, and compare the replayed trajectory."
      ru:
        - "Найти первый аномальный шаг по норме градиента, величинам активаций и логитов внимания и отношению обновления к весам."
        - "Повторить участок с предыдущего checkpoint с тем же порядком данных: воспроизведённый скачок указывает на данные или численную устойчивость, иначе подозревать оборудование."
        - "Вносить одно целевое исправление — пропуск батчей, меньший learning rate, более жёсткий clipping или z-loss — и сравнить повторённую траекторию."
    reading: ["paper-palm","paper-training-instabilities"]
  - id: "pt-distributed-training"
    tracks: ["engineering"]
    roles: ["research-engineer"]
    type: "system_design"
    text:
      en: "Design training for a model that cannot fit on one accelerator; explain how you partition state and keep communication affordable."
      ru: "Спроектируйте обучение модели, не помещающейся на одном ускорителе: как разделить состояние и ограничить стоимость коммуникаций?"
    tests:
      en: "Whether model state, activations and network topology determine the parallel plan."
      ru: "Умение выбирать параллелизм по состоянию модели, активациям и топологии сети."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "google"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 62
    outline:
      en:
        - "Separate parameters, gradients, optimiser state and activations before choosing a partitioning plan."
        - "Explain ZeRO state sharding and its communication trade-offs; distinguish it from splitting layer computation."
        - "Measure peak memory, communication and throughput on the target topology before scaling the run."
      ru:
        - "Разделить параметры, градиенты, состояние оптимизатора и активации до выбора схемы разбиения."
        - "Объяснить шардинг состояния ZeRO и затраты на обмен; отличать его от разделения вычислений слоя."
        - "Измерить пиковую память, обмен и пропускную способность на целевой топологии до масштабирования."
    answer:
      en: "I'd start by sizing what doesn't fit, because each kind of state has a different fix. With mixed-precision Adam, parameters, gradients and optimiser state cost about 16 bytes per parameter; activations scale separately with micro-batch, sequence length and depth. ZeRO shards model state across data-parallel ranks: stage one splits optimiser state and stage two adds gradients, both at roughly ordinary data-parallel communication, since the all-reduce becomes a reduce-scatter plus an all-gather; stage three also shards parameters and gathers each layer just in time, at about one and a half times the traffic. That divides state, not computation. If one layer's working set still doesn't fit, I need tensor parallelism, which splits matrix multiplications and communicates inside every layer, so it belongs on fast intra-node links; across nodes, pipeline parallelism splits layers into stages that exchange only activations, paying in idle bubbles. Activations get checkpointing. Before scaling I'd measure peak memory per device, the share of step time spent communicating, and per-device throughput from one node to the target, since on slow interconnect stage three's gathers can dominate."
      ru: "Я бы начал с того, что именно не помещается, потому что у каждого вида состояния своё лечение. При Adam в смешанной точности параметры, градиенты и состояние оптимизатора стоят около 16 байт на параметр, а активации растут отдельно — с микробатчем, длиной последовательности и глубиной. ZeRO шардирует состояние модели между data-parallel рангами: первая стадия делит состояние оптимизатора, вторая добавляет градиенты, и обе обходятся примерно тем же обменом, что обычный data parallelism, потому что all-reduce превращается в reduce-scatter плюс all-gather; третья стадия шардирует и параметры, собирая каждый слой непосредственно перед использованием, и трафик вырастает примерно в полтора раза. Это деление состояния, а не вычислений. Если рабочий набор одного слоя всё равно не влезает, нужен tensor parallelism, который режет матричные умножения и обменивается данными внутри каждого слоя, поэтому его место на быстрых связях внутри узла; между узлами pipeline parallelism делит слои на стадии, которые обмениваются только активациями, и платит простоями. Для активаций — checkpointing. До масштабирования я бы измерил пиковую память на устройство, долю времени шага на обмен и пропускную способность на устройство от одного узла до целевого размера: на медленной сети сборки слоёв третьей стадии могут занять большую часть шага."
    reading: ["paper-zero"]
