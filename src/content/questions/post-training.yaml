theme: "post-training"
questions:
  - id: "pt-rlhf"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Walk through a preference-based RLHF pipeline and explain the roles of the reward model and reference-policy penalty."
      ru: "Разберите RLHF на предпочтениях и объясните роль reward model и штрафа за отклонение от опорной политики."
    tests:
      en: "Whether data collection, reward fitting and policy optimisation are distinguished."
      ru: "Умение различать сбор данных, обучение награды и оптимизацию политики."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 22
    outline:
      en:
        - "Separate demonstrations, preference pairs and policy rollouts."
        - "Explain reward-model training and policy optimisation with a reference constraint."
        - "Evaluate held-out human preferences and reward overoptimisation."
      ru:
        - "Разделить демонстрации, пары предпочтений и траектории политики."
        - "Объяснить обучение модели награды и оптимизацию политики с ограничением относительно опорной модели."
        - "Проверить отложенные человеческие предпочтения и переоптимизацию награды."
    answer:
      en: "RLHF splits into three stages that differ by data. First demonstrations: examples of desired answers, on which the base model is finetuned with supervised learning. Then preference pairs: a person sees several answers to one prompt and ranks them, and on those comparisons you train a reward model, a separate model predicting which answer a person picks. In the third stage the policy is optimised against that reward on its own rollouts, with a penalty for diverging from the reference model added to the objective, usually a KL divergence; without it the policy drifts to where reward is high and the text has degraded. That is the trade-off: push harder on reward and you reach its overoptimisation sooner. Check on held-out human preferences, not on the reward itself, and watch how divergence from the reference tracks the real gain. The reward model inherits annotator bias, and optimisation amplifies it."
      ru: "RLHF раскладывается на три этапа, различающихся данными. Сначала демонстрации: примеры желаемых ответов, на которых базовую модель дообучают обычным способом с учителем. Затем пары предпочтений: человеку показывают несколько ответов на один промпт и просят их упорядочить, и на этих сравнениях учится reward model — отдельная модель, предсказывающая, какой ответ человек выберет. На третьем этапе политика оптимизируется по этой награде уже на собственных траекториях, а к цели добавляется штраф за расхождение с опорной моделью, обычно KL-дивергенция: без него политика уходит туда, где награда высока, а текст деградировал. В этом и компромисс: сильнее давим на награду — быстрее ловим её переоптимизацию. Проверять нужно на отложенных человеческих предпочтениях, а не по самой награде, и смотреть, как расхождение с опорной моделью соотносится с реальным выигрышем. Граница: reward model наследует смещения разметчиков, а оптимизация их усиливает."
    reading: ["paper-instructgpt"]
  - id: "pt-dpo"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Compare DPO with PPO-based RLHF, including the assumptions behind offline preference learning and reasons to collect fresh rollouts."
      ru: "Сравните DPO с RLHF на PPO, включая предпосылки обучения по офлайн-предпочтениям и причины собирать новые траектории."
    tests:
      en: "Whether a simpler objective is distinguished from universally better alignment."
      ru: "Умение не путать простоту функции потерь с универсальным превосходством."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 23
    outline:
      en:
        - "Describe the preference objective using policy and reference log-probabilities."
        - "Explain how it avoids a separately trained reward model in the basic formulation."
        - "Discuss preference coverage and distribution shift rather than declaring online RL obsolete."
      ru:
        - "Описать функцию предпочтений через логарифмы вероятностей политики и опорной модели."
        - "Объяснить отсутствие отдельно обучаемой reward model в базовом варианте."
        - "Обсудить покрытие предпочтений и сдвиг распределения без тезиса об устаревании online RL."
    answer:
      en: "DPO derives a preference loss using log policy-to-reference probability ratios, equivalently differences of log probabilities. It compares those quantities for preferred and rejected responses, avoiding a separately trained reward model and an online rollout loop. That simplifies implementation, though the frozen reference still contributes to the objective. Standard offline DPO learns from a fixed preference dataset. If its coverage misses responses the updated policy produces, the training signal may generalise poorly there. PPO can score current rollouts with a reward model, but that model can also fail outside its training distribution. I would therefore inspect preference coverage, held-out behaviour and policy drift before choosing between them. A simpler loss does not make online RL obsolete: the decision depends on data coverage, compute budget and the amount of behavioural change required."
      ru: "DPO выводит функцию потерь предпочтений через логарифмы отношений вероятностей обучаемой политики и опорной модели, то есть разности логарифмов. Эти величины сравниваются для предпочтительного и отвергнутого ответов; отдельная обученная reward model и онлайн-цикл генерации не нужны. Реализация проще, хотя замороженная опорная модель всё ещё участвует в целевой функции. Обычный офлайн-DPO учится на фиксированном наборе предпочтений. Если он не покрывает ответы обновлённой политики, обобщение сигнала может ухудшиться. PPO оценивает текущие траектории моделью награды, но и она может ошибаться вне своего обучающего распределения. Поэтому проверяю покрытие предпочтений, поведение на отложенных задачах и уход политики. Простая функция потерь не делает online RL устаревшим: выбор зависит от данных, вычислительного бюджета и требуемого изменения поведения."
    reading: ["paper-dpo"]
