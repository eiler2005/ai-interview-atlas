theme: "applied-scenarios"
questions:
  - id: "app-claims-discovery"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A customer wants to automate claims processing with AI. What would you do in the first two weeks?
      ru: >-
        Клиент хочет автоматизировать обработку страховых требований с помощью AI. Что вы сделаете за первые две недели?
    tests:
      en: >-
        Whether you turn a broad request into a bounded, measurable workflow.
      ru: >-
        Умеете ли вы превратить широкий запрос в ограниченный и измеримый рабочий процесс.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    start_here: ["leadership"]
    priority: 29
    outline:
      en:
        - "Map the current process, decisions, exceptions and accountable users."
        - "Check data access, error consequences and which steps need human judgement."
        - "Choose a narrow pilot with a baseline, acceptance criteria and an owner."
      ru:
        - "Разберите текущий процесс, решения, исключения и ответственных пользователей."
        - "Проверьте доступ к данным, последствия ошибок и этапы, требующие решения человека."
        - "Выберите узкий пилот с базовой линией, критериями приёмки и владельцем."
    answer:
      en: "I'd use those two weeks to define one measurable process. First I take apart how claims are handled today: which steps exist, which decisions a person makes and by what rules, where exceptions come up, how frequent they are, and who actually works in the system every day. In parallel I check the data: whether we have access, what form the documents are in, what counts as a correct answer, and whether there is a decision history to give us a baseline. Separately I look at the cost of an error, because a wrongful denial and an overpayment cost different things, and that decides which steps stay with a human. By the end I pick a narrow pilot: one claim type, an end-to-end path, a baseline on time and accuracy, acceptance criteria, and an owner on the customer side. Automating the whole flow is not on the table yet."
      ru: "Две недели трачу не на прототип, а на то, чтобы превратить широкий запрос в один измеримый процесс. Сначала разбираю, как заявления на выплату обрабатываются сейчас: какие шаги, какие решения человек принимает и по каким правилам, где возникают исключения, насколько они часты и кто именно работает в системе каждый день. Параллельно проверяю данные: есть ли доступ, в каком виде документы, что считается верным ответом и есть ли история решений для базовой линии. Отдельно смотрю на цену ошибки — необоснованный отказ и лишняя выплата стоят по-разному, и это определяет, какие шаги остаются за человеком. К концу выбираю узкий пилот: один тип заявлений на выплату, сквозной путь, базовая линия по времени и точности, критерии приёмки и владелец со стороны клиента. Автоматизация всего потока на этом этапе не обсуждается."
    reading: ["anthropic-building-effective-agents","nist-ai-rmf"]
  - id: "app-pilot-rescue"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A customer executive wants to cancel an AI pilot because it keeps producing wrong results. What would you do over the next 48 hours?
      ru: >-
        Руководитель клиента хочет закрыть AI-пилот из-за постоянных ошибок. Что вы сделаете в ближайшие 48 часов?
    tests:
      en: >-
        Whether you combine incident triage with a credible customer recovery plan.
      ru: >-
        Умеете ли вы сочетать разбор ошибок с реалистичным планом восстановления доверия.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "palantir"
    start_here: ["leadership"]
    priority: 30
    outline:
      en:
        - "Acknowledge impact and collect concrete failing workflows with the customer."
        - "Contain harmful behaviour and separate data, system and expectation problems."
        - "Agree on a short recovery experiment and explicit continue-or-stop criteria."
      ru:
        - "Признайте последствия и соберите с клиентом конкретные неудачные сценарии."
        - "Ограничьте вред и разделите проблемы данных, системы и ожиданий."
        - "Согласуйте короткий проверочный этап и критерии продолжения или остановки."
    answer:
      en: "In the first hours I acknowledge the problem plainly, with no explanation of how it happened: trust is gone, and an argument about wording finishes it. I ask for specifics, not \"it works badly\" but a dozen real cases with the request, the answer they got, and the answer it should have been. That is the only way to separate three different illnesses: data that's missing or dirty, defects in the system itself such as retrieval and prompts, and expectations that never matched what the feature can do. I contain the damage: I switch off the riskiest scenarios and put human review or an honest refusal where confidence is low. By the end of the second day I propose a short recovery stage with a fixed set of cases, a deadline, and explicit continue-or-stop criteria. If the root cause is expectations, closing the pilot is more honest than fixing symptoms."
      ru: "В первые часы признаю проблему прямо, без объяснений, почему так вышло: доверие уже потеряно, и спор о формулировках добьёт его окончательно. Дальше прошу конкретику — не «работает плохо», а десяток реальных случаев с запросом, полученным ответом и тем, каким он должен был быть. Только так разделяются три разные болезни: недоступные или грязные данные, дефекты самой системы вроде поиска и промптов, и несовпадение ожиданий с тем, на что функция вообще способна. Одновременно ограничиваю ущерб: отключаю самые опасные сценарии, ставлю проверку человеком или честный отказ там, где уверенности нет. К концу вторых суток предлагаю короткий проверочный этап с зафиксированным набором случаев, сроком и критериями продолжения или остановки. Если корень в ожиданиях, честнее закрыть пилот, чем чинить симптомы."
    reading: ["google-sre-book","anthropic-evals-for-agents"]
  - id: "app-finetuning-request"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A customer insists on fine-tuning their own model on support tickets, while you suspect retrieval would be enough. How do you proceed?
      ru: >-
        Клиент настаивает на дообучении своей модели на обращениях в поддержку, а вы считаете, что хватит поиска по данным. Как действовать?
    tests:
      en: >-
        Whether you investigate the need without turning architecture preferences into a sales argument.
      ru: >-
        Умеете ли вы выяснить потребность, не подменяя её предпочтением архитектуры.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "databricks"
    start_here: ["leadership"]
    priority: 31
    outline:
      en:
        - "Ask what ownership is meant to achieve: behaviour, knowledge, cost or control."
        - "Build a representative task set and compare plausible approaches."
        - "Explain data governance, maintenance and migration costs before recommending."
      ru:
        - "Уточните, зачем нужна своя модель: поведение, знания, цена или контроль."
        - "Соберите представительный набор задач и сравните подходящие решения."
        - "Объясните требования к данным, сопровождению и миграции до рекомендации."
    answer:
      en: "I don't start with an architecture argument. I start by asking what the customer is trying to solve with their own model: different behaviour and output format, knowledge that isn't in the context, a different cost per request, or control over the weights and where they run. Those four needs are met differently, and fine-tuning covers the first one well: it freezes knowledge at training time and ages along with the support tickets, while retrieval over their data updates when someone edits the source. Then I build a representative task set from their own tickets with expected answers, and compare the approaches on it honestly, hybrid included. Before recommending anything I talk through the cost of ownership: labelling, data quality, retraining when the base model changes, evaluation, migration. If the requirement comes from a regulator or from data isolation, arguing about quality is beside the point."
      ru: "Начинаю не со спора об архитектуре, а с вопроса, какую задачу клиент решает собственной моделью: нужно другое поведение и формат, нужны знания, которых нет в контексте, нужна другая цена запроса или нужен контроль над весами и размещением. Эти четыре потребности лечатся по-разному, и дообучение хорошо закрывает первую: знания оно фиксирует на момент обучения и стареет вместе с обращениями в поддержку, тогда как поиск по данным обновляется правкой источника. Дальше собираю представительный набор задач из их же тикетов с ожидаемыми ответами и честно сравниваю подходы на нём, включая гибридный. И до рекомендации проговариваю цену владения: разметка, качество данных, повторное обучение при смене базовой модели, оценка, миграция. Если требование идёт от регулятора или от изоляции данных, спор о качестве неуместен."
    reading: ["google-rules-of-ml","anthropic-building-effective-agents"]
  - id: "app-model-retirement"
    tracks: ["engineering","leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A deployed agent's base model will be retired in 60 days. How would you migrate it without losing quality?
      ru: >-
        Базовую модель работающего агента отключат через 60 дней. Как вы проведёте миграцию без потери качества?
    tests:
      en: >-
        Whether provider lifecycle risk is handled through reproducible evaluation and controlled change.
      ru: >-
        Умеете ли вы управлять сменой поставщиком модели через воспроизводимую оценку и контролируемые изменения.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "databricks"
    start_here: ["leadership"]
    priority: 32
    outline:
      en:
        - "Inventory affected workflows, tool contracts and model-specific behaviour."
        - "Compare candidates against representative recorded tasks and failure cases."
        - "Plan staged migration, rollback within the available window and customer communication."
      ru:
        - "Составьте перечень затронутых процессов, контрактов инструментов и особенностей модели."
        - "Сравните кандидатов на типичных зафиксированных задачах и известных ошибках."
        - "Спланируйте поэтапный переход, откат в доступное время и информирование клиентов."
    answer:
      en: "I would treat sixty days as a deadline to assess, not a guarantee of enough time. First I inventory workflows, prompts, tool contracts and dependencies on model quirks: answer formats, context limits, refusals and accumulated workarounds. In parallel I freeze an evaluation set covering typical tasks and known failures, so successor selection rests on evidence. I compare candidates on quality, latency and cost, budgeting for prompt and parser changes. Migration proceeds through small traffic slices, during staffed hours, with advance customer communication. Before retirement, rollback may use the old model; afterward it needs a supported alternative or a reduced service mode. Tasks without objective correctness criteria require human review, whose lead time belongs in the plan. If migration cannot finish safely, I communicate scope reductions and contingency plans early."
      ru: "Шестьдесят дней считаю дедлайном, достаточность которого надо оценить. Сначала выписываю процессы, промпты, контракты инструментов и зависимости от особенностей модели: форматы ответов, контекст, отказы, накопленные обходные приёмы. Параллельно фиксирую набор для оценки из типичных задач и известных ошибок, чтобы выбирать преемника по свидетельствам. Сравниваю кандидатов по качеству, задержке и цене, закладывая изменения промптов и парсеров. Перехожу небольшими долями трафика в рабочее время с предварительным предупреждением клиентов. До отключения можно откатиться на старую модель; после нужен поддерживаемый запасной вариант или ограниченный режим сервиса. Для задач без объективного критерия правильности планирую время человеческого разбора. Если безопасно закончить миграцию не удаётся, заранее сообщаю об ограничении функций и резервном плане."
    reading: ["anthropic-evals-for-agents","google-sre-book"]
  - id: "app-slow-expensive"
    tracks: ["engineering","leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A customer says their eight-GPU chatbot is too slow and too expensive. You have a week with them; how do you use it?
      ru: >-
        Клиент жалуется, что чат-бот на восьми GPU слишком медленный и дорогой. У вас неделя работы с ним; как её использовать?
    tests:
      en: >-
        Whether you diagnose bottlenecks and evaluate changes against useful customer outcomes.
      ru: >-
        Умеете ли вы найти узкие места и оценивать изменения через полезный результат для клиента.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
    start_here: ["leadership"]
    priority: 33
    outline:
      en:
        - "Measure real workload, latency distribution, utilisation and cost per successful task."
        - "Profile before choosing serving, model, retrieval or interaction changes."
        - "Validate improvements on the same workload with quality and reliability guardrails."
      ru:
        - "Измерьте реальную нагрузку, распределение задержек, утилизацию и стоимость успешной задачи."
        - "Проведите профилирование до выбора изменений сервинга, модели, поиска или интерфейса."
        - "Проверьте улучшения на той же нагрузке с ограничениями по качеству и надёжности."
    answer:
      en: "I'd start the week with measurements, not ideas: what the real workload profile looks like, how latency is distributed across percentiles rather than averaged, what the response time is made of, retrieval, prefill, decode, external calls, what the utilisation of those eight GPUs is, and what one successfully completed user task costs. The customer's complaint is usually about that last number, not about the price of a token. I profile first and only then pick the lever: batching and serving parameters, a smaller model or quantisation, shorter context and more precise retrieval, streaming and caching for perceived speed. That order holds because swapping the model is the most expensive move and serving is often underloaded. Every change gets validated on the same recorded workload with quality guardrails. If the bottleneck is in the data sources or in the scenario itself, optimising inference won't help."
      ru: "Неделю начинаю с измерений, а не с идей: какой реальный профиль нагрузки, как распределены задержки по процентилям, а не в среднем, из чего складывается время ответа — поиск, prefill, decode, внешние вызовы, — какая утилизация восьми GPU и сколько стоит одна успешно решённая задача пользователя. Обычно жалоба клиента именно про последнюю величину, а не про цену токена. Дальше профилирую и только потом выбираю рычаг: батчинг и параметры сервинга, модель поменьше или квантование, сокращение контекста и более точный поиск, стриминг и кеш для ощущаемой скорости. Порядок такой, потому что смена модели дороже всего, а сервинг часто недогружен. Каждое изменение проверяю на той же записанной нагрузке с ограничениями по качеству. Если узкое место в источниках данных или в самом сценарии, оптимизация инференса не поможет."
    reading: ["google-sre-book","google-rules-of-ml"]
  - id: "app-vpc-pilot"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        An enterprise wants document Q&A over two million internal files within four weeks, with no data leaving its VPC. How would you scope the pilot?
      ru: >-
        Компания хочет за четыре недели запустить ответы по двум миллионам внутренних файлов без вывода данных за пределы VPC. Как определить объём пилота?
    tests:
      en: >-
        Whether you negotiate scope around access controls, deployment constraints and measurable value.
      ru: >-
        Умеете ли вы согласовать объём с учётом прав доступа, ограничений среды и измеримой пользы.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
    start_here: ["leadership"]
    priority: 34
    outline:
      en:
        - "Clarify corpus priority, permissions, permitted services and the most valuable queries."
        - "Choose a representative subset and a deployable end-to-end workflow."
        - "Agree acceptance tests, operational ownership and what the pilot cannot establish."
      ru:
        - "Уточните приоритетные документы, права, разрешённые сервисы и самые ценные запросы."
        - "Выберите представительную часть данных и реализуемый сквозной процесс."
        - "Согласуйте приёмочные проверки, ответственность за эксплуатацию и пределы выводов пилота."
    answer:
      en: "Four weeks and two million files is a conversation about choosing, not about coverage. First I narrow it down: which document collections are genuinely needed, who has rights to them today, which services are allowed inside the perimeter, and which fifteen or so employee questions are worth the most. Permissions are not post-processing: the index has to carry labels and retrieval has to filter by the asker's rights, or the pilot becomes a leak path of its own. Then I take a representative slice of the data rather than a random one: it needs current and stale documents, duplicates and mixed formats, because those are what break answer quality. I build the end-to-end path in full, even on a narrow slice. Up front I agree acceptance tests, an owner for operations, and what the pilot will not prove: load, full coverage, and cost at the full volume."
      ru: "Четыре недели и два миллиона файлов — это разговор про выбор, а не про полноту. Сначала сужаю: какие коллекции документов действительно нужны, у кого есть права на них сейчас, какие сервисы разрешены внутри периметра и какие полтора десятка вопросов сотрудников стоят дороже всего. Права доступа не постобработка: индекс должен хранить метки, а поиск фильтровать по правам спрашивающего, иначе пилот сам станет каналом утечки. Дальше беру представительную часть данных, а не случайную: в ней должны быть свежие и устаревшие документы, дубликаты, разные форматы, потому что именно они ломают качество ответов. Сквозной путь реализую целиком, пусть и на узком срезе. Заранее согласую приёмочные проверки, владельца эксплуатации и то, чего пилот не докажет: нагрузку, полное покрытие и стоимость на всём объёме."
    reading: ["azure-multitenant","nist-ai-rmf"]
  - id: "app-rag-account-triage"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
