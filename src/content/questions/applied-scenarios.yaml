  - id: "app-employee-sync"
    tracks: ["engineering","leadership"]
    type: "system_design"
    level: "senior"
    text:
      en: >-
        Design synchronisation between two systems that hold employee records.
      ru: >-
        Спроектируйте синхронизацию двух систем с данными о сотрудниках.
