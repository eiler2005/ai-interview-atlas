theme: "applied-scenarios"
questions:
  - id: "app-claims-discovery"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A customer wants to automate claims processing with AI. What would you do in the first two weeks?
      ru: >-
        Клиент хочет автоматизировать обработку страховых требований с помощью AI. Что вы сделаете за первые две недели?
    tests:
      en: >-
        Whether you turn a broad request into a bounded, measurable workflow.
      ru: >-
        Умеете ли вы превратить широкий запрос в ограниченный и измеримый рабочий процесс.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    start_here: ["leadership"]
    priority: 29
    outline:
      en:
        - "Map the current process, decisions, exceptions and accountable users."
        - "Check data access, error consequences and which steps need human judgement."
        - "Choose a narrow pilot with a baseline, acceptance criteria and an owner."
      ru:
        - "Разобрать текущий процесс, решения, исключения и ответственных пользователей."
        - "Проверить доступ к данным, последствия ошибок и этапы, требующие решения человека."
        - "Выбрать узкий пилот с базовой линией, критериями приёмки и владельцем."
    answer:
      en: "Two weeks buy one bounded workflow and a go or no-go, not a prototype of automated claims. The first week I'd spend with handlers, mapping intake, document extraction, coverage check, routing, adjudication and payment, with each step's volume, handling time and exception rate, to see where time actually goes. The first candidate is usually intake and document triage, not adjudication: an extraction error gets caught by the handler downstream and is cheap to reverse, while a wrongful denial lands on the policyholder with legal exposure, so denials stay with a person, and wrongful denial, overpayment and delay each get their own threshold. The second week builds the baseline from past claims: handling time, extraction accuracy on a double-checked sample, the share of simple claims that could go straight through. The pilot then has acceptance criteria per claim type and an owner in claims operations. Without a decision history or access to the claims system, two weeks yield an assessment and a data plan, and saying so early is the result."
      ru: "Две недели дают один ограниченный процесс и решение, продолжать ли, а не прототип автоматизации выплат. Первую неделю я бы провёл с сотрудниками, которые разбирают заявления, и разложил процесс на шаги — приём, извлечение данных из документов, проверка покрытия, маршрутизация, решение по выплате, сама выплата — с объёмом, временем обработки и долей исключений на каждом, чтобы увидеть, куда на самом деле уходит время. Первым кандидатом обычно оказываются приём и сортировка документов, а не решение по выплате: ошибку извлечения поймает сотрудник дальше по процессу, и исправить её дёшево, а необоснованный отказ ложится на страхователя и несёт юридические риски, поэтому отказы остаются за человеком, а у необоснованного отказа, переплаты и задержки свои пороги. Вторая неделя уходит на базовую линию по прошлым заявлениям: время обработки, точность извлечения на дважды проверенной выборке, доля простых заявлений, которые могли бы пройти без ручной обработки. У пилота появляются критерии приёмки по каждому типу заявлений и владелец в подразделении урегулирования. Если нет истории решений или доступа к системе учёта заявлений, за две недели получится оценка и план по данным, и сказать об этом сразу — это и есть результат."
    reading: ["anthropic-building-effective-agents","nist-ai-rmf"]
  - id: "app-pilot-rescue"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A customer executive wants to cancel an AI pilot because it keeps producing wrong results. What would you do over the next 48 hours?
      ru: >-
        Руководитель клиента хочет закрыть AI-пилот из-за постоянных ошибок. Что вы сделаете в ближайшие 48 часов?
    tests:
      en: >-
        Whether you combine incident triage with a credible customer recovery plan.
      ru: >-
        Умеете ли вы сочетать разбор ошибок с реалистичным планом восстановления доверия.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "palantir"
    start_here: ["leadership"]
    priority: 30
    outline:
      en:
        - "Acknowledge impact and collect concrete failing workflows with the customer."
        - "Contain harmful behaviour and separate data, system and expectation problems."
        - "Agree on a short recovery experiment and explicit continue-or-stop criteria."
      ru:
        - "Признать последствия и собрать с клиентом конкретные неудачные сценарии."
        - "Ограничить вред и разделить проблемы данных, системы и ожиданий."
        - "Согласовать короткий проверочный этап и критерии продолжения или остановки."
    answer:
      en: "In the first hours I acknowledge the problem plainly, with no explanation of how it happened: trust is gone, and an argument about wording finishes it. I ask for specifics, not \"it works badly\" but a dozen real cases with the request, the answer they got, and the answer it should have been. That is the only way to separate three different illnesses: data that's missing or dirty, defects in the system itself such as retrieval and prompts, and expectations that never matched what the feature can do. I contain the damage: I switch off the riskiest scenarios and put human review or an honest refusal where confidence is low. By the end of the second day I propose a short recovery stage with a fixed set of cases, a deadline, and explicit continue-or-stop criteria. If the root cause is expectations, closing the pilot is more honest than fixing symptoms."
      ru: "В первые часы признаю проблему прямо, без объяснений, почему так вышло: доверие уже потеряно, и спор о формулировках добьёт его окончательно. Дальше прошу конкретику — не «работает плохо», а десяток реальных случаев с запросом, полученным ответом и тем, каким он должен был быть. Только так разделяются три разные болезни: недоступные или грязные данные, дефекты самой системы вроде поиска и промптов, и несовпадение ожиданий с тем, на что функция вообще способна. Одновременно ограничиваю ущерб: отключаю самые опасные сценарии, ставлю проверку человеком или честный отказ там, где уверенности нет. К концу вторых суток предлагаю короткий проверочный этап с зафиксированным набором случаев, сроком и критериями продолжения или остановки. Если корень в ожиданиях, честнее закрыть пилот, чем чинить симптомы."
    reading: ["google-sre-book","anthropic-evals-for-agents"]
  - id: "app-finetuning-request"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A customer insists on fine-tuning their own model on support tickets, while you suspect retrieval would be enough. How do you proceed?
      ru: >-
        Клиент настаивает на дообучении своей модели на обращениях в поддержку, а вы считаете, что хватит поиска по данным. Как действовать?
    tests:
      en: >-
        Whether you investigate the need without turning architecture preferences into a sales argument.
      ru: >-
        Умеете ли вы выяснить потребность, не подменяя её предпочтением архитектуры.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "databricks"
    start_here: ["leadership"]
    priority: 31
    outline:
      en:
        - "Ask what ownership is meant to achieve: behaviour, knowledge, cost or control."
        - "Build a representative task set and compare plausible approaches."
        - "Explain data governance, maintenance and migration costs before recommending."
      ru:
        - "Уточнить, зачем нужна своя модель: поведение, знания, цена или контроль."
        - "Собрать представительный набор задач и сравнить подходящие решения."
        - "Объяснить требования к данным, сопровождению и миграции до рекомендации."
    answer:
      en: "I don't start with an architecture argument. I start by asking what the customer is trying to solve with their own model: different behaviour and output format, knowledge that isn't in the context, a different cost per request, or control over the weights and where they run. Those four needs are met differently. Fine-tuning covers the first one well and can serve the third by teaching a smaller model the narrow task, but it freezes knowledge at training time, ages along with the support tickets and learns the mistakes support staff made in them, while retrieval over their data updates when someone edits the source. Then I build a representative task set from their own tickets with expected answers, and compare the approaches on it honestly, hybrid included. Before recommending anything I talk through the cost of ownership: labelling, data quality, retraining when the base model changes, evaluation, migration. If the requirement comes from a regulator or from data isolation, arguing about quality is beside the point."
      ru: "Начинаю не со спора об архитектуре, а с вопроса, какую задачу клиент решает собственной моделью: нужно другое поведение и формат, нужны знания, которых нет в контексте, нужна другая цена запроса или нужен контроль над весами и размещением. Эти четыре потребности лечатся по-разному. Дообучение хорошо закрывает первую и может закрыть третью, если научить узкой задаче модель поменьше, но знания оно фиксирует на момент обучения, стареет вместе с обращениями в поддержку и перенимает ошибки, которые допускали в них операторы, тогда как поиск по данным обновляется правкой источника. Дальше собираю представительный набор задач из их же тикетов с ожидаемыми ответами и честно сравниваю подходы на нём, включая гибридный. И до рекомендации проговариваю цену владения: разметка, качество данных, повторное обучение при смене базовой модели, оценка, миграция. Если требование идёт от регулятора или от изоляции данных, спор о качестве неуместен."
    reading: ["google-rules-of-ml","anthropic-building-effective-agents"]
  - id: "app-model-retirement"
    tracks: ["engineering","leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A deployed agent's base model will be retired in 60 days. How would you migrate it without losing quality?
      ru: >-
        Базовую модель работающего агента отключат через 60 дней. Как вы проведёте миграцию без потери качества?
    tests:
      en: >-
        Whether provider lifecycle risk is handled through reproducible evaluation and controlled change.
      ru: >-
        Умеете ли вы управлять риском того, что поставщик выведет модель из эксплуатации, через воспроизводимую оценку и контролируемые изменения.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "databricks"
    start_here: ["leadership"]
    priority: 32
    outline:
      en:
        - "Inventory affected workflows, tool contracts and model-specific behaviour."
        - "Compare candidates against representative recorded tasks and failure cases."
        - "Plan staged migration, rollback within the available window and customer communication."
      ru:
        - "Составить перечень затронутых процессов, контрактов инструментов и особенностей модели."
        - "Сравнить кандидатов на типичных зафиксированных задачах и известных ошибках."
        - "Спланировать поэтапный переход, откат в доступное время и информирование клиентов."
    answer:
      en: "Sixty days is fixed; the hidden dependency is that the evaluation must exist before any candidate is chosen, so the first week builds the measuring instrument, not model trials. An agent's quality belongs to the model together with prompts, tool schemas and parsers tuned to its habits, so a successor regresses not because it's weaker but because it formats tool calls differently, refuses elsewhere or follows instructions more literally. I'd freeze an eval from recorded traffic and known failures and replay it in shadow against candidates, with thresholds per slice rather than one average. The trade-off is depth against a fallback: porting prompts carefully to one successor gives the best quality; keeping a second candidate alive costs more but is the only rollback once the old model is gone. Rollout goes shadow, small share, wider, in staffed hours, with customers told in advance. The boundary: if a slice can't reach parity by an agreed date, I'd decide what to cut and say so, and tasks with no objective check need human review time planned in."
      ru: "Шестьдесят дней не сдвинуть, а скрытая зависимость в том, что оценка должна появиться раньше выбора кандидата, поэтому первая неделя уходит на измерительный инструмент, а не на пробы моделей. Качество агента принадлежит не модели, а модели вместе с промптами, схемами инструментов и парсерами, подогнанными под её привычки, поэтому преемник проседает не оттого, что слабее, а оттого, что иначе оформляет вызовы инструментов, отказывает в других местах или понимает инструкции буквальнее. Я бы зафиксировал eval-набор из записанного трафика и известных сбоев и прогнал его в теневом режиме на кандидатах, с порогами по срезам, а не одним средним. Компромисс — глубина против запасного варианта: тщательно перенести промпты на одного преемника — лучшее качество; держать живым второго кандидата дороже, но после отключения старой модели это единственный путь отката. Переход идёт от теневого режима к небольшой доле и дальше, в рабочие часы, с заранее предупреждёнными клиентами. Граница: если какой-то срез к согласованной дате не дотягивает до прежнего уровня, я решаю, что урезать, и говорю об этом прямо, а для задач без объективной проверки закладываю время на разбор людьми."
    reading: ["anthropic-evals-for-agents","google-sre-book"]
  - id: "app-slow-expensive"
    tracks: ["engineering","leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A customer says their eight-GPU chatbot is too slow and too expensive. You have a week with them; how do you use it?
      ru: >-
        Клиент жалуется, что чат-бот на восьми GPU слишком медленный и дорогой. У вас неделя работы с ним; как её использовать?
    tests:
      en: >-
        Whether you diagnose bottlenecks and evaluate changes against useful customer outcomes.
      ru: >-
        Умеете ли вы найти узкие места и оценивать изменения через полезный результат для клиента.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
    start_here: ["leadership"]
    priority: 33
    outline:
      en:
        - "Measure real workload, latency distribution, utilisation and cost per successful task."
        - "Profile before choosing serving, model, retrieval or interaction changes."
        - "Validate improvements on the same workload with quality and reliability guardrails."
      ru:
        - "Измерить реальную нагрузку, распределение задержек, утилизацию и стоимость успешной задачи."
        - "Провести профилирование до выбора изменений сервинга, модели, поиска или интерфейса."
        - "Проверить улучшения на той же нагрузке с ограничениями по качеству и надёжности."
    answer:
      en: "I'd start the week with measurements, not ideas: what the real workload profile looks like, how latency is distributed across percentiles rather than averaged, what the response time is made of — retrieval, prefill, decode, external calls — what the utilisation of those eight GPUs is, and what one successfully completed user task costs. The customer's complaint is usually about that last number, not about the price of a token. I profile first and only then pick the lever: batching and serving parameters, a smaller model or quantisation, shorter context and more precise retrieval, streaming and caching for perceived speed. That order holds because serving is often underloaded and tuning it leaves the answers unchanged, while a smaller or quantised model changes them and needs a full quality re-evaluation. Every change gets validated on the same recorded workload with quality and reliability guardrails. If the bottleneck is in the data sources or in the scenario itself, optimising inference won't help."
      ru: "Неделю начинаю с измерений, а не с идей: какой реальный профиль нагрузки, как распределены задержки по процентилям, а не в среднем, из чего складывается время ответа — поиск, prefill, decode, внешние вызовы, — какая утилизация восьми GPU и сколько стоит одна успешно решённая задача пользователя. Обычно жалоба клиента именно про последнюю величину, а не про цену токена. Дальше профилирую и только потом выбираю рычаг: батчинг и параметры сервинга, модель поменьше или квантование, сокращение контекста и более точный поиск, стриминг и кеш для ощущаемой скорости. Порядок такой, потому что сервинг часто недогружен и его настройка не меняет ответов, а модель поменьше или квантованная их меняет и требует полной повторной оценки качества. Каждое изменение проверяю на той же записанной нагрузке с ограничениями по качеству и надёжности. Если узкое место в источниках данных или в самом сценарии, оптимизация инференса не поможет."
    reading: ["google-sre-book","google-rules-of-ml"]
  - id: "app-vpc-pilot"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        An enterprise wants document Q&A over two million internal files within four weeks, with no data leaving its VPC. How would you scope the pilot?
      ru: >-
        Компания хочет за четыре недели запустить ответы по двум миллионам внутренних файлов без вывода данных за пределы VPC. Как определить объём пилота?
    tests:
      en: >-
        Whether you negotiate scope around access controls, deployment constraints and measurable value.
      ru: >-
        Умеете ли вы согласовать объём с учётом прав доступа, ограничений среды и измеримой пользы.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
    start_here: ["leadership"]
    priority: 34
    outline:
      en:
        - "Clarify corpus priority, permissions, permitted services and the most valuable queries."
        - "Choose a representative subset and a deployable end-to-end workflow."
        - "Agree acceptance tests, operational ownership and what the pilot cannot establish."
      ru:
        - "Уточнить приоритетные документы, права, разрешённые сервисы и самые ценные запросы."
        - "Выбрать представительную часть данных и реализуемый сквозной процесс."
        - "Согласовать приёмочные проверки, ответственность за эксплуатацию и пределы выводов пилота."
    answer:
      en: "Four weeks and two million files is a conversation about choosing, not about coverage. First I narrow it down: which document collections are genuinely needed, who has rights to them today, which services are allowed inside the perimeter, and which fifteen or so employee questions are worth the most. Permissions are not post-processing: the index has to carry labels and retrieval has to filter by the asker's rights, or the pilot becomes a leak path of its own. Then I take a representative slice of the data rather than a random one: it needs current and stale documents, duplicates and mixed formats, because those are what break answer quality. I build the end-to-end path in full, even on a narrow slice. Up front I agree acceptance tests, an owner for operations, and what the pilot will not prove: load, full coverage, and cost at the full volume."
      ru: "Четыре недели и два миллиона файлов — это разговор про выбор, а не про полноту. Сначала сужаю: какие коллекции документов действительно нужны, у кого есть права на них сейчас, какие сервисы разрешены внутри периметра и какие полтора десятка вопросов сотрудников стоят дороже всего. Права доступа не постобработка: индекс должен хранить метки, а поиск фильтровать по правам спрашивающего, иначе пилот сам станет каналом утечки. Дальше беру представительную часть данных, а не случайную: в ней должны быть свежие и устаревшие документы, дубликаты, разные форматы, потому что именно они ломают качество ответов. Сквозной путь реализую целиком, пусть и на узком срезе. Заранее согласую приёмочные проверки, владельца эксплуатации и то, чего пилот не докажет: нагрузку, полное покрытие и стоимость на всём объёме."
    reading: ["azure-multitenant","nist-ai-rmf"]
  - id: "app-rag-account-triage"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        An enterprise customer says Claude hallucinates in their retrieval-based knowledge assistant. How would you investigate the first failures?
      ru: >-
        Корпоративный клиент сообщает, что Claude галлюцинирует в ассистенте с поиском по базе знаний. Как вы начнёте разбор ошибок?
    tests:
      en: >-
        Whether you separate retrieval failures, unsupported generation and misunderstood user expectations.
      ru: >-
        Различаете ли вы ошибки поиска, неподтверждённую генерацию и неверно понятые ожидания пользователя.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    start_here: ["leadership"]
    priority: 70
    outline:
      en:
        - "Collect concrete failing cases with full traces: question, retrieved passages, assembled prompt and answer."
        - "Sort each into missed retrieval, an answer unsupported by retrieved text, or a question the corpus cannot answer."
        - "Report the split with counts, fix the dominant cause first, and keep the cases as a regression set."
      ru:
        - "Собрать конкретные неудачные случаи с полными трассировками: вопрос, найденные фрагменты, собранный промпт и ответ."
        - "Отнести каждый к промаху поиска, ответу без опоры на найденный текст или вопросу, на который в корпусе нет ответа."
        - "Показать распределение в цифрах, сначала устранить преобладающую причину и сохранить случаи как регрессионный набор."
    answer:
      en: "Hallucination is a symptom, so I'd begin by getting concrete cases, a few dozen if they exist, each with its full trace: the question, what retrieval returned, the assembled prompt and the answer. Without traces the conversation is about impressions. Then I sort every case into one of three buckets, because each has a different fix. Retrieval failure: the right passage existed but wasn't returned, or a stale or contradictory document was. Unsupported generation: the right passage was in context, yet the answer added to it or contradicted it. Expectation mismatch: the corpus doesn't contain the answer, or the user wanted judgement rather than lookup; even then, filling the gap instead of saying the sources don't cover it is part of the defect. I'd show the customer the split with counts, fix the dominant bucket first, and keep the cases as a regression set. The limit is that escalated examples overrepresent vivid failures, so before claiming improvement I'd also measure a random sample of ordinary traffic."
      ru: "Галлюцинация — это симптом, поэтому начал бы с конкретных случаев, нескольких десятков, если они есть, и для каждого с полной трассировкой: вопрос, что вернул поиск, собранный промпт и ответ. Без трассировок разговор идёт о впечатлениях. Дальше раскладываю каждый случай по одной из трёх корзин, потому что лечатся они по-разному. Ошибка поиска: нужный фрагмент существовал, но не попал в выдачу, или попал устаревший либо противоречивый документ. Неподтверждённая генерация: нужный фрагмент был в контексте, но ответ что-то к нему добавил или ему противоречит. Расхождение ожиданий: в корпусе ответа нет или пользователь ждал суждения, а не поиска; но и тогда заполнить пробел вместо того, чтобы сказать, что источники этого не покрывают, — часть дефекта. Показал бы клиенту распределение в цифрах, сначала занялся самой крупной корзиной и сохранил случаи как регрессионный набор. Ограничение: среди присланных примеров непропорционально много ярких провалов, поэтому прежде чем заявлять об улучшении, я бы измерил и случайную выборку обычного трафика."
    reading: ["hamel-evals"]
  - id: "app-research-explanation"
    tracks: ["leadership"]
    roles: ["deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        How would you explain a complex AI research result to a nontechnical audience?
      ru: >-
        Как вы объясните сложный результат AI-исследования нетехнической аудитории?
    tests:
      en: >-
        Whether you communicate implications and limitations without replacing evidence with hype.
      ru: >-
        Умеете ли вы объяснить значение и ограничения результата без преувеличений.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    outline:
      en:
        - "Ask who the audience is and which of their decisions the result should inform."
        - "Cut detail, never accuracy: one honest analogy, what was measured and against which baseline."
        - "State what the result does not show, and check the audience can restate its limits."
      ru:
        - "Выяснить, кто аудитория и какое её решение должен помочь принять этот результат."
        - "Жертвовать деталями, но не точностью: одна честная аналогия, что измеряли и с чем сравнивали."
        - "Назвать, чего результат не показывает, и проверить, что слушатели могут пересказать его пределы."
  - id: "app-rail-downtime"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A freight railway loses substantial revenue to unexpected locomotive downtime. Turn the problem into an engineering plan.
      ru: >-
        Грузовая железная дорога теряет существенную выручку из-за внезапных простоев локомотивов. Превратите проблему в инженерный план.
    tests:
      en: >-
        Whether you connect operational decisions, usable data and intervention value.
      ru: >-
        Умеете ли вы связать эксплуатационные решения, пригодные данные и пользу вмешательства.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "palantir"
    outline:
      en:
        - "Ask which failure modes cost most and which decision an early warning would change."
        - "Check whether sensor and repair logs label failures, then price false alarms against missed breakdowns."
        - "Close on a pilot fleet, comparing unplanned downtime and cost with matched locomotives."
      ru:
        - "Спросить, какие отказы обходятся дороже всего и какое решение изменило бы раннее предупреждение."
        - "Проверить, размечены ли отказы в данных датчиков и журналах ремонта, и сопоставить цену ложной тревоги с пропущенной поломкой."
        - "Завершить пилотом на части парка, сравнив внеплановые простои и затраты с сопоставимыми локомотивами."
  - id: "app-city-traffic"
