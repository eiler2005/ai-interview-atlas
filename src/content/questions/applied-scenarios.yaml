    text:
      en: >-
        A lawyer reports that the assistant missed a change-of-control clause during contract review. How would you investigate?
      ru: >-
        Юрист сообщает, что ассистент пропустил условие о смене контроля при проверке договора. Как вы разберёте случай?
    tests:
      en: >-
        Whether you trace the failure through ingestion, retrieval, reasoning and review.
      ru: >-
        Умеете ли вы проследить ошибку от загрузки и поиска до анализа и проверки.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
    outline:
      en:
        - "Reproduce the exact case: document version, query, retrieved passages and the output the lawyer saw."
        - "Locate the failing stage: parsing, chunking, retrieval, reasoning over indirect wording, or human review."
        - "Turn it into a regression test, check similar contracts for the same miss, and warn affected users."
      ru:
        - "Воспроизвести конкретный случай: версия документа, запрос, найденные фрагменты и вывод, который видел юрист."
        - "Найти этап сбоя: разбор файла, разбиение, поиск, рассуждение над косвенной формулировкой или проверка человеком."
        - "Превратить случай в регрессионный тест, поискать такой же пропуск в похожих договорах и предупредить затронутых пользователей."
    reading: ["anthropic-contextual-retrieval","hamel-evals"]
  - id: "app-hospital-scheduling"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A hospital group schedules outpatient visits manually by phone. What would you build for them?
      ru: >-
        Сеть клиник вручную записывает пациентов на амбулаторный приём по телефону. Что вы предложите создать?
    tests:
      en: >-
        Whether you design around workflow, integration and safe exception handling.
      ru: >-
        Учитываете ли вы рабочий процесс, интеграцию и безопасную обработку исключений.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
    outline:
      en:
        - "Ask how a booking happens today: who calls, which rules apply, which system holds the schedule."
        - "Write into the existing scheduling system, automate routine bookings, and route urgent or clinical requests to staff."
        - "Pilot in one clinic, measuring completed bookings, no-shows and correct escalations against the phone baseline."
      ru:
        - "Спросить, как запись устроена сейчас: кто звонит, по каким правилам и в какой системе хранится расписание."
        - "Записывать в существующую систему расписания, автоматизировать типовые записи, а срочные и медицинские вопросы передавать сотрудникам."
        - "Запустить пилот в одной клинике, измеряя завершённые записи, неявки и правильность эскалаций относительно телефонного процесса."
  - id: "app-contact-centre"
    tracks: ["leadership"]
    roles: ["fde-lead"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A contact centre wants voice agents to replace its phone menus. How would you lead the engagement?
      ru: >-
        Контакт-центр хочет заменить телефонное меню голосовыми агентами. Как вы проведёте проект?
    tests:
      en: >-
        Whether you scope user journeys, handoff and operational readiness together.
      ru: >-
        Умеете ли вы одновременно проработать сценарии, перевод на оператора и готовность эксплуатации.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
    start_here: ["leadership"]
    priority: 52
    outline:
      en:
        - "Take the highest-volume intents first and define containment honestly, counting transfers."
        - "Design the handoff to a human as a first-class path that carries context and never loops."
        - "Plan operational readiness: latency targets, interruption handling, monitoring and a rollback."
      ru:
        - "Начать с самых частых обращений и честно определить долю самостоятельных решений с учётом переводов."
        - "Сделать перевод на человека полноценным путём, который несёт контекст и не зацикливается."
        - "Спланировать готовность эксплуатации: цели по задержке, перебивание, мониторинг и откат."
    answer:
      en: "I would scope by intent rather than replace the menu wholesale. Pull the call-reason distribution and take the few intents carrying most volume with a verifiable resolution; leave the long tail on the existing path, because a voice agent that handles everything badly is worse than a menu. The success measure has to be honest containment — calls genuinely resolved without a human, not calls that ended — and I would track repeat calls within a day, where fake containment shows up. Transfer to a human is a first-class design problem, not a failure branch: it carries the transcript and what was attempted, and never loops the caller back. Then operational readiness before launch: latency targets, interruption handling, monitoring on abandonment, and a rollback to the menu. I would pilot on one intent in one region and expand on evidence."
      ru: "Я бы определял охват по типам обращений, а не заменял меню целиком. Взять распределение причин звонков и выбрать несколько обращений, которые дают основной объём и имеют проверяемое разрешение; длинный хвост оставить на прежнем пути, потому что голосовой агент, плохо делающий всё, хуже меню. Мерой успеха должна быть честная доля самостоятельных решений — звонки, действительно закрытые без человека, а не просто завершённые, — и я бы отслеживал повторные звонки в течение суток: именно там проявляется фиктивная автономность. Перевод на оператора — полноценная проектная задача, а не ветка отказа: он несёт расшифровку и то, что уже было предпринято, и никогда не возвращает звонящего в цикл. Дальше готовность эксплуатации до запуска: цели по задержке, обработка перебиваний, мониторинг брошенных звонков и откат к меню. Пилот я бы сделал на одном обращении в одном регионе и расширял по данным."
    reading: ["anthropic-building-effective-agents"]
  - id: "app-public-service-language"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A public agency wants a multilingual assistant for a paper-and-call-centre welfare service, hosted on premises. How would you scope delivery?
      ru: >-
        Государственное ведомство хочет перевести социальную услугу с бумаги и колл-центра на многоязычного ассистента в своём контуре. Как определить объём работ?
    tests:
      en: >-
        Whether access, language coverage and deployment constraints shape the service.
      ru: >-
        Учитываете ли вы доступность услуги, покрытие языков и ограничения размещения.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
    outline:
      en:
        - "Ask which languages, channels and literacy levels users have, and who cannot use a chat at all."
        - "Weigh on-premises limits on model size against quality per language, and keep phone and paper routes."
        - "Accept on per-language task success with native-speaker review, leaving eligibility decisions to caseworkers."
      ru:
        - "Выяснить языки, каналы и уровень грамотности пользователей и то, кому чат недоступен вовсе."
        - "Соотнести ограничения на размер модели в своём контуре с качеством на каждом языке и сохранить телефон и бумажный путь."
        - "Принимать работу по успешности задач на каждом языке с проверкой носителями, оставив решения о праве на пособие сотрудникам."
    reading: ["nist-ai-rmf"]
  - id: "app-financial-crime-decomposition"
    tracks: ["engineering","leadership"]
    roles: ["forward-deployed-engineer", "deployment-strategist"]
    type: "applied_scenario"
    text:
      en: "After an introduction to insider trading, explain how you would detect it: what data would you need, what would you ask the customer and what patterns would you look for?"
      ru: "После вводного объяснения инсайдерской торговли расскажите, как бы вы её выявляли: какие данные вам нужны, что вы спросите у клиента и какие закономерности будете искать?"
    tests:
      en: "Whether you turn a vague, high-stakes problem into a scoped first system that can be tested."
      ru: "Умение превратить размытую задачу с высокими ставками в ограниченную первую систему, которую можно проверить."
    provenance: "published"
    evidence:
      - source: "firstround-hiring-fde"
        company: "palantir"
        role: "forward-deployed-engineer"
    added: "2026-09-29"
    outline:
      en:
        - "Ask which instruments and data exist, and what an analyst must decide from an alert."
        - "Scope one pattern first: unusual trading by connected accounts before price-moving announcements."
        - "Backtest on confirmed past cases, and cap alert volume at what analysts can review."
      ru:
        - "Спросить, какие инструменты и данные есть и что аналитик должен решать по каждому сигналу."
        - "Начать с одной закономерности: необычные сделки связанных счетов перед существенными объявлениями, влияющими на цену."
        - "Проверить на подтверждённых прошлых случаях и ограничить поток сигналов тем, что аналитики успевают разобрать."
  - id: "app-agent-product-poc"
    tracks: ["engineering"]
    roles: ["forward-deployed-engineer"]
    type: "applied_scenario"
    text:
      en: "Instead of a coding round, build a proof of concept for a customer scenario inside the company's own agent product and show how the customer would use it."
      ru: "Вместо раунда кодинга соберите proof of concept для клиентского сценария внутри собственного агентного продукта компании и покажите, как клиент будет им пользоваться."
    tests:
      en: "Whether you understand how customers actually use the product, not only how to write code."
      ru: "Понимаете ли вы, как клиенты на самом деле пользуются продуктом, а не только как писать код."
    provenance: "published"
    evidence:
      - source: "exponent-cognition-fde"
        company: "cognition"
        role: "forward-deployed-engineer"
    added: "2026-09-29"
    outline:
      en:
        - "Ask who the customer's user is and which task in their day the product takes over."
        - "Build with the product's own features as a customer would, not custom code that bypasses them."
        - "Demo the flow end to end on realistic input, including a failure and how the user recovers."
      ru:
        - "Спросить, кто пользователь у клиента и какую задачу из его дня продукт берёт на себя."
        - "Собирать на штатных возможностях продукта, как сделал бы клиент, а не на своём коде в обход них."
        - "Показать сценарий целиком на реалистичных данных, включая сбой и то, как пользователь из него выходит."
  - id: "app-customer-case-call"
    tracks: ["engineering"]
    roles: ["forward-deployed-engineer"]
    type: "applied_scenario"
    text:
      en: "Lead a timed case-study call with a simulated customer: uncover the real problem, propose an approach and agree on next steps."
      ru: "Проведите ограниченный по времени звонок с условным клиентом: выясните настоящую проблему, предложите подход и договоритесь о следующих шагах."
    tests:
      en: "Whether you run a customer conversation under time pressure and leave with a concrete plan."
      ru: "Умение вести разговор с клиентом в условиях нехватки времени и прийти к конкретному плану."
    provenance: "published"
    evidence:
      - source: "exponent-cognition-fde"
        company: "cognition"
        role: "forward-deployed-engineer"
    added: "2026-09-29"
    outline:
      en:
        - "Open with questions on the outcome they need, the current workflow and who decides."
        - "Propose the smallest approach that tests their biggest risk, and say what you would not do."
        - "Close on dated next steps, owners, success criteria and the data they will send."
      ru:
        - "Начать с вопросов о нужном результате, текущем процессе и о том, кто принимает решение."
        - "Предложить минимальный подход, проверяющий их главный риск, и назвать, чего делать не будете."
        - "Закончить следующими шагами с датами, ответственными, критериями успеха и данными, которые они пришлют."
  - id: "app-learn-then-design"
    tracks: ["engineering"]
    roles: ["forward-deployed-engineer"]
    type: "applied_scenario"
    text:
      en: "Integrate a library you have never used into an existing system within minutes, then design the surrounding system for scale, storage and failures."
      ru: "За несколько минут встройте незнакомую библиотеку в существующую систему, затем спроектируйте систему вокруг неё с учётом масштаба, хранения данных и отказов."
    tests:
      en: "Whether you learn an unfamiliar tool quickly and carry it into sound design decisions."
      ru: "Умение быстро освоить незнакомый инструмент и перенести его в обоснованные проектные решения."
    provenance: "published"
    evidence:
      - source: "taro-palantir-fdse-denver-2025"
        company: "palantir"
        role: "forward-deployed-engineer"
        observed: "2025-03"
    added: "2026-09-29"
    outline:
      en:
        - "Read the core abstraction and one minimal example, then wrap the library behind a thin interface."
        - "Carry what you learned about its limits, state and errors into the scale and storage design."
        - "Name how the design fails, plan retries, timeouts and backpressure, and test the integration path."
      ru:
        - "Разобрать основную абстракцию и один минимальный пример, затем спрятать библиотеку за тонким интерфейсом."
        - "Перенести узнанное о её ограничениях, состоянии и ошибках в решения о масштабе и хранении."
        - "Назвать, как система отказывает, предусмотреть повторы, тайм-ауты и backpressure и протестировать путь интеграции."
    reading: ["palantir-existing-systems"]
  - id: "app-prompt-date-range"
    tracks: ["engineering"]
    roles: ["applied-ai-engineer"]
    type: "applied_scenario"
    text:
      en: "Write a prompt that extracts a date range from a customer's request in Russian and tells apart near-identical phrasings such as «с первого числа» (from the first), «по первое число» (through the first) and «за первое число» (for the first)."
      ru: "Напишите промпт, который извлекает период из запроса клиента и различает почти одинаковые формулировки вроде «с первого числа», «по первое число» и «за первое число»."
    tests:
      en: "Whether you handle language-specific ambiguity and test a prompt on hard cases."
      ru: "Умение учитывать неоднозначности конкретного языка и проверять промпт на трудных случаях."
    provenance: "published"
    evidence:
      - source: "tochka-prompt-engineers-2025"
        company: "tochka"
    added: "2026-09-29"
    outline:
      en:
        - "Define the output: start and end dates, inclusive or exclusive bounds, and the reference date."
        - "Spell out how the prepositions «с», «по» and «за» set each bound, with contrasting examples."
        - "Test on a set of near-identical phrasings and relative dates, and ask back when it is ambiguous."
      ru:
        - "Определить формат вывода: начальная и конечная даты, включительность границ и дата отсчёта."
        - "Явно описать, как предлоги «с», «по» и «за» задают каждую границу, и дать контрастные примеры."
        - "Проверить на наборе почти одинаковых формулировок и относительных дат и переспрашивать клиента при неоднозначности."
    reading: ["openai-evaluation-best-practices"]
