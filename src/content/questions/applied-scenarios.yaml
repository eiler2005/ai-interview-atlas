        An enterprise customer says Claude hallucinates in their retrieval-based knowledge assistant. How would you investigate the first failures?
      ru: >-
        Корпоративный клиент сообщает, что Claude галлюцинирует в ассистенте с поиском по базе знаний. Как вы начнёте разбор ошибок?
    tests:
      en: >-
        Whether you separate retrieval failures, unsupported generation and misunderstood user expectations.
      ru: >-
        Различаете ли вы ошибки поиска, неподтверждённую генерацию и неверно понятые ожидания пользователя.
