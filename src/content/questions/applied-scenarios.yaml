    text:
      en: >-
        Estimate the cost and turnaround of AI due diligence over 5,000 documents. Which improvement would you investigate first?
      ru: >-
        Оцените стоимость и сроки AI-проверки 5 000 документов в рамках due diligence. Какое улучшение вы проверите первым?
    tests:
      en: >-
        Whether estimates expose workload assumptions and the dominant cost driver.
      ru: >-
        Показывают ли оценки предположения о нагрузке и основной источник затрат.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
    outline:
      en:
        - "State workload assumptions: pages per document, tokens per page, passes and questions per document."
        - "Compare model cost with lawyers' review time, which may dominate, and find the turnaround bottleneck."
        - "First test what cuts the dominant driver, such as triaging documents for review, on a labelled sample."
      ru:
        - "Назвать предположения о нагрузке: страниц на документ, токенов на страницу, проходов и вопросов на документ."
        - "Сравнить стоимость модели со временем проверки юристами, которое может доминировать, и найти узкое место по срокам."
        - "Первым проверить то, что снижает главную статью затрат, например сортировку документов для проверки, на размеченной выборке."
  - id: "app-missed-contract-clause"
