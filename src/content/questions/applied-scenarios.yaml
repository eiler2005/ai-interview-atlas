  - id: "app-open-model-engagement"
    tracks: ["engineering","leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A customer wants to replace a proprietary frontier-model API with an open model. How would you run the engagement?
      ru: >-
        Клиент хочет заменить API закрытой передовой модели открытой моделью. Как вы организуете проект?
    tests:
      en: >-
        Whether the migration plan tests quality, operating costs and ownership assumptions.
      ru: >-
        Проверяет ли план миграции качество, эксплуатационные расходы и предположения об ответственности.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
  - id: "app-robot-data-collection"
    tracks: ["engineering","leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A robotics customer requests 50,000 hours of demonstrations across twelve tasks and three robot types. How would you organise collection and decide what data to keep?
      ru: >-
        Заказчик в робототехнике просит 50 000 часов демонстраций для двенадцати задач и трёх типов роботов. Как организовать сбор и отбирать данные?
    tests:
      en: >-
        Whether collection targets are tied to coverage and usable demonstrations rather than hours alone.
      ru: >-
        Связываете ли вы объём сбора с покрытием и пригодностью демонстраций, а не только часами.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
  - id: "app-diligence-economics"
    tracks: ["engineering","leadership"]
    type: "applied_scenario"
    level: "senior"
