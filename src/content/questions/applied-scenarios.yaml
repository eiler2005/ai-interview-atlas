        company: "palantir"
  - id: "app-decline-migration"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        A prospective customer already runs on H100 GPUs. When would you recommend that they keep their current setup?
      ru: >-
        Потенциальный клиент уже использует GPU H100. В каких случаях вы посоветуете сохранить текущую систему?
    tests:
      en: >-
        Whether you can reject a migration when customer economics do not justify it.
      ru: >-
        Умеете ли вы отказаться от миграции, если экономика клиента её не оправдывает.
    provenance: "published"
    added: "2026-09-26"
