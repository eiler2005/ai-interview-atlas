    tests:
      en: >-
        Whether you identify record ownership, conflicts and recovery semantics.
      ru: >-
        Умеете ли вы определить владельца записи, правила конфликтов и восстановление.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-palantir-fde"
        company: "palantir"
    outline:
