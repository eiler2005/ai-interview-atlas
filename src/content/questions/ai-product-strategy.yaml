theme: "ai-product-strategy"
questions:
  - id: "prod-enterprise-assistant"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        How would you improve ChatGPT for enterprise customers?
      ru: >-
        Как бы вы улучшили ChatGPT для корпоративных клиентов?
    tests:
      en: >-
        Whether you select a specific workflow and justify its business value.
      ru: >-
        Умеете ли вы выбрать конкретный рабочий процесс и обосновать его ценность.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-openai-pm"
        company: "openai"
    start_here: ["leadership"]
    priority: 6
    outline:
      en:
        - "Choose a customer segment, user and costly workflow problem."
        - "Compare AI and non-AI solutions, integration effort and trust requirements."
        - "Define a pilot outcome, quality guardrails and a rollout decision."
      ru:
        - "Выбрать сегмент клиентов, пользователя и существенную проблему рабочего процесса."
        - "Сравнить AI- и обычные решения, сложность интеграции и требования к доверию."
        - "Определить результат пилота, ограничения по качеству и условие расширения запуска."
    answer:
      en: "Improving an enterprise assistant starts with a segment and one workflow, not a feature list. I would look for a recurring task where the answer already exists inside the company but is expensive to find and assemble, for example drafting a response against internal policies, and describe a specific user and the point where they get stuck. Then an honest comparison: if search, a template or rules solve it, the model is not needed. For enterprise customers demos do not decide anything, integration and trust do: sign in through corporate accounts, permissions inherited from the source, logging, and requirements on data storage and processing. I would bound the pilot with an outcome announced in advance: time on task, share of tasks finished without rework, quality guardrails, and the condition for expanding. The weakness of pilots is that enthusiasts do not predict behaviour under mandatory rollout."
      ru: "Улучшение корпоративного ассистента начинается с выбора сегмента и одного рабочего процесса, а не со списка возможностей. Я бы искал регулярную задачу, где ответ уже существует внутри компании, но его дорого найти и собрать — например, подготовка ответа по внутренним регламентам, — и описал бы конкретного пользователя и место, где он буксует. Дальше честное сравнение: если задача решается поиском, шаблоном или правилами, модель не нужна. Для корпоративных клиентов решают не демонстрации, а интеграция и доверие — вход через корпоративные учётные записи, наследование прав от источника, журналирование, требования к хранению и обработке данных. Пилот я бы ограничил заранее объявленным результатом: время на задачу, доля задач, доведённых до конца без переделки, ограничения по качеству и условие расширения. Слабое место пилотов в том, что энтузиасты не предсказывают поведение при обязательном внедрении."
    reading: ["paper-heart","google-rules-of-ml"]
  - id: "prod-capability-cost"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        A model offers much greater capability but costs ten times as much. How would you decide what product to build with it?
      ru: >-
        Модель существенно мощнее, но стоит в десять раз дороже. Как решить, какой продукт на ней создавать?
    tests:
      en: >-
        Whether you translate capability into willingness to pay and unit economics.
      ru: >-
        Умеете ли вы связать возможности модели с готовностью платить и экономикой продукта.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-openai-pm"
        company: "openai"
    start_here: ["leadership"]
    priority: 7
    outline:
      en:
        - "Identify tasks where the improvement changes the feasible outcome."
        - "Estimate cost per successful workflow, including retries and human review."
        - "Test willingness to pay and consider selective routing before broad deployment."
      ru:
        - "Найти задачи, где улучшение делает возможным новый результат."
        - "Оценить стоимость успешно выполненного процесса с повторами и проверкой человеком."
        - "Проверить готовность платить и выборочное использование модели до массового внедрения."
    answer:
      en: "The question is whether gains make previously untrusted tasks acceptable: where mandatory human review was required before and spot checks are now enough. You count not the price of a token but the cost of a successfully completed workflow, including retries, review and the cost of error. Three attempts of a cheap model still cost less in tokens than one of a model ten times the price, so the expensive one wins where the cheap one can't reach the bar at any number of retries, or where human review time and the cost of a mistake dominate the bill. You pay in latency, complexity and dependence on a single provider. I'd measure that cost on my own task set, test willingness to pay on a narrow segment, and turn on selective routing: the expensive model only for hard cases or cases where an error is costly, the cheap one as the base. The limit is that if users don't notice the difference in outcome, no quality gain pays for itself, and prices and capabilities move faster than product plans."
      ru: "Решает не абстрактная мощность, а наличие задач, где прирост качества делает допустимой работу, которую раньше нельзя было доверить модели: там, где раньше требовалась обязательная проверка человеком, а теперь достаточно выборочной. Считать надо не цену токена, а стоимость успешно завершённого процесса с учётом повторов, проверки и цены ошибки. По токенам три попытки дешёвой модели всё равно стоят меньше одной попытки модели, которая в десять раз дороже, поэтому дорогая выигрывает там, где дешёвая не дотягивает до планки ни с каким числом повторов, или там, где в счёте преобладают время проверки человеком и цена ошибки. Платите вы задержкой, сложностью и зависимостью от одного поставщика. Я бы измерил эту стоимость на своём наборе задач, проверил готовность платить на узком сегменте и включил выборочную маршрутизацию: дорогая модель только на сложных или дорогих по ошибке случаях, дешёвая как основа. Ограничение в том, что если пользователь не замечает разницы в результате, никакой прирост качества не окупается, а цены и возможности моделей меняются быстрее продуктовых планов."
    reading: ["google-rules-of-ml","paper-heart"]
  - id: "prod-ai-suitability"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        How do you decide whether an LLM is useful for a proposed product problem?
      ru: >-
        Как определить, полезна ли LLM для предложенной продуктовой задачи?
    tests:
      en: >-
        Whether you start with the task and evidence rather than the technology.
      ru: >-
        Начинаете ли вы с задачи и данных, а не с технологии.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-gemini-pm"
        company: "google"
    start_here: ["leadership"]
    priority: 8
    outline:
      en:
        - "Describe the job, baseline solution and cost of mistakes."
        - "Check data access, evaluability, latency and the need for predictable behaviour."
        - "Run a bounded comparison and name a reason to reject the LLM approach."
      ru:
        - "Описать задачу пользователя, базовое решение и цену ошибки."
        - "Проверить доступ к данным, возможность оценки, задержку и требования к предсказуемости."
        - "Провести ограниченное сравнение и назвать основание отказаться от LLM."
    answer:
      en: "An LLM earns its place where inputs are too messy for rules and a mistake is cheap or caught before it does harm, and I establish that from the job, not the model: what the user is trying to do, how it's done today, what an error costs and who sees it. The non-obvious trade-off is coverage against variability: the model handles free text and odd documents that rules can't parse, but the same input can give different outputs, and its failures can't be listed in advance the way a rule's can. Where the value is exact repeatability, the model is at most an interface over a deterministic system. Then I check data access, whether correct can be defined and labelled, and the latency budget. The comparison is the LLM against the best simple baseline on labelled real cases, scoring the error that matters weighted by its cost, plus cost and latency per task, with a rejection rule stated up front. If correct can't be defined or labelled, the answer is no LLM yet: build the measurement first."
      ru: "LLM оправдана там, где входные данные слишком разнородны для правил, а ошибка дешева или перехватывается до того, как навредит, и выясняю я это, отталкиваясь от задачи, а не от модели: что человек пытается сделать, как это делается сегодня, сколько стоит ошибка и кто её увидит. Неочевидный компромисс — покрытие против вариативности: модель справляется со свободным текстом и нестандартными документами, которые правила не разберут, но один и тот же вход может дать разные ответы, а её сбои нельзя заранее перечислить, как сбои правила. Где ценность в точной воспроизводимости, модель в лучшем случае интерфейс поверх детерминированной системы. Дальше проверяю доступ к данным, можно ли определить и разметить правильный результат, и бюджет задержки. Сравниваю LLM с лучшим простым базовым решением на размеченных реальных случаях, считая важную ошибку с весом её цены, плюс стоимость и задержку на задачу, а правило отказа формулирую заранее. Если правильный результат нельзя определить или разметить, вывод — пока без LLM: сначала нужно научиться измерять."
    reading: ["google-rules-of-ml","anthropic-building-effective-agents"]
  - id: "prod-student-assistant"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Design a Gemini-based assistant for university students.
      ru: >-
        Спроектируйте ассистента на основе Gemini для студентов университета.
    tests:
      en: >-
        Whether a clear user need drives scope, learning outcomes and safeguards.
      ru: >-
        Определяет ли понятная потребность пользователя функции, учебные результаты и защитные меры.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-gemini-pm"
        company: "google"
    start_here: ["leadership"]
    priority: 9
    outline:
      en:
        - "Pick a student segment and one recurring unmet need."
        - "Design a usable flow with uncertainty, verification and misuse in mind."
        - "Measure task success and learning value alongside retention."
      ru:
        - "Выбрать сегмент студентов и одну регулярную неудовлетворённую потребность."
        - "Спроектировать удобный сценарий с учётом неопределённости, проверки и злоупотреблений."
        - "Измерять успешность задачи и пользу для обучения наряду с удержанием."
    answer:
      en: "I would drop the universal helper and pick one segment with one recurring need, say first year students preparing for an exam in a specific subject, and make the course materials the source rather than the whole internet. The flow is built around understanding: the assistant works through the mistake, asks questions back and points to the place in the materials instead of producing the finished assignment; uncertainty is stated out loud, and copying is treated as the main abuse model and limited in the product, with academic integrity rules in mind. I would measure task success, learning value through a delayed knowledge check, and only then retention. That is exactly where the boundary runs: retention can grow from harm, because students love an assistant that does the work for them even though it makes their learning worse, and without a learning metric you will not see it."
      ru: "Я бы отказался от универсального помощника и выбрал один сегмент с одной регулярной потребностью — скажем, студенты первого курса, готовящиеся к экзамену по конкретному предмету, — а источником сделал бы материалы курса, а не интернет целиком. Сценарий строится вокруг понимания: ассистент разбирает ошибку, задаёт встречные вопросы и показывает место в материалах, а не выдаёт готовый текст задания; неуверенность проговаривается прямо, а списывание рассматривается как основная модель злоупотребления и ограничивается продуктово, с учётом правил академической честности. Измерять я бы стал успешность задачи, пользу для обучения на отложенной проверке знаний и только затем удержание. Именно здесь и проходит граница: удержание может расти от вреда, потому что ассистента, решающего задания за студента, любят, хотя учебный результат он ухудшает, и без учебной метрики это незаметно."
    reading: ["paper-heart","nist-ai-rmf"]
  - id: "prod-confident-errors"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Users say Gemini gives incorrect answers with excessive confidence. What would you change?
      ru: >-
        Пользователи жалуются, что Gemini уверенно даёт неверные ответы. Что вы измените?
    tests:
      en: >-
        Whether you diagnose failure types and improve calibrated user trust.
      ru: >-
        Умеете ли вы различать причины ошибок и формировать обоснованное доверие.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-gemini-pm"
        company: "google"
    start_here: ["leadership"]
    priority: 10
    outline:
      en:
        - "Collect representative failures and separate knowledge, retrieval and presentation issues."
        - "Compare grounding, abstention and interaction changes on the same tasks."
        - "Track unsupported claims, useful task completion and segment-level regressions."
      ru:
        - "Собрать типичные ошибки и разделить проблемы знаний, поиска и подачи ответа."
        - "Сравнить опору на источники, отказ от ответа и изменения интерфейса на одинаковых задачах."
        - "Отслеживать неподтверждённые утверждения, полезное выполнение задач и регрессии по сегментам."
    answer:
      en: "First I would stop treating this as one problem and split the complaints by cause: the model does not know the fact, retrieval brought back the wrong thing or nothing, or the answer is presented so that the confidence does not match the grounds. Those are three different fixes. Grounding in sources reduces invention but adds latency and moves quality onto retrieval; abstention can reduce exposure to wrong answers but irritates people when it fires without reason; interface changes like showing citations and marking unverified claims are cheap and shift trust without touching the model. So I would compare those options on the same task set rather than by feel, and watch the share of claims with no source support, useful task completion, and regressions by segment. Calibration aligns confidence with observed correctness; it does not fix factual errors. Abstention and interface choices change exposure, and warnings may be ignored."
      ru: "Сначала я бы перестал считать это одной проблемой и разобрал жалобы на причины: модель не знает факта, поиск принёс не то или ничего, либо ответ подан так, что уверенность не соответствует основанию. Это три разных исправления. Опора на источники уменьшает выдумки, но добавляет задержку и переносит качество на поиск; отказ отвечать может снизить воздействие неверных ответов, но раздражает, когда срабатывает не по делу; изменения интерфейса вроде показа цитат и пометки непроверенного стоят дёшево и меняют доверие, не трогая модель. Поэтому сравнивал бы эти варианты на одном наборе задач, а не по ощущениям, и следил бы за долей утверждений без подтверждения источником, полезным выполнением задач и регрессиями по сегментам. Калибровка согласует уверенность с наблюдаемой правильностью, но не исправляет фактические ошибки. Отказы и интерфейс меняют воздействие ошибок, а предупреждения могут игнорироваться."
    reading: ["nist-ai-rmf","anthropic-evals-for-agents"]
  - id: "prod-writing-priorities"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        How would you prioritise features for an AI writing assistant in Microsoft Word?
      ru: >-
        Как вы расставите приоритеты функций AI-ассистента для письма в Microsoft Word?
    tests:
      en: >-
        Whether prioritisation accounts for user value, reliability and workflow fit.
      ru: >-
        Учитывает ли приоритизация пользу, надёжность и соответствие рабочему процессу.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-microsoft-ai-pm"
        company: "microsoft"
    start_here: ["leadership"]
    priority: 11
    outline:
      en:
        - "Segment writing tasks and identify friction in the existing workflow."
        - "Compare expected value, quality risk, engineering cost and dependencies."
        - "Choose a narrow first release and measure accepted, useful assistance."
      ru:
        - "Разделить задачи письма и найти трудности в текущем процессе."
        - "Сопоставить ожидаемую пользу, риск качества, трудоёмкость и зависимости."
        - "Выбрать узкий первый релиз и измерять принятую пользователем полезную помощь."
    answer:
      en: "Prioritisation starts by splitting writing into distinct tasks: drafting from scratch, rewriting an existing passage, shortening, fixing tone and grammar, and merging several documents. For each I'd find the point where the person gets stuck today and compare expected value, quality risk, engineering cost and dependencies such as access rights to the document. The risk here is asymmetric: a suggestion next to the text is cheap when it is wrong, while a sweeping edit of someone else's document is expensive, so tasks with a visible, reversible result on a selected fragment come first. The first release should be narrow, and I'd measure not the volume generated but the assistance a user accepted: the share of inserted text still in the document later, and the share of undos. The limit is that acceptance is not quality, people accept an edit to avoid arguing, so text quality needs a separate check."
      ru: "Приоритизация начинается с разбиения письма на разные задачи: черновик с нуля, переписывание готового куска, сокращение, правка тона и грамматики, сведение нескольких документов. Для каждой я бы нашёл место, где человек буксует сегодня, и сопоставил ожидаемую пользу, риск качества, трудоёмкость и зависимости вроде прав доступа к документу. Риск здесь несимметричен: подсказка рядом с текстом дешева в ошибке, а массовая правка чужого документа дорога, поэтому вперёд выходят задачи с видимым и обратимым результатом на выделенном фрагменте. Первый релиз стоит сделать узким и измерять не объём сгенерированного, а принятую пользователем помощь: доля вставленного и сохранившегося в документе спустя время, доля отката. Ограничение в том, что принятие не равно качеству — люди соглашаются с правкой, чтобы не спорить, поэтому нужна отдельная проверка качества текста."
    reading: ["paper-heart","google-rules-of-ml"]
  - id: "prod-ai-feature-metrics"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        How would you measure success for an AI feature in a Microsoft product?
      ru: >-
        Как вы измерите успех AI-функции в продукте Microsoft?
    tests:
      en: >-
        Whether metrics connect model behaviour to user and business outcomes.
      ru: >-
        Связывают ли метрики поведение модели с результатами для пользователя и бизнеса.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-microsoft-ai-pm"
        company: "microsoft"
    start_here: ["leadership"]
    priority: 12
    outline:
      en:
        - "Name the user goal and an observable successful task."
        - "Separate adoption, retention, task quality, latency and cost."
        - "Use a baseline or experiment and guard against metric gaming."
      ru:
        - "Назвать цель пользователя и наблюдаемый признак успешно выполненной задачи."
        - "Разделить внедрение, удержание, качество задачи, задержку и стоимость."
        - "Использовать базовую линию или эксперимент и учитывать манипулирование метриками."
    answer:
      en: "Success is an observable completed task, and model metrics explain why it moves but never prove value. Take a feature that drafts replies: success is a draft that gets sent with light edits. Then I'd keep the layers apart: adoption as the share of eligible users who tried it, retention as the share still using it weeks later, task quality as the share of drafts sent and how much was edited or discarded, p95 latency, and cost per sent draft, with eval-set scores underneath as diagnosis. The real trade-off is the comparison: a holdout group is the only clean read on cause, but it withholds the benefit and needs weeks to show retention, while before and after is cheap and confounded by novelty and season. Against gaming, every volume metric gets a paired quality metric that falls when volume is inflated: count an impression as usage and adoption rises while the share sent drops. The limit: even a clean experiment misses trust effects that take months, and outputs used outside the product need sampled human rating."
      ru: "Успех — это наблюдаемо выполненная задача, а модельные метрики объясняют, почему он меняется, но не доказывают пользу. Возьмём функцию, которая готовит черновики ответов: успех — черновик, отправленный с небольшой правкой. Дальше я бы развёл слои: внедрение — доля пользователей с доступом к функции, которые её попробовали, удержание — доля тех, кто пользуется ею спустя недели, качество задачи — доля отправленных черновиков и объём правки или удалений, задержка по p95 и стоимость на отправленный черновик, а оценки на eval-наборе лежат ниже как диагностика. Настоящий компромисс — в способе сравнения: контрольная группа без функции — единственный чистый способ установить причину, но она лишает часть людей пользы и требует недель, чтобы увидеть удержание, а сравнение до и после дёшево, но смешано с эффектом новизны и сезонностью. Против накрутки каждая метрика объёма получает парную метрику качества, которая падает при раздувании объёма: засчитайте показ за использование — внедрение вырастет, а доля отправленных упадёт. Ограничение: даже чистый эксперимент не видит эффектов доверия, которые проявляются месяцами, а результаты, которые используются вне продукта, требуют выборочной оценки людьми."
    reading: ["paper-heart"]
  - id: "prod-search-north-star"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        What North Star metric would you choose for an AI search product, and what would constrain it?
      ru: >-
        Какую главную метрику вы выберете для AI-поиска и какими ограничениями её дополните?
    tests:
      en: >-
        Whether one headline metric remains accountable to trust and task completion.
      ru: >-
        Остаётся ли главная метрика связанной с доверием и выполнением задачи.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-perplexity-ai-pm"
        company: "perplexity"
    start_here: ["leadership"]
    priority: 13
    outline:
      en:
        - "Define a valuable completed search task and how to observe it."
        - "Add quality, safety, latency and cost guardrails."
        - "Explain denominator, segmentation and how the metric could mislead."
      ru:
        - "Определить полезно завершённую поисковую задачу и способ её наблюдать."
        - "Добавить ограничения по качеству, безопасности, задержке и стоимости."
        - "Объяснить знаменатель, сегментацию и ситуации, когда метрика вводит в заблуждение."
    answer:
      en: "I would make the headline metric the share of sessions with a usefully completed search task, not clicks and not time on page, because both rise when the answer is bad. Completion has to be observed indirectly: the user did not rephrase, took the next action, and if they opened a source, did not come straight back. In an answer product a click-out alone is ambiguous: it can mean checking the answer or that the answer fell short, and a satisfied user may not click at all, so these signals are calibrated against human labelling. Any single metric pushes you to an extreme, so you add guardrails around it: the share of claims with no source support, safety, latency and cost per query, and a regression in any of them cancels the gain. I would explain the denominator separately: do we count sessions or queries, what we do with bots and repeats, how we segment by language and task type. For navigational and entertainment queries completion is poorly defined, and there the metric misleads."
      ru: "Главной метрикой я бы сделал долю сессий с полезно завершённой поисковой задачей, а не клики и не время на странице, потому что и то и другое растёт при плохом ответе. Наблюдать завершение приходится косвенно: пользователь не переформулировал запрос, выполнил следующее действие, а если открыл источник, то не вернулся сразу. В сервисе ответов сам по себе переход к источнику неоднозначен: это может быть и проверка ответа, и признак того, что ответа не хватило, а довольный пользователь может вообще никуда не переходить, поэтому такие сигналы калибруют по разметке людьми. Любая единственная метрика толкает в крайность, поэтому её дополняют ограничениями: доля утверждений без подтверждения источником, безопасность, задержка и стоимость запроса — ухудшение любого из них отменяет прирост. Отдельно объясняю знаменатель: считаем сессии или запросы, что делаем с ботами и повторами, как сегментируем по языку и типу задачи. В навигационных и развлекательных запросах завершение плохо определимо, и там метрика вводит в заблуждение."
    reading: ["paper-heart"]
  - id: "prod-notification-paradox"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Notification engagement rises while total time spent remains flat. How would you interpret that result?
      ru: >-
        Вовлечённость в уведомления растёт, а общее время в продукте не меняется. Как вы объясните результат?
    tests:
      en: >-
        Whether you distinguish substitution, measurement artifacts and real user value.
      ru: >-
        Различаете ли вы замещение активности, артефакты измерения и пользу пользователю.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-report-meta-ai-pm"
        company: "meta"
    start_here: ["leadership"]
    priority: 14
    outline:
      en:
        - "Check definitions, exposure, cohorts and the experiment setup."
        - "Test whether notifications shift existing activity or create valuable new actions."
        - "Include opt-outs, satisfaction and longer-term effects before deciding."
      ru:
        - "Проверить определения, показы, когорты и устройство эксперимента."
        - "Проверить, перераспределяют ли уведомления активность или создают новые полезные действия."
        - "Учесть отключения уведомлений, удовлетворённость и долгосрочный эффект."
    answer:
      en: "The first hypothesis is substitution: notifications may not create activity but move it out of organic visits, so total time does not change. But before explaining behaviour I would check the measurement: do the definitions of engagement and time match, did impressions simply grow, are cohorts of new and existing users mixed together, and was this an experiment with a control or a before and after comparison. Then the substantive question: do notifications lead to actions that would not have happened otherwise, or to the same actions just earlier. Look at opt-outs and unsubscribes, complaints, satisfaction and retention over a long horizon, because a short-term rise in clicks is often paid for by losing the channel. Finally, flat time does not by itself mean there is no value: the product may have become more useful in less time, and that is a fine outcome."
      ru: "Первая гипотеза — замещение: уведомления, возможно, не создают активность, а переносят её из органических заходов, поэтому суммарное время не меняется. Но прежде чем объяснять поведение, я бы проверил измерение: совпадают ли определения вовлечённости и времени, не выросли ли просто показы, не смешаны ли когорты новых и старых пользователей и был ли это эксперимент с контролем или сравнение до и после. Дальше содержательный вопрос: приводят ли уведомления к действиям, которых без них не было, или к тем же самым, просто раньше. Смотреть надо отключения и отписки, жалобы, удовлетворённость и удержание на длинном горизонте, потому что краткосрочный рост кликов часто оплачивается потерей канала. Наконец, неизменное время само по себе не означает отсутствия пользы: продукт мог стать полезнее при меньшем времени, и это нормальный исход."
    reading: ["paper-heart"]
  - id: "prod-favorite-agent"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Choose an AI agent or product you use and propose its most valuable improvement.
      ru: >-
        Выберите AI-агента или продукт, которым пользуетесь, и предложите самое полезное улучшение.
    tests:
      en: >-
        Whether product judgement rests on observed friction and a testable hypothesis.
      ru: >-
        Основано ли продуктовое суждение на наблюдаемой проблеме и проверяемой гипотезе.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-amazon-ai-pm"
        company: "amazon"
    start_here: ["leadership"]
    priority: 15
    outline:
      en:
        - "Describe a real workflow and where the product fails the user."
        - "Explain why the proposed improvement outranks alternatives."
        - "Specify a prototype, success measure and possible adverse effect."
      ru:
        - "Описать реальный сценарий и момент, в котором продукт подводит пользователя."
        - "Объяснить, почему выбранное улучшение важнее альтернатив."
        - "Определить прототип, критерий успеха и возможный негативный эффект."
    answer:
      en: "Pick a product you use often enough to have watched it fail repeatedly in real work, and choose the failure where your own workaround costs the most. The interviewer is scoring whether your judgement rests on observed friction with a frequency and a cost rather than on a feature you'd like, so say how often it happens, what it costs in time or redone work, and what you do instead. Then show prioritisation: name two or three other improvements and rank them on frequency, cost and how many users plausibly share the problem, admitting where your own usage is unusual. Close with the cheapest test of the hypothesis, often a mock-up or a person simulating the behaviour behind the interface, with one success criterion fixed in advance and the side effect you'd watch, since most fixes cost latency, privacy or extra steps. The usual mistake is a wish list or invented internal metrics. From outside you can't measure the effect directly, so say so and name a proxy you could observe, such as retries or abandoned sessions."
      ru: "Возьмите продукт, которым пользуетесь достаточно часто, чтобы не раз видеть, как он подводит вас в реальной работе, и выберите сбой, на обход которого у вас уходит больше всего сил. Интервьюер оценивает, опирается ли ваше суждение на наблюдаемую проблему с частотой и ценой, а не на функцию, которую вам хотелось бы, поэтому скажите, как часто это случается, сколько стоит во времени или переделанной работе и что вы делаете вместо этого. Затем покажите приоритизацию: назовите два-три других улучшения и расставьте их по частоте, цене и тому, у скольких пользователей, по всей видимости, та же проблема, честно отметив, чем ваше использование нетипично. Закончите самым дешёвым способом проверить гипотезу — часто это макет или человек, изображающий нужное поведение за интерфейсом, — с одним критерием успеха, заданным заранее, и побочным эффектом, за которым будете следить: почти любое исправление чего-то стоит: задержки, приватности или лишних шагов. Типичная ошибка — список пожеланий или выдуманные внутренние метрики. Снаружи эффект напрямую не измерить, так и скажите и назовите прокси-метрику, которую можно наблюдать, например повторные запросы или брошенные сессии."
    reading: ["paper-heart"]
  - id: "prod-memory-machine-launch"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        You have invented a memory machine that generates video, images, smells and sounds. How would you bring it to market?
      ru: >-
        Вы изобрели «машину воспоминаний», которая создаёт видео, изображения, запахи и звуки. Как вывести её на рынок?
    tests:
      en: >-
        Whether you turn an unfamiliar capability into a focused market entry.
      ru: >-
        Умеете ли вы превратить непривычную возможность в конкретную стратегию выхода на рынок.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-openai-pm"
        company: "openai"
    outline:
      en:
        - "Choose one beachhead user and occasion, and only the senses that occasion actually needs."
        - "Measure repeat paid use, with guardrails on user distress and the consent of people depicted."
        - "Test willingness to pay with a hand-run concierge pilot before building scent hardware."
      ru:
        - "Выбрать первый сегмент и повод и оставить только те модальности, без которых этот повод не работает."
        - "Измерять повторное платное использование с ограничениями по дистрессу пользователей и согласию изображённых людей."
        - "Проверить готовность платить на пилоте, проводимом вручную, до разработки устройства для запахов."
  - id: "prod-agent-use-cases"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Which business use cases suit AI agents, and how would you compare them?
      ru: >-
        Какие бизнес-сценарии подходят для AI-агентов и как их сравнить?
    tests:
      en: >-
        Whether you distinguish the value of autonomous action from its operational cost.
      ru: >-
        Различаете ли вы пользу автономных действий и их эксплуатационную цену.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-microsoft-ai-pm"
        company: "microsoft"
    start_here: ["leadership"]
    priority: 42
    outline:
      en:
        - "Score candidates on volume, a verifiable outcome, tolerance for error and reversibility."
        - "Separate the value of the action taken from the cost of supervising and correcting it."
        - "Compare against the cheaper option: a prompt, a fixed workflow or ordinary automation."
      ru:
        - "Оценивать сценарии по объёму, проверяемости результата, допустимости ошибки и обратимости."
        - "Отделять пользу совершённого действия от стоимости надзора и исправлений."
        - "Сравнивать с более дешёвым вариантом: промптом, фиксированным процессом или обычной автоматизацией."
    answer:
      en: "I rank candidates on a few properties rather than on enthusiasm. Volume and repetition, because the payoff is per execution; a verifiable outcome, so success can be checked without a human reading everything; tolerance for error, since an agent will be wrong sometimes and the question is what that costs; and whether the actions are reversible. Support triage, back-office data work and research-and-summarise tasks usually score well; anything irreversible and regulated usually does not. The comparison I insist on is against the cheaper thing: a single prompt, a fixed workflow, or ordinary automation. Autonomy is worth paying for only when the path genuinely varies per case, because agents cost more per task and add supervision, audit and incident work that never appears in the demo. So I would pilot with the hardest measurable slice, and count the human minutes spent correcting it, not just the tasks completed."
      ru: "Я ранжирую сценарии по нескольким свойствам, а не по энтузиазму. Объём и повторяемость, потому что выгода возникает на каждом исполнении; проверяемый результат, чтобы успех можно было подтвердить без человека, читающего всё; допустимость ошибки, поскольку агент иногда будет неправ и вопрос в цене этого; и обратимость действий. Триаж поддержки, бэк-офисная работа с данными и задачи «найти и обобщить» обычно проходят хорошо; необратимое и регулируемое — обычно нет. Сравнение, на котором я настаиваю, — против более дешёвого варианта: одного промпта, фиксированного процесса или обычной автоматизации. Автономия стоит своих денег лишь тогда, когда путь действительно различается от случая к случаю: агенты дороже на задачу и добавляют надзор, аудит и разбор инцидентов, которых не видно в демо. Поэтому пилот я бы начал с самого трудного измеримого куска и считал минуты человека, ушедшие на исправления, а не только выполненные задачи."
    reading: ["anthropic-building-effective-agents"]
  - id: "prod-model-choice"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "knowledge"
    level: "senior"
    text:
      en: >-
        Explain the product trade-offs in choosing a model.
      ru: >-
        Объясните продуктовые компромиссы при выборе модели.
    tests:
      en: >-
        Whether model selection considers task quality, cost, latency and constraints together.
      ru: >-
        Учитываете ли вы одновременно качество на задаче, цену, задержку и ограничения.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-microsoft-ai-pm"
        company: "microsoft"
    start_here: ["leadership"]
    priority: 41
    outline:
      en:
        - "Fix the task and a quality bar first, then measure candidate models on your own data."
        - "Compare cost per successful outcome and latency as the user experiences it."
        - "Add the constraints that disqualify a model: deployment region, data handling, change over time."
      ru:
        - "Сначала зафиксировать задачу и планку качества, затем измерить модели-кандидаты на своих данных."
        - "Сравнить стоимость успешного результата и задержку в том виде, в каком её чувствует пользователь."
        - "Добавить ограничения, отсекающие модель: регион развёртывания, обращение с данными, изменения со временем."
    answer:
      en: "I'd fix the task and a pass criterion before running anything, on real product examples, because leaderboard gaps can shrink or reverse on your own distribution. For each candidate I'd measure pass rate, cost per passing output including retries and the human time spent fixing failures, and p95 latency end to end with retrieval and tool calls, since that's what the user waits for. The non-obvious trade-off is with reasoning models: they can lift the pass rate and still lose on cost and latency, because their reasoning tokens are billed as output and spent before the answer starts. That can win a batch task and disqualify an interactive one, which is why routing only the hard cases to them often beats choosing one model. Then the constraints act as filters, not weights: where the model may run, what data may be sent and whether the provider keeps it, and how often versions change or retire. If only one model clears them, there's nothing to compare, and the real work is keeping the evaluation runnable for its next version."
      ru: "Задачу и критерий прохождения я бы зафиксировал до любых прогонов, на реальных примерах продукта, потому что разрыв на лидербордах на собственном распределении может сократиться или перевернуться. Для каждого кандидата измерил бы долю прохождения, стоимость прошедшего ответа с учётом повторов и времени людей на исправление сбоев и p95 задержки от начала до конца, с поиском и вызовами инструментов, — именно этого ждёт пользователь. Неочевидный компромисс связан с рассуждающими моделями: они могут поднять долю прохождения и всё равно проиграть по стоимости и задержке, потому что токены рассуждения оплачиваются как выходные и тратятся до начала ответа. В пакетной обработке такая модель может победить, а для интерактивного сценария оказаться неприемлемой, поэтому направлять к ней только трудные случаи часто лучше, чем выбирать одну модель на всё. Дальше ограничения работают как фильтры, а не как веса: где модель можно развернуть, какие данные ей можно отправлять и хранит ли их провайдер, как часто версии меняются и выводятся из эксплуатации. Если ограничения проходит только одна модель, сравнивать нечего, и настоящая работа — держать оценку готовой к её следующей версии."
    reading: ["openai-reasoning-models"]
