  - id: "prod-agent-use-cases"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Which business use cases suit AI agents, and how would you compare them?
      ru: >-
        Какие бизнес-сценарии подходят для AI-агентов и как их сравнить?
    tests:
      en: >-
        Whether you distinguish the value of autonomous action from its operational cost.
      ru: >-
        Различаете ли вы пользу автономных действий и их эксплуатационную цену.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-microsoft-ai-pm"
        company: "microsoft"
    start_here: ["leadership"]
    priority: 42
    outline:
      en:
        - "Score candidates on volume, a verifiable outcome, tolerance for error and reversibility."
        - "Separate the value of the action taken from the cost of supervising and correcting it."
        - "Compare against the cheaper option: a prompt, a fixed workflow or ordinary automation."
      ru:
        - "Оценивать сценарии по объёму, проверяемости результата, допустимости ошибки и обратимости."
        - "Отделять пользу совершённого действия от стоимости надзора и исправлений."
        - "Сравнивать с более дешёвым вариантом: промптом, фиксированным процессом или обычной автоматизацией."
    answer:
      en: "I rank candidates on a few properties rather than on enthusiasm. Volume and repetition, because the payoff is per execution; a verifiable outcome, so success can be checked without a human reading everything; tolerance for error, since an agent will be wrong sometimes and the question is what that costs; and whether the actions are reversible. Support triage, back-office data work and research-and-summarise tasks usually score well; anything irreversible and regulated usually does not. The comparison I insist on is against the cheaper thing: a single prompt, a fixed workflow, or ordinary automation. Autonomy is worth paying for only when the path genuinely varies per case, because agents cost more per task and add supervision, audit and incident work that never appears in the demo. So I would pilot with the hardest measurable slice, and count the human minutes spent correcting it, not just the tasks completed."
      ru: "Я ранжирую сценарии по нескольким свойствам, а не по энтузиазму. Объём и повторяемость, потому что выгода возникает на каждом исполнении; проверяемый результат, чтобы успех можно было подтвердить без человека, читающего всё; допустимость ошибки, поскольку агент иногда будет неправ и вопрос в цене этого; и обратимость действий. Триаж поддержки, бэк-офисная работа с данными и задачи «найти и обобщить» обычно проходят хорошо; необратимое и регулируемое — обычно нет. Сравнение, на котором я настаиваю, — против более дешёвого варианта: одного промпта, фиксированного процесса или обычной автоматизации. Автономия стоит своих денег лишь тогда, когда путь действительно различается от случая к случаю: агенты дороже на задачу и добавляют надзор, аудит и разбор инцидентов, которых не видно в демо. Поэтому пилот я бы начал с самого трудного измеримого куска и считал минуты человека, ушедшие на исправления, а не только выполненные задачи."
    reading: ["anthropic-building-effective-agents"]
  - id: "prod-model-choice"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "knowledge"
    level: "senior"
    text:
      en: >-
        Explain the product trade-offs in choosing a model.
      ru: >-
        Объясните продуктовые компромиссы при выборе модели.
    tests:
      en: >-
        Whether model selection considers task quality, cost, latency and constraints together.
      ru: >-
        Учитываете ли вы одновременно качество на задаче, цену, задержку и ограничения.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-microsoft-ai-pm"
        company: "microsoft"
    start_here: ["leadership"]
    priority: 41
    outline:
      en:
        - "Fix the task and a quality bar first, then measure candidate models on your own data."
        - "Compare cost per successful outcome and latency as the user experiences it."
        - "Add the constraints that disqualify a model: deployment region, data handling, change over time."
      ru:
        - "Сначала зафиксировать задачу и планку качества, затем измерить модели-кандидаты на своих данных."
        - "Сравнить стоимость успешного результата и задержку в том виде, в каком её чувствует пользователь."
        - "Добавить ограничения, отсекающие модель: регион развёртывания, обращение с данными, изменения со временем."
    answer:
      en: "The choice only means something once the task and a quality bar are fixed and then measured on our own examples, not on public leaderboards that rarely resemble the product. With that in place the comparison has four axes that trade against each other: quality on the task, cost, latency, and the constraints that simply disqualify a candidate — where it may be deployed, what may be sent to it, whether the provider retains data. Cost belongs per successful outcome rather than per token, because a cheaper model that needs retries or human correction is often the expensive one, and latency matters as the user feels it, including retrieval and tool calls. The decision is also not permanent: models and prices move, so keeping the evaluation runnable and the integration swappable is worth more than picking this quarter's best model."
      ru: "Выбор обретает смысл только когда зафиксированы задача и планка качества, а затем измерены на наших собственных примерах, а не на публичных лидербордах, которые редко похожи на продукт. Дальше сравнение идёт по четырём осям, которые конфликтуют между собой: качество на задаче, стоимость, задержка и ограничения, просто отсекающие кандидата, — где его разрешено развернуть, что ему можно отправлять, сохраняет ли провайдер данные. Стоимость считается на успешный результат, а не на токен: более дешёвая модель, требующая повторов или правки человеком, часто и оказывается дорогой. Задержку важно мерить так, как её чувствует пользователь, включая поиск и вызовы инструментов. Решение к тому же не навсегда: модели и цены меняются, поэтому поддерживать оценку воспроизводимой, а интеграцию заменяемой ценнее, чем выбрать лучшую модель этого квартала."
    reading: ["openai-reasoning-models"]
