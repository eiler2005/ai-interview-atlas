  - id: "prod-search-versus-answer"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Where does an AI answer engine outperform traditional search, and where does it fall short? What would you improve first?
      ru: >-
        В чём AI-сервис ответов лучше обычного поиска, а в чём уступает? Что вы улучшите первым?
    tests:
      en: >-
        Whether you compare products through user tasks and evidence quality.
      ru: >-
        Сравниваете ли вы продукты через задачи пользователя и качество доказательств.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "perplexity"
    start_here: ["leadership"]
    priority: 44
    outline:
      en:
        - "Split queries by task: navigation, a single fact, comparison across sources, open exploration."
        - "Judge an answer by whether its evidence is checkable, current and correctly attributed."
        - "Name the first improvement and the metric that would show it worked."
      ru:
        - "Разделить запросы по задачам: навигация, один факт, сравнение источников, открытое исследование."
        - "Оценивать ответ по проверяемости, свежести и правильной атрибуции доказательств."
        - "Назвать первое улучшение и метрику, которая покажет его результат."
    answer:
      en: "The comparison only works per task. An answer engine wins where the user's job is synthesis: a question whose answer is spread across several sources, a comparison, an unfamiliar topic they cannot yet phrase as keywords; one pass replaces five tabs. Classic search still wins navigation, where the user knows the destination and a link is faster than a paragraph; queries needing the freshest state; and anything where the user must judge the source themselves, because an answer flattens away who said it and when. The failure mode is confident synthesis over weak evidence, which search never claimed to do. So I would improve attribution first: claim-level citations the user can verify at a glance, and visible recency, measured by how often people open a cited source and how often they reformulate instead. If the answer is right but unverifiable, enterprise and research users will not trust it."
      ru: "Сравнивать имеет смысл только по задачам. Сервис ответов выигрывает там, где работа пользователя — синтез: ответ размазан по нескольким источникам, нужно сравнение, тема незнакома и её пока не выразить ключевыми словами; один проход заменяет пять вкладок. Обычный поиск по-прежнему выигрывает навигацию, где пользователь знает адрес и ссылка быстрее абзаца; запросы, требующие самого свежего состояния; и всё, где источник человек должен оценить сам, потому что ответ стирает, кто это сказал и когда. Характерный провал — уверенный синтез на слабых доказательствах, чего поиск никогда и не обещал. Поэтому первым я бы улучшал атрибуцию: ссылки на уровне утверждений, проверяемые одним взглядом, и видимую свежесть, с метриками — как часто открывают процитированный источник и как часто вместо этого переформулируют запрос. Если ответ верен, но непроверяем, корпоративные и исследовательские пользователи ему не поверят."
    reading: ["paper-rag"]
  - id: "prod-impactful-product"
    tracks: ["leadership"]
    type: "self_presentation"
    level: "senior"
    text:
      en: >-
        Walk through the product you built that had the greatest impact, including the business case and evidence of results.
