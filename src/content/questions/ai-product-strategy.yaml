theme: "ai-product-strategy"
questions:
  - id: "prod-enterprise-assistant"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        How would you improve ChatGPT for enterprise customers?
      ru: >-
        Как бы вы улучшили ChatGPT для корпоративных клиентов?
    tests:
      en: >-
        Whether you select a specific workflow and justify its business value.
      ru: >-
        Умеете ли вы выбрать конкретный рабочий процесс и обосновать его ценность.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-openai-pm"
        company: "openai"
    start_here: ["leadership"]
    priority: 6
    outline:
      en:
        - "Choose a customer segment, user and costly workflow problem."
        - "Compare AI and non-AI solutions, integration effort and trust requirements."
        - "Define a pilot outcome, quality guardrails and a rollout decision."
      ru:
        - "Выберите сегмент клиентов, пользователя и существенную проблему рабочего процесса."
        - "Сравните AI- и обычные решения, сложность интеграции и требования к доверию."
        - "Определите результат пилота, ограничения по качеству и условие расширения запуска."
    answer:
      ru: "Улучшение корпоративного ассистента начинается с выбора сегмента и одного рабочего процесса, а не со списка возможностей. Я бы искал регулярную задачу, где ответ уже существует внутри компании, но его дорого найти и собрать — например, подготовка ответа по внутренним регламентам, — и описал бы конкретного пользователя и место, где он буксует. Дальше честное сравнение: если задача решается поиском, шаблоном или правилами, модель не нужна. Для корпоративных клиентов решают не демонстрации, а интеграция и доверие — вход через корпоративные учётные записи, наследование прав от источника, журналирование, требования к хранению и обработке данных. Пилот я бы ограничил заранее объявленным результатом: время на задачу, доля задач, доведённых до конца без переделки, ограничения по качеству и условие расширения. Слабое место пилотов в том, что энтузиасты не предсказывают поведение при обязательном внедрении."
    reading: ["paper-heart","google-rules-of-ml"]
  - id: "prod-capability-cost"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        A model offers much greater capability but costs ten times as much. How would you decide what product to build with it?
      ru: >-
        Модель существенно мощнее, но стоит в десять раз дороже. Как решить, какой продукт на ней создавать?
    tests:
      en: >-
        Whether you translate capability into willingness to pay and unit economics.
      ru: >-
        Умеете ли вы связать возможности модели с готовностью платить и экономикой продукта.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-openai-pm"
        company: "openai"
    start_here: ["leadership"]
    priority: 7
    outline:
      en:
        - "Identify tasks where the improvement changes the feasible outcome."
        - "Estimate cost per successful workflow, including retries and human review."
        - "Test willingness to pay and consider selective routing before broad deployment."
      ru:
        - "Найдите задачи, где улучшение делает возможным новый результат."
        - "Оцените стоимость успешно выполненного процесса с повторами и проверкой человеком."
        - "Проверьте готовность платить и выборочное использование модели до массового внедрения."
    answer:
      ru: "Решает не абстрактная мощность, а наличие задач, где прирост качества переводит работу из разряда недоверяемой в допустимую: там, где раньше требовалась обязательная проверка человеком, а теперь достаточно выборочной. Считать надо не цену токена, а стоимость успешно завершённого процесса с учётом повторов, проверки и цены ошибки — дорогая модель, проходящая с первой попытки, часто дешевле дешёвой с тремя попытками и ревью. Платите вы задержкой, сложностью и зависимостью от одного поставщика. Я бы измерил эту стоимость на своём наборе задач, проверил готовность платить на узком сегменте и включил выборочную маршрутизацию: дорогая модель только на сложных или дорогих по ошибке случаях, дешёвая как основа. Ограничение в том, что если пользователь не замечает разницы в результате, никакой прирост качества не окупается, а цены и возможности моделей меняются быстрее продуктовых планов."
    reading: ["google-rules-of-ml","paper-heart"]
  - id: "prod-ai-suitability"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        How do you decide whether an LLM is useful for a proposed product problem?
      ru: >-
        Как определить, полезна ли LLM для предложенной продуктовой задачи?
    tests:
      en: >-
        Whether you start with the task and evidence rather than the technology.
      ru: >-
        Начинаете ли вы с задачи и данных, а не с технологии.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-gemini-pm"
        company: "google"
    start_here: ["leadership"]
    priority: 8
    outline:
      en:
        - "Describe the job, baseline solution and cost of mistakes."
        - "Check data access, evaluability, latency and the need for predictable behaviour."
        - "Run a bounded comparison and name a reason to reject the LLM approach."
      ru:
        - "Опишите задачу пользователя, базовое решение и цену ошибки."
        - "Проверьте доступ к данным, возможность оценки, задержку и требования к предсказуемости."
        - "Проведите ограниченное сравнение и назовите основание отказаться от LLM."
    answer:
      ru: "Начинаю с задачи пользователя и базового решения, а не с модели: что человек пытается сделать, как это делается сегодня и сколько стоит ошибка. Если задача закрывается правилами, поиском или простой моделью, это и есть ответ — сначала простая эвристика и понятная метрика, иначе сложность добавляется без выигрыша. Затем проверяю четыре вещи: есть ли доступ к нужным данным, можно ли вообще оценить результат, терпит ли сценарий задержку и допустима ли вариативность ответа. Там, где нужны воспроизводимость и точный расчёт, модель в лучшем случае интерфейс поверх детерминированной системы. Дальше ограниченное сравнение на общем наборе задач с заранее названными порогами и стоимостью. Обязательно формулирую заранее основание отказаться, иначе пилот окажется успешным при любом результате. Такая проверка говорит о пригодности, но не гарантирует, что функцией будут пользоваться."
    reading: ["google-rules-of-ml","anthropic-building-effective-agents"]
  - id: "prod-student-assistant"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Design a Gemini-based assistant for university students.
      ru: >-
        Спроектируйте ассистента на основе Gemini для студентов университета.
    tests:
      en: >-
        Whether a clear user need drives scope, learning outcomes and safeguards.
      ru: >-
        Определяет ли понятная потребность пользователя функции, учебные результаты и защитные меры.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-gemini-pm"
        company: "google"
    start_here: ["leadership"]
    priority: 9
    outline:
      en:
        - "Pick a student segment and one recurring unmet need."
        - "Design a usable flow with uncertainty, verification and misuse in mind."
        - "Measure task success and learning value alongside retention."
      ru:
        - "Выберите сегмент студентов и одну регулярную неудовлетворённую потребность."
        - "Спроектируйте удобный сценарий с учётом неопределённости, проверки и злоупотреблений."
        - "Измеряйте успешность задачи и пользу для обучения наряду с удержанием."
    answer:
      ru: "Я бы отказался от универсального помощника и выбрал один сегмент с одной регулярной потребностью — скажем, студенты первого курса, готовящиеся к экзамену по конкретному предмету, — а источником сделал бы материалы курса, а не интернет целиком. Сценарий строится вокруг понимания: ассистент разбирает ошибку, задаёт встречные вопросы и показывает место в материалах, а не выдаёт готовый текст задания; неуверенность проговаривается прямо, а списывание рассматривается как основная модель злоупотребления и ограничивается продуктово, с учётом правил академической честности. Измерять я бы стал успешность задачи, пользу для обучения на отложенной проверке знаний и только затем удержание. Именно здесь и проходит граница: удержание может расти от вреда, потому что ассистента, решающего задания за студента, любят, хотя учебный результат он ухудшает, и без учебной метрики это незаметно."
    reading: ["paper-heart","nist-ai-rmf"]
  - id: "prod-confident-errors"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Users say Gemini gives incorrect answers with excessive confidence. What would you change?
      ru: >-
        Пользователи жалуются, что Gemini уверенно даёт неверные ответы. Что вы измените?
    tests:
      en: >-
        Whether you diagnose failure types and improve calibrated user trust.
      ru: >-
        Умеете ли вы различать причины ошибок и формировать обоснованное доверие.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-gemini-pm"
        company: "google"
    start_here: ["leadership"]
    priority: 10
    outline:
      en:
        - "Collect representative failures and separate knowledge, retrieval and presentation issues."
        - "Compare grounding, abstention and interaction changes on the same tasks."
        - "Track unsupported claims, useful task completion and segment-level regressions."
      ru:
        - "Соберите типичные ошибки и разделите проблемы знаний, поиска и подачи ответа."
        - "Сравните опору на источники, отказ от ответа и изменения интерфейса на одинаковых задачах."
        - "Отслеживайте неподтверждённые утверждения, полезное выполнение задач и регрессии по сегментам."
    answer:
      ru: "Сначала я бы перестал считать это одной проблемой и разобрал жалобы на причины: модель не знает факта, поиск принёс не то или ничего, либо ответ подан так, что уверенность не соответствует основанию. Это три разных исправления. Опора на источники уменьшает выдумки, но добавляет задержку и переносит качество на поиск; отказ отвечать убирает вред, но раздражает, когда срабатывает не по делу; изменения интерфейса вроде показа цитат и пометки непроверенного стоят дёшево и меняют доверие, не трогая модель. Поэтому сравнивал бы эти варианты на одном наборе задач, а не по ощущениям, и следил бы за долей утверждений без подтверждения источником, полезным выполнением задач и регрессиями по сегментам. Калибровка не устраняет ошибки, а перераспределяет их, и часть пользователей всё равно не читает предупреждения."
    reading: ["nist-ai-rmf","anthropic-evals-for-agents"]
  - id: "prod-writing-priorities"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        How would you prioritise features for an AI writing assistant in Microsoft Word?
      ru: >-
        Как вы расставите приоритеты функций AI-ассистента для письма в Microsoft Word?
    tests:
      en: >-
        Whether prioritisation accounts for user value, reliability and workflow fit.
      ru: >-
        Учитывает ли приоритизация пользу, надёжность и соответствие рабочему процессу.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-microsoft-ai-pm"
        company: "microsoft"
    start_here: ["leadership"]
    priority: 11
    outline:
      en:
        - "Segment writing tasks and identify friction in the existing workflow."
        - "Compare expected value, quality risk, engineering cost and dependencies."
        - "Choose a narrow first release and measure accepted, useful assistance."
      ru:
        - "Разделите задачи письма и найдите трудности в текущем процессе."
        - "Сопоставьте ожидаемую пользу, риск качества, трудоёмкость и зависимости."
        - "Выберите узкий первый релиз и измеряйте принятую пользователем полезную помощь."
    answer:
      ru: "Приоритизация начинается с разбиения письма на разные задачи: черновик с нуля, переписывание готового куска, сокращение, правка тона и грамматики, сведение нескольких документов. Для каждой я бы нашёл место, где человек буксует сегодня, и сопоставил ожидаемую пользу, риск качества, трудоёмкость и зависимости вроде прав доступа к документу. Риск здесь несимметричен: подсказка рядом с текстом дешева в ошибке, а массовая правка чужого документа дорога, поэтому вперёд выходят задачи с видимым и обратимым результатом на выделенном фрагменте. Первый релиз стоит сделать узким и измерять не объём сгенерированного, а принятую пользователем помощь: доля вставленного и сохранившегося в документе спустя время, доля отката. Ограничение в том, что принятие не равно качеству — люди соглашаются с правкой, чтобы не спорить, поэтому нужна отдельная проверка качества текста."
    reading: ["paper-heart","google-rules-of-ml"]
  - id: "prod-ai-feature-metrics"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        How would you measure success for an AI feature in a Microsoft product?
      ru: >-
        Как вы измерите успех AI-функции в продукте Microsoft?
    tests:
      en: >-
        Whether metrics connect model behaviour to user and business outcomes.
      ru: >-
        Связывают ли метрики поведение модели с результатами для пользователя и бизнеса.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-microsoft-ai-pm"
        company: "microsoft"
    start_here: ["leadership"]
    priority: 12
    outline:
      en:
        - "Name the user goal and an observable successful task."
        - "Separate adoption, retention, task quality, latency and cost."
        - "Use a baseline or experiment and guard against metric gaming."
      ru:
        - "Назовите цель пользователя и наблюдаемый признак успешно выполненной задачи."
        - "Разделите внедрение, удержание, качество задачи, задержку и стоимость."
        - "Используйте базовую линию или эксперимент и учитывайте манипулирование метриками."
    answer:
      ru: "Метрика начинается с цели пользователя и наблюдаемого признака того, что задача выполнена: что именно должно произойти в продукте, если функция сработала. Дальше я бы развёл слои, которые часто смешивают: внедрение, то есть кто попробовал, удержание, кто вернулся, качество задачи, доведена ли она до результата и сколько было правок или откатов, а также задержка и стоимость на задачу. Модельные метрики на eval-наборе остаются, но как объяснение причины, а не как доказательство пользы. За это платят разметкой событий и дисциплиной определений. Сравнивать нужно с базовой линией или в эксперименте: как задача решалась без функции. И заранее продумать, как метрику будут накручивать — навязчивыми подсказками, засчитыванием показа за использование. Короткий эксперимент при этом не видит эффектов доверия, которые проявляются месяцами."
    reading: ["paper-heart"]
  - id: "prod-search-north-star"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        What North Star metric would you choose for an AI search product, and what would constrain it?
      ru: >-
        Какую главную метрику вы выберете для AI-поиска и какими ограничениями её дополните?
    tests:
      en: >-
        Whether one headline metric remains accountable to trust and task completion.
      ru: >-
        Остаётся ли главная метрика связанной с доверием и выполнением задачи.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-perplexity-ai-pm"
        company: "perplexity"
    start_here: ["leadership"]
    priority: 13
    outline:
      en:
        - "Define a valuable completed search task and how to observe it."
        - "Add quality, safety, latency and cost guardrails."
        - "Explain denominator, segmentation and how the metric could mislead."
      ru:
        - "Определите полезно завершённую поисковую задачу и способ её наблюдать."
        - "Добавьте ограничения по качеству, безопасности, задержке и стоимости."
        - "Объясните знаменатель, сегментацию и ситуации, когда метрика вводит в заблуждение."
    answer:
      ru: "Главной метрикой я бы сделал долю сессий с полезно завершённой поисковой задачей, а не клики и не время на странице, потому что и то и другое растёт при плохом ответе. Наблюдать завершение приходится косвенно: пользователь не переформулировал запрос, перешёл к источнику и не вернулся сразу, выполнил следующее действие; часть случаев стоит подтверждать разметкой людьми, поскольку поведение неоднозначно. Любая единственная метрика толкает в крайность, поэтому её дополняют ограничениями: доля утверждений без подтверждения источником, безопасность, задержка и стоимость запроса — ухудшение любого из них отменяет прирост. Отдельно объясняю знаменатель: считаем сессии или запросы, что делаем с ботами и повторами, как сегментируем по языку и типу задачи. В навигационных и развлекательных запросах завершение плохо определимо, и там метрика вводит в заблуждение."
    reading: ["paper-heart"]
  - id: "prod-notification-paradox"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Notification engagement rises while total time spent remains flat. How would you interpret that result?
      ru: >-
        Вовлечённость в уведомления растёт, а общее время в продукте не меняется. Как вы объясните результат?
    tests:
      en: >-
        Whether you distinguish substitution, measurement artifacts and real user value.
      ru: >-
        Различаете ли вы замещение активности, артефакты измерения и пользу пользователю.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-report-meta-ai-pm"
        company: "meta"
    start_here: ["leadership"]
    priority: 14
    outline:
      en:
        - "Check definitions, exposure, cohorts and the experiment setup."
        - "Test whether notifications shift existing activity or create valuable new actions."
        - "Include opt-outs, satisfaction and longer-term effects before deciding."
      ru:
        - "Проверьте определения, показы, когорты и устройство эксперимента."
        - "Проверьте, перераспределяют ли уведомления активность или создают новые полезные действия."
        - "Учтите отключения уведомлений, удовлетворённость и долгосрочный эффект."
    answer:
      ru: "Самое вероятное объяснение — замещение: уведомления не создают активность, а переносят её из органических заходов, поэтому суммарное время не меняется. Но прежде чем объяснять поведение, я бы проверил измерение: совпадают ли определения вовлечённости и времени, не выросли ли просто показы, не смешаны ли когорты новых и старых пользователей и был ли это эксперимент с контролем или сравнение до и после. Дальше содержательный вопрос: приводят ли уведомления к действиям, которых без них не было, или к тем же самым, просто раньше. Смотреть надо отключения и отписки, жалобы, удовлетворённость и удержание на длинном горизонте, потому что краткосрочный рост кликов часто оплачивается потерей канала. Наконец, нейтральное время само по себе не означает отсутствия пользы: продукт мог стать полезнее при меньшем времени, и это нормальный исход."
    reading: ["paper-heart"]
  - id: "prod-favorite-agent"
    tracks: ["leadership"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        Choose an AI agent or product you use and propose its most valuable improvement.
      ru: >-
        Выберите AI-агента или продукт, которым пользуетесь, и предложите самое полезное улучшение.
    tests:
      en: >-
        Whether product judgement rests on observed friction and a testable hypothesis.
      ru: >-
        Основано ли продуктовое суждение на наблюдаемой проблеме и проверяемой гипотезе.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-amazon-ai-pm"
        company: "amazon"
    start_here: ["leadership"]
    priority: 15
    outline:
      en:
        - "Describe a real workflow and where the product fails the user."
        - "Explain why the proposed improvement outranks alternatives."
        - "Specify a prototype, success measure and possible adverse effect."
      ru:
        - "Опишите реальный сценарий и момент, в котором продукт подводит пользователя."
        - "Объясните, почему выбранное улучшение важнее альтернатив."
        - "Определите прототип, критерий успеха и возможный негативный эффект."
    answer:
      ru: "Отвечать на такой вопрос стоит через наблюдаемую поломку, а не через список пожеланий. Возьмите продукт, которым пользуетесь регулярно, и опишите момент, где он подводит: например, агент теряет контекст между сессиями и заставляет заново объяснять задачу, либо уверенно уходит не туда, а вмешаться по ходу нельзя. Дальше объясните, почему выбранное улучшение важнее альтернатив — частота ситуации, цена для пользователя, отсутствие обходного пути, — и тем самым покажите приоритизацию, а не вкус. Затем назовите самый дешёвый способ проверить гипотезу, заранее сформулированный критерий успеха и вероятный побочный эффект: сохранение контекста повышает риски приватности, возможность прерывания замедляет работу. Граница здесь в том, что вы рассуждаете как пользователь снаружи, поэтому не стоит выдумывать внутренние причины, планы и метрики чужой команды."
    reading: ["paper-heart"]
