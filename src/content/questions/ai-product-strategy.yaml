        - "Explain why rivals cannot simply copy it, and measure completed tasks with a citation-accuracy guardrail."
        - "Test the riskiest assumption cheaply with a fake-door test or a manual prototype for target users."
      ru:
        - "Выбрать один сегмент и регулярную исследовательскую задачу, которую пользователи пока доделывают вне продукта."
        - "Объяснить, почему конкурентам не скопировать функцию просто так, и измерять завершённые задачи с ограничением по точности ссылок."
        - "Дёшево проверить самое рискованное предположение: тест фиктивной кнопки или ручной прототип на целевых пользователях."
    reading: ["paper-heart"]
  - id: "prod-roadmap"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "product_case"
    level: "senior"
    text:
      en: >-
        How do you prioritise a product roadmap when several valuable opportunities compete?
      ru: >-
        Как вы расставляете приоритеты дорожной карты, когда конкурируют несколько ценных возможностей?
    tests:
      en: >-
