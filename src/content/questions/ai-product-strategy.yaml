        - "Изложить бизнес-обоснование, самое рискованное предположение ставки и эксперимент, который его проверил."
        - "Закончить измеренным эффектом относительно базовой линии, вашим вкладом в него и тем, что сделали бы иначе."
  - id: "prod-enterprise-ai-pricing"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "product_case"
    text:
      en: "How would you price an enterprise AI product, which costs must you count, and how does customising it for each client affect its margin?"
      ru: "Как вы установите цену корпоративного AI-продукта, какие затраты обязательно учтёте и как кастомизация под каждого клиента влияет на маржинальность?"
    tests:
      en: "Whether you reason about unit economics and margin, not only product value."
      ru: "Умение рассуждать о юнит-экономике и марже, а не только о ценности продукта."
    provenance: "published"
    evidence:
      - source: "habr-ai-pm-enterprise-interviewer"
        role: "ai-pm"
    added: "2026-09-29"
    start_here: ["leadership"]
    priority: 43
    outline:
      en:
        - "Name the cost stack per account: inference, retrieval and storage, evaluation, human support."
        - "Choose a price metric the customer can predict and you can defend as volume grows."
        - "Treat per-client customisation as recurring cost, and price or productise it deliberately."
      ru:
        - "Назвать структуру затрат на аккаунт: инференс, поиск и хранение, оценку качества, поддержку людьми."
        - "Выбрать метрику цены, предсказуемую для клиента и защитимую при росте объёма."
        - "Считать кастомизацию под клиента повторяющимися затратами и осознанно продавать её или продуктизировать."
    answer:
      en: "Enterprise AI pricing is a margin question disguised as a value question, so I start with the cost stack per account: inference, including retries and evaluation tokens; retrieval, indexing and storage of their corpus; the human cost of onboarding, support and incidents; and engineering time spent keeping their configuration alive. Then the price metric: seats are predictable for the buyer but decouple revenue from usage, while consumption tracks cost and frightens procurement, so a common answer is a platform fee plus metered usage with a committed floor. Customisation is where margin actually disappears. A bespoke integration or a client-specific eval set is not a one-off but a recurring obligation that every model upgrade reopens, so I would price it separately or refuse it until it can be productised. I would watch gross margin per account rather than blended, because averages hide the accounts that lose money."
      ru: "Цена корпоративного AI-продукта — вопрос маржи, замаскированный под вопрос ценности, поэтому я начинаю со структуры затрат на аккаунт: инференс, включая повторы и токены самой оценки качества; поиск, индексация и хранение их корпуса; стоимость работы людей на внедрении, поддержке и разборе инцидентов; инженерное время на поддержание их конфигурации. Затем метрика цены: оплата за места предсказуема для покупателя, но отвязывает выручку от использования, а оплата за потребление следует за затратами и пугает закупки, поэтому частый ответ — платформенный платёж плюс тарифицируемое использование с обязательным минимумом. Маржа же по-настоящему исчезает в кастомизации. Индивидуальная интеграция или набор оценок под клиента — не разовая работа, а повторяющееся обязательство, которое заново вскрывается при каждом обновлении модели, поэтому я бы продавал её отдельно или отказывался до продуктизации. Смотреть я бы стал на валовую маржу по каждому аккаунту, а не на смешанную: средние скрывают убыточных клиентов."
    reading: ["oreilly-year-of-llms"]
  - id: "prod-enterprise-discovery"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "product_case"
    text:
      en: "In discovery for an enterprise AI product, who is the persona, where do you find B2B respondents, and how will you tell that a problem is worth solving?"
      ru: "Кто в дискавери корпоративного AI-продукта является «персоной», где вы найдёте B2B-респондентов и как поймёте, что проблему стоит решать?"
    tests:
      en: "Whether you adapt customer research to enterprise buyers, users and decision-makers."
      ru: "Умение адаптировать исследование клиентов к корпоративным покупателям, пользователям и лицам, принимающим решения."
    provenance: "published"
    evidence:
      - source: "habr-ai-pm-enterprise-interviewer"
        role: "ai-pm"
    added: "2026-09-29"
    start_here: ["leadership"]
    priority: 66
    outline:
      en:
        - "Split the persona into user, budget-owning sponsor and blockers such as security, legal and IT."
        - "Recruit through existing customers, account teams and partners, interviewing several roles in the same account."
        - "Judge the problem by current spend on workarounds and a sponsor's willingness to commit scarce resources."
      ru:
        - "Разделить персону на пользователя, спонсора с бюджетом и блокирующих: безопасность, юристов, ИТ."
        - "Искать респондентов через текущих клиентов, аккаунт-менеджеров и партнёров, опрашивая несколько ролей в одной компании."
        - "Оценивать проблему по текущим затратам на обходные пути и готовности спонсора вложить дефицитные ресурсы."
    answer:
      en: "In enterprise there's no single persona: there's the user who does the work, the sponsor who owns the budget and the target metric, and the people who can block the purchase — security, legal, IT, the data owner. They want different things, and an AI product often dies at the blockers rather than with users, so discovery has to cover all of them, ideally several roles inside the same account, to see how decisions actually get made. Respondents come from wherever trust already exists: current customers and their account teams, sales conversations, partners and integrators, former colleagues. Cold outreach mostly reaches people with spare time. To judge whether it's worth solving I look past stated pain to behaviour: what they already spend on workarounds — people, spreadsheets, a vendor — how often it occurs, and whether a sponsor will commit something scarce: data access, expert time or a paid pilot. Interest without commitment isn't evidence. And a few large accounts can make a problem look universal, so I'd check it repeats across segments."
      ru: "В корпоративном сегменте нет одной персоны: есть пользователь, который делает работу, спонсор, который владеет бюджетом и целевой метрикой, и те, кто может заблокировать покупку, — безопасность, юристы, ИТ, владелец данных. Им нужно разное, и AI-продукт нередко погибает на блокирующих, а не у пользователей, поэтому дискавери должно охватить всех, лучше — несколько ролей внутри одной компании, чтобы увидеть, как на самом деле принимаются решения. Респондентов ищут там, где уже есть доверие: текущие клиенты и их аккаунт-менеджеры, переговоры отдела продаж, партнёры и интеграторы, бывшие коллеги. Холодные рассылки в основном доходят до тех, у кого есть свободное время. Чтобы понять, стоит ли проблему решать, смотрю не на заявленную боль, а на поведение: сколько уже тратят на обходные пути — люди, таблицы, подрядчик, — как часто это случается и готов ли спонсор вложить что-то дефицитное: доступ к данным, время экспертов, платный пилот. Интерес без обязательства — не свидетельство. А несколько крупных клиентов могут создать видимость всеобщей проблемы, поэтому проверил бы, повторяется ли она в разных сегментах."
    reading: ["gitlab-research-recruiting"]
  - id: "prod-expensive-mvp"
    tracks: ["leadership"]
    roles: ["ai-pm"]
    type: "product_case"
    text:
      en: "What do you do when an MVP of an enterprise AI product is too expensive or too slow to build?"
      ru: "Что вы будете делать, если MVP корпоративного AI-продукта слишком дорого или долго делать?"
    tests:
      en: "Whether you test the riskiest assumptions with cheaper prototypes before committing to a build."
      ru: "Умение проверить самые рискованные гипотезы более дешёвыми прототипами до решения строить продукт."
    provenance: "published"
    evidence:
      - source: "habr-ai-pm-enterprise-interviewer"
        role: "ai-pm"
    added: "2026-09-29"
    start_here: ["leadership"]
    priority: 65
    outline:
      en:
        - "Treat the MVP as an experiment: list its assumptions and rank them by uncertainty and cost of error."
        - "Test the riskiest cheaply: the model offline on customer data, a concierge pilot, or a paid pilot commitment."
        - "Agree in advance which evidence justifies the build, and name what a cheap test cannot prove."
      ru:
        - "Считать MVP экспериментом: выписать его допущения и ранжировать по неопределённости и цене ошибки."
        - "Проверить самое рискованное дёшево: модель офлайн на данных клиента, ручной пилот или обязательство платного пилота."
        - "Заранее договориться, какие данные оправдывают разработку, и назвать, чего дешёвая проверка доказать не может."
    answer:
      en: "An MVP that's too expensive is usually being treated as a small product rather than as an experiment, so I'd go back to what we need to learn. I'd write down the assumptions — the problem is costly enough to pay for, the model reaches the needed quality on this customer's documents, we can actually get the data, the workflow will absorb the output, the buyer can get it through security review — and rank them by uncertainty and cost of being wrong. In enterprise AI the riskiest are rarely the interface; they're data access and quality on real data. Each gets the cheapest test that could kill it: running the model offline on a sample of the customer's data, a concierge pilot where people do the part that isn't built, a design partner committing to a paid pilot. I'd agree beforehand what result justifies the build. The trade-off: these tests prove neither scale nor integration cost; when integration is the main risk, a thin end-to-end slice at one customer is the cheapest honest test."
      ru: "Слишком дорогой MVP обычно означает, что его делают как маленький продукт, а не как эксперимент, поэтому я бы вернулся к тому, что нам нужно узнать. Выписал бы допущения: проблема стоит того, чтобы за её решение платить; модель достигает нужного качества на документах этого клиента; данные действительно можно получить; процесс примет результат; покупатель проведёт продукт через проверку безопасности, — и ранжировал бы их по неопределённости и цене ошибки. В корпоративном AI самое рискованное редко интерфейс; обычно это доступ к данным и качество на реальных данных. Для каждого допущения — самая дешёвая проверка, способная его опровергнуть: прогнать модель офлайн на выборке данных клиента, ручной пилот, где недостроенную часть делают люди, обязательство партнёра по разработке на платный пилот. Заранее договорился бы, какой результат оправдывает разработку. Цена такого подхода: эти проверки не доказывают ни масштаб, ни стоимость интеграции; когда главный риск — сама интеграция, самая дешёвая честная проверка — тонкий сквозной срез у одного клиента."
    reading: ["google-rules-of-ml"]
