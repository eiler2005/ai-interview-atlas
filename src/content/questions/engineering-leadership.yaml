  - id: "lead-research-product-boundary"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        Researchers want more exploration while product engineers need a reliable release. How would you structure ownership and handoffs?
      ru: >-
        Исследователям нужно продолжать эксперименты, а продуктовым инженерам — выпустить надёжный сервис. Как вы распределите ответственность и передачу работы?
    tests:
      en: >-
        Whether team design accommodates uncertainty without abandoning production ownership.
      ru: >-
        Учитываете ли вы неопределённость исследований, сохраняя ответственность за эксплуатацию.
    provenance: "generated"
    added: "2026-09-26"
    basis: ["radar:engineering-leadership"]
    start_here: ["leadership"]
    priority: 49
    outline:
      en:
        - "Separate what is being explored from what is being operated, and give each a different bar."
        - "Define the handoff as a contract: an interface, evaluation evidence and an owner on call."
        - "Protect the release with versioning and a rollback path, so exploration cannot destabilise it."
      ru:
        - "Разделить то, что исследуется, и то, что эксплуатируется, задав каждому свою планку."
        - "Оформить передачу как контракт: интерфейс, свидетельства оценки и владелец на дежурстве."
        - "Защитить релиз версионированием и путём отката, чтобы исследование не расшатывало его."
    answer:
      en: "These are two different bars, not two levels of rigour, so I separate them structurally. Exploration is judged on learning rate and may be messy, undocumented and abandoned; production is judged on reliability and has an owner who is paged. The boundary is a handoff contract: a stable interface, evaluation evidence on an agreed set, and a named owner who accepts it; nothing enters the release path by being interesting. Behind that boundary the product team keeps versioning, gating and a rollback path, so a research change is a candidate, never a fait accompli. I would keep one shared evaluation suite both sides trust, because these arguments are usually about evidence. The pattern I watch for is researchers on permanent call for their own prototype, which quietly ends exploration; that is the signal to productionise it or retire it."
      ru: "Это две разные планки, а не две степени строгости, поэтому я разделяю их структурно. Исследование оценивается по скорости получения знаний и может быть неаккуратным, недокументированным и брошенным; эксплуатация оценивается по надёжности и имеет владельца, которого будят. Границей становится контракт передачи: стабильный интерфейс, свидетельства оценки на согласованном наборе и названный владелец, который её принимает; ничто не попадает в релизный путь просто потому, что интересно. За этой границей продуктовая команда держит версионирование, гейты и путь отката, поэтому исследовательское изменение — кандидат, а не свершившийся факт. Я бы сохранил один общий набор оценок, которому доверяют обе стороны: такие споры обычно идут именно о доказательствах. Настораживает меня картина, когда исследователи бессрочно дежурят по собственному прототипу: это тихо заканчивает исследования и служит сигналом либо довести прототип до продакшена, либо от него отказаться."
    reading: ["google-rules-of-ml"]
  - id: "lead-ai-review-skills"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        An engineering team adopts AI coding tools, but reviewers struggle to verify the resulting changes. How would you build the missing capability?
      ru: >-
        Команда внедрила AI-инструменты программирования, но ревьюерам трудно проверять изменения. Как вы разовьёте недостающие навыки?
    tests:
      en: >-
        Whether enablement is tied to verification and ownership rather than tool usage counts.
      ru: >-
        Связываете ли вы развитие навыков с проверкой и ответственностью, а не числом использований инструмента.
    provenance: "generated"
    added: "2026-09-26"
    basis: ["radar:engineering-leadership"]
    start_here: ["leadership"]
    priority: 46
    outline:
      en:
        - "Name the real gap: reviewing a large change nobody drafted by hand, not tool operation."
        - "Keep the author accountable for explaining and testing the change, whatever produced it."
        - "Train review on verification habits and measure escaped defects, not adoption counts."
      ru:
        - "Назвать настоящий пробел: ревью крупного изменения, которого никто не писал руками, а не владение инструментом."
        - "Оставить автора ответственным за объяснение и тестирование изменения, чем бы оно ни было создано."
        - "Учить ревью навыкам проверки и измерять пропущенные дефекты, а не число внедрений."
    answer:
      en: "The gap is not tool operation, it is that review was designed for changes a human drafted incrementally and now receives large, plausible diffs nobody wrote by hand. So I would fix ownership first: the author is accountable for the change regardless of what produced it, and a pull request nobody can explain does not get reviewed. Concretely the author states intent, the tests that pin the behaviour, and what they verified themselves; reviewers are trained to read tests before implementation, to check edge cases and error paths where generated code is weakest, and to reject a change too large to reason about. I would keep changes small and invest in tests as the durable check, since a human cannot out-read the generator. I would measure escaped defects, revert rate and review latency, never tool adoption, which says nothing about understanding."
      ru: "Пробел не в умении пользоваться инструментом: ревью проектировалось под изменения, которые человек писал постепенно, а теперь получает большие правдоподобные диффы, которых никто не набирал руками. Поэтому я бы сначала починил ответственность: автор отвечает за изменение независимо от того, чем оно создано, а pull request, который никто не может объяснить, не идёт на ревью. Конкретно: автор формулирует замысел, тесты, закрепляющие поведение, и что проверил сам; ревьюеров учат читать тесты раньше реализации, смотреть граничные случаи и ветки ошибок, где сгенерированный код слабее всего, и отклонять изменение, слишком большое для осмысления. Я бы держал изменения небольшими и вкладывался в тесты как в устойчивую проверку: человек не в состоянии перечитать генератор. Измерял бы пропущенные дефекты, долю откатов и время ревью, но никогда не число внедрений инструмента — оно ничего не говорит о понимании."
    reading: ["anthropic-ai-resistant-evaluations"]
