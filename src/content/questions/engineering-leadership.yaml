  - id: "lead-research-product-boundary"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        Researchers want more exploration while product engineers need a reliable release. How would you structure ownership and handoffs?
      ru: >-
        Исследователям нужно продолжать эксперименты, а продуктовым инженерам — выпустить надёжный сервис. Как вы распределите ответственность и передачу работы?
    tests:
      en: >-
        Whether team design accommodates uncertainty without abandoning production ownership.
      ru: >-
        Учитываете ли вы неопределённость исследований, сохраняя ответственность за эксплуатацию.
    provenance: "generated"
    added: "2026-09-26"
    basis: ["radar:engineering-leadership"]
    start_here: ["leadership"]
    priority: 49
    outline:
      en:
        - "Separate what is being explored from what is being operated, and give each a different bar."
        - "Define the handoff as a contract: an interface, evaluation evidence and an owner on call."
        - "Protect the release with versioning and a rollback path, so exploration cannot destabilise it."
      ru:
        - "Разделить то, что исследуется, и то, что эксплуатируется, задав каждому свою планку."
        - "Оформить передачу как контракт: интерфейс, свидетельства оценки и владелец на дежурстве."
        - "Защитить релиз версионированием и путём отката, чтобы исследование не расшатывало его."
    answer:
      en: "These are two different bars, not two levels of rigour, so I separate them structurally. Exploration is judged on how fast the team learns and may be messy, undocumented and abandoned; production is judged on reliability and has an owner who is paged. The boundary is a handoff contract: a stable interface, evaluation evidence on an agreed set, and a named owner who accepts it; nothing enters the release path by being interesting. Behind that boundary the product team keeps versioning, gating and a rollback path, so a research change is a candidate, never a fait accompli. I would keep one shared evaluation suite both sides trust, because these arguments are usually about evidence. The pattern I watch for is researchers on permanent call for their own prototype, which quietly ends exploration; that is the signal to productionise it or retire it."
      ru: "Это две разные планки, а не две степени строгости, поэтому я разделяю их структурно. Исследование оценивается по скорости получения знаний и может быть неаккуратным, недокументированным и брошенным; эксплуатация оценивается по надёжности и имеет владельца, которого будят. Границей становится контракт передачи: стабильный интерфейс, свидетельства оценки на согласованном наборе и названный владелец, который её принимает; ничто не попадает в релизный путь просто потому, что интересно. За этой границей продуктовая команда держит версионирование, гейты и путь отката, поэтому исследовательское изменение — кандидат, а не свершившийся факт. Я бы сохранил один общий набор оценок, которому доверяют обе стороны: такие споры обычно идут именно о доказательствах. Настораживает меня картина, когда исследователи бессрочно дежурят по собственному прототипу: это тихо заканчивает исследования и служит сигналом либо довести прототип до продакшена, либо от него отказаться."
    reading: ["google-rules-of-ml"]
  - id: "lead-ai-review-skills"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        An engineering team adopts AI coding tools, but reviewers struggle to verify the resulting changes. How would you build the missing capability?
      ru: >-
        Команда внедрила AI-инструменты программирования, но ревьюерам трудно проверять изменения. Как вы разовьёте недостающие навыки?
    tests:
      en: >-
        Whether enablement is tied to verification and ownership rather than tool usage counts.
      ru: >-
        Связываете ли вы развитие навыков с проверкой и ответственностью, а не числом использований инструмента.
    provenance: "generated"
    added: "2026-09-26"
    basis: ["radar:engineering-leadership"]
    start_here: ["leadership"]
    priority: 46
    outline:
      en:
        - "Name the real gap: reviewing a large change nobody drafted by hand, not tool operation."
        - "Keep the author accountable for explaining and testing the change, whatever produced it."
        - "Train review on verification habits and measure escaped defects, not adoption counts."
      ru:
        - "Назвать настоящий пробел: ревью крупного изменения, которого никто не писал руками, а не владение инструментом."
        - "Оставить автора ответственным за объяснение и тестирование изменения, чем бы оно ни было создано."
        - "Учить ревьюеров навыкам проверки и измерять пропущенные дефекты, а не охват использования инструмента."
    answer:
      en: "The gap is not tool operation, it is that review was designed for changes a human drafted incrementally and now receives large, plausible diffs nobody wrote by hand. So I would fix ownership first: the author is accountable for the change regardless of what produced it, and a pull request nobody can explain does not get reviewed. Concretely the author states intent, the tests that pin the behaviour, and what they verified themselves; reviewers are trained to read tests before implementation, to check edge cases and error paths where generated code is weakest, and to reject a change too large to reason about. I would keep changes small and invest in tests as the durable check, since a human cannot out-read the generator; but tests generated with the code can encode the same misreading, so they count only once someone has checked them against the stated intent. I would measure escaped defects, revert rate and review latency, never tool adoption, which says nothing about understanding."
      ru: "Пробел не в умении пользоваться инструментом: ревью проектировалось под изменения, которые человек писал постепенно, а теперь получает большие правдоподобные диффы, которых никто не набирал руками. Поэтому я бы сначала починил ответственность: автор отвечает за изменение независимо от того, чем оно создано, а pull request, который никто не может объяснить, не идёт на ревью. Конкретно: автор формулирует замысел, тесты, закрепляющие поведение, и что проверил сам; ревьюеров учат читать тесты раньше реализации, смотреть граничные случаи и ветки ошибок, где сгенерированный код слабее всего, и отклонять изменение, слишком большое для осмысления. Я бы держал изменения небольшими и вкладывался в тесты как в устойчивую проверку: человек не успеет прочитать всё, что выдаёт генератор. Но тесты, сгенерированные вместе с кодом, могут закрепить то же неверное понимание задачи, поэтому опираться на них можно только после того, как их сверили с заявленным замыслом. Измерял бы пропущенные дефекты, долю откатов и время ревью, но никогда не охват использования инструмента — оно ничего не говорит о понимании."
    reading: ["anthropic-ai-resistant-evaluations"]
  - id: "lead-platform-team-charter"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        Two product teams need shared AI infrastructure, but neither can spare an engineer. How would you establish ownership without creating an unstaffed platform promise?
      ru: >-
        Двум продуктовым командам нужна общая AI-инфраструктура, но ни одна не может выделить инженера. Как организовать работу без обещаний платформы, под которые нет людей?
    tests:
      en: >-
        Whether you resolve capacity and accountability before creating a new team boundary.
      ru: >-
        Решаете ли вы вопросы ресурсов и ответственности до создания новой командной структуры.
    provenance: "generated"
    added: "2026-09-26"
    basis: ["radar:engineering-leadership"]
    start_here: ["leadership"]
    priority: 61
    outline:
      en:
        - "Define the shared need precisely and compare its cost with each team building its own."
        - "Choose a staffing model explicitly: funded headcount, capacity taken from both roadmaps, or one owning team."
        - "Write a narrow charter with a named owner, support terms and the trigger for a dedicated team."
      ru:
        - "Точно определить общую потребность и сравнить её стоимость с тем, что каждая команда сделает сама."
        - "Явно выбрать модель ресурсов: новые ставки, ёмкость из планов обеих команд или одна команда-владелец."
        - "Написать узкий устав с названным владельцем, условиями поддержки и триггером для выделенной команды."
    answer:
      en: "The thing to prevent is a platform announced before anyone is staffed to run it: teams start depending on it, it degrades, and its failures belong to no one. I'd first define what's actually shared — model access, an evaluation harness, logging with redaction — and what each team would build alone, because a quarter of duplication can be cheaper than a premature shared dependency that couples two roadmaps. If it's genuinely shared, capacity must come from somewhere, and the honest options are few: fund headcount, take an explicit share out of both teams' plans, or make one team the owner, with the other as a customer on written terms. A volunteer working group isn't one of them. Then a narrow charter: the owner, what's in and out of scope, response expectations, how changes are requested, and the trigger for a dedicated team, such as a third consumer or growing support load. If neither team will give up roadmap capacity, that's a priority decision for their common manager, not an org-design problem."
      ru: "Предотвратить нужно платформу, объявленную раньше, чем появились люди для её поддержки: команды начинают от неё зависеть, она деградирует, а за её сбои не отвечает никто. Поэтому сначала определяю, что действительно общее — доступ к моделям, стенд оценки, журналирование с маскированием, — и что каждая команда сделала бы сама: квартал дублирования бывает дешевле преждевременной общей зависимости, которая связывает два роадмапа. Если потребность действительно общая, ёмкость должна откуда-то взяться, и честных вариантов немного: выделить ставки, явно забрать долю из планов обеих команд или назначить одну команду владельцем, а другую — клиентом на письменно зафиксированных условиях. Рабочая группа добровольцев в этот список не входит. Дальше узкий устав: владелец, что входит в зону ответственности и что нет, ожидаемые сроки реакции, порядок запроса изменений и триггер для выделенной команды, например третий потребитель или растущая нагрузка на поддержку. Если ни одна команда не готова отдать часть плана, это вопрос приоритетов для их общего руководителя, а не задача оргдизайна."
    reading: ["fowler-team-topologies"]
  - id: lead-ai-interview-redesign
    tracks:
    - leadership
    roles:
    - engineering-manager
    type: applied_scenario
    text:
      en: Candidates now use AI assistants during technical interviews. How would you redesign your loop so that it
        still produces a usable hiring signal?
      ru: Кандидаты используют AI-ассистентов на технических интервью. Как вы перестроите процесс, чтобы он по-прежнему
        давал пригодный сигнал для найма?
    tests:
      en: Whether you define the hiring signal, set a clear tool policy and evaluate individual judgement consistently.
      ru: Умеете ли вы определить сигнал для найма, задать понятные правила инструментов и последовательно оценивать
        индивидуальное суждение.
    provenance: generated
    added: '2026-09-30'
    basis:
    - radar:engineering-leadership
    outline:
      en:
      - Define the job capabilities and identify tasks whose score no longer distinguishes candidates.
      - Choose and disclose a tool policy for each stage; give candidates comparable access and evaluate verification
        and explanation.
      - Calibrate on representative work, review scoring disagreements and examine later performance without overclaiming
        small samples.
      ru:
      - Определить необходимые рабочие навыки и задания, оценка которых больше не различает кандидатов.
      - Выбрать и заранее объявить правила инструментов для каждого этапа; обеспечить сопоставимый доступ и оценивать
        проверку и объяснение.
      - Калибровать на типичной работе, разбирать расхождения оценок и сопоставлять с дальнейшей работой без сильных
        выводов по малой выборке.
    reading:
    - anthropic-ai-resistant-evaluations
    - canva-ai-interview-success
    start_here:
    - leadership
    priority: 76
    answer:
      en: 'I would start with the work the hire must perform: framing a problem, checking an unfamiliar change, diagnosing
        failure and explaining a decision. Then I would identify which existing tasks now mostly measure access to
        an assistant. Each stage needs an explicit policy: tools may be permitted for realistic work, restricted for
        a particular independent skill, or supplied in a controlled environment. Candidates should know the policy
        beforehand and have comparable access. I would score observable reasoning, verification, corrections and ownership,
        using a follow-up change that exposes whether the candidate understands the result. Before rollout, current
        engineers and trained interviewers should try the tasks and reconcile scoring disagreements. I would monitor
        candidate experience and later work outcomes, while acknowledging that small, selectively hired samples cannot
        establish predictive validity. The goal is a defensible hiring decision, not winning an arms race with assistants.'
      ru: 'Я начну с работы, которую предстоит выполнять нанятому человеку: постановки задачи, проверки незнакомого
        изменения, диагностики сбоя и объяснения решения. Затем выделю старые задания, которые теперь преимущественно
        измеряют доступ к ассистенту. Для каждого этапа нужны явные правила: инструменты можно разрешить в реалистичной
        работе, ограничить ради отдельного самостоятельного навыка или предоставить в контролируемой среде. Кандидаты
        должны узнать правила заранее и получить сопоставимый доступ. Я буду оценивать наблюдаемую логику, проверку,
        исправления и ответственность, добавляя изменение условий, которое показывает понимание результата. До запуска
        задания пройдут действующие инженеры и подготовленные интервьюеры; расхождения оценок необходимо разобрать.
        После запуска буду отслеживать опыт кандидатов и результаты дальнейшей работы, признавая, что небольшая выборка
        только нанятых людей не доказывает прогностическую точность. Цель — обоснованное решение о найме, а не соревнование
        с возможностями ассистентов.'
  - id: lead-managers-accountability
    tracks:
    - leadership
    roles:
    - engineering-director
    - ai-transformation-lead
    type: applied_scenario
    text:
      en: You manage three engineering managers delivering a shared AI initiative. Two blame each other for an evaluation
        gap while the executive sponsor has promised a launch date. How would you restore accountability without taking
        over their teams?
      ru: Вы руководите тремя инженерными менеджерами, которые ведут общую AI-инициативу. Двое обвиняют друг друга
        в пробеле оценки качества, а исполнительный спонсор уже обещал дату запуска. Как вы восстановите ответственность,
        не подменяя руководителей команд?
    tests:
      en: Whether you lead through managers, resolve cross-team decision rights and negotiate executive commitments
        using evidence.
      ru: Умеете ли вы руководить через менеджеров, разрешать вопросы межкомандных полномочий и пересматривать обещания
        руководству на основании данных.
    provenance: generated
    added: '2026-10-05'
    basis:
    - radar:engineering-leadership
    start_here:
    - leadership
    priority: 73
    outline:
      en:
      - Establish the missing outcome, prior agreements and each manager’s account; separate unclear structure from
        individual avoidance.
      - Assign an accountable decision owner and interfaces while managers retain staffing and delivery responsibility.
      - Agree evidence-based options with the sponsor, coach managers privately and review whether the organisation
        can resolve the next conflict without you.
      ru:
      - Установить недостающий результат, прежние договорённости и позицию каждого менеджера; отличить неясную структуру
        от уклонения от ответственности.
      - Назначить ответственного за решение и границы взаимодействия, сохранив кадровую и исполнительскую ответственность
        менеджеров.
      - Согласовать со спонсором варианты на основе данных, отдельно развивать менеджеров и проверить, решит ли организация
        следующий конфликт без вас.
    answer:
      en: 'I would establish which evaluation outcome is missing, what was previously agreed and which decisions each
        manager could actually make. The immediate objective is to close the risk, but taking over every task would
        hide a broken management interface. I would name an accountable owner for the shared outcome, agree contributions
        and escalation conditions with the managers, and leave team planning and execution with them. In parallel,
        I would take the sponsor a small set of evidenced options: narrow the launch, move the date or accept only
        risks that the authorised owner can legitimately accept. The promise is a constraint to renegotiate, not proof
        of readiness. I would coach each manager privately on their part in the conflict and change incentives or
        boundaries that encouraged it. Success includes the next cross-team decision being resolved through the agreed
        structure without my intervention.'
      ru: 'Я установлю, какого результата оценки не хватает, о чём договорились раньше и какие решения каждый менеджер
        действительно мог принимать. Ближайшая задача — закрыть риск, но перехват всех задач скроет проблему взаимодействия
        руководителей. Назначу ответственного за общий результат, согласую вклады команд и условия эскалации с менеджерами,
        оставив им планирование и выполнение внутри команд. Одновременно представлю спонсору несколько вариантов с
        подтверждениями: сузить запуск, перенести дату или принять только те риски, которые уполномоченный владелец
        действительно вправе принять. Обещание даты — ограничение для пересмотра, а не доказательство готовности.
        С каждым менеджером отдельно разберу его вклад в конфликт и изменю стимулы или границы, которые его поддерживали.
        Признаком успеха станет не только закрытый текущий пробел, но и следующее межкомандное решение, принятое через
        согласованный порядок без моего вмешательства в работу команд.'
    reading:
    - gitlab-engineering-director-process
    - gitlab-communication
    - fowler-team-topologies
  - id: lead-ai-productivity-claim
    tracks:
    - leadership
    roles:
    - engineering-manager
    - engineering-director
    - ai-transformation-lead
    type: applied_scenario
    text:
      en: Your organisation adopted AI coding tools and leadership wants to know whether they worked. How would
        you answer that credibly?
      ru: Организация внедрила AI-инструменты для разработки, и руководство хочет знать, дали ли они результат.
        Как вы ответите на этот вопрос убедительно?
    tests:
      en: Whether you choose a measure that survives scrutiny and admit what the available data cannot settle.
      ru: Выбираете ли вы показатель, который выдержит проверку, и признаёте ли, что имеющиеся данные не могут решить.
    provenance: generated
    added: '2026-10-05'
    basis:
    - radar:engineering-leadership
    start_here:
    - leadership
    priority: 89
    outline:
      en:
      - Make the claim precise first — faster delivery, more change, better quality or less toil — because each
        needs different evidence and they can move in opposite directions.
      - Prefer outcomes a customer feels, such as delivery lead time and change failure rate, over activity counts
        like accepted suggestions, which rise when the tool is used rather than when the work improves.
      - Compare against something — a staged rollout, comparable teams, or the same teams before and after — and
        name the confounders you could not remove.
      ru:
      - 'Сначала уточнить само утверждение — быстрее поставка, больше изменений, выше качество или меньше рутины:
        для каждого нужны свои данные, и двигаться они могут в разные стороны.'
      - 'Предпочитать результаты, которые чувствует заказчик, такие как время от задачи до поставки и доля неудачных
        изменений, счётчикам активности вроде принятых подсказок: те растут от использования инструмента, а не от
        улучшения работы.'
      - Сравнивать с чем-то — поэтапное внедрение, сопоставимые команды или те же команды до и после — и прямо назвать
        мешающие факторы, которые устранить не удалось.
    answer:
      en: 'I would first make the question answerable, because "did they work" hides four different claims: faster
        delivery, more change shipped, better quality, or less drudgery. They need different evidence and can move
        in opposite directions — more code merged with a higher change failure rate is not a win. I would report
        outcomes a customer feels, such as delivery lead time and change failure rate, rather than accepted suggestions
        or lines generated, which measure adoption and rise whenever people use the tool. Any number needs a comparison:
        a staged rollout gives the cleanest one, otherwise comparable teams, or before and after with the confounders
        named — hiring, reorganisation, seasonality, a big migration. I would also measure where the effort moved,
        since generated code shifts load onto review, and a gain in authoring that reappears as review backlog is
        not a gain. Developer surveys are weak evidence of time saved but good evidence of where friction is. I
        would state plainly what this design cannot settle rather than imply causation.'
      ru: 'Сначала я делаю вопрос отвечаемым, потому что за «дали ли результат» прячутся четыре разных утверждения:
        быстрее поставка, больше выпущенных изменений, выше качество, меньше рутины. Им нужны разные данные, и двигаться
        они могут в разные стороны: больше влитого кода при большей доле неудачных изменений — не победа. Я показываю
        результаты, которые чувствует заказчик, — время от задачи до поставки и долю неудачных изменений, — а не
        принятые подсказки и сгенерированные строки: те измеряют принятие инструмента и растут просто от его использования.
        Любому числу нужна база сравнения: чище всего её даёт поэтапное внедрение, иначе — сопоставимые команды
        или те же команды до и после с прямо названными мешающими факторами: найм, реорганизация, сезонность, крупная
        миграция. Я также измеряю, куда переехали усилия: сгенерированный код перекладывает нагрузку на ревью, и
        выигрыш в написании, который возвращается очередью на ревью, выигрышем не является. Опросы разработчиков
        — слабое свидетельство сэкономленного времени, но хорошее свидетельство того, где трение. Я прямо говорю,
        что такая схема решить не может, вместо намёка на причинность.'
    reading:
    - ms-experiment-design
    - google-rules-of-ml
