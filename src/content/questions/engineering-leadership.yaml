  - id: "lead-strategic-hiring"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        How do you decide which engineering capabilities to hire for?
      ru: >-
        Как вы определяете, какие инженерные компетенции нужно нанимать?
    tests:
      en: >-
        Whether staffing choices follow strategy and gaps in team capability.
      ru: >-
        Следуют ли кадровые решения из стратегии и пробелов в компетенциях.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-stripe"
        company: "stripe"
    start_here: ["leadership"]
    priority: 47
    outline:
      en:
        - "Start from the next period's commitments and the capabilities they require."
        - "Separate a gap worth hiring for from one solved by training, borrowing or not doing the work."
        - "Write the role from the gap, and define what evidence the loop must produce."
      ru:
        - "Начать с обязательств следующего периода и требуемых для них компетенций."
        - "Отличить пробел, который стоит закрывать найм, от решаемого обучением, заимствованием или отказом от работы."
        - "Писать роль из пробела и определить, какие доказательства должно дать интервью."
    answer:
      en: "I work backwards from commitments, not from granted headcount. What has the team promised for the next few quarters, which capabilities that requires, and where is the team thin in capability rather than in people. Then for each gap I ask whether hiring is the right instrument at all: some close faster by training someone who already knows the domain, some by borrowing a specialist temporarily, and some should close by deciding not to do that work. What remains justifies a role, and I write the role from the gap rather than from a generic ladder, then define what the loop must evidence so it tests the gap and not a proxy. I also weigh durability: a capability needed for years deserves a hire; a six-month spike usually does not. The failure I plan against is hiring for the architecture we have rather than the one we are moving to."
      ru: "Я иду от обязательств, а не от выделенной численности. Что команда обещала на ближайшие кварталы, какие компетенции для этого нужны и где она тонка именно по компетенциям, а не по числу людей. Дальше по каждому пробелу спрашиваю, вообще ли найм — подходящий инструмент: часть закрывается быстрее обучением человека, который уже знает предметную область, часть — временным заимствованием специалиста, а часть должна закрыться решением эту работу не делать. Остальное оправдывает роль, и роль я пишу из пробела, а не из общей карьерной лестницы, затем определяю, какие доказательства должно дать интервью, чтобы оно проверяло сам пробел, а не его подобие. Я взвешиваю и долговечность: компетенция, нужная стратегии годами, заслуживает найма, а полугодовой всплеск — обычно нет. Провал, от которого я страхуюсь, — найм под ту архитектуру, которая есть, а не под ту, к которой мы идём."
    reading: ["google-manager-training"]
  - id: "lead-quality-standard"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        How do you establish engineering quality standards across a team?
      ru: >-
        Как вы задаёте стандарты инженерного качества в команде?
    tests:
      en: >-
        Whether standards are observable, proportionate and part of daily delivery.
      ru: >-
        Являются ли стандарты проверяемыми, соразмерными риску и встроенными в работу.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-stripe"
        company: "stripe"
    start_here: ["leadership"]
    priority: 48
    outline:
      en:
        - "Define quality by observable outcomes, not by taste or a document nobody reads."
        - "Scale the requirement to the risk of the change, so low-risk work is not slowed."
        - "Put the standard in the default path — tooling, templates, CI — and revisit it with data."
      ru:
        - "Определить качество через наблюдаемые результаты, а не через вкус или документ, который никто не читает."
        - "Соразмерить требование риску изменения, чтобы не тормозить малорисковую работу."
        - "Встроить стандарт в путь по умолчанию — инструменты, шаблоны, CI — и пересматривать его по данным."
    answer:
      en: "A standard that lives in a wiki page is a preference; a standard that lives in the default path is real. So I start from outcomes the team can observe — escaped defects, revert rate, time to restore, review latency, test coverage of the risky paths — and agree what good looks like, otherwise review becomes an argument about style. Then I make the requirement proportionate to risk: a copy change and a change to the payments path should not face the same gate, or people will route around the gate. Whatever we agree goes into tooling, templates, linters and CI, so the easy path is the correct one. I would write it with the senior engineers rather than for them, since an imposed standard gets performed rather than followed, and revisit it against the numbers: a gate that never catches anything is pure cost."
      ru: "Стандарт, живущий на вики-странице, — это предпочтение; стандарт, живущий в пути по умолчанию, — реальность. Поэтому я начинаю с наблюдаемых результатов: пропущенные дефекты, доля откатов, время восстановления, задержка ревью, покрытие тестами рискованных участков — и договариваюсь, что считается хорошим, иначе ревью превращается в спор о стиле. Затем соразмеряю требование риску: правка текста и изменение платёжного пути не должны проходить один и тот же барьер, иначе барьер начнут обходить. Всё, о чём договорились, уходит в инструменты, шаблоны, линтеры и CI, чтобы простой путь был и правильным. Писал бы я это вместе с сильными инженерами, а не за них: навязанный извне стандарт исполняют для вида, а не соблюдают, — и пересматривал бы его по цифрам: барьер, который никогда ничего не ловит, — чистые издержки."
    reading: ["google-sre-book"]
