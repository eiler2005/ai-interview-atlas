theme: "engineering-leadership"
questions:
  - id: "lead-low-performance"
    tracks: ["leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Tell me how you handled an engineer who was not meeting expectations.
      ru: >-
        Расскажите, как вы работали с инженером, который не справлялся с ожиданиями.
    tests:
      en: >-
        Whether you diagnose performance fairly and make expectations actionable.
      ru: >-
        Умеете ли вы справедливо разобраться в причинах и превратить ожидания в конкретные действия.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-report-google-em-l6"
        company: "google"
    start_here: ["leadership"]
    priority: 18
    outline:
      en:
        - "Identify the performance gap using observable examples."
        - "Explain the feedback, listening and support you provided."
        - "Describe agreed next steps and the follow-up result."
      ru:
        - "Покажите отклонение от ожиданий на наблюдаемых примерах."
        - "Объясните обратную связь, обсуждение и оказанную поддержку."
        - "Опишите согласованные действия и результат последующей проверки."
    answer:
      en: "The interviewer isn't listening for a firing story; they want to see how you separate facts from impressions. So build the answer from the observable gap: what expectations were written down, which results and deadlines missed them, and which examples show it. Then explain how you gave feedback: directly, promptly, not in public, and what you heard back. The causes usually sit in unclear priorities, skill gaps, or circumstances outside work. Name the support you offered, the actions you agreed with a check-in date, and how it ended, including the cases where the person left. One common mistake is opening with a diagnosis of their personality and closing with a moral; another is staying silent about your own part in expectations never being clear. Finish with what you changed in your own practice: how you state expectations now, and how early you notice drift."
      ru: "Интервьюер слушает здесь не историю увольнения, а способ отличать факты от впечатлений, поэтому стройте ответ от наблюдаемого разрыва: какие ожидания были зафиксированы, какие именно результаты и сроки им не соответствовали, на каких примерах это видно. Дальше объясните, как вы дали обратную связь — прямо, вовремя, не публично — и что услышали в ответ: причины часто лежат в непонятных приоритетах, пробелах в навыках или обстоятельствах вне работы. Затем назовите оказанную поддержку, согласованные действия с датой проверки и чем всё закончилось, включая случаи, когда человек ушёл. Типичная ошибка — начать с диагноза личности и закончить моралью; вторая — умолчать о своём вкладе в то, что ожидания не были ясны. Завершайте тем, что изменили в собственной работе: как теперь формулируете ожидания и насколько рано замечаете отклонение."
    reading: ["google-manager-training"]
  - id: "lead-disruptive-star"
    tracks: ["leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        How did you handle a high-performing engineer whose behaviour caused conflict with colleagues?
      ru: >-
        Как вы работали с сильным инженером, чьё поведение вызывало конфликты с коллегами?
    tests:
      en: >-
        Whether you hold performance and collaboration to explicit standards.
      ru: >-
        Предъявляете ли вы понятные требования и к результатам, и к взаимодействию.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-report-google-em-l6"
        company: "google"
    start_here: ["leadership"]
    priority: 19
    outline:
      en:
        - "Separate technical results from the impact of specific behaviour."
        - "Explain your feedback and how you heard their perspective."
        - "Describe agreed behaviour changes and subsequent observations."
      ru:
        - "Разделите технические результаты и последствия конкретного поведения."
        - "Объясните обратную связь и то, как вы выслушали сотрудника."
        - "Опишите согласованные изменения поведения и последующие наблюдения."
    answer:
      en: "Separate two things in your first sentence: the person's technical contribution and the consequences of specific behaviour. Otherwise the answer sounds like a complaint about someone's character. Describe what was observable: whose work got held up, who stopped bringing ideas, which meetings ended without a decision. What's being tested is whether you set standards for collaboration as clearly as you set them for results, and whether you quietly make an exception for a strong engineer. Say how you talked one on one, what you heard back, since sharpness often covers overload, unclear authority, or a sense that quality is being sacrificed, and what behaviour changes you agreed in checkable terms. End with what you saw afterwards and what would have followed if nothing changed. The mistake is finishing with \"we talked and it went away\"; the interviewer wants the follow-up, not a happy ending."
      ru: "Разделите две вещи с первой фразы: технический вклад человека и последствия конкретного поведения — иначе ответ звучит как жалоба на характер. Опишите наблюдаемое: чьи задачи тормозились, кто перестал приносить идеи, какие встречи заканчивались без решения. Проверяют здесь, предъявляете ли вы требования к взаимодействию так же ясно, как к результату, и не делаете ли исключение для сильного инженера. Расскажите, как вы говорили один на один, что услышали в ответ — за резкостью нередко стоят перегрузка, непонятные полномочия или ощущение, что качеством жертвуют, — и о каких изменениях поведения договорились, в проверяемых формулировках. Закончите тем, что наблюдали дальше и что было бы, если бы ничего не поменялось. Ошибка — финал вида «поговорили, и всё прошло»: интервьюеру нужна последующая проверка, а не благополучная развязка."
    reading: ["google-manager-training"]
  - id: "lead-mentee-growth"
    tracks: ["leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Describe how someone you mentored progressed in their career.
      ru: >-
        Расскажите, как развивалась карьера человека, которого вы наставляли.
    tests:
      en: >-
        Whether you develop others through opportunities and evidence rather than taking credit for their success.
      ru: >-
        Помогаете ли вы развиваться через задачи и обратную связь, не присваивая чужие достижения.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-report-anthropic-em"
        company: "anthropic"
    start_here: ["leadership"]
    priority: 20
    outline:
      en:
        - "Describe their development goal and starting point."
        - "Explain how coaching helped them choose actions."
        - "Distinguish their achievements from your support."
      ru:
        - "Опишите цель развития сотрудника и исходную ситуацию."
        - "Объясните, как наставничество помогло выбрать действия."
        - "Отделите достижения сотрудника от вашей поддержки."
    answer:
      en: "Start with their goal, not your role: what they wanted to reach, where they stood then, and what gap to the next level was visible in their work. Then explain what the mentoring actually did: which tasks you helped them pick or handed over, what questions you asked, what feedback you gave and how often. What is being listened for is whether you grow people through real work and whether you avoid taking credit for their wins, so name the achievements as theirs: they did it, they defended the design, they got promoted. State your own contribution separately and more modestly: you created an opportunity, removed an obstacle, made the result visible. The common mistake is a story where the mentor decides everything and the mentee only executes. Finish with what you learned about developing people and what you do differently with the people you lead now."
      ru: "Начните с цели человека, а не со своей роли: чего он хотел достичь, где находился тогда и какой разрыв до следующего уровня был виден в работе. Потом объясните, что именно делало наставничество: какие задачи вы помогли выбрать или передали, какие вопросы задавали, какую обратную связь давали и с какой регулярностью. Слушают при этом главное — растите ли вы людей через настоящую работу и не присваиваете ли их достижения, поэтому достижения называйте от их имени: он сделал, он защитил проект, его повысили. Свой вклад формулируйте отдельно и скромнее: создал возможность, убрал препятствие, добился видимости результата. Частая ошибка — рассказ, где наставник решает всё сам, а подопечный только исполняет. Заканчивайте тем, что вы поняли про развитие людей и что делаете иначе с теми, кого ведёте сейчас."
    reading: ["google-manager-training"]
  - id: "lead-team-disagrees"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        What do you do when your team disagrees with your proposed direction?
      ru: >-
        Что вы делаете, когда команда не согласна с предложенным вами направлением?
    tests:
      en: >-
        Whether you invite challenge while retaining responsibility for a decision.
      ru: >-
        Готовы ли вы обсуждать возражения, сохраняя ответственность за решение.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-report-anthropic-em"
        company: "anthropic"
    start_here: ["leadership"]
    priority: 21
    outline:
      en:
        - "Clarify the disputed assumptions and actively seek the strongest objection."
        - "Use evidence or a bounded experiment where it can resolve the disagreement."
        - "Explain decision rights, communicate the choice and define when to revisit it."
      ru:
        - "Уточните спорные предположения и разберите самое сильное возражение."
        - "Используйте данные или ограниченный эксперимент, если это поможет разрешить спор."
        - "Объясните полномочия, сообщите решение и условия его пересмотра."
    answer:
      en: "First I work out what the disagreement is about: facts, a forecast, or priorities. Otherwise the discussion goes in circles. I ask people to name the assumptions my proposal rests on, then take the strongest objection and state it better than its author did: if it falls apart, the direction is firmer; if it doesn't, I'm the one who has to change the decision. Where the argument turns on an unknown quantity, it's cheaper to run a bounded experiment or prototype with an agreed criterion than to keep arguing; the price is time, so I fix the deadline up front. Then I say plainly whose call it is: the discussion is open, the responsibility is mine. The decision, reasons and rejected options go into a design doc with the conditions for revisiting it. This is overkill when a decision is cheap and reversible: then trying is faster than aligning."
      ru: "Сначала выясняю, о чём именно спор: о фактах, о прогнозе или о приоритетах — иначе обсуждение идёт по кругу. Прошу назвать предположения, на которых держится моё предложение, и беру самое сильное возражение, формулируя его вслух лучше, чем это сделал автор: если оно рассыпается, направление крепче, если нет — менять решение надо мне. Там, где спор упирается в неизвестную величину, дешевле не спорить, а поставить ограниченный эксперимент или прототип с заранее согласованным критерием; плата за это — время, поэтому срок фиксирую сразу. Дальше прямо говорю, чьё это решение: обсуждение открытое, ответственность моя. Решение, причины и отвергнутые варианты записываю в design-документ вместе с условиями пересмотра. Такой порядок избыточен, когда решение дёшево и обратимо: тогда быстрее попробовать, чем согласовывать."
    reading: ["design-docs-at-google"]
  - id: "lead-reorganisation-retention"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        How would you respond when a high performer considers leaving during a reorganisation?
      ru: >-
        Как вы поступите, если сильный сотрудник собирается уйти во время реорганизации?
    tests:
      en: >-
        Whether you listen honestly and address retention without making promises you cannot keep.
      ru: >-
        Умеете ли вы разобраться в причинах ухода без невыполнимых обещаний.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-report-google-em-l6"
        company: "google"
    start_here: ["leadership"]
    priority: 22
    outline:
      en:
        - "Understand the person's concerns and separate change uncertainty from persistent problems."
        - "Explain what is known, what you can change and what remains undecided."
        - "Discuss feasible support, surface unresolved concerns and agree a follow-up."
      ru:
        - "Выясните причины и отделите неопределённость перемен от устойчивых проблем."
        - "Объясните, что известно, на что вы влияете и какие решения ещё не приняты."
        - "Обсудите доступную поддержку, нерешённые вопросы и последующую встречу."
    answer:
      en: "I start with a conversation that isn't a negotiation: I want the reason, not retention at any price. Then I separate the temporary uncertainty of a reorganisation, an unclear manager, an unsettled team shape, plans on hold, from problems that predate it: a growth ceiling, pay, relationships, the content of the work. The mechanism is simple: the first is treated with information and dates, the second only with real changes. Confusing them is expensive, because a promise I can't keep speeds the exit and costs the team's trust. So I say honestly what is decided, what I influence, what is still open and when it will be known. I offer support I can actually give, write down unresolved questions and set a follow-up on a specific date. If the reason is beyond my influence, the goal changes: a decent exit, a handover and a preserved relationship are a result too."
      ru: "Начинаю с разговора без торга: мне нужно понять причину, а не удержать любой ценой. Дальше разделяю временную неопределённость реорганизации — неясный руководитель, непонятный контур команды, подвешенные планы — и устойчивые проблемы, которые были и до неё: потолок роста, вознаграждение, отношения, содержание работы. Механизм простой: первое лечится информацией и сроками, второе — только реальными изменениями, а путать их дорого, потому что невыполнимое обещание ускорит уход и ударит по доверию всей команды. Поэтому честно говорю, что уже решено, на что влияю я, что ещё открыто и когда станет известно. Предлагаю доступную поддержку, записываю нерешённые вопросы и назначаю следующую встречу с конкретной датой. Если причина вне моего влияния, задача меняется: достойный выход, передача знаний и сохранённые отношения тоже результат."
    reading: ["gitlab-organizational-change"]
  - id: "lead-team-after-change"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        How would you stabilise an engineering team after a change in management?
      ru: >-
        Как вы стабилизируете инженерную команду после смены руководства?
    tests:
      en: >-
        Whether you establish trust and operating clarity before imposing broad changes.
      ru: >-
        Умеете ли вы восстановить доверие и ясность работы до масштабных изменений.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-report-google-em-l6"
        company: "google"
    start_here: ["leadership"]
    priority: 23
    outline:
      en:
        - "Listen to team members and partners and identify urgent delivery or wellbeing risks."
        - "Clarify priorities, decision ownership and communication routines."
        - "Make a small number of justified changes and check their effect."
      ru:
        - "Выслушайте команду и партнёров и выявите срочные риски для работы и людей."
        - "Уточните приоритеты, ответственность за решения и регулярное взаимодействие."
        - "Внесите ограниченное число обоснованных изменений и проверьте их эффект."
    answer:
      en: "I spend the first weeks listening rather than reforming: one on ones with the team and with key partners, asking what gets in the way today and what people are afraid of tomorrow. A change of manager by itself lowers predictability, so any big early change reads as a threat, even a sensible one. Then I put clarity back: which priorities hold right now, who owns which decisions, which meetings and reports stay and which go away. Urgent risks to delivery and to people I close immediately, without waiting for the full picture. After that I make a small number of changes, each with a stated reason, and check the effect after a fixed period against dates, incidents, attrition and direct feedback. This pace is wrong if the team is already in crisis: there you stop the fall first and listen as you go."
      ru: "Первые недели трачу на слушание, а не на реформы: встречи один на один с командой и ключевыми партнёрами, вопросы о том, что мешает работать сегодня и чего люди опасаются завтра. Смена руководителя сама по себе снижает предсказуемость, поэтому любое раннее крупное изменение читается как угроза, даже вполне разумное. Дальше возвращаю ясность: какие приоритеты действуют сейчас, кто какие решения принимает, какие встречи и отчёты остаются, а какие исчезают. Срочные риски для поставки и для людей закрываю сразу, не дожидаясь полной картины. Потом делаю немного изменений, каждое с объяснением причины, и через фиксированный срок проверяю эффект по срокам, инцидентам, оттоку и прямым отзывам. Такой темп не годится, если команда уже в кризисе: там сначала останавливают падение, а слушают по ходу."
    reading: ["gitlab-organizational-change"]
  - id: "lead-opportunity-coalition"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Describe how you identified a valuable opportunity and persuaded a group to deliver it.
      ru: >-
        Расскажите, как вы нашли ценную возможность и убедили группу людей её реализовать.
    tests:
      en: >-
        Whether you create influence through evidence, alignment and shared ownership.
      ru: >-
        Умеете ли вы влиять через данные, согласование интересов и общую ответственность.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "monzo-staff-plus-interview"
        company: "monzo"
    start_here: ["leadership"]
    priority: 24
    outline:
      en:
        - "Explain why the opportunity mattered and how you discovered it."
        - "Describe competing priorities, objections and how participants shaped the plan."
        - "Show delivery and impact, including what remained outside your control."
      ru:
        - "Объясните значение возможности и как вы её обнаружили."
        - "Опишите конкурирующие приоритеты, возражения и вклад участников в план."
        - "Покажите выполнение и эффект, обозначив границы своего влияния."
    answer:
      en: "Build the answer around the opportunity, not around how persuasive you were. Start with what you noticed and why it mattered: which signal in the data, the support tickets or the metrics, what size of effect you expected and on what basis. Then the important part. Everyone you needed already had a plan for the quarter, so say whose priorities you were pushing against, what objections came back, and how the proposal changed because of other people's input; a coalition holds together through co-authorship, not through persuasion. A written document with options, risks and open questions helps here, because people argue with a text rather than with rumours. Then give what was actually delivered and what effect it had, and mark the limits of your influence honestly: where other people decided, and what did not work. The mistake is a story where you convinced everyone at once, with no losses."
      ru: "Стройте ответ вокруг самой возможности, а не вокруг своей убедительности. Сначала объясните, что вы заметили и почему это было ценно: какой сигнал в данных, обращениях или метриках, какого порядка эффект вы ожидали и на каком основании. Дальше самое важное: у каждого участника был свой план на квартал, поэтому расскажите, чьи приоритеты вы задевали, какие возражения звучали и как предложение менялось от чужого вклада — коалиция держится на соавторстве, а не на уговорах. Хороший инструмент здесь письменный документ с вариантами, рисками и открытыми вопросами: спорят с текстом, а не со слухами. Затем приведите, что было реально сделано и какой вышел эффект, и честно обозначьте границы своего влияния: где решали другие и что не получилось. Ошибка — история, в которой вы убедили всех сразу и без потерь."
    reading: ["design-docs-at-google","google-sre-book"]
