  - id: "lead-two-valid-views"
    tracks: ["leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Describe a team disagreement that you resolved without discarding the valid concerns on either side.
      ru: >-
        Расскажите о споре в команде, который вы разрешили, сохранив обоснованные доводы обеих сторон.
    tests:
      en: >-
        Whether you uncover underlying needs instead of forcing a superficial compromise.
      ru: >-
        Выявляете ли вы реальные потребности вместо поверхностного компромисса.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-report-google-em-l6"
        company: "google"
    start_here: ["leadership"]
    priority: 60
    outline:
      en:
        - "Pick a disagreement where both positions protected something real, and state each in its strongest form."
        - "Show how you moved from positions to the needs behind them and found an option meeting both."
        - "Close with what was decided, whether both concerns stayed addressed, and how you checked."
      ru:
        - "Выбрать спор, где обе позиции защищали что-то настоящее, и изложить каждую в сильнейшей форме."
        - "Показать, как вы перешли от позиций к стоящим за ними потребностям и нашли вариант, закрывающий обе."
        - "Закончить принятым решением, тем, остались ли закрыты оба опасения, и тем, как вы это проверили."
    answer:
      en: "Choose a disagreement where both sides were defending something real, say delivery speed against operability, rather than one where somebody was simply wrong, because the question is about keeping valid concerns, not about picking a winner. State each position in its strongest form. The interviewer is listening for the step from positions to needs: what each person feared would happen if the other prevailed. Positions conflict far more often than needs do, and once the needs are visible there's often an option that meets both — a staged rollout, a guardrail with a deadline, a reversible first step. Make clear this isn't splitting the difference, which usually leaves both concerns half addressed; that's the superficial compromise being tested. Say who decided, and what you'd have done if the needs had genuinely conflicted. The usual mistake is casting yourself as the wise mediator whose idea solved everything. Close with evidence: what was built, whether both concerns stayed addressed, and how the two people worked together afterwards."
      ru: "Выбирайте спор, где обе стороны защищали что-то настоящее, например скорость выпуска и удобство эксплуатации, а не тот, где кто-то просто ошибался: вопрос о том, чтобы сохранить обоснованные опасения, а не выбрать победителя. Изложите каждую позицию в сильнейшей форме. Интервьюер слушает переход от позиций к потребностям: чего каждый боялся, если победит другой. Позиции конфликтуют гораздо чаще, чем потребности, и когда потребности видны, нередко находится вариант, закрывающий обе, — поэтапный выпуск, ограничитель со сроком, обратимый первый шаг. Подчеркните, что это не деление пополам: оно обычно оставляет оба опасения закрытыми наполовину, и именно такой поверхностный компромисс здесь проверяют. Скажите, кто принимал решение и что бы вы сделали, если бы потребности действительно противоречили друг другу. Частая ошибка — роль мудрого посредника, чья идея всё решила. Заканчивайте свидетельствами: что в итоге сделали, остались ли закрыты оба опасения и как эти двое работали вместе дальше."
    reading: ["google-manager-training"]
  - id: lead-strategic-hiring
    tracks:
    - leadership
    type: behavioral
    level: senior
    text:
      en: Describe your most recent strategic engineering hire. How did you define the hiring bar and assess whether
        the hire met the need?
      ru: Расскажите о своём последнем стратегически важном найме инженера. Как вы определили планку и оценили, решил
        ли найм исходную задачу?
    tests:
      en: Whether a real hiring decision connects a capability need, a consistent assessment and observed results.
      ru: Связываете ли вы в реальном кадровом решении потребность в компетенции, последовательную оценку и наблюдаемые
        результаты.
    provenance: published
    added: '2026-09-26'
    evidence:
    - source: exponent-stripe
      company: stripe
    start_here:
    - leadership
    priority: 47
    outline:
      en:
      - State the real strategic need, your role in the decision and why hiring was chosen.
      - Explain the role-specific bar, assessment evidence and important tradeoffs.
      - Describe onboarding and observed results; distinguish early signals from a proven long-term outcome.
      ru:
      - Назвать реальную стратегическую потребность, свою роль в решении и причины выбора найма.
      - Объяснить требования роли, доказательства из оценки и существенные компромиссы.
      - Описать адаптацию и наблюдаемые результаты; отделить ранние признаки от подтверждённого долгосрочного эффекта.
    answer:
      en: 'Use your most recent real strategic hire and explain the capability the organisation needed, rather than
        presenting a generic staffing philosophy. State your authority: you may have owned the role, designed the
        assessment or contributed an interview without making the final decision. Explain why hiring was preferable
        to training, borrowing expertise or reducing scope in that situation. Describe the hiring bar in terms of
        work the person needed to perform and the evidence used to assess it consistently. Include a meaningful tradeoff,
        such as immediate domain knowledge versus the ability to build a new capability, without disclosing candidate
        details. Then describe onboarding and what you observed after the hire. If the person has only recently joined,
        say that the strategic outcome is not yet known. If you have no such hire, be explicit and discuss the closest
        staffing decision without recasting participation as ownership.'
      ru: 'Возьмите последний реальный стратегически важный найм и объясните, какая компетенция была нужна организации,
        вместо изложения общей кадровой философии. Назовите свои полномочия: вы могли отвечать за роль, проектировать
        оценку или проводить интервью, не принимая окончательного решения. Объясните, почему в той ситуации найм оказался
        предпочтительнее обучения, временного привлечения эксперта или сокращения объёма работы. Сформулируйте планку
        через задачи, которые предстояло выполнять человеку, и доказательства, которыми последовательно проверяли
        готовность к ним. Покажите существенный компромисс, например между немедленным знанием предметной области
        и способностью создать новую компетенцию, не раскрывая данные кандидатов. Затем опишите адаптацию и наблюдаемые
        результаты найма. Если человек пришёл недавно, прямо скажите, что стратегический эффект пока неизвестен. Если
        такого найма не было, обозначьте это и разберите ближайшее кадровое решение, не превращая участие в ответственность
        за весь процесс.'
    reading:
    - google-manager-training
  - id: "lead-quality-standard"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        How do you establish engineering quality standards across a team?
      ru: >-
        Как вы задаёте стандарты инженерного качества в команде?
    tests:
      en: >-
        Whether standards are observable, proportionate and part of daily delivery.
      ru: >-
        Являются ли стандарты проверяемыми, соразмерными риску и встроенными в работу.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-stripe"
        company: "stripe"
    start_here: ["leadership"]
    priority: 48
    outline:
      en:
        - "Define quality by observable outcomes, not by taste or a document nobody reads."
        - "Scale the requirement to the risk of the change, so low-risk work is not slowed."
        - "Put the standard in the default path — tooling, templates, CI — and revisit it with data."
      ru:
        - "Определить качество через наблюдаемые результаты, а не через вкус или документ, который никто не читает."
        - "Соразмерить требование риску изменения, чтобы не тормозить малорисковую работу."
        - "Встроить стандарт в путь по умолчанию — инструменты, шаблоны, CI — и пересматривать его по данным."
    answer:
      en: "A standard that lives in a wiki page is a preference; a standard that lives in the default path is real. So I start from outcomes the team can observe — escaped defects, revert rate, time to restore, review latency, test coverage of the risky paths — and agree what good looks like, otherwise review becomes an argument about style. Then I make the requirement proportionate to risk: a copy change and a change to the payments path should not face the same gate, or people will route around the gate. Whatever we agree goes into tooling, templates, linters and CI, so the easy path is the correct one. I would write it with the senior engineers rather than for them, since an imposed standard gets performed rather than followed, and revisit it against the numbers: a gate that never catches anything is pure cost."
      ru: "Стандарт, живущий на вики-странице, — это предпочтение; стандарт, живущий в пути по умолчанию, — реальность. Поэтому я начинаю с наблюдаемых результатов: пропущенные дефекты, доля откатов, время восстановления, задержка ревью, покрытие тестами рискованных участков — и договариваюсь, что считается хорошим, иначе ревью превращается в спор о стиле. Затем соразмеряю требование риску: правка текста и изменение платёжного пути не должны проходить один и тот же барьер, иначе барьер начнут обходить. Всё, о чём договорились, уходит в инструменты, шаблоны, линтеры и CI, чтобы простой путь был и правильным. Писал бы я это вместе с сильными инженерами, а не за них: навязанный извне стандарт исполняют для вида, а не соблюдают, — и пересматривал бы его по цифрам: барьер, который никогда ничего не ловит, — чистые издержки."
    reading: ["google-sre-book"]
  - id: "lead-engineering-persuasion"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        How would you convince engineers that a proposed product feature is worth building?
      ru: >-
        Как вы убедите инженеров, что предложенную продуктовую функцию стоит делать?
    tests:
      en: >-
        Whether you engage technical concerns and establish a shared reason to invest.
      ru: >-
        Учитываете ли вы технические возражения и формируете ли общее обоснование работы.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-perplexity-ai-pm"
        company: "perplexity"
    outline:
      en:
        - "Bring the user problem and the evidence behind it, not the feature, so engineers can judge the reasoning."
        - "Treat objections about cost, complexity or maintenance as inputs that can reshape scope, not as resistance."
        - "Agree a success metric and a cheap first version, and commit to cutting it if the metric misses."
      ru:
        - "Принести проблему пользователя и данные за ней, а не саму функцию, чтобы инженеры могли проверить логику."
        - "Считать возражения о цене, сложности и поддержке входными данными, способными изменить объём, а не сопротивлением."
        - "Договориться о метрике успеха и дешёвой первой версии и обещать убрать функцию, если метрика не будет достигнута."
    reading: ["google-pair-user-needs", "design-docs-at-google"]
