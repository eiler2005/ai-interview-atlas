    roles: ["engineering-manager"]
    type: "applied_scenario"
    text:
      en: "Candidates now use AI assistants during technical interviews. How would you redesign your loop so that it still produces a usable hiring signal?"
      ru: "Кандидаты используют AI-ассистентов на технических интервью. Как вы перестроите процесс, чтобы он по-прежнему давал пригодный сигнал для найма?"
    tests:
      en: "Whether the loop measures judgement and ownership instead of banning or ignoring the tools."
      ru: "Измеряет ли процесс суждение и ответственность вместо запрета или игнорирования инструментов."
    provenance: "generated"
    added: "2026-09-30"
    basis: ["radar:engineering-leadership"]
    outline:
      en:
        - "Identify which old tasks assistants now solve, and restate the signal as judgement, verification and ownership."
        - "Allow tools openly with the same setup for everyone, and score how candidates check, correct and explain output."
        - "Calibrate the new tasks on current engineers using the same tools, and track whether scores predict later performance."
      ru:
        - "Определить, какие прежние задания теперь решают ассистенты, и переформулировать сигнал как суждение, проверку и ответственность."
        - "Открыто разрешить инструменты в одинаковой для всех среде и оценивать, как кандидат проверяет, исправляет и объясняет результат."
        - "Откалибровать новые задания на действующих инженерах с теми же инструментами и отслеживать, предсказывают ли оценки последующую работу."
