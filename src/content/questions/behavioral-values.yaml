theme: "behavioral-values"
questions:
  - id: "beh-motivation-and-disagreement"
    tracks: ["engineering","leadership"]
    type: "self_presentation"
    level: "senior"
    text:
      en: >-
        Why do you want to work at Anthropic, and where do you disagree with its approach?
      ru: >-
        Почему вы хотите работать в Anthropic и в чём не согласны с её подходом?
    tests:
      en: >-
        Whether motivation is informed and leaves room for independent judgement.
      ru: >-
        Основана ли мотивация на понимании компании и сохраняете ли вы самостоятельность суждений.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    start_here: ["leadership"]
    priority: 38
    outline:
      en:
        - "Connect specific public work or mission choices to your own professional interests."
        - "Offer a reasoned disagreement and state what evidence could change your view."
        - "Explain how you would contribute while engaging constructively with that disagreement."
      ru:
        - "Связать конкретную публичную работу или решения компании со своими профессиональными интересами."
        - "Сформулировать обоснованное несогласие и данные, которые могли бы изменить вашу позицию."
        - "Объяснить свой возможный вклад и конструктивную работу при сохранении разногласий."
    answer:
      en: "Build the motivation on verifiable specifics: name a paper, a product or a company decision you actually studied, and explain how it connects to your work and to what you want to do next. Generic mission statements tell the interviewer little about you. The second half of the question matters more than the first. The disagreement has to be real, with a clear basis, and it must come with an answer to what evidence or results would change your position; that is what separates judgement from a pose. Take the subject from the substance of the work, not a safe detail and not an accusation. Finish with how you would work while holding that disagreement: what you contribute, how you raise the objection internally, and why you carry out a decision that went against you. Refresh the facts from the company's public material before the conversation."
      ru: "Мотивацию стройте на проверяемой конкретике: назовите публикацию, продукт или решение компании, которое вы разбирали, и объясните, как оно связано с вашей работой и тем, чем вы хотите заниматься дальше. Общие слова про миссию звучат у всех и ничего не сообщают о вас. Вторая половина вопроса важнее первой: несогласие должно быть настоящим, с внятным основанием, и обязательно с ответом на вопрос, какие данные или результаты изменили бы вашу позицию — это отличает суждение от позы. Предмет спора берите по существу работы, а не безопасную мелочь и не обвинение. Заканчивайте тем, как вы собираетесь работать, сохраняя разногласие: в чём ваш вклад, как вы доносите возражение внутри и почему выполняете решение, принятое не в вашу пользу. Перед разговором обновите факты по публичным материалам компании."
    reading: ["anthropic-careers"]
  - id: "beh-mistake-learning"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Describe a mistake you made, its consequences and what you changed afterward.
      ru: >-
        Расскажите о своей ошибке, её последствиях и последующих изменениях в работе.
    tests:
      en: >-
        Whether you take responsibility and show learning through concrete behaviour.
      ru: >-
        Берёте ли вы ответственность и подтверждаете ли выводы конкретными изменениями поведения.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    start_here: ["leadership"]
    priority: 39
    outline:
      en:
        - "Describe your decision and what you knew at the time."
        - "Explain impact, recovery and your responsibility without blaming others."
        - "Identify a lasting change and evidence that it helped."
      ru:
        - "Описать своё решение и данные, которыми располагали тогда."
        - "Объяснить последствия, восстановление и свою ответственность без перекладывания вины."
        - "Назвать устойчивое изменение и признаки его пользы."
    answer:
      en: "Pick a mistake that genuinely cost money, time or trust, or the answer turns into hidden boasting. Start with the decision: what you chose, what you knew at the time, and why it looked reasonable, so the interviewer sees your thinking and not just the outcome. Then the consequences and the recovery, without spreading the blame across circumstances and colleagues: a blameless postmortem means an honest analysis of causes, not a way of dropping your own responsibility. The most common failure in this answer is the line about taking on too much, which dresses a virtue up as a flaw. Finish with a change that stayed with you, a different rule for deciding, a check before release, the habit of writing the postmortem, and with a sign that it worked, for example a similar situation that went differently the next time."
      ru: "Берите ошибку, которая действительно стоила денег, времени или доверия, иначе ответ прозвучит как скрытое хвастовство. Начните с решения: что вы выбрали, какими данными располагали тогда и почему это выглядело разумным — так собеседник видит ваше мышление, а не только исход. Дальше последствия и восстановление, без размазывания вины по обстоятельствам и коллегам: разбор без поиска виноватых означает честный анализ причин, а вовсе не отказ от собственной ответственности. Самая частая ошибка ответа — формулировка вроде «слишком много брал на себя», которая маскирует достоинство под недостаток. Заканчивайте изменением, которое осталось с вами: другое правило принятия решений, проверка перед выпуском, привычка писать разбор, — и признаком того, что оно сработало, например похожей ситуацией, которая пошла уже иначе."
    reading: ["google-sre-postmortem-culture"]
  - id: "beh-unresolved-disagreement"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Tell me about a time you disagreed with someone and could not persuade them.
      ru: >-
        Расскажите о случае, когда вы были не согласны с человеком, но не смогли его убедить.
    tests:
      en: >-
        Whether you work constructively after losing an argument.
      ru: >-
        Умеете ли вы конструктивно работать после того, как вашу позицию не приняли.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-amazon-ai-pm"
        company: "amazon"
    start_here: ["leadership"]
    priority: 40
    outline:
      en:
        - "State both positions fairly and explain your evidence."
        - "Describe the decision process and how you supported the agreed action."
        - "Explain the result, limits of commitment and what you learned."
      ru:
        - "Честно изложить обе позиции и свои аргументы."
        - "Описать принятие решения и поддержку согласованных действий."
        - "Объяснить результат, границы обязательств и сделанные выводы."
    answer:
      en: "What matters in this answer is what happened after the argument, not the argument itself. Put both positions fairly and in their strongest form: if the other side sounds stupid, the interviewer decides you were listening badly. Give your own evidence and how you put it across, in conversation, in a written document, through data. Then say clearly who made the decision and why it was theirs to make, and describe how you backed the agreed action: you object before the decision, and after it you deliver, without quiet sabotage. Name the result, even if it proved you right, but without any triumph. Mark the limit as well: what you would not have done, and in what situation you would escalate. Finish with the conclusion, usually about what your argument was missing or who you should have gone to earlier."
      ru: "Главное в этом ответе то, что было после спора, а не сам спор. Изложите обе позиции честно и в сильной форме: если чужая выглядит глупо, собеседник решит, что вы плохо слушали. Приведите свои аргументы и то, как вы их доносили — в разговоре, письменным документом, через данные. Затем ясно скажите, кто принял решение и почему это было его право, и опишите, как вы поддержали согласованные действия: возражают до решения, после — выполняют, не саботируя вполголоса. Назовите результат, даже если он подтвердил вашу правоту, но без торжества. Обозначьте и границу: чего вы делать не стали бы и в какой ситуации пошли бы на эскалацию. Заканчивайте выводом, обычно про то, чего не хватило в аргументации или к кому стоило прийти раньше."
    reading: ["amazon-leadership-principles"]
  - id: "beh-moral-conflict"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Describe a time when work created a moral conflict for you. What did you do?
      ru: >-
        Расскажите о моральном конфликте, возникшем у вас в работе. Как вы поступили?
    tests:
      en: >-
        Whether you can explain values, consequences and practical action without a rehearsed slogan.
      ru: >-
        Умеете ли вы объяснить ценности, последствия и действия без заученных лозунгов.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-report-anthropic-staff-infra"
        company: "anthropic"
    outline:
      en:
        - "Choose a case with real stakes where reasonable people could disagree, not an obvious wrongdoing."
        - "State the value through its consequences: who would be affected and how, and which options you had."
        - "Describe the action you took, what it cost you, and the line you would hold next time."
      ru:
        - "Выбрать случай с реальной ставкой, где разумные люди могли разойтись, а не очевидное нарушение."
        - "Выразить ценность через последствия: кого и как это затронуло бы и какие у вас были варианты."
        - "Описать, что вы сделали, чего это вам стоило и какую границу будете держать в следующий раз."
    reading: ["gds-data-ai-ethics"]
  - id: "beh-ai-safety-view"
    tracks: ["engineering","leadership"]
    type: "knowledge"
    level: "senior"
    text:
      en: >-
        What do you see as the significant risks of advanced AI systems?
      ru: >-
        Какие риски развитых AI-систем вы считаете существенными?
    tests:
      en: >-
        Whether you articulate a coherent, evidence-sensitive view of AI risk.
      ru: >-
        Умеете ли вы последовательно изложить позицию о рисках AI и её основания.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    outline:
      en:
        - "Separate risk classes — misuse, unintended model behaviour, wider structural effects — and say which you rank highest."
        - "Tie each risk to current evidence, and mark clearly where you are extrapolating rather than observing."
        - "Name what evidence would change your ranking and which mitigations, such as capability evaluations, can be tested now."
      ru:
        - "Разделить классы рисков — злоупотребление, непредусмотренное поведение моделей, более широкие структурные эффекты — и назвать главный для вас."
        - "Привязать каждый риск к имеющимся данным и ясно отметить, где вы экстраполируете, а не наблюдаете."
        - "Назвать, какие данные изменили бы вашу оценку и какие меры, например оценки возможностей моделей, проверяемы уже сейчас."
    reading: ["anthropic-rsp","international-ai-safety-report-2025"]
  - id: "beh-proud-project"
    tracks: ["engineering","leadership"]
    type: "self_presentation"
    level: "senior"
    text:
      en: >-
        Which project are you most proud of, and why?
      ru: >-
        Каким проектом вы больше всего гордитесь и почему?
    tests:
      en: >-
        Whether you explain meaningful impact and your actual contribution.
      ru: >-
        Умеете ли вы объяснить значимый результат и свой реальный вклад.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    outline:
      en:
        - "Choose the project by what changed for its users or the business, not by its technology or brand."
        - "Separate what you personally decided and built from the team's work, and name the hardest call you made."
        - "Close with evidence of the impact and why this project, rather than a bigger one, matters to you."
      ru:
        - "Выбрать проект по тому, что изменилось для пользователей или бизнеса, а не по технологии или громкому имени."
        - "Отделить то, что вы лично решили и сделали, от работы команды, и назвать самое трудное своё решение."
        - "Закончить подтверждением результата и тем, почему вам важен именно этот проект, а не более крупный."
    reading: ["paper-heart"]
  - id: "beh-interpersonal-conflict"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Describe a conflict with a colleague, how you handled it and what you learned.
      ru: >-
        Расскажите о конфликте с коллегой: как вы его разрешали и чему научились.
    tests:
      en: >-
        Whether you understand the other person's perspective and your own part in the conflict.
      ru: >-
        Понимаете ли вы позицию другого человека и свою роль в конфликте.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    outline:
      en:
        - "Pick a conflict in which your own behaviour contributed, not one where the colleague was simply difficult."
        - "Restate the colleague's view as they would, including the pressure they were under, before your own."
        - "Close with how the working relationship stood afterwards and what you now do differently yourself."
      ru:
        - "Выбрать конфликт, в который внесло вклад и ваше поведение, а не историю о просто трудном коллеге."
        - "Изложить позицию коллеги так, как изложил бы её он сам, с учётом давления на него, и только потом свою."
        - "Закончить тем, какими стали рабочие отношения и что вы сами теперь делаете иначе."
    reading: ["gitlab-communication"]
  - id: "beh-stakeholder-priorities"
    tracks: ["leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Tell me about conflicting stakeholder priorities and how you established alignment.
      ru: >-
        Расскажите о противоречащих приоритетах участников проекта и о том, как вы согласовали действия.
    tests:
      en: >-
        Whether you make competing objectives explicit and build an actionable agreement.
      ru: >-
        Умеете ли вы явно обсудить конкурирующие цели и договориться о действиях.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    start_here: ["leadership"]
    priority: 54
    outline:
      en:
        - "Name the stakeholders and the objective each was actually measured on."
        - "Show how you surfaced the conflict as a trade-off rather than a personality clash."
        - "End with the agreement, what was given up, and evidence that it held."
      ru:
        - "Назвать участников и цель, по которой каждого действительно оценивали."
        - "Показать, как вы вывели конфликт в плоскость компромисса, а не столкновения характеров."
        - "Закончить договорённостью, тем, чем пожертвовали, и свидетельством, что она держалась."
    answer:
      en: "Choose a conflict where the parties were both right, because a story where one side was simply wrong tests judgement about people, not alignment. Name what each stakeholder was measured on — that is usually the real source of the disagreement, and saying it aloud is most of the work: a sales commitment, a reliability target and a compliance deadline can be genuinely incompatible without anyone behaving badly. Then show how you made the trade-off visible: the options, their costs, and whose goal each damaged, rather than hunting for a compromise nobody asked for. Be concrete about the decision and what was given up, including your own priority if that happened. Finish with evidence it held — a written agreement people referred to later, a metric both sides accepted — and avoid the ending where everyone simply agreed once you explained."
      ru: "Берите конфликт, где обе стороны были правы: история, в которой одна сторона просто ошибалась, проверяет ваши суждения о людях, а не умение согласовывать. Назовите, по какой цели оценивали каждого участника, — обычно именно там и лежит источник расхождения, и произнести это вслух означает сделать большую часть работы: обязательство перед клиентом, цель по надёжности и срок по комплаенсу бывают действительно несовместимы, и никто при этом не ведёт себя плохо. Затем покажите, как вы сделали видимым сам выбор между целями: варианты, их цену и то, чьей цели каждый из них вредил, вместо поиска компромисса, о котором никто не просил. Будьте конкретны в решении и в том, чем пожертвовали, включая собственный приоритет, если так и было. Завершите свидетельством, что договорённость держалась: письменная фиксация, к которой потом возвращались, метрика, принятая обеими сторонами, — и избегайте финала, где все просто согласились после ваших объяснений."
    reading: ["gitlab-organizational-change"]
  - id: "beh-research-priorities"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Describe a disagreement with a researcher or technical lead about priorities and what followed.
      ru: >-
        Расскажите о разногласии с исследователем или техническим лидером по приоритетам и о том, что произошло дальше.
    tests:
      en: >-
        Whether you can reason across research and engineering incentives.
      ru: >-
        Умеете ли вы учитывать различия мотивации исследователей и инженеров.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "google"
    outline:
      en:
        - "Pick a dispute over priorities where research and engineering goals genuinely pulled in different directions."
        - "Explain what each side was rewarded for — new findings or reliable delivery — and what each choice cost."
        - "Show how it was settled, for example by a time-boxed experiment, and what followed for both sides."
      ru:
        - "Выбрать спор о приоритетах, где цели исследования и инженерной работы действительно тянули в разные стороны."
        - "Объяснить, за что поощряли каждую сторону — за новые результаты или за надёжный выпуск, — и чего стоил каждый вариант."
        - "Показать, как спор разрешился, например экспериментом с ограниченным сроком, и что было дальше для обеих сторон."
    reading: ["design-docs-at-google", "gitlab-communication"]
  - id: "beh-ml-project-obstacles"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Describe a project that used data and machine learning. What obstacles did you encounter?
      ru: >-
        Расскажите о проекте с данными и машинным обучением. С какими препятствиями вы столкнулись?
    tests:
      en: >-
        Whether you connect technical obstacles to actions and delivered outcomes.
      ru: >-
        Связываете ли вы технические препятствия с действиями и достигнутыми результатами.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "meta"
    outline:
      en:
        - "Pick obstacles specific to data and models — labels, leakage, drift, evaluation gaps — not generic delays."
        - "For each obstacle, say how you diagnosed it and why you chose that fix over the alternatives."
        - "End with the delivered outcome measured against a baseline, and which obstacle you would now catch earlier."
      ru:
        - "Выбрать препятствия, характерные именно для данных и моделей, — разметка, утечка данных, дрейф, пробелы в оценке, — а не общие задержки."
        - "По каждому препятствию сказать, как вы его диагностировали и почему выбрали это решение, а не альтернативы."
        - "Закончить достигнутым результатом в сравнении с базовым уровнем и тем, какое препятствие теперь заметили бы раньше."
    reading: ["google-rules-of-ml"]
  - id: "beh-ambiguity-result"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Tell me about achieving a meaningful result despite substantial ambiguity.
      ru: >-
        Расскажите, как вы добились значимого результата в условиях существенной неопределённости.
    tests:
      en: >-
        Whether you reduce uncertainty through decisions and feedback.
      ru: >-
        Умеете ли вы снижать неопределённость через решения и обратную связь.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "meta"
    outline:
      en:
        - "Choose a case where the goal or the problem itself was unclear, not just resources or time."
        - "Show which unknown you resolved first, with what small decision or probe, and how feedback changed the plan."
        - "Close with the meaningful result and the evidence that you had solved the right problem."
      ru:
        - "Выбрать случай, где неясны были сама цель или задача, а не только ресурсы или сроки."
        - "Показать, какую неизвестность вы сняли первой, каким небольшим решением или пробным шагом и как обратная связь меняла план."
        - "Закончить значимым результатом и свидетельством того, что вы решили именно ту задачу."
    reading: ["gds-alpha"]
  - id: "beh-wrong-technical-choice"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Describe a technical decision you championed that turned out to be wrong.
      ru: >-
        Расскажите о техническом решении, которое вы отстаивали, но которое оказалось ошибочным.
    tests:
      en: >-
        Whether you can reverse a position and repair its consequences.
      ru: >-
        Умеете ли вы пересмотреть позицию и исправить последствия.
    provenance: "published"
    added: "2026-09-26"
