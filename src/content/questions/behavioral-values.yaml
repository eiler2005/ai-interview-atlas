theme: "behavioral-values"
questions:
  - id: "beh-motivation-and-disagreement"
    tracks: ["engineering","leadership"]
    type: "self_presentation"
    level: "senior"
    text:
      en: >-
        Why do you want to work at Anthropic, and where do you disagree with its approach?
      ru: >-
        Почему вы хотите работать в Anthropic и в чём не согласны с её подходом?
    tests:
      en: >-
        Whether motivation is informed and leaves room for independent judgement.
      ru: >-
        Основана ли мотивация на понимании компании и сохраняете ли вы самостоятельность суждений.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    start_here: ["leadership"]
    priority: 38
    outline:
      en:
        - "Connect specific public work or mission choices to your own professional interests."
        - "Offer a reasoned disagreement and state what evidence could change your view."
        - "Explain how you would contribute while engaging constructively with that disagreement."
      ru:
        - "Свяжите конкретную публичную работу или решения компании со своими профессиональными интересами."
        - "Сформулируйте обоснованное несогласие и данные, которые могли бы изменить вашу позицию."
        - "Объясните свой возможный вклад и конструктивную работу при сохранении разногласий."
    answer:
      ru: "Мотивацию стройте на проверяемой конкретике: назовите публикацию, продукт или решение компании, которое вы разбирали, и объясните, как оно связано с вашей работой и тем, чем вы хотите заниматься дальше. Общие слова про миссию звучат у всех и ничего не сообщают о вас. Вторая половина вопроса важнее первой: несогласие должно быть настоящим, с внятным основанием, и обязательно с ответом на вопрос, какие данные или результаты изменили бы вашу позицию — это отличает суждение от позы. Предмет спора берите по существу работы, а не безопасную мелочь и не обвинение. Заканчивайте тем, как вы собираетесь работать, сохраняя разногласие: в чём ваш вклад, как вы доносите возражение внутри и почему выполняете решение, принятое не в вашу пользу. Перед разговором обновите факты по публичным материалам компании."
    reading: ["anthropic-careers"]
  - id: "beh-mistake-learning"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Describe a mistake you made, its consequences and what you changed afterward.
      ru: >-
        Расскажите о своей ошибке, её последствиях и последующих изменениях в работе.
    tests:
      en: >-
        Whether you take responsibility and show learning through concrete behaviour.
      ru: >-
        Берёте ли вы ответственность и подтверждаете ли выводы конкретными изменениями поведения.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    start_here: ["leadership"]
    priority: 39
    outline:
      en:
        - "Describe your decision and what you knew at the time."
        - "Explain impact, recovery and your responsibility without blaming others."
        - "Identify a lasting change and evidence that it helped."
      ru:
        - "Опишите своё решение и данные, которыми располагали тогда."
        - "Объясните последствия, восстановление и свою ответственность без перекладывания вины."
        - "Назовите устойчивое изменение и признаки его пользы."
    answer:
      ru: "Берите ошибку, которая действительно стоила денег, времени или доверия, иначе ответ прозвучит как скрытое хвастовство. Начните с решения: что вы выбрали, какими данными располагали тогда и почему это выглядело разумным — так собеседник видит ваше мышление, а не только исход. Дальше последствия и восстановление, без размазывания вины по обстоятельствам и коллегам: разбор без поиска виноватых означает честный анализ причин, а вовсе не отказ от собственной ответственности. Самая частая ошибка ответа — формулировка вроде «слишком много брал на себя», которая маскирует достоинство под недостаток. Заканчивайте изменением, которое осталось с вами: другое правило принятия решений, проверка перед выпуском, привычка писать разбор, — и признаком того, что оно сработало, например похожей ситуацией, которая пошла уже иначе."
    reading: ["google-sre-postmortem-culture"]
  - id: "beh-unresolved-disagreement"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Tell me about a time you disagreed with someone and could not persuade them.
      ru: >-
        Расскажите о случае, когда вы были не согласны с человеком, но не смогли его убедить.
    tests:
      en: >-
        Whether you work constructively after losing an argument.
      ru: >-
        Умеете ли вы конструктивно работать после того, как вашу позицию не приняли.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-amazon-ai-pm"
        company: "amazon"
    start_here: ["leadership"]
    priority: 40
    outline:
      en:
        - "State both positions fairly and explain your evidence."
        - "Describe the decision process and how you supported the agreed action."
        - "Explain the result, limits of commitment and what you learned."
      ru:
        - "Честно изложите обе позиции и свои аргументы."
        - "Опишите принятие решения и поддержку согласованных действий."
        - "Объясните результат, границы обязательств и сделанные выводы."
    answer:
      ru: "Главное в этом ответе то, что было после спора, а не сам спор. Изложите обе позиции честно и в сильной форме: если чужая выглядит глупо, собеседник решит, что вы плохо слушали. Приведите свои аргументы и то, как вы их доносили — в разговоре, письменным документом, через данные. Затем ясно скажите, кто принял решение и почему это было его право, и опишите, как вы поддержали согласованные действия: возражают до решения, после — выполняют, не саботируя вполголоса. Назовите результат, даже если он подтвердил вашу правоту, но без торжества. Обозначьте и границу: чего вы делать не стали бы и в какой ситуации пошли бы на эскалацию. Заканчивайте выводом, обычно про то, чего не хватило в аргументации или к кому стоило прийти раньше."
    reading: ["amazon-leadership-principles"]
