  - id: "beh-stakeholder-priorities"
    tracks: ["leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Tell me about conflicting stakeholder priorities and how you established alignment.
      ru: >-
        Расскажите о противоречащих приоритетах участников проекта и о том, как вы согласовали действия.
    tests:
      en: >-
        Whether you make competing objectives explicit and build an actionable agreement.
      ru: >-
        Умеете ли вы явно обсудить конкурирующие цели и договориться о действиях.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
    start_here: ["leadership"]
    priority: 54
    outline:
      en:
        - "Name the stakeholders and the objective each was actually measured on."
        - "Show how you surfaced the conflict as a trade-off rather than a personality clash."
        - "End with the agreement, what was given up, and evidence that it held."
      ru:
        - "Назвать участников и цель, по которой каждого действительно оценивали."
        - "Показать, как вы вывели конфликт в плоскость компромисса, а не столкновения характеров."
        - "Закончить договорённостью, тем, чем пожертвовали, и свидетельством, что она держалась."
    answer:
      en: "Choose a conflict where the parties were both right, because a story where one side was simply wrong tests judgement about people, not alignment. Name what each stakeholder was measured on — that is usually the real source of the disagreement, and saying it aloud is most of the work: a sales commitment, a reliability target and a compliance deadline can be genuinely incompatible without anyone behaving badly. Then show how you made the trade-off visible: the options, their costs, and whose goal each damaged, rather than hunting for a compromise nobody asked for. Be concrete about the decision and what was given up, including your own priority if that happened. Finish with evidence it held — a written agreement people referred to later, a metric both sides accepted — and avoid the ending where everyone simply agreed once you explained."
      ru: "Берите конфликт, где обе стороны были правы: история, в которой одна сторона просто ошибалась, проверяет ваши суждения о людях, а не умение согласовывать. Назовите, по какой цели оценивали каждого участника, — обычно именно там и лежит источник расхождения, и произнести это вслух означает сделать большую часть работы: обязательство перед клиентом, цель по надёжности и срок по комплаенсу бывают действительно несовместимы, и никто при этом не ведёт себя плохо. Затем покажите, как вы сделали компромисс видимым: варианты, их цену и то, чью цель каждый из них повреждал, вместо поиска компромисса, о котором никто не просил. Будьте конкретны в решении и в том, чем пожертвовали, включая собственный приоритет, если так и было. Завершите свидетельством, что договорённость держалась: письменная фиксация, к которой потом возвращались, метрика, принятая обеими сторонами, — и избегайте финала, где все просто согласились после ваших объяснений."
    reading: ["gitlab-organizational-change"]
