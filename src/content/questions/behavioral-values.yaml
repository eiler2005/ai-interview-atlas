  - id: "beh-critical-feedback"
    tracks: ["engineering","leadership"]
    type: "behavioral"
    level: "senior"
    text:
      en: >-
        Describe feedback that was difficult for you to hear and what you did with it.
      ru: >-
        Расскажите об обратной связи, которую было трудно услышать, и о том, как вы её использовали.
    tests:
      en: >-
        Whether you can respond to criticism with specific learning and action.
      ru: >-
        Умеете ли вы отвечать на критику конкретными выводами и действиями.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-anthropic-swe"
        company: "anthropic"
    start_here: ["leadership"]
    priority: 55
    outline:
      en:
        - "State the feedback plainly, in the words it was given, without softening it."
        - "Separate your first reaction from what you concluded once you checked it."
        - "Name the change you made and a later situation that shows it stuck."
      ru:
        - "Изложить обратную связь прямо, в тех словах, в которых её дали, не смягчая."
        - "Отделить первую реакцию от вывода, сделанного после проверки."
        - "Назвать изменение и более поздний случай, показывающий, что оно закрепилось."
    answer:
      en: "The test is whether you can still hear it, so state the feedback in the words it was actually given. Softened versions — I was told to communicate more — signal that you have not really accepted it. Admitting your first reaction is fine and makes the answer credible, because most people are defensive before they are reflective. What matters is the next step: that you went and checked, by asking others whether they saw the same thing or looking for it in your own record, instead of accepting or rejecting it on one person's word. Then name the specific change, the narrower the better, and a later situation where you can tell it stuck. Avoid two endings — the one where the feedback turned out to be unfair after all, and the one where you simply tried harder — because neither shows anything changed."
      ru: "Проверяют, можете ли вы и сейчас услышать эту критику, поэтому изложите обратную связь в тех словах, в которых её действительно дали. Смягчённые версии вроде «мне сказали больше коммуницировать» выдают, что вы её так и не приняли. Признать первую реакцию — нормально и делает ответ достоверным: большинство сначала защищается и только потом размышляет. Важен следующий шаг: что вы пошли и проверили — спросили других, видят ли они то же самое, или поискали подтверждение в собственных результатах, — вместо того чтобы принять или отвергнуть на основании слов одного человека. Затем назовите конкретное изменение, чем оно уже, тем лучше, и более поздний случай, по которому видно, что оно закрепилось. Избегайте двух финалов: где обратная связь в итоге оказалась несправедливой и где вы просто стали больше стараться, — ни один из них не показывает, что что-то изменилось."
    reading: ["google-manager-training"]
  - id: "beh-conflict-under-urgency"
    tracks: ["leadership"]
    type: "applied_scenario"
    level: "senior"
    text:
      en: >-
        How do you manage conflict when the situation is urgent?
      ru: >-
        Как вы управляете конфликтом, когда нужно действовать срочно?
    tests:
      en: >-
        Whether urgency changes the decision process without eliminating respect and accountability.
      ru: >-
        Меняет ли срочность процесс решения без отказа от уважения и ответственности.
    provenance: "published"
    added: "2026-09-26"
    evidence:
      - source: "exponent-openai-pm"
        company: "openai"
    outline:
      en:
        - "Make the decision owner and deadline explicit first, so urgency shortens debate rather than removing it."
        - "Hear each side briefly, prefer a reversible step, and record dissent instead of overriding it silently."
        - "Revisit after the pressure passes: review the decision, repair relationships, and fix what caused the urgency."
      ru:
        - "Сначала явно назвать владельца решения и срок, чтобы срочность сокращала обсуждение, а не отменяла его."
        - "Коротко выслушать каждую сторону, предпочесть обратимый шаг и зафиксировать несогласие, а не молча его отбросить."
        - "Вернуться к вопросу после спада давления: разобрать решение, восстановить отношения и устранить причину спешки."
    reading: ["google-sre-book"]
