  - id: "llm-context-position"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "How would you test and reduce a model's tendency to miss relevant evidence in the middle of a long context?"
      ru: "Как проверить и уменьшить склонность модели пропускать важные сведения в середине длинного контекста?"
    tests:
      en: "Whether context utilisation is measured rather than inferred from context capacity."
      ru: "Умение измерять использование контекста, а не судить по его вместимости."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 5
    outline:
      en:
        - "Move the same relevant evidence through controlled context positions."
        - "Measure accuracy across lengths, distractors and model variants."
        - "Compare retrieval, ordering and context reduction without assuming a universal cure."
      ru:
        - "Перемещать одни и те же нужные сведения по позициям в контексте."
        - "Измерять точность при разных длинах, отвлекающих фрагментах и моделях."
        - "Сравнить retrieval, порядок и сокращение контекста без обещания универсального решения."
    answer:
      en: "You test it by moving the evidence: take a question whose answer sits in exactly one passage and slide that passage through input positions, changing nothing else. A dip in the middle with identical content is the positional effect, not a shortage of context. Measure at several input lengths, with varying numbers of similar distractor passages, and separately for each model: the behaviour depends on training and on length, and window size on its own promises nothing. Three things soften the problem: retrieve more precisely so there's less text to read; rerank and place strong candidates nearer the edges; shrink the context by summarising or dropping what isn't needed. I'd put a positional slice into the regular eval set and recheck it on every model change. There's no universal cure: long context stays more expensive in money and latency, and it doesn't replace good retrieval."
      ru: "Проверяется это переносом: берём вопрос, ответ на который лежит ровно в одном фрагменте, и двигаем этот фрагмент по позициям входа, ничего больше не меняя. Проседание в середине при неизменном содержимом и есть позиционный эффект, а не нехватка контекста. Мерить надо на нескольких длинах входа, с разным количеством похожих отвлекающих фрагментов и отдельно на каждой модели: поведение зависит от обучения и от длины, а размер окна сам по себе ничего не обещает. Смягчают проблему тремя путями: точнее искать, чтобы нужного текста было меньше; переранжировать и класть сильных кандидатов ближе к краям; сокращать контекст, суммируя или отбрасывая лишнее. Я бы завёл позиционный срез в регулярный eval-набор и перепроверял его при каждой смене модели. Универсального решения нет: длинный контекст остаётся дороже по деньгам и задержке и не заменяет хороший поиск."
    reading: ["paper-lost-in-the-middle"]
