theme: "llm-fundamentals"
questions:
  - id: "llm-attention"
    tracks: ["engineering"]
    roles: ["research-engineer"]
    type: "knowledge"
    text:
      en: "Derive scaled dot-product attention and explain how its scale affects softmax gradients."
      ru: "Выведите формулу scaled dot-product attention и объясните, как масштаб влияет на градиенты softmax."
    tests:
      en: "Whether tensor shapes and numerical behaviour support the explanation."
      ru: "Понимание размерностей тензоров и численной устойчивости."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 1
    outline:
      en:
        - "Track Q, K and V shapes through score computation and weighted summation."
        - "Scale by the square root of key width; discuss saturation of softmax."
        - "Apply the causal mask before softmax and check numerical stability."
      ru:
        - "Проследить размерности Q, K и V до взвешенной суммы."
        - "Объяснить деление на корень из размерности ключа и насыщение softmax."
        - "Наложить causal mask до softmax и проверить численную устойчивость."
    answer:
      en: "Attention is softmax(QKᵀ/√d_k)V, and the shapes carry the derivation. Q and K are batch × heads × n × d_k, so QKᵀ is an n × n score matrix per head; softmax over the key axis makes each row a distribution, and multiplying by V gives n × d_v, a weighted sum of values. The scale is one line: if q and k have independent zero-mean, unit-variance components, q·k sums d_k unit-variance terms, so its variance is d_k. Unscaled, logits spread as √d_k, softmax puts almost all mass on one key, and its Jacobian, diag(p) − ppᵀ, goes to zero, so gradients to Q and K vanish; dividing by √d_k restores unit variance. For causal attention I set future scores to minus infinity before softmax and subtract each row's maximum. I'd test against a naive implementation on random tensors and check that changing future tokens leaves earlier outputs intact. The scale only fixes variance at initialisation: if query and key norms grow in training, softmax saturates anyway, which is why some models normalise queries and keys."
      ru: "Внимание — это softmax(QKᵀ/√d_k)V, и вывод держится на размерностях. Q и K имеют форму батч × головы × n × d_k, поэтому QKᵀ — матрица оценок n × n на каждую голову; softmax по оси ключей превращает каждую строку в распределение, а умножение на V даёт n × d_v, взвешенную сумму значений. Масштаб выводится в одну строку: если компоненты q и k независимы, имеют нулевое среднее и единичную дисперсию, q·k — сумма d_k слагаемых с единичной дисперсией, значит, её дисперсия равна d_k. Без масштаба разброс логитов растёт как √d_k, softmax отдаёт почти всю массу одному ключу, его якобиан diag(p) − ppᵀ стремится к нулю, и градиенты к Q и K затухают; деление на √d_k возвращает единичную дисперсию. В causal-варианте я ставлю будущим позициям минус бесконечность до softmax и вычитаю построчный максимум. Проверял бы сравнением с наивной реализацией на случайных тензорах и тестом, что подмена будущих токенов не меняет ранние выходы. Масштаб фиксирует дисперсию только при инициализации: если нормы запросов и ключей растут в обучении, softmax всё равно насыщается, поэтому в некоторых моделях запросы и ключи дополнительно нормализуют."
    reading: ["paper-attention"]
  - id: "llm-kv-cache"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Derive the memory required by a decoder's KV cache as batch size and context length grow."
      ru: "Выведите объём памяти KV-кеша декодера в зависимости от размера батча и длины контекста."
    tests:
      en: "Whether cache size is calculated from the actual architecture."
      ru: "Умение рассчитать размер кеша с учётом архитектуры."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "openai"
      - source: "outcome-school-company-wise"
        company: "amazon"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 2
    outline:
      en:
        - "For equal sequence lengths, use 2 × batch × layers × tokens × KV heads × head width × bytes."
        - "Explain why queries are not retained for future decode steps."
        - "Account separately for weights, activations, padding and allocation overhead."
      ru:
        - "Для равных длин использовать 2 × батч × слои × токены × KV-головы × размер головы × байты."
        - "Объяснить, почему запросы не сохраняют для последующих шагов декодирования."
        - "Отдельно учесть веса, активации, padding и накладные расходы выделения памяти."
    answer:
      en: "With equal lengths the size is 2 × batch × layers × tokens × KV heads × head width × bytes per element. The two is keys and values; queries aren't kept, because the current step's Q is needed for exactly one iteration, while the keys and values of every past position are read again at each following step. The cache grows linearly in both batch and context length, so on long conversations it can limit concurrency beyond the weight budget. To that formula you always add weights, activations and working buffers, allocator headroom, and padding waste when lengths differ and memory is handed out as a rectangle; paged allocation, as in PagedAttention, reduces that fragmentation. I'd compute the budget over the real length distribution and reconcile it with measured memory under load. The formula ignores cache compression, offload and architectures that store the cache differently."
      ru: "При одинаковых длинах объём считается как 2 × батч × слои × токены × KV-головы × размер головы × байты на элемент. Двойка — это ключи и значения; запросы не сохраняют, потому что Q текущего шага нужен ровно одну итерацию, а ключи и значения всех прошлых позиций читаются на каждом следующем шаге. Кеш растёт линейно и по батчу, и по длине контекста, поэтому на длинных диалогах он может ограничивать конкурентность сверх бюджета весов. К формуле обязательно добавляют веса, активации и рабочие буферы, запас аллокатора и потери на padding, если длины разные и память выделяется прямоугольником; страничное выделение как в PagedAttention снижает эту фрагментацию. Я бы посчитал бюджет на реальном распределении длин и сверил с измеренной памятью под нагрузкой. Формула не учитывает сжатие кеша, оффлоад и архитектуры с иной схемой хранения."
    reading: ["paper-pagedattention","paper-gqa"]
  - id: "llm-grouped-query"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Compare multi-head, multi-query and grouped-query attention in quality and serving memory."
      ru: "Сравните multi-head, multi-query и grouped-query attention по качеству и памяти при инференсе."
    tests:
      en: "Whether shared keys and values are distinguished from query heads."
      ru: "Понимание различия между головами запросов и общими ключами и значениями."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "meta"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 3
    outline:
      en:
        - "MHA uses separate KV heads; MQA shares one; GQA shares within groups."
        - "Relate KV-head count to cache size and memory reads."
        - "Discuss quality evaluation and the need to train or adapt the checkpoint."
      ru:
        - "В MHA головы KV отдельные, в MQA одна общая, в GQA общие внутри групп."
        - "Связать число KV-голов с размером кеша и чтением памяти."
        - "Обсудить проверку качества и необходимость обучения или адаптации весов."
    answer:
      en: "All three keep every query head with its own attention pattern and differ only in keys and values: MHA has a K and V pair per query head, MQA one pair for all, GQA one per group. The cache shrinks by the ratio of query heads to KV heads: with 64 query heads and 8 KV heads it's eight times smaller than MHA, with MQA sixty-four. That pays off where KV reads dominate decode, at large batch and long context; at small batch and short prompts each step is bound by reading the weights, and fewer KV heads barely move latency. The price is quality: MQA loses more, GQA with a few groups stays close to MHA, and converting an MHA checkpoint takes mean-pooling KV heads per group plus uptraining on about five percent of the original pretraining. I'd measure concurrency at fixed memory, long-context decode throughput and quality against MHA. Under tensor parallelism MQA's single head is copied to every device, so GQA with one group per shard costs the same memory there and keeps more quality."
      ru: "Все три варианта сохраняют все головы запросов со своим паттерном внимания и различаются только ключами и значениями: в MHA пара K и V на каждую голову запроса, в MQA одна пара на всех, в GQA одна на группу. Кеш сжимается во столько раз, во сколько голов запросов больше, чем KV-голов: при 64 головах запросов и 8 KV-головах он в восемь раз меньше, чем в MHA, а в MQA — в шестьдесят четыре. Окупается это там, где decode упирается в чтение KV, то есть при большом батче и длинном контексте; при малом батче и коротких промптах шаг ограничен чтением весов, и меньшее число KV-голов задержку почти не меняет. Платим качеством: MQA теряет больше, GQA с несколькими группами остаётся близка к MHA, а перевод MHA-чекпойнта требует усреднить KV-головы внутри групп и дообучить примерно на пяти процентах исходных шагов предобучения. Я бы мерил конкурентность при фиксированной памяти, пропускную способность decode на длинном контексте и качество против MHA. При tensor parallelism единственная голова MQA копируется на каждое устройство, поэтому GQA с одной группой на шард занимает там столько же памяти и сохраняет больше качества."
    reading: ["paper-gqa"]
  - id: "llm-latent-attention"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Explain how latent attention compresses the KV representation and what must be reconstructed at inference."
      ru: "Объясните, как latent attention сжимает представление KV и что приходится восстанавливать при инференсе."
    tests:
      en: "Whether architectural compression is distinguished from lower numeric precision."
      ru: "Понимание отличия архитектурного сжатия от снижения численной точности."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 42
    outline:
      en:
        - "Cache one low-rank latent vector per token instead of full keys and values for every head."
        - "Reconstruct per-head keys and values from that latent, or fold the up-projections into the query and output projections, paying extra compute."
        - "Separate this architectural compression from quantising the same cache."
      ru:
        - "Кешировать один низкоранговый латентный вектор на токен вместо полных key и value для каждой головы."
        - "Восстанавливать key и value по головам из латента или встраивать обратные проекции в проекции query и выхода, платя дополнительными вычислениями."
        - "Отделить архитектурное сжатие от квантования того же кеша."
    answer:
      en: "Latent attention changes what you store, not how precisely you store it. Keys and values are projected down to a single low-rank latent vector per token, and that latent is what the cache holds; during attention it is projected back up to per-head keys and values, or the up-projections are folded into the query and output projections so attention runs on the latent directly, with the positional part cached as a small separate key. Cache bytes per token therefore fall by about the compression ratio, paid for with extra arithmetic on every decode step and more intricate kernels. I would measure cache bytes per token, the context length and batch size reachable within the same memory, decode throughput, and quality against a grouped-query baseline at an equal cache budget. The distinction matters because quantisation lowers the precision of the same tensors: the two compose, so each needs its own baseline or one saving gets counted twice. The gain is real only when the KV cache, not the weights, is what bounds you."
      ru: "Латентное внимание меняет то, что вы храните, а не точность хранения. Key и value проецируются вниз в один низкоранговый латентный вектор на токен, и именно латент лежит в кеше; во время внимания он либо проецируется обратно в key и value по головам, либо матрицы обратной проекции встраиваются в проекции запроса и выхода, и внимание считается прямо по латенту, а позиционная часть кешируется отдельным небольшим ключом. Байты кеша на токен поэтому падают примерно во столько раз, каково сжатие, а платой становятся дополнительная арифметика на каждом шаге декодирования и более сложные ядра. Я бы измерил байты кеша на токен, достижимые в той же памяти длину контекста и размер батча, пропускную способность декодирования и качество против grouped-query при равном бюджете кеша. Различение важно, потому что квантование снижает точность тех же тензоров: одно с другим сочетается, поэтому у каждого должен быть свой baseline, иначе одну экономию посчитают дважды. Выигрыш реален лишь тогда, когда вас ограничивает KV-кеш, а не веса."
    reading: ["paper-deepseek-v2"]
  - id: "llm-flashattention"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Why can an exact attention kernel run faster without changing the quadratic attention computation?"
      ru: "Почему точный attention может работать быстрее без изменения квадратичного характера вычислений?"
    tests:
      en: "Whether memory traffic is separated from arithmetic complexity."
      ru: "Понимание различия между обменом с памятью и вычислительной сложностью."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 57
    outline:
      en:
        - "Explain tiled attention and the reduction in reads and writes between accelerator memory levels."
        - "Distinguish exact attention with floating-point differences from sparse or approximate attention."
        - "Separate quadratic arithmetic from memory traffic; benchmark the relevant shapes and hardware."
      ru:
        - "Объяснить блочное вычисление attention и сокращение обмена между уровнями памяти ускорителя."
        - "Отличить точный attention с различиями округления от разреженного или приближённого attention."
        - "Разделить квадратичную арифметику и обмен с памятью; измерить нужные размерности на целевом оборудовании."
    answer:
      en: "Because on a GPU standard attention is limited by memory traffic, not arithmetic. The usual kernel writes the N-by-N score matrix to high-bandwidth memory, reads it back for the softmax, writes the probabilities, then reads them again to multiply by V. FlashAttention tiles Q, K and V into blocks that fit in on-chip SRAM and keeps a running maximum and sum per row, the online softmax, rescaling the partial output as each key block arrives, so the full matrix never lands in HBM. FLOPs stay quadratic; the backward pass even adds some, recomputing scores from saved softmax statistics rather than storing them, and still wins because far fewer bytes move. It's exact, differing from standard attention only by floating-point summation order, unlike sparse or low-rank methods that change what's computed. I'd benchmark the real sequence lengths, head widths, masking and dtype on the target GPU, checking agreement within tolerance. At short sequences attention isn't the bottleneck, and in single-token decode attention's cost is reading the KV cache, a different problem."
      ru: "Потому что на GPU обычный attention упирается в обмен с памятью, а не в арифметику. Стандартное ядро пишет матрицу оценок N на N в HBM, читает её обратно ради softmax, записывает вероятности и снова читает их, чтобы умножить на V. FlashAttention режет Q, K и V на блоки, которые помещаются в SRAM на кристалле, и держит для каждой строки текущий максимум и сумму, то есть онлайн-softmax, пересчитывая частичный результат по мере прихода каждого блока ключей, так что полная матрица в HBM не попадает вовсе. FLOPs остаются квадратичными, обратный проход их даже добавляет, пересчитывая оценки по сохранённой статистике softmax вместо хранения матрицы, и всё равно выигрывает, потому что байтов передаётся намного меньше. Метод точный: от стандартного attention он отличается лишь порядком суммирования в плавающей точке, в отличие от разреженных или низкоранговых методов, меняющих само вычисление. Я бы измерял на реальных длинах, размерах голов, масках и типах данных на целевом GPU, проверяя совпадение в пределах допуска. На коротких последовательностях attention не узкое место, а при декодировании по одному токену стоимость attention — это чтение KV-кеша, и это уже другая задача."
    reading: ["paper-flashattention"]
  - id: "llm-tokenization"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Explain BPE training and why numbers, source code and different writing systems can tokenize unevenly."
      ru: "Объясните обучение BPE и причины неодинаковой токенизации чисел, кода и разных письменностей."
    tests:
      en: "Whether tokenisation choices are connected to context use and representation."
      ru: "Понимание влияния токенизации на расход контекста и представление текста."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Describe training: start from characters or bytes and repeatedly merge the most frequent adjacent pair until the vocabulary is full."
        - "Link unevenness to corpus frequency and pre-tokenisation rules: rare scripts fragment, digit groups vary, code indentation splits oddly."
        - "Measure tokens per character or word by language and domain, and the effect on context, cost and arithmetic."
      ru:
        - "Описать обучение: начать с символов или байтов и повторно сливать самую частую соседнюю пару, пока словарь не заполнится."
        - "Связать неравномерность с частотами корпуса и правилами предтокенизации: редкие письменности дробятся, группы цифр различаются, отступы в коде режутся непредсказуемо."
        - "Измерить число токенов на символ или слово по языкам и доменам и его влияние на контекст, стоимость и арифметику."
    reading: ["paper-bpe-subword","paper-tokenizer-unfairness"]
  - id: "llm-position-schemes"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Compare additive positional embeddings, rotary embeddings and attention biases for representing token order."
      ru: "Сравните добавляемые позиционные эмбеддинги, rotary embeddings и смещения attention для задания порядка токенов."
    tests:
      en: "Whether different mechanisms for encoding position are understood."
      ru: "Понимание разных способов задать позицию токена."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    outline:
      en:
        - "Show where position enters: added to input embeddings, rotated into queries and keys, or added to attention logits."
        - "Contrast absolute learned or sinusoidal tables with RoPE's relative-offset dot products and ALiBi's linear distance penalty."
        - "Test behaviour beyond the training length on in-context retrieval, since perplexity hides weak use of distant tokens."
      ru:
        - "Показать, куда входит позиция: прибавляется к эмбеддингам входа, поворачивает query и key или добавляется к логитам внимания."
        - "Противопоставить абсолютные обучаемые или синусоидальные таблицы скалярному произведению по относительному смещению в RoPE и линейному штрафу за расстояние в ALiBi."
        - "Проверить поведение за пределами обучающей длины на поиске внутри контекста: перплексия скрывает слабое использование дальних токенов."
    reading: ["paper-attention","paper-rope","paper-alibi"]
  - id: "llm-rope-extension"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "Explain rotary position encoding and the trade-offs of interpolation when extending context beyond training lengths."
      ru: "Объясните RoPE и компромиссы интерполяции при расширении контекста за пределы обучающей длины."
    tests:
      en: "Whether a longer accepted input is distinguished from reliable long-context reasoning."
      ru: "Умение отличать допустимую длину входа от надёжной работы с длинным контекстом."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "meta"
    added: "2026-09-26"
    outline:
      en:
        - "Explain RoPE: rotate query and key dimension pairs by position times a per-pair frequency, so scores depend on offset."
        - "Show that position interpolation divides every frequency by the scale, blurring nearby tokens; NTK and YaRN mostly rescale low frequencies."
        - "Separate accepted length from use: test retrieval and multi-hop tasks at varied depths, plus short-context regressions after finetuning."
      ru:
        - "Объяснить RoPE: пары координат query и key поворачиваются на угол, равный позиции, умноженной на частоту пары, поэтому оценка зависит от смещения."
        - "Показать, что позиционная интерполяция делит каждую частоту на коэффициент растяжения и размывает соседние токены; NTK и YaRN масштабируют в основном низкие частоты."
        - "Отличать допустимую длину от реального использования: проверить поиск и многошаговые задачи на разной глубине и регрессии на коротком контексте после дообучения."
    reading: ["paper-rope","paper-lost-in-the-middle","paper-position-interpolation","paper-yarn","paper-ruler"]
  - id: "llm-compute-optimal"
    tracks: ["engineering","leadership"]
    roles: ["research-engineer"]
    type: "knowledge"
    text:
      en: "Under a fixed training compute budget, how do Chinchilla-style scaling results change the balance between model size and training tokens?"
      ru: "Как результаты Chinchilla меняют выбор размера модели и числа обучающих токенов при фиксированном бюджете вычислений?"
    tests:
      en: "Whether empirical training trade-offs are kept separate from deployment economics."
      ru: "Понимание различия между оптимумом обучения и экономикой эксплуатации."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
        company: "anthropic"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 4
    outline:
      en:
        - "State the fixed-compute setting and the empirical nature of the fit."
        - "Balance parameter count with sufficient training tokens."
        - "Separate training-optimal allocation from inference cost and data quality constraints."
      ru:
        - "Задать фиксированный бюджет вычислений и эмпирический характер зависимости."
        - "Сбалансировать число параметров с достаточным объёмом обучающих токенов."
        - "Отделить оптимум обучения от стоимости инференса и ограничений качества данных."
    answer:
      en: "Chinchilla shows that under a fixed compute budget parameter count and training tokens have to grow together, whereas earlier practice took too large a model and too little data. The relationship is empirical, fitted over many runs of different sizes, so carrying its coefficients over to another architecture, tokeniser or corpus deserves caution. The main trade-off is that the training optimum is not the serving optimum: if the model will serve an enormous stream of requests, you're better off with fewer parameters trained longer on more tokens, paying in training time and winning on every request for years. I'd work out total cost of ownership, training plus projected inference over the model's lifetime, and separately check whether there's enough quality data without harmful duplication. The law says nothing about post-training, about limited corpora, or about whether the quality you need is reachable at all."
      ru: "Chinchilla показывает, что при фиксированном бюджете вычислений число параметров и число обучающих токенов надо наращивать согласованно, тогда как прежняя практика брала слишком большую модель и слишком мало данных. Зависимость эмпирическая, подобранная по множеству прогонов разного размера, поэтому переносить её коэффициенты на другую архитектуру, токенизатор или корпус стоит осторожно. Главный компромисс в том, что оптимум обучения не равен оптимуму эксплуатации: если модель будет обслуживать огромный поток запросов, выгоднее взять меньше параметров и обучать дольше на большем числе токенов, заплатив временем обучения и выиграв на каждом запросе годами. Я бы посчитал совокупную стоимость владения, то есть обучение плюс прогноз инференса на горизонт жизни модели, и отдельно проверил, хватает ли качественных данных без вредного дублирования. Закон ничего не говорит о post-training, об ограниченных корпусах и о том, достижимо ли нужное качество вообще."
    reading: ["paper-chinchilla"]
  - id: "llm-experts"
    tracks: ["engineering"]
    type: "knowledge"
    text:
      en: "How does sparse expert routing increase parameter capacity, and what costs remain despite activating only some experts?"
      ru: "Как разреженная маршрутизация по экспертам увеличивает число параметров и какие затраты сохраняются при активации части экспертов?"
    tests:
      en: "Whether active computation, total memory and communication are separated."
      ru: "Умение различать активные вычисления, общую память и коммуникации."
    provenance: "published"
    evidence:
      - source: "outcome-school-company-wise"
    added: "2026-09-26"
    start_here: ["engineering"]
    priority: 41
    outline:
      en:
        - "Separate the total parameter count from the parameters activated for one token."
        - "Account for memory that must hold every expert and for routing traffic between devices."
        - "Discuss load imbalance, expert capacity and dropped tokens."
      ru:
        - "Отделить общее число параметров от параметров, активируемых для одного токена."
        - "Учесть память, в которой лежат все эксперты, и трафик маршрутизации между устройствами."
        - "Обсудить перекос нагрузки, ёмкость экспертов и отброшенные токены."
    answer:
      en: "Routing buys capacity, not free scale: the model holds far more parameters while any one token is computed by only a few of them. A router scores experts per token and sends it to the top few, so arithmetic grows with the experts activated rather than the total, and quality improves as experts specialise. Memory does not shrink: every expert's weights stay resident, and in distributed serving tokens travel to the device holding their expert, putting an all-to-all exchange on the critical path. I would measure tokens per expert to expose imbalance, the share dropped when an expert hits its capacity limit, and the all-to-all share of step time, judging quality against a dense model of the same active size. The argument holds only while routing stays balanced and batches are large enough to amortise that exchange."
      ru: "Маршрутизация покупает ёмкость, а не бесплатный масштаб: модель хранит намного больше параметров, но любой отдельный токен считается лишь небольшой их частью. Маршрутизатор оценивает экспертов для каждого токена и отправляет его к нескольким лучшим, поэтому арифметика растёт с числом активированных экспертов, а не с общим, а качество выигрывает от их специализации. Память при этом не уменьшается: веса всех экспертов остаются размещёнными, а при распределённом обслуживании сами токены едут к устройству со своим экспертом, и обмен all-to-all оказывается на критическом пути. Я бы измерил число токенов на эксперта, чтобы увидеть перекос, долю отброшенных при достижении ёмкости эксперта и долю all-to-all во времени шага, сравнивая качество с плотной моделью того же активного размера. Рассуждение верно лишь пока маршрутизация сбалансирована, а батчи достаточно велики, чтобы этот обмен амортизировался."
    reading: ["paper-switch-transformers"]
