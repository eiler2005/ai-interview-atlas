  "method": {
    "en": "79 public full-text job postings for senior product, engineering and programme roles, first seen 2026-09-15 – 2026-09-19 on employer career boards and job boards during one job search, deduplicated by employer and title. The track comes from the job title, with content checks to exclude functions outside scope; design, marketing, sales and similar functions are excluded. Claude Sonnet 5 classified the first 60 postings and GPT Astra completed the remaining batch against the criteria below, retaining evidence for every marked theme. GPT Astra checked a deterministic random sample of eight retained postings and the flagged ambiguous cases against the full source text. Author and review records are retained privately. A posting counts once per theme. “The role itself involves AI” means the role owns AI or machine-learning products, features, models, teams or infrastructure; using AI tools does not count. The sample leans towards international fintech and business software and is not a market survey. This edition has too few engineering postings to publish that track.",
    "ru": "79 публичных вакансий с полным текстом на старшие роли в продукте, инженерии и управлении программами, впервые замеченных 2026-09-15 – 2026-09-19 на карьерных сайтах работодателей и job-бордах в ходе одного поиска работы; дубликаты по работодателю и названию убраны. Трек определяется по названию должности; содержание проверено, чтобы исключить функции за рамками исследования. Дизайн, маркетинг, продажи и похожие функции исключены. Claude Sonnet 5 классифицировала первые 60 вакансий, GPT Astra завершила оставшуюся часть по критериям ниже; для каждой отмеченной темы сохранена цитата. GPT Astra сверила с полным текстом воспроизводимую случайную выборку из восьми оставшихся вакансий и отмеченные спорные случаи. Записи об авторстве и проверке сохранены приватно. Вакансия учитывается в теме один раз. «Сама роль связана с AI» означает, что роль отвечает за AI/ML-продукты, функции, модели, команды или инфраструктуру; использование AI-инструментов не считается. В выборке больше международного финтеха и B2B-софта; это не обзор рынка. В этом выпуске слишком мало инженерных вакансий, поэтому этот трек не публикуется."
  },
