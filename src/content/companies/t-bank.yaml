summary:
  en: "Interviewers describe a screening, live coding and a team-fit interview. A 2025 senior candidate also had a management section and system design, and received a grade before meeting teams."
  ru: "Интервьюеры описывают скрининг, live coding и фит-интервью с командой. У кандидата уровня senior в 2025 году были ещё секция по менеджменту и system design, а грейд он получил до встреч с командами."
loop:
- stage:
    en: "HR introduction and screening"
    ru: "Знакомство с HR и скрининг"
  detail:
    en: "An introduction with HR, then a technical screening on theory."
    ru: "Знакомство с HR, затем технический скрининг по теории."
  claim: "confirmed"
  sources:
  - "tj-tbank-interviews"
- stage:
    en: "Live coding"
    ru: "Live coding"
  detail:
    en: "Programming in real time, about an hour and a half in one interviewer's description; the thinking process is assessed, not only the answer."
    ru: "Программирование в реальном времени, по описанию одного из интервьюеров — около полутора часов; оценивают ход мысли, а не только ответ."
  claim: "confirmed"
  sources:
  - "tj-tbank-interviews"
- stage:
    en: "Team fit"
    ru: "Фит-интервью с командой"
  detail:
    en: "A final interview to check fit with the team and its tasks."
    ru: "Финальное интервью, чтобы проверить совпадение с командой и её задачами."
  claim: "confirmed"
  sources:
  - "tj-tbank-interviews"
- stage:
    en: "Senior and team-lead track (2025)"
    ru: "Трек senior и тимлида (2025)"
  detail:
    en: "A conversational management section, a two-hour language section and system design (a courier-tracking service), then fit interviews with several teams after a grade was assigned."
    ru: "Разговорная секция по менеджменту, двухчасовая языковая секция и system design (отслеживание курьеров), затем фит-интервью с несколькими командами после присвоения грейда."
  claim: "participant_report"
  sources:
  - "habr-ozon-tbank-candidate"
- stage:
    en: "ML system design section"
    ru: "Секция по дизайну ML-систем"
  detail:
    en: "Design and decompose a complex ML system: formalise the task and requirements, split it into subtasks, collect data, choose ML architectures, then deploy and test. Published in 2022 in a repository archived in 2023."
    ru: "Спроектировать и декомпозировать сложную ML-систему: формализовать задачу и требования, разбить на подзадачи, собрать данные, выбрать ML-архитектуры, затем выкатить и протестировать. Опубликовано в 2022 году в репозитории, который в 2023 году переведён в архив."
  claim: "confirmed"
  sources:
  - "tbank-career-system-design-ml"
  roles:
  - "ml-engineer"
- stage:
    en: "ML section"
    ru: "Секция по ML"
  detail:
    en: "Data analysis questions on theory and practical cases: framing the task, choosing and justifying quality metrics, collecting and validating data, and ML algorithms. From the same 2022 archive."
    ru: "Вопросы по анализу данных на теоретических и практических кейсах: постановка задачи, выбор и обоснование метрик качества, сбор и валидация данных, ML-алгоритмы. Из того же архива 2022 года."
  claim: "confirmed"
