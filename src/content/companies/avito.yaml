  en: "The engineering loop published in 2019 has four one-hour sections. A 2025 candidate for analyst and project roles describes a take-home task presented to the team."
  ru: "Инженерный цикл, описанный в 2019 году, состоит из четырёх секций по часу. Кандидатка 2025 года на аналитические и проектные роли описывает домашнее задание с презентацией команде."
loop:
- stage:
    en: "Remote technical interview"
    ru: "Удалённое техническое интервью"
  detail:
    en: "Forty-five minutes of programming and technical questions to decide whether to continue in person."
    ru: "Сорок пять минут программирования и технических вопросов, чтобы решить, продолжать ли очно."
