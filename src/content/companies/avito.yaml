    ru: "По часу: программирование, архитектура и опыт с крупными приложениями, платформенные навыки и финал с HR и руководителем."
  claim: "confirmed"
  sources:
  - "avito-interview-structure"
- stage:
    en: "Analyst and project roles (2025)"
    ru: "Аналитические и проектные роли (2025)"
