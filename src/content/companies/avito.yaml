    en: "Phone screen, HR interview, hiring manager interview, a take-home task presented to the team and department head, and a decision within three to seven days."
    ru: "Телефонный скрининг, интервью с HR, интервью с руководителем, домашнее задание с презентацией команде и руководителю отдела, решение за три–семь дней."
