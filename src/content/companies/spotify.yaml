id: "spotify"
name: {en: "Spotify", ru: "Spotify"}
segment: "big-tech"
markets: ["intl"]
roles:
  engineering: ["software-engineer-general", "ml-engineer"]
summary:
  en: "The official page establishes broad stages and a third-party guide describes the engineering rounds. A candidate's 2025 account of a machine-learning loop that ended in an offer adds the ML-specific path: a one-hour machine-learning screen, then an assessment day of data, values, system design and depth interviews. That author deliberately publishes no questions, so no public source records what Spotify asks."
  ru: "Официальная страница подтверждает общие этапы, сторонний гайд описывает инженерные раунды. Рассказ кандидата 2025 года о ML-цикле, закончившемся офером, добавляет специфичный для ML путь: часовой ML-скрининг, затем день оценки с секциями по данным, ценностям, system design и глубине. Вопросов тот автор сознательно не публикует, поэтому публичных источников с самими вопросами Spotify нет."
loop:
  - stage: {en: "Recruiter, team and final interviews", ru: "Рекрутер, команда и финальные встречи"}
    detail:
      en: "An initial conversation is followed by team members and a broader final panel. The recruiter explains who you will meet."
      ru: "После вводной беседы встречаются с командой, затем с более широким кругом сотрудников. Рекрутер заранее объясняет состав встреч."
    claim: "confirmed"
    sources: ["spotify-start-your-journey"]
  - stage: {en: "Engineering screen", ru: "Инженерный скрининг"}
    detail:
      en: "A third-party guide describes technical discussion, coding and sometimes a past-project discussion; tools vary."
      ru: "Сторонний гайд описывает техническую беседу, кодинг и иногда разбор прошлого проекта; инструменты различаются."
    claim: "secondary"
    sources: ["interviewing-io-spotify"]
  - stage: {en: "Engineering final rounds", ru: "Финальные инженерные раунды"}
    detail:
      en: "The guide reports coding, system design, a diagnostic case study and values discussions. Treat this as a preparation baseline."
      ru: "Гайд описывает кодинг, system design, диагностический кейс и беседы о ценностях. Это ориентир для подготовки."
    claim: "secondary"
    sources: ["interviewing-io-spotify"]
  - stage: {en: "Machine-learning tech screen", ru: "ML-скрининг"}
    detail:
      en: "A candidate who received an offer in 2025 describes a one-hour machine-learning screen after the recruiter call."
      ru: "Кандидат, получивший офер в 2025 году, описывает часовой ML-скрининг после звонка рекрутера."
    claim: "participant_report"
    sources: ["njordy-spotify-mle-2025"]
    roles: ["ml-engineer"]
  - stage: {en: "Assessment day for machine-learning roles", ru: "День оценки для ML-роли"}
    detail:
      en: "Four interviews in one day: machine-learning data, values, machine-learning system design and machine-learning depth. The same account describes the depth interview as additional to the standard process and shares no questions from any round."
      ru: "Четыре интервью в один день: данные в ML, ценности, ML system design и глубина ML. Тот же рассказ описывает секцию по глубине как дополнительную к стандартному процессу и не приводит вопросов ни из одного раунда."
    claim: "participant_report"
    sources: ["njordy-spotify-mle-2025"]
    roles: ["ml-engineer"]
coding:
  value: "varies"
  note:
    en: "Official guidance names CoderPad for technical interviews but does not require coding for every role."
    ru: "Официальный гайд называет CoderPad для технических интервью, но не требует кодинга для каждой роли."
  sources: ["spotify-start-your-journey"]
prep: ["spotify-start-your-journey"]
reviewed: "2026-09-30"
