summary:
  en: "Ramp's engineering blog explains how it hires forward deployed engineers: drive and work ethic come first, and engineering fundamentals are a bar to pass rather than the main signal. Seven of its sixteen FDEs had founded companies."
  ru: "Инженерный блог Ramp объясняет, как компания нанимает forward deployed engineers: на первом месте драйв и трудолюбие, а инженерная база — планка, которую нужно пройти, а не главный сигнал. Семь из шестнадцати FDE в команде раньше основывали компании."
