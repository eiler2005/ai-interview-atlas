summary:
  en: "Amazon’s official preparation page describes a general TPM process. The AI-product path remains a secondary guide, and Engineering topics come from a compilation. The general TPM stages do not establish an AI-specific loop."
  ru: "Официальная страница Amazon описывает общий процесс TPM. Путь AI-продакта по-прежнему основан на вторичном гайде, а инженерные темы взяты из подборки. Общие этапы TPM не подтверждают отдельный AI-цикл."
loop:
- stage:
    en: "General TPM technical phone screen"
    ru: "Технический телефонный скрининг общего TPM-профиля"
  detail:
    en: "The official TPM preparation page describes a 60-minute screen with behavioural, situational and technical discussion; a second phone screen may follow. This is general TPM guidance, not an AI-specialist process."
    ru: "Официальная подготовка TPM описывает 60-минутный скрининг с поведенческим, ситуационным и техническим обсуждением; возможен второй телефонный этап. Это общие рекомендации TPM, не процесс для AI-специалистов."
