  roles: ["tpm"]
  sources:
  - "amazon-tpm-interview"
- stage:
    en: "General TPM writing assessment and interview loop"
    ru: "Письменное задание и цикл интервью общего TPM-профиля"
  detail:
    en: "The page describes a writing assessment before a loop of five 55-minute interviews, including at least one systems-design question. Management preparation covers metrics, dependencies, escalation and tradeoffs. These published stages describe the general TPM path at retrieval."
    ru: "Страница описывает письменное задание перед циклом из пяти интервью по 55 минут, включающим как минимум один вопрос по системному дизайну. Подготовка к управленческой части охватывает метрики, зависимости, эскалацию и компромиссы. Эти опубликованные этапы описывают общий путь TPM на дату чтения."
  claim: "confirmed"
  roles: ["tpm"]
  sources:
  - "amazon-tpm-interview"
- stage:
    en: "AI product manager path"
    ru: "Путь AI-продакт-менеджера"
  detail:
    en: "A recruiter screen on ownership and customer obsession, a one- to two-page written answer to a Leadership Principles prompt, product screening rounds, then a final loop of four or five rounds with Leadership Principles deep dives, product thinking, generative-AI evaluation, system design for technical PM roles and a Bar Raiser."
    ru: "Скрининг с рекрутером об ownership и customer obsession, письменный ответ на одну-две страницы по принципам лидерства, продуктовые скрининги, затем финальный цикл из четырёх-пяти раундов: принципы лидерства с глубокими уточнениями, продуктовое мышление, оценка генеративного AI, system design для технических PM и Bar Raiser."
