tracks:
  - id: "engineering"
    name: {en: "AI Engineering", ru: "AI-инженерия"}
    summary:
      en: "Engineers who build, ship and run AI systems: applications, agents, platforms, inference and research code."
      ru: "Инженеры, которые строят, выпускают и эксплуатируют AI-системы: приложения, агентов, платформы, инференс и исследовательский код."
  - id: "leadership"
    name: {en: "AI Leadership", ru: "AI-лидерство"}
    summary:
      en: "People who decide what AI to build and lead the teams, programmes and organisations that build it."
      ru: "Те, кто решает, какой AI строить, и руководит командами, программами и организациями, которые его строят."

