<rect x="655.95" y="74" width="62.05" height="30" rx="3" fill="#898781"/>
<rect x="20" y="114" width="9" height="9" rx="2" fill="#1c5cab"/>
<text x="35" y="123" font-size="11" fill="#52514e">Company-confirmed 11 (4%)</text>
