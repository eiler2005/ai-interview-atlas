<svg xmlns="http://www.w3.org/2000/svg" width="740" height="275" viewBox="0 0 740 275" role="img" aria-labelledby="figure-title figure-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="figure-title">What backs the atlas</title>
<desc id="figure-desc">Two stacked bars: the question bank by its strongest evidence, and company interview-loop stages by the strength of their claim.</desc>
