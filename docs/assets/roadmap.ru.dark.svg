<svg xmlns="http://www.w3.org/2000/svg" width="820" height="627" viewBox="0 0 820 627" role="img" aria-labelledby="figure-title figure-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="figure-title">План развития проекта</title>
<desc id="figure-desc">Этапы работы: у каждого пункта статус — сделано, в работе, запланировано или отклонено.</desc>
<rect x="0.5" y="0.5" width="819" height="626" rx="10" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="20" y="32" font-size="16" fill="#ffffff" font-weight="600">План развития проекта</text>
<circle cx="25" cy="52" r="5.5" fill="#0ca30c"/>
<path d="M22.4 51.8l1.8 1.9 3.2-3.5" fill="none" stroke="#1a1a19" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="37" y="56" font-size="11" fill="#c3c2b7">Сделано</text>
<circle cx="103.2" cy="52" r="4.6" fill="none" stroke="#fab219" stroke-width="2.2"/>
<path d="M103.2 47.4A4.6 4.6 0 0 1 103.2 56.6z" fill="#fab219"/>
<text x="115.2" y="56" font-size="11" fill="#c3c2b7">В работе</text>
<circle cx="188" cy="52" r="4.4" fill="none" stroke="#898781" stroke-width="1.6"/>
<text x="200" y="56" font-size="11" fill="#c3c2b7">Запланировано</text>
<path d="M302.2 48.4l7.2 7.2m0-7.2l-7.2 7.2" fill="none" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"/>
<text x="317.8" y="56" font-size="11" fill="#c3c2b7">Отклонено</text>
<line x1="26" y1="82" x2="26" y2="595" stroke="#383835" stroke-width="1"/>
<circle cx="26" cy="91" r="5" fill="#3987e5"/>
<text x="48" y="96" font-size="13" fill="#ffffff" font-weight="600">Сейчас</text>
<circle cx="53" cy="113" r="4.6" fill="none" stroke="#fab219" stroke-width="2.2"/>
<path d="M53 108.4A4.6 4.6 0 0 1 53 117.6z" fill="#fab219"/>
<text x="66" y="117" font-size="12" fill="#ffffff">Независимое ревью новейшего контента в отдельной сессии, затем проверки печати PDF</text>
<circle cx="53" cy="138" r="4.6" fill="none" stroke="#fab219" stroke-width="2.2"/>
<path d="M53 133.4A4.6 4.6 0 0 1 53 142.6z" fill="#fab219"/>
<text x="66" y="142" font-size="12" fill="#ffffff">Свежесть источников: недельная проверка ссылок с одним issue и метка устаревания по</text>
<text x="66" y="163" font-size="12" fill="#ffffff">календарю</text>
<circle cx="53" cy="184" r="5.5" fill="#0ca30c"/>
<path d="M50.4 183.8l1.8 1.9 3.2-3.5" fill="none" stroke="#1a1a19" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="188" font-size="12" fill="#ffffff">Чеклист и материалы для чтения у каждого вопроса, а не только у приоритетных</text>
<circle cx="53" cy="209" r="5.5" fill="#0ca30c"/>
<path d="M50.4 208.8l1.8 1.9 3.2-3.5" fill="none" stroke="#1a1a19" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="213" font-size="12" fill="#ffffff">Машиночитаемый экспорт банка, чтобы тренироваться вне Markdown-страниц</text>
<circle cx="26" cy="242" r="5" fill="#3987e5"/>
<text x="48" y="247" font-size="13" fill="#ffffff" font-weight="600">Далее</text>
<circle cx="53" cy="264" r="4.4" fill="none" stroke="#898781" stroke-width="1.6"/>
<text x="66" y="268" font-size="12" fill="#ffffff">Лучшие свидетельства по компаниям: независимое подтверждение там, где страница</text>
<text x="66" y="289" font-size="12" fill="#ffffff">держится на одном издателе</text>
<circle cx="53" cy="310" r="4.4" fill="none" stroke="#898781" stroke-width="1.6"/>
<text x="66" y="314" font-size="12" fill="#ffffff">Написанные ответы за пределами приоритетного набора, начиная с тем, которые чаще</text>
<text x="66" y="335" font-size="12" fill="#ffffff">требуют работодатели</text>
<circle cx="53" cy="356" r="4.4" fill="none" stroke="#898781" stroke-width="1.6"/>
<text x="66" y="360" font-size="12" fill="#ffffff">Обновлённый радар на большей выборке, чтобы инженерный трек прошёл минимум и был</text>
<text x="66" y="381" font-size="12" fill="#ffffff">опубликован</text>
<circle cx="26" cy="410" r="5" fill="#3987e5"/>
<text x="48" y="415" font-size="13" fill="#ffffff" font-weight="600">Позже, если будет спрос</text>
<circle cx="53" cy="432" r="4.4" fill="none" stroke="#898781" stroke-width="1.6"/>
<text x="66" y="436" font-size="12" fill="#ffffff">Фильтры по уровню и роли, но только там, где это прямо сказано в источниках</text>
<circle cx="53" cy="457" r="4.4" fill="none" stroke="#898781" stroke-width="1.6"/>
<text x="66" y="461" font-size="12" fill="#ffffff">Третий язык — со всеми нужными изменениями схемы, генератора и проверок</text>
<circle cx="26" cy="490" r="5" fill="#3987e5"/>
<text x="48" y="495" font-size="13" fill="#ffffff" font-weight="600">Чего проект делать не будет</text>
<path d="M49.4 508.4l7.2 7.2m0-7.2l-7.2 7.2" fill="none" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"/>
<text x="66" y="516" font-size="12" fill="#ffffff">Конфиденциальные материалы, NDA и всё, что описано как утечка</text>
<path d="M49.4 533.4l7.2 7.2m0-7.2l-7.2 7.2" fill="none" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"/>
<text x="66" y="541" font-size="12" fill="#ffffff">Утверждения об интервью без публичного источника с датой и ответы-ссылки на платный</text>
<text x="66" y="562" font-size="12" fill="#ffffff">курс</text>
<path d="M49.4 579.4l7.2 7.2m0-7.2l-7.2 7.2" fill="none" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"/>
<text x="66" y="587" font-size="12" fill="#ffffff">Сбор данных за логином или против правил сайта и любые персональные данные</text>
<text x="20" y="613" font-size="11" fill="#898781">Пункт двигается, когда появляется основание, а не по дате.</text>
</svg>
