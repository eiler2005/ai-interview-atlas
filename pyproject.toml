[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-interview-atlas"
version = "0.1.0"
description = "Sourced interview questions and loops for AI engineering and AI leadership roles"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pyyaml>=6,<7", "jsonschema>=4.23,<5"]

[project.scripts]
atlas = "atlas.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
pdf = [
    "job-search-agent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.uv.sources]
job-search-agent = { git = "https://github.com/eiler2005/career-copilot", rev = "fac2dd3c3545c97b07fdb47fddb717f7db732a60" }
