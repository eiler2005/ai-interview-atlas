# Builds the printable PDF books and attaches them to a GitHub release.
#
# Releases are always created as DRAFTS: publishing a book needs the
# maintainer's approval after inspecting every page (see AGENTS.md). Review
# the extracted text and the pages of each attached PDF, then publish the
# draft manually on GitHub.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach PDFs to (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.6"

      - name: Printable PDF books with the pinned Career Copilot renderer
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core librsvg2-bin
          uv sync --frozen --group pdf
          uv run --group pdf python scripts/build_pdf.py

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          mapfile -t assets < <(find dist/pdf -maxdepth 1 -type f \( -name '*.pdf' -o -name '*.manifest.json' \))
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No PDF outputs found in dist/pdf" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $tag is already published; refusing to replace its assets." >&2
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --draft --title "$tag" --generate-notes
          fi
