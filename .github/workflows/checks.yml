name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # The public Career Copilot privacy checker, pinned to a reviewed commit.
  PRIVACY_CHECKER: git+https://github.com/eiler2005/career-copilot@fac2dd3c3545c97b07fdb47fddb717f7db732a60
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.6"
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Schema, provenance, generated pages and local links
        run: uv run python scripts/build.py --check
      - name: Printable PDF books with the pinned Career Copilot renderer
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core librsvg2-bin
          uv sync --frozen --group pdf
          uv run --group pdf pytest -q tests/test_pdf.py
          uv run --group pdf python scripts/build_pdf.py
      - name: Install pinned Gitleaks with checksum verification
        shell: bash
        run: |
          scan_tools=$(mktemp -d)
          cd "$scan_tools"
          curl --fail --location --retry 2 --max-time 120 --remote-name https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --retry 2 --max-time 120 --remote-name https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Privacy allowlist, content rules and Gitleaks over the tree and full history
        run: |
          uvx --from "$PRIVACY_CHECKER" ajh privacy check --root . --scope index --gitleaks
          uvx --from "$PRIVACY_CHECKER" ajh privacy check --root . --scope history --gitleaks
